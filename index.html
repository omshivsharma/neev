    {q:L("How do I track cash spends?","कैश खर्च कैसे ट्रैक करूँ?","Cash kharche kaise track karun?"),a:L("30 seconds at day's end — just note the big cash spends. Direction matters more than perfection.","दिन के अंत में 30 सेकंड — बस बड़े कैश खर्च नोट करो। परफेक्शन से ज़्यादा दिशा मायने रखती है।","Din ke ant mein 30 second — bas bade cash kharche note karo. Perfection se zyada direction maayne rakhti hai.")}
   ]},
  terms:[{k:L("Cash flow","कैश फ्लो","Cash flow"),d:L("The money moving in (income) and out (expenses) each month.","हर महीने अंदर (इनकम) और बाहर (खर्च) जाता पैसा।","Har mahine andar (income) aur bahar (kharch) jaata paisa.")},{k:L("Discretionary spend","डिस्क्रेशनरी खर्च","Discretionary spend"),d:L("Spending fully in your control — the 'wants'.","पूरी तरह आपके कंट्रोल का खर्च — 'वॉन्ट्स'।","Poori tarah aapke control ka kharch — 'wants'.")}],
  action:{h:L("Tag your 5 biggest spends","अपने 5 सबसे बड़े खर्च टैग करो","Apne 5 sabse bade kharche tag karo"),p:L("Enter last month's 5 biggest expenses and tag each Need or Want.","पिछले महीने के 5 सबसे बड़े खर्च डालो और हर एक को Need या Want टैग करो।","Pichhle mahine ke 5 sabse bade kharche daalo aur har ek ko Need ya Want tag karo."),data:L("Your real past expenses (user-entered).","आपके असली पिछले खर्च (यूज़र-डाला)।","Aapke asli pichhle kharche (user-entered).")},
  quiz:[
   {q:L("What is the FIRST step to fixing your spending?","खर्च सुधारने का पहला कदम क्या है?","Kharch sudhaarne ka pehla kadam kya hai?"),o:[L("Cut everything","सब काटो","Sab kaato"),L("See where it actually goes","देखो पैसा असल में कहाँ जाता है","Dekho paisa asal mein kahan jaata hai"),L("Earn more first","पहले ज़्यादा कमाओ","Pehle zyada kamao"),L("Open more accounts","और अकाउंट खोलो","Aur account kholo")],a:1,why:L("Visibility comes before control — you can't fix a leak you can't see.","कंट्रोल से पहले विज़िबिलिटी — जो रिसाव दिखे नहीं उसे ठीक नहीं कर सकते।","Control se pehle visibility — jo leak dikhe nahi use theek nahi kar sakte.")},
   {q:L("Which is a 'need', not a 'want'?","कौन सा 'need' है, 'want' नहीं?","Kaunsa 'need' hai, 'want' nahi?"),o:[L("A premium OTT plan","प्रीमियम OTT प्लान","Premium OTT plan"),L("Rent","किराया","Kiraya"),L("Weekend dining out","वीकेंड बाहर खाना","Weekend bahar khaana"),L("A new gadget","नया गैजेट","Naya gadget")],a:1,why:L("Rent is essential; the others are discretionary wants you control.","किराया ज़रूरी है; बाकी आपके कंट्रोल के वॉन्ट्स हैं।","Kiraya zaroori hai; baaki aapke control ke wants hain.")}
  ],
  reflect:L("How many of your 'needs' turned out to be 'wants'?","आपके कितने 'needs' असल में 'wants' निकले?","Aapke kitne 'needs' asal mein 'wants' nikle?")},

 {id:"m2l2",title:L("50-30-20: a simple frame","50-30-20: एक सरल ढाँचा","50-30-20: ek simple dhaancha"),sub:L("The classic budgeting rule, in depth","क्लासिक बजट रूल, गहराई से","The classic budgeting rule, in depth"),mins:4,
  beats:{
   sit:L("You now know where money goes. Next question: how much <i>should</i> go where? Calculating each thing feels tiring.","अब आप जानते हो पैसा कहाँ जाता है। अगला सवाल: कितना कहाँ जाना <i>चाहिए</i>? हर चीज़ calculate करना थकाऊ लगता है।","Ab aap jaante ho paisa kahan jaata hai. Agla sawaal: kitna kahan jaana <i>chahiye</i>? Har cheez calculate karna thakaane wala lagta hai."),
   myth:{lie:L("Budgeting needs Excel and hours of planning.","बजटिंग के लिए Excel और घंटों की प्लानिंग चाहिए।","Budgeting ke liye Excel aur ghanton ki planning chahiye."),truth:L("A simple 3-part frame does 90% of the job. 50-30-20 is exactly that.","एक सरल 3-हिस्से का ढाँचा 90% काम कर देता है। 50-30-20 वही है।","Ek saral 3-hisse ka dhaancha 90% kaam kar deta hai. 50-30-20 wahi hai.")},
   reflex:L("Over-complicating it, or giving up on budgeting entirely.","इसे ज़्यादा उलझाना, या बजटिंग छोड़ देना।","Ise zyada uljhaana, ya budgeting chhod dena."),
   q:L("How much of my pay should go where?","मेरी सैलरी का कितना हिस्सा कहाँ जाए?","Meri salary ka kitna hissa kahan jaaye?"),
   fw:L("<b>50%</b> Needs, <b>30%</b> Wants, <b>20%</b> Savings &amp; debt — of your <b>take-home</b> pay (not gross). Extra loan repayment counts in the 20%.","<b>50%</b> नीड्स, <b>30%</b> वॉन्ट्स, <b>20%</b> सेविंग्स और डेट — आपकी <b>टेक-होम</b> सैलरी का (ग्रॉस का नहीं)। एक्स्ट्रा लोन चुकाना 20% में गिना जाता है।","<b>50%</b> Needs, <b>30%</b> Wants, <b>20%</b> Savings &amp; debt — aapki <b>take-home</b> salary ka (gross ka nahi). Extra loan chukana 20% mein ginta hai."),
   call:L("Adjust to your life — just make sure the 20% exists. We won't say where savings go, only that they must.","अपनी लाइफ से एडजस्ट करो — बस 20% मौजूद हो। हम नहीं कहते सेविंग्स कहाँ जाए, सिर्फ कि जाए।","Apni life se adjust karo — bas 20% maujood ho. Hum nahi kehte savings kahan jaaye, sirf ki jaaye.")
  },
  dd:{ex:[
   L("50-30-20 splits your take-home into three simple buckets and gives instant clarity. Two things people get wrong: the split is on take-home (after tax/PF), not gross; and any loan repayment ABOVE the minimum counts in the 20% savings bucket, because clearing debt is also building your future.","50-30-20 आपकी टेक-होम को तीन सरल बकेट में बाँटता है और तुरंत क्लैरिटी देता है। दो चीज़ें लोग गलत समझते हैं: हिस्सा टेक-होम पर है, ग्रॉस पर नहीं; और मिनिमम से ऊपर की लोन रीपेमेंट 20% में गिनती है।","50-30-20 aapki take-home ko teen saral bucket mein baant-ta hai aur turant clarity deta hai. Do cheezein log galat samajhte hain: hissa take-home pe hai, gross pe nahi; aur minimum se upar ki loan repayment 20% mein ginti hai."),
   L("Worked example — ₹50,000 take-home: Needs ₹25,000, Wants ₹15,000, Save &amp; debt ₹10,000. That ₹10,000/month is exactly the fuel compounding needs. India reality: on lower incomes needs often exceed 50% (rent + food dominate) — so 50-30-20 is a direction, not a law. If needs are 65%, don't panic; aim to trim wants and nudge savings from 10% toward 15%.","उदाहरण — ₹50,000 टेक-होम: नीड्स ₹25,000, वॉन्ट्स ₹15,000, सेव और डेट ₹10,000। वो ₹10,000/महीना ही कंपाउंडिंग का ईंधन है। भारत में कम इनकम पर नीड्स अक्सर 50% से ऊपर — तो यह दिशा है, कानून नहीं।","Udaharan — ₹50,000 take-home: Needs ₹25,000, Wants ₹15,000, Save & debt ₹10,000. Woh ₹10,000/mahina hi compounding ka eendhan hai. India mein kam income pe needs aksar 50% se upar — toh yeh direction hai, kanoon nahi.")],
   faq:[
    {q:L("My needs are over 50% — does the rule fail?","मेरी नीड्स 50% से ज़्यादा हैं — रूल फेल?","Meri needs 50% se zyada hain — rule fail?"),a:L("No — it's useful precisely because it shows your real situation. Higher needs just means focus on trimming wants so savings isn't zero.","नहीं — यह इसलिए काम का है कि आपकी असली situation दिखाता है। ज़्यादा नीड्स मतलब वॉन्ट्स घटाओ ताकि सेविंग्स शून्य न रहे।","Nahi — yeh isliye kaam ka hai ki aapki asli situation dikhaata hai. Zyada needs matlab wants ghatao taaki savings shoonya na rahe.")},
    {q:L("Is EMI a need or a saving?","EMI need है या saving?","EMI need hai ya saving?"),a:L("The minimum EMI is a need (must-pay). Extra prepayment above it is the savings/debt bucket — your choice to build the future faster.","मिनिमम EMI need है (चुकाना ज़रूरी)। उसके ऊपर एक्स्ट्रा प्रीपेमेंट सेविंग्स/डेट बकेट है।","Minimum EMI need hai (chukana zaroori). Uske upar extra prepayment savings/debt bucket hai — aapki choice.")}
   ]},
  terms:[{k:L("Take-home pay","टेक-होम पे","Take-home pay"),d:L("Salary in hand after tax and deductions.","टैक्स और कटौती के बाद हाथ में आने वाली सैलरी।","Tax aur deductions ke baad haath mein aane wali salary.")},{k:L("Budget","बजट","Budget"),d:L("A plan for how much money goes into each bucket.","पैसा किस बकेट में कितना जाएगा उसका प्लान।","Paisa kis bucket mein kitna jaayega uska plan.")}],
  action:{h:L("See your 50-30-20 targets","अपने 50-30-20 टारगेट देखो","Apne 50-30-20 targets dekho"),p:L("Enter your take-home; the app shows the rupee targets and compares them with your real spend.","अपनी टेक-होम डालो; ऐप रुपये के टारगेट दिखाएगा और आपके असली खर्च से तुलना करेगा।","Apni take-home daalo; app rupee targets dikhayega aur aapke asli kharch se compare karega."),data:L("Your take-home salary (user-entered).","आपकी टेक-होम सैलरी (यूज़र-डाला)।","Aapki take-home salary (user-entered).")},
  quiz:[
   {q:L("50-30-20 is applied to which figure?","50-30-20 किस राशि पर लगता है?","50-30-20 kis raashi pe lagta hai?"),o:[L("Gross salary","ग्रॉस सैलरी","Gross salary"),L("Take-home pay","टेक-होम पे","Take-home pay"),L("Annual bonus","सालाना बोनस","Saalaana bonus"),L("Total savings","कुल बचत","Kul bachat")],a:1,why:L("It splits your take-home (in-hand) pay, not gross.","यह टेक-होम (हाथ में) सैलरी बाँटता है, ग्रॉस नहीं।","Yeh take-home (haath mein) salary baant-ta hai, gross nahi.")},
   {q:L("In 50-30-20, what does the 20% cover?","50-30-20 में 20% किसके लिए है?","50-30-20 mein 20% kiske liye hai?"),o:[L("More wants","और वॉन्ट्स","Aur wants"),L("Savings and extra debt payoff","सेविंग्स और एक्स्ट्रा लोन चुकाना","Savings aur extra loan chukana"),L("Rent only","सिर्फ किराया","Sirf kiraya"),L("Taxes","टैक्स","Tax")],a:1,why:L("The 20% is future-building: savings, investing, and paying debt above the minimum.","20% भविष्य बनाना है: सेविंग्स, इन्वेस्टिंग और मिनिमम से ऊपर लोन।","20% future banana hai: savings, investing aur minimum se upar loan.")}
  ],
  reflect:L("Which bucket is furthest from its 50-30-20 target for you?","आपके लिए कौन सा बकेट 50-30-20 टारगेट से सबसे दूर है?","Aapke liye kaunsa bucket 50-30-20 target se sabse door hai?")},

 {id:"m2l3",title:L("40-30-30 and other variants","40-30-30 और बाकी वैरिएंट","40-30-30 aur baaki variants"),sub:L("Which split fits you?","कौन सी स्प्लिट आपके लिए?","Kaunsi split aapke liye?"),mins:4,
  beats:{
   sit:L("You tried 50-30-20 and feel you could save more — or someone said '40-30-30 is better'. Which is right?","आपने 50-30-20 आज़माया और लगता है ज़्यादा बचा सकते हो — या किसी ने कहा '40-30-30 बेहतर है'। कौन सा सही?","Aapne 50-30-20 aazmaya aur lagta hai zyada bacha sakte ho — ya kisi ne kaha '40-30-30 better hai'. Kaunsa sahi?"),
   myth:{lie:L("There's one 'best' budgeting rule everyone should follow.","एक 'बेस्ट' बजट रूल है जो सबको फॉलो करना चाहिए।","Ek 'best' budgeting rule hai jo sabko follow karna chahiye."),truth:L("Rules are templates for different life stages. The best one is the one you can actually sustain.","रूल अलग लाइफ स्टेज के लिए टेम्पलेट हैं। बेस्ट वो जो आप सच में निभा सको।","Rules alag life stages ke liye templates hain. Best woh jo aap sach mein nibha sako.")},
   reflex:L("Chasing the 'optimal' rule instead of a sustainable one.","निभने वाले के बजाय 'ऑप्टिमल' रूल का पीछा करना।","Nibhne wale ke bajaye 'optimal' rule ka peechha karna."),
   q:L("Which split fits my situation?","कौन सी स्प्लिट मेरी situation में फिट है?","Kaunsi split meri situation mein fit hai?"),
   fw:L("<b>40-30-30</b> = aggressive saver (low needs, big 30% to savings). Also <b>70-20-10</b> for beginners, <b>60-20-20</b> as a middle path. The pattern is constant: shrink living, grow the future.","<b>40-30-30</b> = आक्रामक सेवर (कम नीड्स, बड़ा 30% सेविंग्स)। शुरुआती के लिए <b>70-20-10</b>, बीच का रास्ता <b>60-20-20</b>। पैटर्न एक: लिविंग घटाओ, भविष्य बढ़ाओ।","<b>40-30-30</b> = aggressive saver (kam needs, bada 30% savings). Beginners ke liye <b>70-20-10</b>, beech ka rasta <b>60-20-20</b>. Pattern ek: living ghatao, future badhao."),
   call:L("Whichever split you can keep up consistently is the best one for you.","जो भी स्प्लिट आप लगातार निभा सको, वही आपके लिए बेस्ट है।","Jo bhi split aap lagataar nibha sako, wahi aapke liye best hai.")
  },
  dd:{ex:[
   L("40-30-30 puts a full 30% into savings and investing — great for those with low needs (living with family, no rent) who want to build wealth faster. More saved today means more compounding tomorrow. Other frames help you find your stage: 70-20-10 is realistic on a small salary; 60-20-20 is a middle ground.","40-30-30 पूरे 30% सेविंग्स और इन्वेस्टिंग को देता है — उनके लिए बढ़िया जिनकी नीड्स कम हैं (परिवार के साथ, बिना किराया) और तेज़ी से वेल्थ बनाना चाहते हैं। आज ज़्यादा बचत = कल ज़्यादा कंपाउंडिंग।","40-30-30 poore 30% savings aur investing ko deta hai — unke liye badhiya jinki needs kam hain (family ke saath, bina kiraya) aur tezi se wealth banana chahte hain. Aaj zyada bachat = kal zyada compounding."),
   L("Worked example — ₹50,000: 50-30-20 saves ₹10,000/month; 40-30-30 saves ₹15,000. That extra ₹5,000/month, compounded over years, can become lakhs on its own — BUT only if 40% needs is genuinely liveable for you. An aggressive plan you break in 2 months is worse than a gentle one you keep for years.","उदाहरण — ₹50,000: 50-30-20 में ₹10,000/महीना बचत; 40-30-30 में ₹15,000। वो एक्स्ट्रा ₹5,000/महीना सालों में कंपाउंड होकर खुद लाखों बन सकता है — पर तभी जब 40% नीड्स सच में जीने लायक हो।","Udaharan — ₹50,000: 50-30-20 mein ₹10,000/mahina bachat; 40-30-30 mein ₹15,000. Woh extra ₹5,000/mahina saalon mein compound ho ke khud laakhon ban sakta hai — par tabhi jab 40% needs sach mein jeene layak ho.")],
   faq:[
    {q:L("I can't live on 40% needs — then?","मैं 40% नीड्स में जी नहीं सकता — तो?","Main 40% needs mein jee nahi sakta — toh?"),a:L("Then 40-30-30 isn't for you right now. Start at 50-30-20 or 70-20-10 — your stage will change over time.","तो 40-30-30 अभी आपके लिए नहीं। 50-30-20 या 70-20-10 से शुरू करो — स्टेज बदलेगी।","Toh 40-30-30 abhi aapke liye nahi. 50-30-20 ya 70-20-10 se shuru karo — stage badlegi.")},
    {q:L("Do I re-check percentages daily?","क्या रोज़ percentages चेक करूँ?","Kya roz percentages check karun?"),a:L("No — set once, review once a month. Automation (next lesson) runs it for you.","नहीं — एक बार सेट, महीने में एक बार रिव्यू। ऑटोमेशन (अगला पाठ) इसे चला देता है।","Nahi — ek baar set, mahine mein ek baar review. Automation (agla lesson) ise chala deta hai.")}
   ]},
  terms:[{k:L("Savings rate","सेविंग्स रेट","Savings rate"),d:L("The share of income you save/invest — the biggest driver of wealth.","इनकम का वो हिस्सा जो आप बचाते/इन्वेस्ट करते हैं — वेल्थ का सबसे बड़ा ड्राइवर।","Income ka woh hissa jo aap bachate/invest karte ho — wealth ka sabse bada driver.")},{k:L("Lifestyle creep","लाइफस्टाइल क्रीप","Lifestyle creep"),d:L("Spending rising with income, so your savings rate never improves.","इनकम बढ़ते ही खर्च बढ़ना, जिससे सेविंग्स रेट नहीं सुधरता।","Income badhte hi kharch badhna, jisse savings rate nahi sudharta.")}],
  action:{h:L("Compare three splits","तीन स्प्लिट तुलना करो","Teen splits compare karo"),p:L("See 50-30-20, 40-30-30 and 70-20-10 on your salary and pick the realistic one.","अपनी सैलरी पर 50-30-20, 40-30-30 और 70-20-10 देखो और realistic चुनो।","Apni salary pe 50-30-20, 40-30-30 aur 70-20-10 dekho aur realistic chuno."),data:L("Your take-home salary (user-entered).","आपकी टेक-होम सैलरी (यूज़र-डाला)।","Aapki take-home salary (user-entered).")},
  quiz:[
   {q:L("Which split fits an aggressive saver with low needs?","कम नीड्स वाले आक्रामक सेवर को कौन सी स्प्लिट सूट करती है?","Kam needs wale aggressive saver ko kaunsi split suit karti hai?"),o:[L("70-20-10","70-20-10","70-20-10"),L("40-30-30","40-30-30","40-30-30"),L("90-10-0","90-10-0","90-10-0"),L("Any is same","कोई भी बराबर","Koi bhi barabar")],a:1,why:L("40-30-30 routes a full 30% to savings — good when needs are genuinely low.","40-30-30 पूरे 30% को सेविंग्स देता है — जब नीड्स सच में कम हों।","40-30-30 poore 30% ko savings deta hai — jab needs sach mein kam hon.")},
   {q:L("What makes a split the 'best' one for you?","कोई स्प्लिट आपके लिए 'बेस्ट' क्या बनाता है?","Koi split aapke liye 'best' kya banata hai?"),o:[L("The highest savings %","सबसे ज़्यादा सेविंग्स %","Sabse zyada savings %"),L("The one you can sustain","जो आप निभा सको","Jo aap nibha sako"),L("Whatever a friend uses","जो दोस्त इस्तेमाल करे","Jo dost istemal kare"),L("The newest trend","नया ट्रेंड","Naya trend")],a:1,why:L("A plan you keep for years beats an aggressive one you abandon in weeks.","सालों निभने वाला प्लान हफ्तों में छूटने वाले से बेहतर।","Saalon nibhne wala plan hafton mein chhootne wale se behtar.")}
  ],
  reflect:L("Which split can you sustain for 6 months without breaking?","कौन सी स्प्लिट आप 6 महीने बिना टूटे निभा सकते हो?","Kaunsi split aap 6 mahine bina toote nibha sakte ho?")},

 {id:"m2l4",title:L("Pay yourself first","पहले खुद को दो","Pay yourself first"),sub:L("Automate savings before you can spend it","खर्च से पहले सेविंग्स ऑटोमेट करो","Kharch se pehle savings automate karo"),mins:4,
  beats:{
   sit:L("Every month you thought 'I'll save whatever's left' — and at month-end, nothing's left. Good intention, zero result.","हर महीने सोचा 'जो बचेगा बचा लूँगा' — और महीने के अंत में कुछ बचता ही नहीं। नीयत ठीक, नतीजा शून्य।","Har mahine socha 'jo bachega bacha lunga' — aur mahine ke ant mein kuch bachta hi nahi. Neeyat theek, natija zero."),
   myth:{lie:L("Spend first, save whatever's left.","पहले खर्च, जो बचे वो बचत।","Pehle kharch, jo bache woh bachat."),truth:L("Flip it — save first, spend what's left. That's 'pay yourself first'.","उल्टा करो — पहले बचत, जो बचे उसमें खर्च। यही 'pay yourself first' है।","Ulta karo — pehle bachat, jo bache usme kharch. Yehi 'pay yourself first' hai.")},
   reflex:L("Relying on willpower and month-end leftovers.","विलपावर और महीने के अंत के बचे पर भरोसा।","Willpower aur mahine ke ant ke bache pe bharosa."),
   q:L("How do I make saving the default?","बचत को डिफ़ॉल्ट कैसे बनाऊँ?","Bachat ko default kaise banaun?"),
   fw:L("Auto-move your savings the day salary lands, into another account or auto-invest. What's left is guilt-free to spend. Don't leave saving to willpower — make it a <b>default</b>.","सैलरी आते ही सेविंग्स ऑटोमैटिक अलग करो, दूसरे अकाउंट या ऑटो-इन्वेस्ट में। जो बचे वो बिना गिल्ट खर्च करने लायक। बचत को विलपावर पर मत छोड़ो — <b>डिफ़ॉल्ट</b> बनाओ।","Salary aate hi savings automatic alag karo, doosre account ya auto-invest mein. Jo bache woh bina guilt kharch karne layak. Bachat ko willpower pe mat chhodo — <b>default</b> banao."),
   call:L("How much to auto-save = your chosen split. We won't name where — only that the transfer be automatic and on salary day.","कितना ऑटो-सेव = आपकी चुनी स्प्लिट। हम जगह नहीं बताते — सिर्फ कि ट्रांसफर ऑटोमैटिक और सैलरी के दिन हो।","Kitna auto-save = aapki chuni split. Hum jagah nahi bataate — sirf ki transfer automatic aur salary ke din ho.")
  },
  dd:{ex:[
   L("Whatever money you see, you tend to spend. So the trick is simple: the day salary arrives, automatically move the savings portion out — before your brain counts it as spendable. Now the visible balance is meant for spending, guilt-free. Don't rely on willpower; make saving the default. On raises and bonuses, route a big chunk to savings FIRST, before lifestyle absorbs it.","जो पैसा दिखता है, वो खर्च हो जाता है। तो ट्रिक सरल: सैलरी आते ही सेविंग्स हिस्सा ऑटोमैटिक बाहर करो — इससे पहले कि दिमाग उसे खर्च लायक गिने। बढ़ोतरी और बोनस पर बड़ा हिस्सा पहले सेविंग्स में।","Jo paisa dikhta hai, woh kharch ho jaata hai. Toh trick saral: salary aate hi savings hissa automatic bahar karo — isse pehle ki dimaag use kharch layak gine. Badhotari aur bonus pe bada hissa pehle savings mein."),
   L("Worked example — same ₹50,000. Spend-first: at month-end 'nothing left', savings ≈ ₹0–3,000, different every month. Pay-yourself-first: on Day 1, ₹10,000 auto-saved; you live on ₹40,000, savings guaranteed. Same income, same lifestyle — only the order changed. That order is the whole game. Pair it with zero-based thinking: give every rupee a job so none drifts idle.","उदाहरण — वही ₹50,000। स्पेंड-फर्स्ट: महीने के अंत 'कुछ नहीं बचा', सेविंग्स ≈ ₹0–3,000। पे-योरसेल्फ-फर्स्ट: दिन 1 पर ₹10,000 ऑटो-सेव; ₹40,000 पर जीना, सेविंग्स पक्की। सिर्फ क्रम बदला।","Udaharan — wahi ₹50,000. Spend-first: mahine ke ant 'kuch nahi bacha', savings ≈ ₹0–3,000. Pay-yourself-first: din 1 pe ₹10,000 auto-saved; ₹40,000 pe jeena, savings pakki. Sirf order badla — wahi poora khel.")],
   faq:[
    {q:L("My income is irregular (freelance) — then?","मेरी इनकम अनियमित है (फ्रीलांस) — तो?","Meri income irregular hai (freelance) — toh?"),a:L("Move a fixed % out the moment each payment lands, however small. The amount varies; the habit doesn't.","हर पेमेंट आते ही एक फिक्स्ड % अलग करो, चाहे छोटा। रकम बदले, आदत न टूटे।","Har payment aate hi ek fixed % alag karo, chahe chhota. Amount badle, aadat na toote.")},
    {q:L("Emergency fund first or investing first?","इमरजेंसी फंड पहले या इन्वेस्टिंग?","Emergency fund pehle ya investing?"),a:L("Emergency buffer first, alongside clearing high-interest debt (next module), then the rest to investing. Auto-save can feed all three.","पहले इमरजेंसी बफर, साथ में हाई-इंटरेस्ट कर्ज़ (अगला मॉड्यूल), फिर बाकी इन्वेस्टिंग।","Pehle emergency buffer, saath mein high-interest karza (agla module), phir baaki investing.")}
   ]},
  terms:[{k:L("Pay yourself first","पहले खुद को दो","Pay yourself first"),d:L("Setting savings aside the moment income arrives, before spending.","इनकम आते ही खर्च से पहले बचत अलग करना।","Income aate hi kharch se pehle bachat alag karna.")},{k:L("Zero-based budget","ज़ीरो-बेस्ड बजट","Zero-based budget"),d:L("Giving every rupee a job in advance — nothing left 'unassigned'.","हर रुपये को पहले से एक काम देना — कुछ भी 'unassigned' नहीं।","Har rupee ko pehle se ek kaam dena — kuch bhi 'unassigned' nahi.")}],
  action:{h:L("Set an auto-save","ऑटो-सेव सेट करो","Auto-save set karo"),p:L("Set a virtual 'auto-save on salary day' at your chosen % and see the 12-month total.","अपनी चुनी % पर वर्चुअल 'सैलरी-डे ऑटो-सेव' सेट करो और 12-महीने का टोटल देखो।","Apni chuni % pe virtual 'salary-day auto-save' set karo aur 12-mahine ka total dekho."),data:L("Your chosen savings % and salary (user-entered).","आपकी चुनी सेविंग्स % और सैलरी (यूज़र-डाला)।","Aapki chuni savings % aur salary (user-entered).")},
  quiz:[
   {q:L("What does 'pay yourself first' mean?","'pay yourself first' का मतलब?","'Pay yourself first' ka matlab?"),o:[L("Spend, then save leftovers","खर्च, फिर बचत","Kharch, phir bachat"),L("Save on salary day, then spend the rest","सैलरी-डे बचत, फिर खर्च","Salary-day bachat, phir kharch"),L("Pay all bills first","पहले सब बिल","Pehle sab bill"),L("Buy yourself gifts","खुद को गिफ्ट","Khud ko gift")],a:1,why:L("Move savings out the day pay lands; spend what remains, guilt-free.","सैलरी के दिन बचत अलग करो; जो बचे वो खर्च करो।","Salary ke din bachat alag karo; jo bache woh kharch karo.")},
   {q:L("Why automate the transfer?","ट्रांसफर ऑटोमेट क्यों?","Transfer automate kyun?"),o:[L("Banks force it","बैंक मजबूर करते हैं","Bank majboor karte hain"),L("Money you see gets spent","जो पैसा दिखता है खर्च हो जाता है","Jo paisa dikhta hai kharch ho jaata hai"),L("It earns more interest","ज़्यादा ब्याज मिलता है","Zyada byaaj milta hai"),L("It avoids tax","टैक्स बचता है","Tax bachta hai")],a:1,why:L("Automation removes willpower from the loop — unseen money isn't spent.","ऑटोमेशन विलपावर हटाता है — जो न दिखे वो खर्च नहीं होता।","Automation willpower hataata hai — jo na dikhe woh kharch nahi hota.")}
  ],
  reflect:L("What stopped you from flipping the order until now?","अब तक आपको क्रम उलटने से क्या रोक रहा था?","Ab tak aapko order ulatne se kya rok raha tha?")}
]};

const MODULE3={ id:"m3", n:3, title:L("Loans & debt: handle and close","लोन और कर्ज़: संभालो, बंद करो","Loans & debt: sambhaalo, khatam karo"), theme:L("Clear expensive debt before investing — and close loans properly.","इन्वेस्ट से पहले महँगा कर्ज़ चुकाओ — और लोन सही से बंद करो।","Invest se pehle mehnga karza chukao — aur loan sahi se band karo."),
 lessons:[
 {id:"m3l1",title:L("Not all debt is bad — good vs bad","हर कर्ज़ बुरा नहीं — गुड बनाम बैड","Har karza bura nahi — good vs bad"),sub:L("The framework","फ्रेमवर्क","The framework"),mins:4,
  beats:{
   sit:L("You've heard both 'a loan is a trap' and 'everyone takes EMIs, it's normal'. Where's the truth?","आपने दोनों सुना — 'लोन जाल है' और 'EMI तो सब लेते हैं, नॉर्मल है'। सच कहाँ?","Aapne dono suna — 'loan jaal hai' aur 'EMI toh sab lete hain, normal hai'. Sach kahan?"),
   myth:{lie:L("All debt is bad — never take a loan.","सारा कर्ज़ बुरा — कभी लोन मत लो।","Saara karza bura — kabhi loan mat lo."),truth:L("Debt is a tool. The question is whether it moves you forward or back — and how high its interest is.","कर्ज़ एक टूल है। सवाल यह है कि वो आपको आगे ले जा रहा है या पीछे — और उसका ब्याज कितना है।","Karza ek tool hai. Sawaal yeh hai ki woh aapko aage le ja raha hai ya peeche — aur uska interest kitna hai.")},
   reflex:L("Treating every loan as the same thing.","हर लोन को एक जैसा समझना।","Har loan ko ek jaisa samajhna."),
   q:L("Is this debt building something — and how high is the interest?","क्या यह कर्ज़ कुछ बना रहा है — और ब्याज कितना है?","Kya yeh karza kuch bana raha hai — aur interest kitna hai?"),
   fw:L("Two lenses: <b>does it build value</b>, and <b>the interest rate</b>. Good debt is usually low-interest and builds (education, a home); bad debt is high-interest consumption (card balance, lifestyle EMIs). Rule: kill high-interest bad debt first; pause before new bad debt.","दो लेंस: <b>क्या यह वैल्यू बनाता है</b>, और <b>ब्याज दर</b>। गुड डेट अक्सर कम-ब्याज और कुछ बनाता है (एजुकेशन, घर); बैड डेट हाई-इंटरेस्ट खपत (कार्ड, लाइफस्टाइल EMI)। नियम: हाई-इंटरेस्ट बैड डेट पहले खत्म करो।","Do lens: <b>kya yeh value banata hai</b>, aur <b>interest rate</b>. Good debt aksar low-interest aur kuch banata hai (education, ghar); bad debt high-interest khapat (card, lifestyle EMI). Rule: high-interest bad debt pehle khatam karo."),
   call:L("Taking a loan or not = your situation and its interest. Judge it: does it build, what's the interest, does the EMI fit your budget (total EMIs under ~40% of take-home).","लोन लेना या न लेना = आपकी situation और उसका ब्याज। जाँचो: बनाता है क्या, ब्याज कितना, EMI बजट में फिट (कुल EMI ~40% टेक-होम से कम)।","Loan lena ya na lena = aapki situation aur uska interest. Jaancho: banata hai kya, interest kitna, EMI budget mein fit (total EMIs ~40% take-home se kam).")
  },
  dd:{ex:[
   L("Look at every loan through two lenses: does it build something, and how high is the interest. 'Good' debt tends to be low-interest and invests in something that can grow value or income — like education or a home. 'Bad' debt is usually high-interest and pays for consumption — things that wear out or lose value (a card balance, expensive gadget EMIs, a lifestyle personal loan).","हर लोन को दो लेंस से देखो: क्या वो कुछ बनाता है, और ब्याज कितना है। 'गुड' डेट अक्सर कम-ब्याज और किसी बढ़ने वाली चीज़ में — एजुकेशन, घर। 'बैड' डेट हाई-इंटरेस्ट और खपत के लिए — जो घिस जाए या वैल्यू खोए।","Har loan ko do lens se dekho: kya woh kuch banata hai, aur interest kitna hai. 'Good' debt aksar kam-byaaj aur kisi badhne wali cheez mein — education, ghar. 'Bad' debt high-interest aur khapat ke liye — jo ghis jaaye ya value khoye."),
   L("The single most important number is always the interest rate. A home loan and a credit-card balance are totally different animals even though both are 'loans': roughly, home loans are low, education low-to-mid, personal loans mid-to-high, and a revolving credit card is the most expensive common debt. Rates change constantly and vary by lender — the app shows live ranges. (verify current rate before relying on this)","सबसे ज़रूरी नंबर हमेशा ब्याज दर है। होम लोन और कार्ड बैलेंस बिल्कुल अलग जानवर हैं: मोटे तौर पर होम कम, एजुकेशन कम-से-मध्यम, पर्सनल मध्यम-से-ऊँचा, और रिवॉल्विंग कार्ड सबसे महँगा। दरें बदलती हैं — (verify current rate before relying on this)","Sabse zaroori number hamesha interest rate hai. Home loan aur card balance bilkul alag jaanwar hain: mote taur pe home kam, education kam-se-mid, personal mid-se-ooncha, aur revolving card sabse mehnga. Rates badalte hain — (verify current rate before relying on this)")],
   faq:[
    {q:L("Is a 0% 'no-cost EMI' really free?","0% 'नो-कॉस्ट EMI' सच में फ्री है?","0% 'no-cost EMI' sach mein free hai?"),a:L("Often the cost hides in a lost discount or a fee. Compare the full cash price with the EMI total to see the truth.","अक्सर कीमत छूटे डिस्काउंट या फीस में छुपी होती है। पूरा कैश प्राइस बनाम EMI टोटल देखो।","Aksar keemat chhoote discount ya fee mein chhupi hoti hai. Poora cash price banaam EMI total dekho.")},
    {q:L("Take a loan or use my savings?","लोन लूँ या सेविंग्स इस्तेमाल करूँ?","Loan lun ya savings use karun?"),a:L("If the loan's interest is higher than your savings' likely return, the loan costs you. Compare the numbers, not the feeling.","अगर लोन का ब्याज आपकी सेविंग्स के संभावित रिटर्न से ज़्यादा है, तो लोन महँगा। नंबर देखो, भावना नहीं।","Agar loan ka interest aapki savings ke sambhavit return se zyada hai, toh loan mehnga. Number dekho, feeling nahi.")}
   ]},
  terms:[{k:L("Principal","प्रिंसिपल","Principal"),d:L("The core amount you borrowed, separate from interest.","आपने जो मूल राशि उधार ली, ब्याज से अलग।","Aapne jo mool raashi udhaar li, interest se alag.")},{k:L("Interest rate","ब्याज दर","Interest rate"),d:L("The price of borrowing, % per year — a loan's most important number.","उधार की कीमत, % प्रति वर्ष — लोन का सबसे ज़रूरी नंबर।","Udhaar ki keemat, % per year — loan ka sabse zaroori number.")}],
  action:{h:L("Rank your debts by interest","अपने कर्ज़ ब्याज से रैंक करो","Apne karze interest se rank karo"),p:L("List all your (or family's) loans with their interest rates, highest to lowest. The app ranks them good vs bad.","अपने (या परिवार के) सभी लोन उनके ब्याज के साथ लिखो, ऊँचे से नीचे। ऐप गुड/बैड रैंक करेगा।","Apne (ya family ke) sabhi loans unke interest ke saath likho, ooncha se neeche. App good/bad rank karega."),data:L("Your real loans and their rates (user-entered).","आपके असली लोन और उनकी दरें (यूज़र-डाला)।","Aapke asli loans aur unki rates (user-entered).")},
  quiz:[
   {q:L("What's the most important number for any loan?","किसी भी लोन का सबसे ज़रूरी नंबर?","Kisi bhi loan ka sabse zaroori number?"),o:[L("Its name","इसका नाम","Iska naam"),L("The interest rate","ब्याज दर","Interest rate"),L("The lender's logo","लेंडर का लोगो","Lender ka logo"),L("The EMI date","EMI तारीख","EMI taareekh")],a:1,why:L("Interest rate decides how expensive the debt truly is.","ब्याज दर तय करती है कर्ज़ असल में कितना महँगा है।","Interest rate tay karti hai karza asal mein kitna mehnga hai.")},
   {q:L("Which is typically 'bad' (high-interest) debt?","आम तौर पर 'बैड' (हाई-इंटरेस्ट) कर्ज़ कौन सा?","Aam taur pe 'bad' (high-interest) karza kaunsa?"),o:[L("A home loan","होम लोन","Home loan"),L("A revolving credit-card balance","रिवॉल्विंग कार्ड बैलेंस","Revolving card balance"),L("An education loan","एजुकेशन लोन","Education loan"),L("None are debt","कोई कर्ज़ नहीं","Koi karza nahi")],a:1,why:L("A revolving card balance is usually the most expensive common debt.","रिवॉल्विंग कार्ड बैलेंस अक्सर सबसे महँगा आम कर्ज़ है।","Revolving card balance aksar sabse mehnga aam karza hai.")}
  ],
  reflect:L("Which of your debts is the most expensive — did it surprise you?","आपका कौन सा कर्ज़ सबसे महँगा है — हैरानी हुई?","Aapka kaunsa karza sabse mehnga hai — hairani hui?")},

 {id:"m3l2",title:L("What's hidden inside an EMI","EMI के अंदर क्या छुपा है","EMI ke andar kya chhupa hai"),sub:L("How interest & amortization really work","ब्याज और अमॉर्टाइज़ेशन असल में कैसे","How interest & amortization really work"),mins:4,
  beats:{
   sit:L("You've paid EMIs for 3 years, yet the outstanding is barely down. 'I've paid so much — why so much left?'","3 साल से EMI भर रहे हो, फिर भी बकाया कम नहीं हुआ। 'इतना दिया, फिर भी बकाया इतना?'","3 saal se EMI bhar rahe ho, phir bhi bakaya kam nahi hua. 'Itna diya, phir bhi bakaya itna?'"),
   myth:{lie:L("Each EMI cuts my loan by an equal amount.","हर EMI मेरा लोन बराबर घटाती है।","Har EMI mera loan barabar ghataati hai."),truth:L("Early EMIs are mostly interest; principal falls faster later. This is amortization.","शुरुआती EMI ज़्यादातर ब्याज होती हैं; प्रिंसिपल बाद में तेज़ घटता है। इसे अमॉर्टाइज़ेशन कहते हैं।","Shuruaati EMI zyadatar interest hoti hain; principal baad mein tez ghatta hai. Ise amortization kehte hain.")},
   reflex:L("Assuming the loan falls in a straight line.","मान लेना कि लोन सीधी रेखा में घटता है।","Maan lena ki loan seedhi rekha mein ghatta hai."),
   q:L("Where does my EMI money actually go?","मेरी EMI का पैसा जाता कहाँ है?","Meri EMI ka paisa jaata kahan hai?"),
   fw:L("Each EMI = some <b>interest</b> (on the outstanding) + some <b>principal</b>. Early on, outstanding is highest, so the interest share is big. Also: <b>reducing balance</b> (interest on remaining — better) vs <b>flat</b> (on full original — looks low, effectively higher). Always ask which.","हर EMI = कुछ <b>ब्याज</b> (बकाया पर) + कुछ <b>प्रिंसिपल</b>। शुरू में बकाया सबसे ज़्यादा, तो ब्याज हिस्सा बड़ा। और: <b>रिड्यूसिंग बैलेंस</b> (बचे पर ब्याज — बेहतर) बनाम <b>फ्लैट</b> (पूरे मूल पर — दिखने में कम, असल में ज़्यादा)।","Har EMI = kuch <b>interest</b> (bakaya pe) + kuch <b>principal</b>. Shuru mein bakaya sabse zyada, toh interest hissa bada. Aur: <b>reducing balance</b> (bache pe interest — behtar) banaam <b>flat</b> (poore mool pe — dikhne mein kam, asal mein zyada)."),
   call:L("A longer tenure means a smaller EMI but far more total interest; shorter is the reverse. Decide on total interest, not just the monthly EMI.","लंबा टेन्योर मतलब छोटी EMI पर कहीं ज़्यादा कुल ब्याज; छोटा उल्टा। कुल ब्याज पर फैसला करो, सिर्फ मंथली EMI पर नहीं।","Lamba tenure matlab chhoti EMI par kahin zyada total interest; chhota ulta. Total interest pe faisla karo, sirf monthly EMI pe nahi.")
  },
  dd:{ex:[
   L("Every EMI splits into two parts: interest (charged on whatever principal is still left) and principal repayment. Because the outstanding is largest at the start, the interest slice is big early and the principal barely moves. As the principal shrinks, the interest slice shrinks and principal starts falling fast. The EMI stays the same, but its internal split changes every month — that's amortization.","हर EMI दो हिस्सों में बँटती है: ब्याज (जो प्रिंसिपल बचा है उस पर) और प्रिंसिपल। शुरू में बकाया सबसे बड़ा, तो ब्याज हिस्सा बड़ा और प्रिंसिपल मुश्किल से घटता है। बाद में उल्टा। EMI वही, अंदर का बँटवारा बदलता है — यही अमॉर्टाइज़ेशन।","Har EMI do hisson mein bant-ti hai: interest (jo principal bacha hai us pe) aur principal. Shuru mein bakaya sabse bada, toh interest hissa bada aur principal mushkil se ghatta hai. Baad mein ulta. EMI wahi, andar ka batwara badalta hai — yahi amortization."),
   L("Watch for reducing-balance vs flat interest. Reducing balance charges interest only on the remaining principal (better, and standard for home and most loans). Flat charges on the full original amount for the whole tenure — it looks cheaper but its effective rate is much higher. So never compare two loans on the 'rate' alone; ask whether it's reducing or flat. This is also why prepaying early (lesson 5) is so powerful.","रिड्यूसिंग-बैलेंस बनाम फ्लैट ब्याज पर ध्यान दो। रिड्यूसिंग बचे प्रिंसिपल पर ब्याज लगाता है (बेहतर)। फ्लैट पूरे मूल पर पूरे टेन्योर के लिए — दिखने में सस्ता, effective rate ज़्यादा। सिर्फ 'रेट' मत तुलना करो; पूछो रिड्यूसिंग या फ्लैट।","Reducing-balance banaam flat interest pe dhyan do. Reducing bache principal pe interest lagata hai (behtar). Flat poore mool pe poore tenure ke liye — dikhne mein sasta, effective rate zyada. Sirf 'rate' mat tulna karo; poocho reducing ya flat.")],
   faq:[
    {q:L("Long or short tenure — what changes?","लंबा या छोटा टेन्योर — क्या बदलता है?","Lamba ya chhota tenure — kya badalta hai?"),a:L("Long = smaller EMI but much more total interest. Short = bigger EMI, less total interest. The trade-off is your cash flow.","लंबा = छोटी EMI पर ज़्यादा कुल ब्याज। छोटा = बड़ी EMI, कम ब्याज। ट्रेड-ऑफ आपका कैश फ्लो।","Lamba = chhoti EMI par zyada total interest. Chhota = badi EMI, kam interest. Trade-off aapka cash flow.")},
    {q:L("Is a 'flat 8%' loan cheap?","'फ्लैट 8%' लोन सस्ता है?","'Flat 8%' loan sasta hai?"),a:L("Usually not — its effective (reducing) rate can be much higher. Always ask for the reducing-balance rate.","आम तौर पर नहीं — इसका effective (रिड्यूसिंग) रेट कहीं ज़्यादा हो सकता है। हमेशा रिड्यूसिंग रेट पूछो।","Aam taur pe nahi — iska effective (reducing) rate kahin zyada ho sakta hai. Hamesha reducing rate poocho.")}
   ]},
  terms:[{k:L("Amortization","अमॉर्टाइज़ेशन","Amortization"),d:L("The changing interest-vs-principal split of each EMI over time.","समय के साथ हर EMI का बदलता ब्याज-बनाम-प्रिंसिपल बँटवारा।","Samay ke saath har EMI ka badalta interest-vs-principal batwara.")},{k:L("Reducing balance","रिड्यूसिंग बैलेंस","Reducing balance"),d:L("Interest charged only on the remaining principal — cheaper than flat.","सिर्फ बचे प्रिंसिपल पर ब्याज — फ्लैट से सस्ता।","Sirf bache principal pe interest — flat se sasta.")}],
  action:{h:L("See your EMI breakup","अपनी EMI का ब्रेकअप देखो","Apni EMI ka breakup dekho"),p:L("Enter a loan and see the interest-vs-principal split in year 1 versus the final year.","एक लोन डालो और पहले साल बनाम आखिरी साल का ब्याज-बनाम-प्रिंसिपल बँटवारा देखो।","Ek loan daalo aur pehle saal banaam aakhri saal ka interest-vs-principal batwara dekho."),data:L("Your loan's amount, rate and tenure (user-entered).","आपके लोन की राशि, दर और टेन्योर (यूज़र-डाला)।","Aapke loan ki raashi, rate aur tenure (user-entered).")},
  quiz:[
   {q:L("In an early EMI, which part is bigger?","शुरुआती EMI में कौन सा हिस्सा बड़ा?","Shuruaati EMI mein kaunsa hissa bada?"),o:[L("Principal","प्रिंसिपल","Principal"),L("Interest","ब्याज","Interest"),L("Both equal","दोनों बराबर","Dono barabar"),L("Neither","कोई नहीं","Koi nahi")],a:1,why:L("Outstanding is highest early, so the interest share dominates.","शुरू में बकाया सबसे ज़्यादा, तो ब्याज हिस्सा हावी।","Shuru mein bakaya sabse zyada, toh interest hissa haavi.")},
   {q:L("Which is cheaper and more transparent?","कौन सा सस्ता और पारदर्शी?","Kaunsa sasta aur transparent?"),o:[L("Flat rate","फ्लैट रेट","Flat rate"),L("Reducing balance","रिड्यूसिंग बैलेंस","Reducing balance"),L("Both same","दोनों बराबर","Dono barabar"),L("Depends on the bank's logo","बैंक के लोगो पर","Bank ke logo pe")],a:1,why:L("Reducing balance charges interest only on what's left — a lower effective cost.","रिड्यूसिंग सिर्फ बचे पर ब्याज लगाता है — कम effective कीमत।","Reducing sirf bache pe interest lagata hai — kam effective keemat.")}
  ],
  reflect:L("How little did the principal fall in year 1 — as expected?","पहले साल प्रिंसिपल कितना कम घटा — जैसा सोचा था?","Pehle saal principal kitna kam ghata — jaisa socha tha?"),
  tax:null},

 {id:"m3l3",title:L("The credit-card trap","क्रेडिट कार्ड का जाल","Credit card ka jaal"),sub:L("The truth about the minimum payment","मिनिमम पेमेंट का सच","Minimum payment ka sach"),mins:4,
  beats:{
   sit:L("A ₹30,000 card bill, hard to pay in full. The app shows 'Minimum due: ₹1,500' — feels like relief.","₹30,000 का कार्ड बिल, पूरा देना मुश्किल। ऐप दिखाता है 'मिनिमम ड्यू: ₹1,500' — राहत लगती है।","₹30,000 ka card bill, poora dena mushkil. App dikhata hai 'Minimum due: ₹1,500' — raahat lagti hai."),
   myth:{lie:L("I paid the minimum, so I'm safe.","मैंने मिनिमम दे दिया, तो मैं सेफ हूँ।","Maine minimum de diya, toh main safe hoon."),truth:L("The minimum is a trap — the rest carries very high interest that compounds against you.","मिनिमम एक जाल है — बाकी पर बहुत ऊँचा ब्याज लगता है जो आपके खिलाफ कंपाउंड होता है।","Minimum ek jaal hai — baaki pe bahut ooncha interest lagta hai jo aapke khilaaf compound hota hai.")},
   reflex:L("Paying only the minimum due each month.","हर महीने सिर्फ मिनिमम ड्यू देना।","Har mahine sirf minimum due dena."),
   q:L("I paid the minimum — is everything fine?","मैंने मिनिमम दिया — सब ठीक है?","Maine minimum diya — sab theek hai?"),
   fw:L("An unpaid balance revolves at a very high rate (often 3%+/month, 40%+/year) and compounds — compounding now working <b>against</b> you. New purchases also lose their interest-free grace. The minimum barely dents it. A card is fine if you pay the <b>full</b> bill monthly; the trap is revolving.","बकाया बहुत ऊँची दर (अक्सर 3%+/महीना, 40%+/साल) पर घूमता है और कंपाउंड होता है — कंपाउंडिंग अब आपके <b>खिलाफ</b>। नए खर्च की ब्याज-मुक्त छूट भी खत्म। मिनिमम मुश्किल से घटाता है। कार्ड ठीक है अगर <b>पूरा</b> बिल भरो।","Bakaya bahut oonchi dar (aksar 3%+/mahina, 40%+/saal) pe ghoomta hai aur compound hota hai — compounding ab aapke <b>khilaaf</b>. Naye kharch ki interest-free chhoot bhi khatam. Minimum mushkil se ghataata hai. Card theek hai agar <b>poora</b> bill bharo."),
   call:L("If you can't pay in full, target zero as fast as possible — it's the highest-interest enemy, ahead of investing. How to arrange it is your situation; just make it top priority.","अगर पूरा नहीं दे सकते, जितनी जल्दी हो बैलेंस ज़ीरो करो — यह सबसे ऊँचे ब्याज का दुश्मन, इन्वेस्टिंग से पहले। कैसे जुटाना आपकी situation; बस टॉप प्रायोरिटी दो।","Agar poora nahi de sakte, jitni jaldi ho balance zero karo — yeh sabse ooncha interest ka dushman, investing se pehle. Kaise jutaana aapki situation; bas top priority do.")
  },
  dd:{ex:[
   L("A credit card's most dangerous feature: if you don't pay the full bill, the leftover balance starts running at a very high interest rate — and that interest compounds. Compounding, which worked in your favour when investing, now runs against you. Revolving also kills the interest-free grace period on new purchases, so fresh spends start charging interest immediately too.","क्रेडिट कार्ड का सबसे खतरनाक हिस्सा: अगर पूरा बिल न भरो, बचा बैलेंस बहुत ऊँची दर पर चलने लगता है — और वो ब्याज कंपाउंड होता है। कंपाउंडिंग, जो इन्वेस्टिंग में फायदे में थी, अब खिलाफ। रिवॉल्व करते ही नए खर्च पर भी तुरंत ब्याज।","Credit card ka sabse khatarnaak hissa: agar poora bill na bharo, bacha balance bahut oonchi dar pe chalne lagta hai — aur woh interest compound hota hai. Compounding, jo investing mein faayde mein thi, ab khilaaf. Revolve karte hi naye kharch pe bhi turant interest."),
   L("'Minimum due' is dangerous precisely because it's just enough to keep the account from defaulting, while barely reducing the balance. Pay only the minimum and even a small balance can drag on for years, and you end up paying many times the original amount in interest. So a card balance is the very first enemy on your whole list — even ahead of investing, because stopping a 40% guaranteed loss beats any investment's likely return. The card itself is fine if you clear the full bill every month.","'मिनिमम ड्यू' खतरनाक इसलिए है कि वो बस डिफॉल्ट रोकता है, बैलेंस मुश्किल से घटाता है। सिर्फ मिनिमम भरते रहो तो छोटा बैलेंस भी सालों खिंच सकता है। इसलिए कार्ड बैलेंस पहला दुश्मन — इन्वेस्टिंग से भी पहले।","'Minimum due' khatarnaak isliye hai ki woh bas default rokta hai, balance mushkil se ghataata hai. Sirf minimum bharte raho toh chhota balance bhi saalon khinch sakta hai. Isliye card balance pehla dushman — investing se bhi pehle.")],
   faq:[
    {q:L("Should I transfer the balance to another card?","बैलेंस दूसरे कार्ड पर ट्रांसफर करूँ?","Balance doosre card pe transfer karun?"),a:L("A low-rate balance transfer can help, but check the fees and the rate after the intro period — or you can get stuck deeper.","लो-रेट बैलेंस ट्रांसफर मदद कर सकता है, पर फीस और इंट्रो के बाद का रेट देखो।","Low-rate balance transfer madad kar sakta hai, par fees aur intro ke baad ka rate dekho.")},
    {q:L("Should I cancel the card?","क्या कार्ड कैंसिल कर दूँ?","Kya card cancel kar dun?"),a:L("Not necessarily — using it and paying in full builds discipline (and cancelling can dent your score, lesson 6).","ज़रूरी नहीं — पूरा भरकर इस्तेमाल बेहतर (कैंसिल करना स्कोर भी घटा सकता है, पाठ 6)।","Zaroori nahi — poora bhar ke istemal behtar (cancel karna score bhi ghata sakta hai, lesson 6).")}
   ]},
  terms:[{k:L("Revolving credit","रिवॉल्विंग क्रेडिट","Revolving credit"),d:L("A leftover card balance carried forward at high interest.","बचा कार्ड बैलेंस जो ऊँचे ब्याज पर आगे बढ़ता है।","Bacha card balance jo ooncha interest pe aage badhta hai.")},{k:L("Minimum due","मिनिमम ड्यू","Minimum due"),d:L("The small amount that avoids default but barely cuts the balance.","वो छोटी रकम जो डिफॉल्ट रोकती है पर बैलेंस मुश्किल से घटाती है।","Woh chhoti raqam jo default rokti hai par balance mushkil se ghataati hai.")}],
  action:{h:L("See the minimum-only trap","मिनिमम-ओनली जाल देखो","Minimum-only jaal dekho"),p:L("Enter a revolving balance and compare 'minimum only' vs 'full payoff' — how much interest and how long.","एक रिवॉल्विंग बैलेंस डालो और 'सिर्फ मिनिमम' बनाम 'पूरा payoff' तुलना करो — कितना ब्याज, कितना समय।","Ek revolving balance daalo aur 'sirf minimum' banaam 'poora payoff' compare karo — kitna interest, kitna time."),data:L("A card balance and its rate (user-entered; app shows live ranges).","एक कार्ड बैलेंस और उसका रेट (यूज़र-डाला; ऐप लाइव रेंज)।","Ek card balance aur uska rate (user-entered; app live ranges).")},
  quiz:[
   {q:L("Paying only the minimum due means…","सिर्फ मिनिमम ड्यू देने का मतलब…","Sirf minimum due dene ka matlab…"),o:[L("You're debt-free","आप कर्ज़-मुक्त","Aap karza-mukt"),L("High interest compounds on the rest","बाकी पर ऊँचा ब्याज कंपाउंड","Baaki pe ooncha interest compound"),L("No interest at all","बिल्कुल ब्याज नहीं","Bilkul interest nahi"),L("The bank waives it","बैंक माफ कर देता है","Bank maaf kar deta hai")],a:1,why:L("The unpaid balance revolves at a very high, compounding rate.","बकाया बहुत ऊँची, कंपाउंडिंग दर पर घूमता है।","Bakaya bahut oonchi, compounding dar pe ghoomta hai.")},
   {q:L("When is a credit card basically free?","क्रेडिट कार्ड कब लगभग फ्री है?","Credit card kab lagbhag free hai?"),o:[L("When you revolve a balance","जब बैलेंस रिवॉल्व करो","Jab balance revolve karo"),L("When you pay the full bill monthly","जब हर महीने पूरा बिल भरो","Jab har mahine poora bill bharo"),L("When you pay only minimum","जब सिर्फ मिनिमम भरो","Jab sirf minimum bharo"),L("Never","कभी नहीं","Kabhi nahi")],a:1,why:L("Pay the full bill each month and you owe no interest — the card was free.","हर महीने पूरा भरो तो कोई ब्याज नहीं — कार्ड फ्री रहा।","Har mahine poora bharo toh koi interest nahi — card free raha.")}
  ],
  reflect:L("How many months did 'minimum only' take — was it shocking?","'सिर्फ मिनिमम' में कितने महीने लगे — चौंकाने वाला?","'Sirf minimum' mein kitne mahine lage — chaunkane wala?")},

 {id:"m3l4",title:L("Which loan to kill first?","पहले कौन सा लोन मारें?","Kaun sa loan pehle maaro?"),sub:L("Avalanche vs Snowball","एवलांच बनाम स्नोबॉल","Avalanche vs Snowball"),mins:4,
  beats:{
   sit:L("You have three debts — a card, a personal loan, and a small gadget EMI. You can pay a little extra each month. First strike on which?","आपके तीन कर्ज़ हैं — कार्ड, पर्सनल लोन, और छोटी गैजेट EMI। हर महीने थोड़ा एक्स्ट्रा दे सकते हो। पहला वार किस पर?","Aapke teen karze hain — card, personal loan, aur chhoti gadget EMI. Har mahine thoda extra de sakte ho. Pehla vaar kis pe?"),
   myth:{lie:L("Spread the extra thinly across all — that's fair.","एक्स्ट्रा को सब पर थोड़ा-थोड़ा बाँटो — फेयर है।","Extra ko sab pe thoda-thoda baanto — fair hai."),truth:L("Spreading is the slowest. Focus all the extra on one target — Avalanche or Snowball.","बाँटना सबसे धीमा है। सारा एक्स्ट्रा एक टारगेट पर — एवलांच या स्नोबॉल।","Baant-na sabse dheema hai. Saara extra ek target pe — Avalanche ya Snowball.")},
   reflex:L("Paying a little extra on everything at once.","एक साथ सब पर थोड़ा एक्स्ट्रा देना।","Ek saath sab pe thoda extra dena."),
   q:L("Where should my extra money go?","मेरा एक्स्ट्रा पैसा किस पर जाए?","Mera extra paisa kis pe jaaye?"),
   fw:L("Pay every <b>minimum</b> always. <b>Avalanche</b>: put all extra on the highest-interest loan first — least total interest, mathematically best. <b>Snowball</b>: extra on the smallest balance first — a quick win, more motivation. Best = the one you'll sustain.","हर <b>मिनिमम</b> हमेशा भरो। <b>एवलांच</b>: सारा एक्स्ट्रा सबसे ऊँचे-ब्याज पर पहले — सबसे कम कुल ब्याज, गणित से बेस्ट। <b>स्नोबॉल</b>: सबसे छोटे बैलेंस पर पहले — जल्दी जीत, ज़्यादा मोटिवेशन।","Har <b>minimum</b> hamesha bharo. <b>Avalanche</b>: saara extra sabse ooncha-interest pe pehle — sabse kam total interest, ganit se best. <b>Snowball</b>: sabse chhote balance pe pehle — jaldi jeet, zyada motivation. Best = jo aap nibhaao."),
   call:L("Numbers-driven → Avalanche; need momentum → Snowball. We don't pick your loans, only explain the method.","नंबर-ड्रिवन → एवलांच; मोमेंटम चाहिए → स्नोबॉल। हम आपके लोन नहीं चुनते, सिर्फ तरीका समझाते हैं।","Number-driven → Avalanche; momentum chahiye → Snowball. Hum aapke loans nahi chunte, sirf tareeka samjhaate hain.")
  },
  dd:{ex:[
   L("Always pay the minimum on every loan (missing one means penalties plus a credit-score hit). The only question is where the EXTRA goes. Avalanche puts all extra on the highest-interest debt, then the next highest — this pays the least total interest and clears you fastest, the head-smart route. Snowball puts extra on the smallest balance first, even if low-interest — it clears quickly, giving a motivating 'win', the psychology-smart route.","हर लोन का मिनिमम भरो (चूकना = पेनल्टी + स्कोर चोट)। सवाल सिर्फ एक्स्ट्रा का। एवलांच सबसे ऊँचे-ब्याज पर सारा एक्स्ट्रा — सबसे कम कुल ब्याज, दिमाग से सही। स्नोबॉल सबसे छोटे बैलेंस पर पहले — जल्दी खत्म, मोटिवेशन।","Har loan ka minimum bharo (chookna = penalty + score chot). Sawaal sirf extra ka. Avalanche sabse ooncha-interest pe saara extra — sabse kam total interest, dimaag se sahi. Snowball sabse chhote balance pe pehle — jaldi khatam, motivation."),
   L("Worked example — three debts: a ₹30,000 card (high rate), an ₹80,000 personal loan (mid), a ₹12,000 gadget EMI (low), with ₹5,000 extra a month. Avalanche sends the extra to the card first (highest rate) → least interest paid. Snowball sends it to the gadget EMI first (smallest) → fastest first win. Minimums are paid on all three, always. Pick the one you'll actually stick to.","उदाहरण — तीन कर्ज़: ₹30,000 कार्ड (ऊँचा), ₹80,000 पर्सनल (मध्यम), ₹12,000 गैजेट EMI (कम), ₹5,000 एक्स्ट्रा/महीना। एवलांच पहले कार्ड पर → कम ब्याज। स्नोबॉल पहले गैजेट पर → जल्दी जीत।","Udaharan — teen karze: ₹30,000 card (ooncha), ₹80,000 personal (madhyam), ₹12,000 gadget EMI (kam), ₹5,000 extra/mahina. Avalanche pehle card pe → kam interest. Snowball pehle gadget pe → jaldi jeet.")],
   faq:[
    {q:L("I have no extra money — then?","मेरे पास एक्स्ट्रा पैसा ही नहीं — तो?","Mere paas extra paisa hi nahi — toh?"),a:L("Free a little from your budget (Module 2) — even ₹1,000/month focused on one target makes a difference.","बजट (मॉड्यूल 2) से थोड़ा निकालो — ₹1,000/महीना भी एक टारगेट पर फर्क लाता है।","Budget (Module 2) se thoda nikalo — ₹1,000/mahina bhi ek target pe farak laata hai.")},
    {q:L("Invest or repay debt?","इन्वेस्ट करूँ या कर्ज़ चुकाऊँ?","Invest karun ya karza chukaun?"),a:L("If the loan's interest beats your likely investment return (like a card), repay first — that's a guaranteed 'return'.","अगर लोन का ब्याज संभावित रिटर्न से ज़्यादा (जैसे कार्ड), पहले चुकाओ — यह पक्का 'रिटर्न'।","Agar loan ka interest sambhavit return se zyada (jaise card), pehle chukao — yeh pakka 'return'.")}
   ]},
  terms:[{k:L("Avalanche","एवलांच","Avalanche"),d:L("Extra on the highest-interest debt first — least interest, best on paper.","पहले सबसे ऊँचे-ब्याज पर एक्स्ट्रा — कम ब्याज, कागज़ पर बेस्ट।","Pehle sabse ooncha-interest pe extra — kam interest, kaagaz pe best.")},{k:L("Snowball","स्नोबॉल","Snowball"),d:L("Extra on the smallest balance first — quick wins, best for motivation.","पहले सबसे छोटे बैलेंस पर एक्स्ट्रा — जल्दी जीत, मोटिवेशन।","Pehle sabse chhote balance pe extra — jaldi jeet, motivation.")}],
  action:{h:L("Compare Avalanche vs Snowball","एवलांच बनाम स्नोबॉल तुलना","Avalanche vs Snowball compare"),p:L("Enter your loans; the app shows both payoff orders and the total interest for each. Pick one.","अपने लोन डालो; ऐप दोनों payoff क्रम और कुल ब्याज दिखाएगा। एक चुनो।","Apne loans daalo; app dono payoff order aur total interest dikhayega. Ek chuno."),data:L("Your loans, balances and rates (user-entered).","आपके लोन, बैलेंस और दरें (यूज़र-डाला)।","Aapke loans, balances aur rates (user-entered).")},
  quiz:[
   {q:L("Avalanche means paying extra on…","एवलांच मतलब एक्स्ट्रा…","Avalanche matlab extra…"),o:[L("The smallest balance","सबसे छोटे बैलेंस पर","Sabse chhote balance pe"),L("The highest-interest loan","सबसे ऊँचे-ब्याज लोन पर","Sabse ooncha-interest loan pe"),L("A random loan","किसी भी लोन पर","Kisi bhi loan pe"),L("All equally","सब पर बराबर","Sab pe barabar")],a:1,why:L("Avalanche attacks the highest interest first — the least total interest paid.","एवलांच सबसे ऊँचे ब्याज पर पहले — सबसे कम कुल ब्याज।","Avalanche sabse ooncha interest pe pehle — sabse kam total interest.")},
   {q:L("What must you always keep paying?","हमेशा क्या भरते रहना चाहिए?","Hamesha kya bharte rehna chahiye?"),o:[L("Only the target loan","सिर्फ टारगेट लोन","Sirf target loan"),L("Every loan's minimum","हर लोन का मिनिमम","Har loan ka minimum"),L("Nothing until payday","पेडे तक कुछ नहीं","Payday tak kuch nahi"),L("Double on all","सब पर डबल","Sab pe double")],a:1,why:L("Miss a minimum and you get penalties plus a credit-score hit.","मिनिमम चूको तो पेनल्टी और स्कोर चोट।","Minimum chooko toh penalty aur score chot.")}
  ],
  reflect:L("How big was the total-interest gap between the two methods?","दोनों तरीकों में कुल-ब्याज का फर्क कितना था?","Dono methods mein total-interest ka farak kitna tha?")},

 {id:"m3l5",title:L("Prepayment: a little extra, a big saving","प्रीपेमेंट: थोड़ा एक्स्ट्रा, बड़ी बचत","Prepayment: thoda extra, badi bachat"),sub:L("Prepay, foreclose, tenure vs EMI","प्रीपे, फोरक्लोज़, टेन्योर बनाम EMI","Prepay, foreclose, tenure vs EMI"),mins:4,
  beats:{
   sit:L("You got a ₹1 lakh bonus. Two voices: 'put it on the loan, lift the weight' and 'leave it, the EMI's running anyway'.","₹1 लाख बोनस मिला। दो आवाज़ें: 'लोन पर डाल, बोझ उतरे' और 'रहने दे, EMI तो चल ही रही है'।","₹1 lakh bonus mila. Do awaaz: 'loan pe daal, bojh utre' aur 'rehne de, EMI toh chal hi rahi hai'."),
   myth:{lie:L("Prepaying doesn't help much — the EMI is the same.","प्रीपे करने का खास फायदा नहीं — EMI तो उतनी ही।","Prepay karne ka khaas fayda nahi — EMI toh utni hi."),truth:L("Prepayment cuts principal directly — and all future interest on that principal vanishes. The earlier, the bigger.","प्रीपेमेंट सीधे प्रिंसिपल घटाता है — और उस पर सारा भविष्य का ब्याज गायब। जितना जल्दी, उतना बड़ा।","Prepayment seedhe principal ghataata hai — aur us pe saara future ka interest gayab. Jitna jaldi, utna bada.")},
   reflex:L("Letting the loan just run to the end.","लोन को बस अंत तक चलने देना।","Loan ko bas ant tak chalne dena."),
   q:L("Should I put the bonus on the loan or not?","बोनस लोन पर डालूँ या नहीं?","Bonus loan pe daalun ya nahi?"),
   fw:L("Extra above the EMI goes <b>straight to principal</b>; since interest is on the remaining principal, cutting it early erases future interest. Two options: <b>reduce tenure</b> (max interest saved) or <b>reduce EMI</b> (monthly relief). <b>Foreclosure</b> = pay it all off. Note charges: RBI rules often mean no prepay charge on individual floating-rate loans, but fixed-rate or some personal loans may charge — get the exact figure in writing. (verify current rate/rules)","EMI से ऊपर एक्स्ट्रा <b>सीधे प्रिंसिपल</b> पर; ब्याज बचे प्रिंसिपल पर होता है, तो जल्दी घटाने से भविष्य का ब्याज मिटता है। दो विकल्प: <b>टेन्योर घटाओ</b> (ज़्यादा बचत) या <b>EMI घटाओ</b> (मंथली राहत)। <b>फोरक्लोज़र</b> = पूरा चुकाना। चार्ज देखो। (verify current rate/rules)","EMI se upar extra <b>seedhe principal</b> pe; interest bache principal pe hota hai, toh jaldi ghataane se future ka interest mitta hai. Do vikalp: <b>tenure ghatao</b> (zyada bachat) ya <b>EMI ghatao</b> (monthly raahat). <b>Foreclosure</b> = poora chukana. Charge dekho. (verify current rate/rules)"),
   call:L("Prepay vs invest = the loan's interest vs your expected return, plus your emergency buffer. High-interest loan → prepay almost always wins. Low-interest with a buffer set → you can balance. Don't break the emergency fund.","प्रीपे बनाम इन्वेस्ट = लोन का ब्याज बनाम संभावित रिटर्न, और आपका इमरजेंसी बफर। हाई-इंटरेस्ट → प्रीपे जीतता है। कम-ब्याज + बफर सेट → बैलेंस। इमरजेंसी फंड मत तोड़ो।","Prepay banaam invest = loan ka interest banaam sambhavit return, aur aapka emergency buffer. High-interest → prepay jeetta hai. Kam-byaaj + buffer set → balance. Emergency fund mat todo.")
  },
  dd:{ex:[
   L("When you pay above your normal EMI, the extra goes straight to principal. Because interest is always charged on the remaining principal, dropping it erases all the future interest that principal would have accrued. That's why prepaying EARLY is most powerful — early on, the principal (and its future interest) is largest. With part-prepayment you choose: reduce tenure (EMI same, loan ends sooner — most interest saved) or reduce EMI (tenure same, lower monthly load — cash-flow relief).","जब आप सामान्य EMI से ऊपर भरते हो, एक्स्ट्रा सीधे प्रिंसिपल पर। ब्याज बचे प्रिंसिपल पर होता है, तो उसे घटाने से भविष्य का पूरा ब्याज मिटता है। इसलिए जल्दी प्रीपे सबसे पावरफुल। दो विकल्प: टेन्योर घटाओ (ज़्यादा बचत) या EMI घटाओ (राहत)।","Jab aap saamaanya EMI se upar bharte ho, extra seedhe principal pe. Interest bache principal pe hota hai, toh use ghataane se future ka poora interest mitta hai. Isliye jaldi prepay sabse powerful. Do vikalp: tenure ghatao (zyada bachat) ya EMI ghatao (raahat)."),
   L("Timing matters hugely: the same ₹1 lakh prepaid early erases years of future interest on that principal, while prepaid near the end saves little (there was barely any interest left to charge). On charges: under RBI norms, individual floating-rate loans usually have no prepayment/foreclosure charge, but fixed-rate loans or some personal loans may. Always get the exact foreclosure amount and any charges in writing before closing. (verify current rate/rules before relying on this)","टाइमिंग बहुत मायने रखती है: वही ₹1 लाख जल्दी प्रीपे करने पर सालों का ब्याज मिटाता है, अंत में करने पर थोड़ा। चार्ज: RBI नियम से individual फ्लोटिंग लोन पर अक्सर प्रीपे चार्ज नहीं, फिक्स्ड/कुछ पर्सनल पर हो सकता है। लिखित में लो। (verify current rate/rules)","Timing bahut maayne rakhti hai: wahi ₹1 lakh jaldi prepay karne pe saalon ka interest mitaata hai, ant mein karne pe thoda. Charge: RBI niyam se individual floating loan pe aksar prepay charge nahi, fixed/kuch personal pe ho sakta hai. Likhit mein lo. (verify current rate/rules)")],
   faq:[
    {q:L("Prepay or build the emergency fund?","प्रीपे करूँ या इमरजेंसी फंड?","Prepay karun ya emergency fund?"),a:L("A small emergency buffer first — otherwise a prepayment that leaves you cashless can force new, costly debt. Buffer, then high-interest prepay.","पहले छोटा बफर — वरना कैश-लेस होकर नया महँगा कर्ज़ लेना पड़ सकता है। बफर, फिर हाई-इंटरेस्ट प्रीपे।","Pehle chhota buffer — warna cash-less ho ke naya mehnga karza lena pad sakta hai. Buffer, phir high-interest prepay.")},
    {q:L("Reduce tenure or EMI?","टेन्योर घटाऊँ या EMI?","Tenure ghataun ya EMI?"),a:L("Max interest saved → reduce tenure. Lower monthly load → reduce EMI. The principal cut is the same either way.","ज़्यादा बचत → टेन्योर घटाओ। मंथली राहत → EMI घटाओ। प्रिंसिपल कट दोनों में एक जैसा।","Zyada bachat → tenure ghatao. Monthly raahat → EMI ghatao. Principal cut dono mein ek jaisa.")}
   ]},
  terms:[{k:L("Prepayment","प्रीपेमेंट","Prepayment"),d:L("Money paid above the normal EMI that goes straight to principal.","सामान्य EMI से ऊपर दिया पैसा जो सीधे प्रिंसिपल पर जाता है।","Saamaanya EMI se upar diya paisa jo seedhe principal pe jaata hai.")},{k:L("Foreclosure","फोरक्लोज़र","Foreclosure"),d:L("Paying off the entire remaining loan at once to close it.","बचा पूरा लोन एक साथ चुकाकर बंद करना।","Bacha poora loan ek saath chukakar band karna.")}],
  action:{h:L("Test a prepayment","एक प्रीपेमेंट टेस्ट करो","Ek prepayment test karo"),p:L("Enter a prepayment and see 'reduce tenure' vs 'reduce EMI', and the effect of early vs late timing.","एक प्रीपेमेंट डालो और 'टेन्योर घटाओ' बनाम 'EMI घटाओ', और जल्दी बनाम देर का असर देखो।","Ek prepayment daalo aur 'tenure ghatao' banaam 'EMI ghatao', aur jaldi banaam der ka asar dekho."),data:L("Your loan details + a prepayment amount (user-entered).","आपके लोन डिटेल + प्रीपेमेंट राशि (यूज़र-डाला)।","Aapke loan details + prepayment raashi (user-entered).")},
  quiz:[
   {q:L("A prepayment goes toward…","प्रीपेमेंट किस पर जाता है…","Prepayment kis pe jaata hai…"),o:[L("Interest only","सिर्फ ब्याज","Sirf interest"),L("Principal directly","सीधे प्रिंसिपल","Seedhe principal"),L("Bank fees","बैंक फीस","Bank fees"),L("Nothing useful","कुछ काम का नहीं","Kuch kaam ka nahi")],a:1,why:L("Extra above the EMI cuts principal, erasing its future interest.","EMI से ऊपर एक्स्ट्रा प्रिंसिपल घटाता है, भविष्य का ब्याज मिटाता है।","EMI se upar extra principal ghataata hai, future ka interest mitaata hai.")},
   {q:L("When is prepaying most powerful?","प्रीपे कब सबसे पावरफुल?","Prepay kab sabse powerful?"),o:[L("Near the end","अंत के पास","Ant ke paas"),L("As early as possible","जितना जल्दी हो","Jitna jaldi ho"),L("Only in the last month","सिर्फ आखिरी महीने","Sirf aakhri mahine"),L("It never matters","कभी नहीं","Kabhi nahi")],a:1,why:L("Early, the principal and its future interest are largest, so you save the most.","जल्दी, प्रिंसिपल और भविष्य का ब्याज सबसे बड़ा, तो सबसे ज़्यादा बचत।","Jaldi, principal aur future ka interest sabse bada, toh sabse zyada bachat.")}
  ],
  reflect:L("Quicker freedom or monthly relief — which suits you?","जल्दी मुक्ति या मंथली राहत — कौन सा आपको सूट करता है?","Jaldi mukti ya monthly raahat — kaun sa aapko suit karta hai?"),
  tax:null},

 {id:"m3l6",title:L("How to close a loan — right to the NOC","लोन कैसे बंद करें — NOC तक","Loan band kaise karein — NOC tak"),sub:L("Closing properly + credit score","सही से बंद करना + क्रेडिट स्कोर","Closing properly + credit score"),mins:5,
  beats:{
   sit:L("The last payment's done, the loan is 'over'. Eight months later a new loan is rejected — the old one still shows 'active'.","आखिरी पेमेंट हो गया, लोन 'खत्म'। 8 महीने बाद नया लोन रिजेक्ट — पुराना अब भी 'एक्टिव' दिख रहा है।","Aakhri payment ho gaya, loan 'khatam'. 8 mahine baad naya loan reject — purana ab bhi 'active' dikh raha hai."),
   myth:{lie:L("The last EMI means the loan is fully closed.","आखिरी EMI मतलब लोन पूरी तरह बंद।","Aakhri EMI matlab loan poori tarah band."),truth:L("After payment you need closure paperwork — NOC, documents back, and a bureau update. Else a 'closed' loan bites later.","पेमेंट के बाद क्लोज़र पेपरवर्क चाहिए — NOC, दस्तावेज़ वापस, ब्यूरो अपडेट। वरना 'बंद' लोन बाद में काटता है।","Payment ke baad closure paperwork chahiye — NOC, documents wapas, bureau update. Warna 'band' loan baad mein kaat-ta hai.")},
   reflex:L("Assuming payment alone equals closure.","मान लेना कि सिर्फ पेमेंट = क्लोज़र।","Maan lena ki sirf payment = closure."),
   q:L("How do I close a loan completely?","लोन पूरी तरह कैसे बंद करूँ?","Loan poori tarah kaise band karun?"),
   fw:L("Steps: <b>1)</b> get the exact closing/foreclosure amount in writing, <b>2)</b> pay and keep the receipt, <b>3)</b> get the <b>NOC / No-Dues Certificate</b>, <b>4)</b> release any collateral/lien (e.g. remove RC hypothecation), <b>5)</b> collect original documents, <b>6)</b> check your credit report shows 'closed'.","चरण: <b>1)</b> exact क्लोज़िंग/फोरक्लोज़र राशि लिखित में, <b>2)</b> भुगतान + रसीद, <b>3)</b> <b>NOC / नो-ड्यूज़</b> लो, <b>4)</b> कोलैटरल/लियन रिलीज़ (जैसे RC हाइपोथिकेशन हटाना), <b>5)</b> ओरिजिनल दस्तावेज़ लो, <b>6)</b> क्रेडिट रिपोर्ट 'closed' दिखे।","Charan: <b>1)</b> exact closing/foreclosure raashi likhit mein, <b>2)</b> bhugtaan + raseed, <b>3)</b> <b>NOC / No-Dues</b> lo, <b>4)</b> collateral/lien release (jaise RC hypothecation hataana), <b>5)</b> original documents lo, <b>6)</b> credit report 'closed' dikhe."),
   call:L("When to close is your call — but do it fully: take the NOC, release security, confirm the bureau update. It's your right, so ask for it.","कब बंद करना आपका फैसला — पर पूरा करो: NOC लो, सिक्योरिटी रिलीज़, ब्यूरो अपडेट कन्फर्म। यह आपका हक है, माँगो।","Kab band karna aapka faisla — par poora karo: NOC lo, security release, bureau update confirm. Yeh aapka haq hai, maango.")
  },
  dd:{ex:[
   L("The final payment is only half the job. To fully close: (1) get the exact closing amount in writing (principal + any charges); (2) pay and keep the receipt; (3) get the NOC / No-Dues Certificate — the lender's written proof nothing is owed, the single most important document; (4) if anything was pledged (a home, a vehicle), confirm the charge/lien is removed; (5) collect any original documents the lender held; (6) a few weeks later, check your credit report shows the loan 'closed' — if not, use the NOC to fix it.","आखिरी पेमेंट सिर्फ आधा काम। पूरी तरह बंद करने: (1) exact क्लोज़िंग राशि लिखित में; (2) भुगतान + रसीद; (3) NOC / नो-ड्यूज़ — सबसे ज़रूरी दस्तावेज़; (4) गिरवी कुछ था तो लियन हटवाओ; (5) ओरिजिनल दस्तावेज़ लो; (6) कुछ हफ्ते बाद रिपोर्ट में 'closed' चेक करो।","Aakhri payment sirf aadha kaam. Poori tarah band karne: (1) exact closing raashi likhit mein; (2) bhugtaan + raseed; (3) NOC / No-Dues — sabse zaroori document; (4) girvi kuch tha toh lien hatwaao; (5) original documents lo; (6) kuch hafte baad report mein 'closed' check karo."),
   L("Your credit score (like CIBIL) reflects how reliably you repay: on-time payments, low credit utilisation, and old accounts push it up; missed payments and high utilisation pull it down. Check it free, but don't apply for many loans at once (each hard enquiry can dent it). And if you're drowning in debt: don't ignore it — talk to the lender (restructuring may be possible), free cash from your budget (Module 2), and run avalanche/snowball. Avoid borrowing from predatory instant-loan apps or loan sharks to pay old debt — that's a deeper hole.","आपका क्रेडिट स्कोर (जैसे CIBIL) दिखाता है आप कितने भरोसे से चुकाते हो: समय पर पेमेंट, कम यूटिलाइज़ेशन, पुराने अकाउंट ऊपर; मिस्ड/ज़्यादा नीचे। फ्री चेक करो, पर बार-बार अप्लाई मत करो। कर्ज़ में दबे हो तो: इग्नोर मत करो, लेंडर से बात करो, प्रिडेटरी ऐप/लोन शार्क से बचो।","Aapka credit score (jaise CIBIL) dikhata hai aap kitne bharose se chukate ho: samay pe payment, kam utilisation, purane account upar; missed/zyada neeche. Free check karo, par baar-baar apply mat karo. Karza mein dabe ho toh: ignore mat karo, lender se baat karo, predatory app/loan shark se bacho.")],
   faq:[
    {q:L("What if I don't get the NOC?","अगर NOC न मिले?","Agar NOC na mile?"),a:L("Demand it in writing — it's your right. Closure is incomplete without it and can hurt future loans and your score.","लिखित में माँगो — यह आपका हक है। इसके बिना क्लोज़र अधूरा और स्कोर पर असर।","Likhit mein maango — yeh aapka haq hai. Iske bina closure adhoora aur score pe asar.")},
    {q:L("Does closing a loan drop my score?","लोन बंद करने से स्कोर गिरता है?","Loan band karne se score girta hai?"),a:L("Maybe a small short-term dip (credit mix changes), but a paid, closed loan is a good long-term record.","शायद छोटा short-term डिप, पर चुकाया, बंद लोन लॉन्ग-टर्म में अच्छा रिकॉर्ड।","Shayad chhota short-term dip, par chukaya, band loan long-term mein achha record.")}
   ]},
  terms:[{k:L("NOC (No-Dues Certificate)","NOC (नो-ड्यूज़)","NOC (No-Dues Certificate)"),d:L("The lender's written proof the loan is fully paid and nothing is owed.","लेंडर का लिखित सबूत कि लोन पूरा चुका, कुछ बकाया नहीं।","Lender ka likhit saboot ki loan poora chuka, kuch bakaya nahi.")},{k:L("Credit score","क्रेडिट स्कोर","Credit score"),d:L("A number showing how reliably you repay borrowed money.","एक नंबर जो दिखाता है आप कर्ज़ कितने भरोसे से चुकाते हो।","Ek number jo dikhata hai aap karza kitne bharose se chukate ho.")}],
  action:{h:L("Build a loan-closing checklist","लोन-क्लोज़िंग चेकलिस्ट बनाओ","Loan-closing checklist banao"),p:L("For one of your loans, build the closing checklist — mark which steps/documents are still pending.","अपने किसी लोन के लिए क्लोज़िंग चेकलिस्ट बनाओ — कौन से चरण/दस्तावेज़ पेंडिंग हैं मार्क करो।","Apne kisi loan ke liye closing checklist banao — kaunse charan/documents pending hain mark karo."),data:L("Your loan's closure status (user-entered).","आपके लोन का क्लोज़र स्टेटस (यूज़र-डाला)।","Aapke loan ka closure status (user-entered).")},
  quiz:[
   {q:L("What's the key document proving a loan is closed?","लोन बंद होने का मुख्य दस्तावेज़ कौन सा?","Loan band hone ka mukhya document kaunsa?"),o:[L("The EMI schedule","EMI शेड्यूल","EMI schedule"),L("The NOC / No-Dues Certificate","NOC / नो-ड्यूज़","NOC / No-Dues Certificate"),L("A bank selfie","बैंक सेल्फी","Bank selfie"),L("The loan brochure","लोन ब्रोशर","Loan brochure")],a:1,why:L("The NOC is the lender's written proof nothing is owed — always collect it.","NOC लेंडर का लिखित सबूत है कि कुछ बकाया नहीं — हमेशा लो।","NOC lender ka likhit saboot hai ki kuch bakaya nahi — hamesha lo.")},
   {q:L("What helps your credit score?","क्रेडिट स्कोर किससे बेहतर होता है?","Credit score kisse behtar hota hai?"),o:[L("Missing payments","पेमेंट चूकना","Payment chookna"),L("On-time payments & low utilisation","समय पर पेमेंट और कम यूटिलाइज़ेशन","Samay pe payment aur kam utilisation"),L("Many loan applications","कई लोन एप्लिकेशन","Kai loan application"),L("Maxing your card","कार्ड फुल इस्तेमाल","Card full istemal")],a:1,why:L("Paying on time and using little of your limit build the score.","समय पर भुगतान और लिमिट का कम इस्तेमाल स्कोर बनाते हैं।","Samay pe bhugtaan aur limit ka kam istemal score banate hain.")}
  ],
  reflect:L("Do you have the NOC for any loan you consider 'closed'?","आपके किसी 'बंद' लोन का NOC आपके पास है?","Aapke kisi 'band' loan ka NOC aapke paas hai?")}
]};

const MODULE4={ id:"m4", n:4, title:L("Where to put it? The options","कहाँ रखें? ऑप्शन","Kahaan rakhein? Options"), theme:L("Understand the building blocks — as ideas, no products named.","बिल्डिंग ब्लॉक समझो — आइडिया के तौर पर, कोई प्रोडक्ट नहीं।","Building blocks samjho — ideas ke taur pe, koi product nahi."),
 lessons:[
 {id:"m4l1",title:L("Owning vs lending — equity vs debt","मालिक बनना बनाम उधार देना","Maalik banna vs udhaar dena"),sub:L("The two core building blocks","दो मूल बिल्डिंग ब्लॉक","The two core building blocks"),mins:4,
  beats:{
   sit:L("You've decided to invest. But you keep hearing 'equity', 'debt', 'shares', 'FD' — where do you even start?","आपने इन्वेस्ट करने का सोच लिया। पर 'इक्विटी', 'डेट', 'शेयर', 'FD' सुनते रहते हो — शुरू कहाँ से करें?","Aapne invest karne ka soch liya. Par 'equity', 'debt', 'shares', 'FD' sunte rehte ho — shuru kahan se karein?"),
   myth:{lie:L("You need to know dozens of products before you start.","शुरू करने से पहले दर्जनों प्रोडक्ट जानने पड़ते हैं।","Shuru karne se pehle darjanon product jaanne padte hain."),truth:L("There are just a few basic blocks. Two are core: owning vs lending.","बस कुछ मूल ब्लॉक हैं। दो कोर हैं: मालिक बनना बनाम उधार देना।","Bas kuch mool block hain. Do core hain: maalik banna vs udhaar dena.")},
   reflex:L("Freezing at the jargon, or blindly copying someone's picks.","शब्दजाल पर अटक जाना, या किसी की पिक्स नकल करना।","Shabdjaal pe atak jaana, ya kisi ki picks nakal karna."),
   q:L("What are the basic types, really?","असल में बेसिक टाइप क्या हैं?","Asal mein basic type kya hain?"),
   fw:L("<b>Equity</b> = you own a slice of a business — grows with it, but bumpy. <b>Debt</b> = you lend money and earn interest — steadier, lower growth. Almost everything else is a mix or variation of these two ideas.","<b>इक्विटी</b> = आप बिज़नेस का हिस्सा रखते हो — उसके साथ बढ़ता, पर बंपी। <b>डेट</b> = आप पैसा उधार देते हो और ब्याज कमाते — स्थिर, कम ग्रोथ। बाकी सब इन दो का मिश्रण।","<b>Equity</b> = aap business ka hissa rakhte ho — uske saath badhta, par bumpy. <b>Debt</b> = aap paisa udhaar dete ho aur interest kamate — steady, kam growth. Baaki sab in do ka mishran."),
   call:L("Which suits a goal depends on its horizon and your risk capacity — a later step. First, understand the two ideas.","कौन सा गोल के लिए = होराइज़न और रिस्क कैपेसिटी — बाद का कदम। पहले दो आइडिया समझो।","Kaunsa goal ke liye = horizon aur risk capacity — baad ka kadam. Pehle do idea samjho.")
  },
  dd:{ex:[
   L("Strip away the jargon and there are two core ways to invest. Owning (equity): you buy a slice of a business, so your money rises and falls with how that business does — higher growth potential over long periods, but bumpy along the way. Lending (debt): you lend money (to a company or government) and get paid interest — steadier and more predictable, but usually lower growth.","शब्दजाल हटाओ तो दो कोर तरीके हैं। मालिक बनना (इक्विटी): आप बिज़नेस का हिस्सा खरीदते हो, तो पैसा उसके साथ ऊपर-नीचे — लंबे में ज़्यादा ग्रोथ, पर बंपी। उधार देना (डेट): आप पैसा उधार देते हो और ब्याज पाते — स्थिर, पर कम ग्रोथ।","Shabdjaal hatao toh do core tareeke hain. Maalik banna (equity): aap business ka hissa khareedte ho, toh paisa uske saath upar-neeche — lambe mein zyada growth, par bumpy. Udhaar dena (debt): aap paisa udhaar dete ho aur interest paate — steady, par kam growth."),
   L("Neither is 'better' — they have different characters and both have a place. Equity's bumpiness is the price of its higher long-run growth; debt's calm is the price of its lower return. Almost every other product you'll hear about is built from, or blends, these two ideas. Get these two, and the rest stops being scary.","कोई 'बेहतर' नहीं — दोनों के अलग स्वभाव, दोनों की जगह। इक्विटी की बंपीनेस उसकी ज़्यादा ग्रोथ की कीमत; डेट की शांति उसकी कम रिटर्न की कीमत। बाकी हर प्रोडक्ट इन्हीं दो से बना।","Koi 'behtar' nahi — dono ke alag swabhaav, dono ki jagah. Equity ki bumpiness uski zyada growth ki keemat; debt ki shaanti uski kam return ki keemat. Baaki har product inhi do se bana.")],
   faq:[
    {q:L("Is equity just gambling?","क्या इक्विटी सिर्फ जुआ है?","Kya equity sirf jua hai?"),a:L("No — over long periods, owning good businesses tends to grow; the bumpiness is the trade for that growth, not a coin flip.","नहीं — लंबे में अच्छे बिज़नेस का मालिक होना बढ़ता है; बंपीनेस उस ग्रोथ का सौदा है।","Nahi — lambe mein achhe business ka maalik hona badhta hai; bumpiness us growth ka sauda hai.")},
    {q:L("Is debt totally risk-free?","क्या डेट पूरी तरह रिस्क-फ्री है?","Kya debt poori tarah risk-free hai?"),a:L("Steadier, not risk-free — the borrower could struggle, and returns can lag inflation. Lower bumpiness, not zero risk.","स्थिर, रिस्क-फ्री नहीं — उधार लेने वाला दिक्कत में आ सकता है, रिटर्न इन्फ्लेशन से पीछे। कम बंपीनेस, शून्य रिस्क नहीं।","Steady, risk-free nahi — udhaar lene wala dikkat mein aa sakta hai, return inflation se peeche. Kam bumpiness, zero risk nahi.")}
   ]},
  terms:[{k:L("Equity","इक्विटी","Equity"),d:L("Owning a slice of a business — higher growth potential, more bumpiness.","बिज़नेस का हिस्सा — ज़्यादा ग्रोथ, ज़्यादा बंपीनेस।","Business ka hissa — zyada growth, zyada bumpiness.")},{k:L("Debt","डेट","Debt"),d:L("Lending money for interest — steadier, lower growth.","ब्याज के लिए पैसा उधार देना — स्थिर, कम ग्रोथ।","Byaaj ke liye paisa udhaar dena — steady, kam growth.")}],
  action:L("View how a broad ownership basket and a lending-type return behaved over a year (real data).","देखो एक broad ownership basket और lending-type रिटर्न ने साल भर में कैसा किया (असली डेटा)।","Dekho ek broad ownership basket aur lending-type return ne saal bhar mein kaisa kiya (real data)."),
  quiz:[
   {q:L("Equity means…","इक्विटी का मतलब…","Equity ka matlab…"),o:[L("Lending for interest","ब्याज के लिए उधार","Byaaj ke liye udhaar"),L("Owning a slice of a business","बिज़नेस का हिस्सा रखना","Business ka hissa rakhna"),L("A fixed deposit","फिक्स्ड डिपॉज़िट","Fixed deposit"),L("Gold","सोना","Sona")],a:1,why:L("Equity is ownership — your money rises and falls with the business.","इक्विटी मालिकाना है — पैसा बिज़नेस के साथ ऊपर-नीचे।","Equity maalikaana hai — paisa business ke saath upar-neeche.")},
   {q:L("Which is generally steadier with lower growth?","आम तौर पर स्थिर और कम ग्रोथ कौन?","Aam taur pe steady aur kam growth kaun?"),o:[L("Equity","इक्विटी","Equity"),L("Debt","डेट","Debt"),L("Neither","कोई नहीं","Koi nahi"),L("Both same","दोनों बराबर","Dono barabar")],a:1,why:L("Debt (lending) is steadier and lower-growth; equity is bumpier and higher-growth.","डेट स्थिर और कम-ग्रोथ; इक्विटी बंपी और ज़्यादा-ग्रोथ।","Debt steady aur kam-growth; equity bumpy aur zyada-growth.")}
  ],
  reflect:L("Owning or lending — which idea feels more comfortable to you, and why?","मालिक बनना या उधार देना — कौन सा आइडिया ज़्यादा सहज लगता है, क्यों?","Maalik banna ya udhaar dena — kaunsa idea zyada sehaj lagta hai, kyun?")},

 {id:"m4l2",title:L("One stock vs a whole basket","अकेला स्टॉक बनाम पूरी टोकरी","Akela stock vs poori tokri"),sub:L("Single security vs a fund/index idea","सिंगल सिक्योरिटी बनाम फंड/इंडेक्स","Single security vs a fund/index idea"),mins:4,
  beats:{
   sit:L("A friend made money on one hot stock, and you're tempted to put everything on a single name.","एक दोस्त ने एक हॉट स्टॉक पर पैसा बनाया, और आप सब कुछ एक नाम पर लगाने को ललचा रहे हो।","Ek dost ne ek hot stock pe paisa banaya, aur aap sab kuch ek naam pe lagaane ko lalcha rahe ho."),
   myth:{lie:L("Picking the one right stock is how you win.","एक सही स्टॉक चुनना ही जीत है।","Ek sahi stock chunna hi jeet hai."),truth:L("One name is a concentrated bet; a basket spreads the risk — usually the smarter start.","एक नाम एक concentrated दांव है; टोकरी रिस्क बाँटती है — आमतौर पर समझदार शुरुआत।","Ek naam ek concentrated daanv hai; tokri risk baant-ti hai — aam taur pe samajhdaar shuruaat.")},
   reflex:L("Betting big on a single tip or stock.","एक टिप या स्टॉक पर बड़ा दांव।","Ek tip ya stock pe bada daanv."),
   q:L("Should I buy one stock or many?","एक स्टॉक लूँ या कई?","Ek stock lun ya kai?"),
   fw:L("A single stock rises or falls entirely on one company. A <b>basket</b> (a fund/index idea — many holdings together) softens any one bad outcome. This is diversification (Module 1) in action. We won't name a basket — just the idea: one vs many.","एक स्टॉक पूरी तरह एक कंपनी पर चढ़ता-गिरता है। एक <b>टोकरी</b> (फंड/इंडेक्स आइडिया — कई होल्डिंग साथ) किसी एक बुरे नतीजे को नरम करती है। यह डाइवर्सिफिकेशन है।","Ek stock poori tarah ek company pe chadhta-girta hai. Ek <b>basket</b> (fund/index idea — kai holdings saath) kisi ek bure natije ko naram karti hai. Yeh diversification hai."),
   call:L("Single names carry concentration risk; whether you ever hold them is your call by risk capacity — but a spread-out approach is the calmer default.","सिंगल नाम concentration रिस्क रखते हैं; रखना या नहीं आपका फैसला — पर फैला हुआ तरीका शांत डिफ़ॉल्ट।","Single naam concentration risk rakhte hain; rakhna ya nahi aapka faisla — par phaila hua tareeka shaant default.")
  },
  dd:{ex:[
   L("Put everything on one stock and your outcome depends entirely on that single company — if it stumbles, you take the full hit. A basket holds many companies at once, so one bad performer is cushioned by the others. This is diversification from Module 1, applied: the same expected return with less bumpiness.","सब एक स्टॉक पर लगाओ तो नतीजा पूरी तरह उस एक कंपनी पर — वो लड़खड़ाई तो पूरा झटका। टोकरी कई कंपनियाँ रखती है, तो एक खराब को बाकी संभाल लेते हैं। यही डाइवर्सिफिकेशन: उतना रिटर्न, कम बंपीनेस।","Sab ek stock pe lagao toh natija poori tarah us ek company pe — woh ladkhadai toh poora jhatka. Tokri kai companyaan rakhti hai, toh ek kharab ko baaki sambhaal lete hain. Yahi diversification: utna return, kam bumpiness."),
