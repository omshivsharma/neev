   L("The cruel part: the urge to sell is strongest at the very bottom, when fear peaks — exactly when selling is worst. You can't rely on willpower in that moment, so you defend against it in advance: right-size your risk to your sleep test (Module 5) so a crash never exceeds what you can hold, and pre-commit to a rule in calm times ('I don't sell a long-term holding in a crash unless my goals changed'). A plan decided before the storm survives the storm — and that closes the mistakes module.","क्रूर हिस्सा: बेचने का लालच तली पर सबसे तेज़, जब डर चरम — तभी बेचना सबसे बुरा। उस पल विलपावर पर भरोसा नहीं, तो पहले से बचाव: रिस्क को नींद टेस्ट से सही रखो, और शांति में नियम पहले तय करो। तूफ़ान से पहले तय प्लान तूफ़ान झेलता।","Kroor hissa: bechne ka laalach tali pe sabse tez, jab dar charam — tabhi bechna sabse bura. Us pal willpower pe bharosa nahi, toh pehle se bachaav: risk ko neend test se sahi rakho, aur shaanti mein niyam pehle tay karo. Toofaan se pehle tay plan toofaan jhelta.")],
   faq:[
    {q:L("What if I actually need the money soon?","अगर मुझे सच में जल्दी पैसा चाहिए?","Agar mujhe sach mein jaldi paisa chahiye?"),a:L("Then it shouldn't have been in a bumpy investment (Module 5). Near-term money belongs in steadier, reachable places — a horizon mismatch, not a crash problem.","तो वो बंपी में होना ही नहीं चाहिए था। जल्द चाहिए पैसा स्थिर, रीचेबल जगह।","Toh woh bumpy mein hona hi nahi chahiye tha. Jald chahiye paisa sthir, reachable jagah.")},
    {q:L("How do I stay calm in a crash?","क्रैश में शांत कैसे रहूँ?","Crash mein shaant kaise rahun?"),a:L("Right-size risk beforehand, avoid over-checking (this module), and remember: history says diversified markets have recovered given time.","पहले से रिस्क सही रखो, ओवर-चेकिंग टालो, और याद रखो: डाइवर्सिफाइड मार्केट समय पाकर रिकवर हुए हैं।","Pehle se risk sahi rakho, over-checking taalo, aur yaad rakho: diversified market samay paakar recover hue hain.")}
   ]},
  terms:[{k:L("Panic selling","पैनिक सेलिंग","Panic selling"),d:L("Selling in fear during a fall, locking in the loss.","गिरावट में डर से बेचना, नुकसान पक्का करना।","Giraavat mein dar se bechna, nuksaan pakka karna.")},{k:L("Loss aversion","लॉस एवर्ज़न","Loss aversion"),d:L("Feeling losses far more painfully than equal gains — fuels panic.","बराबर लाभ से नुकसान ज़्यादा दर्दनाक लगना — पैनिक बढ़ाता।","Barabar laabh se nuksaan zyada dardnaak lagna — panic badhaata.")}],
  action:{h:L("Held vs panic-sold","थामा बनाम पैनिक-बेचा","Thaama banaam panic-becha"),p:L("Run a virtual crash-and-recovery and compare 'held the plan' vs 'panic-sold at the bottom'.","एक वर्चुअल क्रैश-और-रिकवरी चलाओ और 'प्लान थामा' बनाम 'तली पर पैनिक-बेचा' तुलना करो।","Ek virtual crash-aur-recovery chalao aur 'plan thaama' banaam 'tali pe panic-becha' compare karo."),data:L("Your virtual portfolio (in-app).","आपका वर्चुअल पोर्टफोलियो (ऐप में)।","Aapka virtual portfolio (app mein).")},
  quiz:[
   {q:L("Panic-selling in a crash usually…","क्रैश में पैनिक-सेलिंग आमतौर पर…","Crash mein panic-selling aam taur pe…"),o:[L("Protects your money","पैसा बचाती","Paisa bachati"),L("Locks the loss and misses the rebound","नुकसान पक्का, रिबाउंड चूक","Nuksaan pakka, rebound chook"),L("Guarantees profit","मुनाफे की गारंटी","Munaafe ki guarantee"),L("Lowers taxes","टैक्स घटाती","Tax ghataati")],a:1,why:L("Selling makes a paper loss permanent and you miss the recovery.","बेचना कागज़ी नुकसान स्थायी बनाता, रिकवरी छूटती।","Bechna kaagzi nuksaan sthaayi banata, recovery chhootti.")},
   {q:L("The best defence against panic-selling is…","पैनिक-सेलिंग से सबसे अच्छा बचाव…","Panic-selling se sabse achha bachaav…"),o:[L("Willpower in the moment","पल में विलपावर","Pal mein willpower"),L("Right-size risk + pre-commit in calm times","रिस्क सही + शांति में पहले तय","Risk sahi + shaanti mein pehle tay"),L("Check prices more","ज़्यादा दाम देखो","Zyada daam dekho"),L("Follow the news","न्यूज़ फॉलो","News follow")],a:1,why:L("Decide before the storm and size risk so you never must sell.","तूफ़ान से पहले तय करो और रिस्क ऐसा रखो कि बेचना न पड़े।","Toofaan se pehle tay karo aur risk aisa rakho ki bechna na pade.")}
  ],
  reflect:L("In the last scary drop, what would holding vs selling have done to you?","पिछली डरावनी गिरावट में, थामना बनाम बेचना आपके साथ क्या करता?","Pichhli daraavni giraavat mein, thaamna banaam bechna aapke saath kya karta?")}
]};

const MODULE8={ id:"m8", n:8, title:L("Tax, fees & paperwork","टैक्स, फीस और पेपरवर्क","Tax, fees aur paperwork"), theme:L("The quiet leaks — keep more of what you make (India-specific).","खामोश रिसाव — जो कमाओ उसका ज़्यादा रखो (भारत-विशिष्ट)।","Khamosh risaav — jo kamao uska zyada rakho (India-specific)."),
 lessons:[
 {id:"m8l1",title:L("Sold at a profit — how much tax?","बेचकर मुनाफा — टैक्स कितना?","Bechkar munaafa — tax kitna?"),sub:L("Capital gains: long-term vs short-term","कैपिटल गेन: लॉन्ग-टर्म बनाम शॉर्ट-टर्म","Capital gains: long-term vs short-term"),mins:5,
  beats:{
   sit:L("You sold an investment at a profit, feeling great — then wonder 'how much tax on this?'","आपने मुनाफे में इन्वेस्टमेंट बेचा, मन खुश — फिर सोचते हो 'इस पर टैक्स कितना?'","Aapne munaafe mein investment becha, mann khush — phir sochte ho 'is pe tax kitna?'"),
   myth:{lie:L("The whole profit is mine to keep.","पूरा मुनाफा मेरा रखने को है।","Poora munaafa mera rakhne ko hai."),truth:L("When you sell at a gain, part may be taxed — how much depends on what you held and for how long.","मुनाफे में बेचने पर हिस्सा taxed हो सकता है — कितना = क्या रखा और कितने समय।","Munaafe mein bechne pe hissa taxed ho sakta hai — kitna = kya rakha aur kitne samay.")},
   reflex:L("Ignoring tax until it surprises you.","टैक्स को तब तक अनदेखा करना जब तक चौंका न दे।","Tax ko tab tak andekha karna jab tak chaunka na de."),
   q:L("I made a profit — what's the tax?","मुझे मुनाफा हुआ — टैक्स क्या?","Mujhe munaafa hua — tax kya?"),
   fw:L("<b>Capital gain</b> = profit on selling above cost. In India tax differs by <b>asset type</b> (equity vs debt vs gold treated differently) and <b>holding period</b> — long-term (beyond a threshold) vs short-term, at different rates. Longer holding often means gentler tax. Exact thresholds/rates change — verify.","<b>कैपिटल गेन</b> = लागत से ऊपर बेचने का मुनाफा। भारत में टैक्स <b>एसेट टाइप</b> (इक्विटी/डेट/गोल्ड अलग) और <b>होल्डिंग अवधि</b> — लॉन्ग-टर्म बनाम शॉर्ट-टर्म, अलग दरों से। लंबा रखना अक्सर हल्का टैक्स। दरें बदलती हैं — verify।","<b>Capital gain</b> = laagat se upar bechne ka munaafa. India mein tax <b>asset type</b> (equity/debt/gold alag) aur <b>holding period</b> — long-term banaam short-term, alag daron se. Lamba rakhna aksar halka tax. Rates badalti hain — verify."),
   call:L("Knowing gains are taxed (and long-term is usually lighter) is enough to plan around; for the exact number, verify current rules.","गेन taxed होते हैं (और लॉन्ग-टर्म हल्का) यह जानना प्लान के लिए काफी; सटीक नंबर के लिए मौजूदा नियम verify करो।","Gain taxed hote hain (aur long-term halka) yeh jaanna plan ke liye kaafi; sateek number ke liye maujooda niyam verify karo.")
  },
  dd:{ex:[
   L("A capital gain is simply the profit when you sell something for more than you paid. In India, how it's taxed depends on two things. First, the asset type — equity, debt and gold each have their own rules. Second, the holding period — hold beyond a set threshold and it's a 'long-term' gain (usually taxed more gently); sell before that and it's 'short-term' (usually taxed at a higher rate).","कैपिटल गेन बस मुनाफा है जब लागत से ज़्यादा में बेचो। भारत में टैक्स दो बातों पर: एसेट टाइप (इक्विटी, डेट, गोल्ड के अलग नियम) और होल्डिंग अवधि — तय सीमा से ज़्यादा रखो तो 'लॉन्ग-टर्म' (अक्सर हल्का); पहले बेचो तो 'शॉर्ट-टर्म' (अक्सर ज़्यादा)।","Capital gain bas munaafa hai jab laagat se zyada mein becho. India mein tax do baaton pe: asset type (equity, debt, gold ke alag niyam) aur holding period — tay seema se zyada rakho toh 'long-term' (aksar halka); pehle becho toh 'short-term' (aksar zyada)."),
   L("Two practical takeaways. One: because long-term gains are usually taxed more gently, patience is rewarded twice — by compounding AND by lighter tax. Two: frequent buying and selling not only breaks compounding (Module 4) but keeps triggering short-term tax and charges, quietly shrinking your returns. The exact thresholds and rates change over time and by asset, so always verify the current rules before acting. (verify current rate before relying on this)","दो व्यावहारिक बातें। एक: लॉन्ग-टर्म हल्का taxed, तो सब्र दोहरा इनाम — कंपाउंडिंग और हल्का टैक्स। दो: बार-बार खरीद-बेच कंपाउंडिंग तोड़ती और शॉर्ट-टर्म टैक्स+चार्ज बार-बार लगाती। सीमा/दरें बदलती हैं — verify। (verify current rate)","Do vyaavhaarik baatein. Ek: long-term halka taxed, toh sabr dohra inaam — compounding aur halka tax. Do: baar-baar khareed-bech compounding todti aur short-term tax+charge baar-baar lagaati. Seema/rates badalti hain — verify. (verify current rate)")],
   faq:[
    {q:L("Do I pay tax if I don't sell?","न बेचूँ तो टैक्स लगेगा?","Na bechun toh tax lagega?"),a:L("Generally capital-gains tax applies when you sell and realise the gain — holding it isn't a sale. (Some income like dividends is taxed separately; verify.)","आमतौर पर बेचने पर लगता — रखना बिक्री नहीं। (डिविडेंड जैसी आय अलग; verify।)","Aam taur pe bechne pe lagta — rakhna bikri nahi. (Dividend jaisi aay alag; verify.)")},
    {q:L("Is there tax on SIPs?","SIP पर टैक्स है?","SIP pe tax hai?"),a:L("Each SIP instalment has its own purchase date, so its holding period is counted separately when you sell — verify how that applies to your case.","हर SIP किस्त की अपनी खरीद तारीख, तो बेचते वक्त होल्डिंग अलग गिनी जाती — verify।","Har SIP kist ki apni khareed taareekh, toh bechte waqt holding alag gini jaati — verify.")}
   ]},
  terms:[{k:L("Capital gains","कैपिटल गेन","Capital gains"),d:L("Profit from selling an asset above what you paid.","लागत से ऊपर एसेट बेचने का मुनाफा।","Laagat se upar asset bechne ka munaafa.")},{k:L("LTCG / STCG","LTCG / STCG","LTCG / STCG"),d:L("Long-term vs short-term capital gains — taxed differently by holding period.","लॉन्ग-टर्म बनाम शॉर्ट-टर्म गेन — होल्डिंग से अलग taxed।","Long-term banaam short-term gain — holding se alag taxed.")}],
  action:{h:L("Long-term or short-term?","लॉन्ग-टर्म या शॉर्ट-टर्म?","Long-term ya short-term?"),p:L("For a virtual sale, see which holding-period bucket it falls into (rates flagged to verify).","एक वर्चुअल बिक्री के लिए देखो वो किस होल्डिंग बकेट में आती है (दरें verify)।","Ek virtual bikri ke liye dekho woh kis holding bucket mein aati hai (rates verify)."),data:L("Your buy and sell dates (user-entered).","आपकी खरीद और बिक्री तारीखें (यूज़र-डाला)।","Aapki khareed aur bikri taareekhein (user-entered).")},
  quiz:[
   {q:L("India's capital-gains tax depends on…","भारत का कैपिटल-गेन टैक्स किस पर…","India ka capital-gain tax kis pe…"),o:[L("Only the amount","सिर्फ रकम","Sirf raqam"),L("Asset type and holding period","एसेट टाइप और होल्डिंग अवधि","Asset type aur holding period"),L("The weather","मौसम","Mausam"),L("Your age","आपकी उम्र","Aapki umar")],a:1,why:L("Equity/debt/gold differ, and long-term vs short-term are taxed differently.","इक्विटी/डेट/गोल्ड अलग, और लॉन्ग/शॉर्ट अलग।","Equity/debt/gold alag, aur long/short alag.")},
   {q:L("Holding longer often means…","ज़्यादा समय रखना अक्सर…","Zyada samay rakhna aksar…"),o:[L("Heavier tax","भारी टैक्स","Bhaari tax"),L("Gentler (long-term) tax","हल्का (लॉन्ग-टर्म) टैक्स","Halka (long-term) tax"),L("No difference","कोई फर्क नहीं","Koi farak nahi"),L("A penalty","पेनल्टी","Penalty")],a:1,why:L("Long-term gains are usually taxed more gently — patience is rewarded.","लॉन्ग-टर्म अक्सर हल्का — सब्र का इनाम।","Long-term aksar halka — sabr ka inaam.")}
  ],
  reflect:L("Are any of your gains short-term that could've been long-term with patience?","आपके कोई गेन शॉर्ट-टर्म हैं जो सब्र से लॉन्ग-टर्म हो सकते थे?","Aapke koi gain short-term hain jo sabr se long-term ho sakte the?"),
  tax:L("Capital-gains rates, thresholds and holding-period definitions differ by asset (equity/debt/gold) and change over time. (verify current rate before relying on this)","कैपिटल-गेन दरें, सीमाएँ और होल्डिंग परिभाषाएँ एसेट से अलग और समय के साथ बदलती हैं। (verify current rate before relying on this)","Capital-gain rates, seemayein aur holding definitions asset se alag aur samay ke saath badalti hain. (verify current rate before relying on this)")},

 {id:"m8l2",title:L("Small fee, big bite","छोटी फीस, बड़ी चोट","Chhoti fee, badi chot"),sub:L("Fees compound too","फीस भी कंपाउंड होती है","Fees compound too"),mins:4,
  beats:{
   sit:L("A fund charges a 'small' 1.5% a year. Sounds tiny — you ignore it.","एक फंड 'छोटी' 1.5% सालाना लेता है। नन्ही लगती — आप अनदेखा करते हो।","Ek fund 'chhoti' 1.5% saalaana leta hai. Nanhi lagti — aap andekha karte ho."),
   myth:{lie:L("A 1% or 2% fee is too small to matter.","1% या 2% फीस मायने रखने को बहुत छोटी।","1% ya 2% fee maayne rakhne ko bahut chhoti."),truth:L("Fees compound just like returns; a small annual fee quietly eats a large slice of your long-run corpus.","फीस रिटर्न की तरह कंपाउंड होती; छोटी सालाना फीस चुपचाप लंबे corpus का बड़ा हिस्सा खा जाती।","Fee return ki tarah compound hoti; chhoti saalaana fee chupchaap lambe corpus ka bada hissa kha jaati.")},
   reflex:L("Ignoring costs because each looks small.","हर एक छोटी दिखने से लागत अनदेखा करना।","Har ek chhoti dikhne se laagat andekha karna."),
   q:L("Do these small fees really matter?","क्या ये छोटी फीस सच में मायने रखती हैं?","Kya ye chhoti fee sach mein maayne rakhti hain?"),
   fw:L("Costs include the <b>expense ratio</b> (annual %), <b>exit load</b> (early-withdrawal fee), and <b>brokerage/charges</b> per trade. Because they recur and compound over decades, even 1% can cost lakhs on a large corpus. Lower cost is one of the few near-guaranteed edges.","लागत में <b>एक्सपेंस रेशियो</b> (सालाना %), <b>एग्ज़िट लोड</b> (जल्दी निकासी फीस), और <b>ब्रोकरेज/चार्ज</b> प्रति ट्रेड। ये बार-बार और दशकों कंपाउंड, तो 1% भी बड़े corpus पर लाखों। कम लागत दुर्लभ पक्की बढ़त।","Laagat mein <b>expense ratio</b> (saalaana %), <b>exit load</b> (jaldi nikaasi fee), aur <b>brokerage/charge</b> prati trade. Ye baar-baar aur dashakon compound, toh 1% bhi bade corpus pe laakhon. Kam laagat durlabh pakki badhat."),
   call:L("Weigh the fee against what it buys (Module 4's convenience/skill); don't ignore it just because it's a small percent.","फीस को उसके बदले मिलने वाले (मॉड्यूल 4 सुविधा/स्किल) से तौलो; छोटा % देखकर अनदेखा मत करो।","Fee ko uske badle milne wale (Module 4 suvidha/skill) se taulo; chhota % dekhkar andekha mat karo.")
  },
  dd:{ex:[
   L("Three kinds of cost quietly follow your money: the expense ratio (a yearly percentage a fund charges to run itself), an exit load (a fee for leaving too early), and brokerage/transaction charges each time you trade. Individually they look trivial — 'just 1%'. But they're charged every single year, on your whole balance, forever.","तीन तरह की लागत चुपचाप पीछे: एक्सपेंस रेशियो (फंड की सालाना %), एग्ज़िट लोड (जल्दी निकलने की फीस), और हर ट्रेड पर ब्रोकरेज। अलग-अलग नन्ही — 'बस 1%'। पर हर साल, पूरे बैलेंस पर, हमेशा।","Teen tarah ki laagat chupchaap peeche: expense ratio (fund ki saalaana %), exit load (jaldi nikalne ki fee), aur har trade pe brokerage. Alag-alag nanhi — 'bas 1%'. Par har saal, poore balance pe, hamesha."),
   L("Here's the sting: costs compound exactly like returns, just against you. A 1% higher annual fee, over 25-30 years on a growing corpus, can quietly swallow lakhs — a chunk that would otherwise have compounded for you. That's why keeping costs low is one of the very few edges in investing that's almost guaranteed to help. Weigh every fee against what it actually buys you (Module 4), and never dismiss it as 'just a small percent'.","चुभन: लागत रिटर्न की तरह कंपाउंड, बस आपके खिलाफ। 1% ज़्यादा फीस, 25-30 साल बढ़ते corpus पर, चुपचाप लाखों निगल सकती। इसलिए कम लागत लगभग पक्की बढ़त। हर फीस को उसके बदले से तौलो, 'बस छोटा %' कहकर मत टालो।","Chubhan: laagat return ki tarah compound, bas aapke khilaaf. 1% zyada fee, 25-30 saal badhte corpus pe, chupchaap laakhon nigal sakti. Isliye kam laagat lagbhag pakki badhat. Har fee ko uske badle se taulo, 'bas chhota %' kehkar mat taalo.")],
   faq:[
    {q:L("Is the cheapest always best?","सबसे सस्ता हमेशा बेस्ट?","Sabse sasta hamesha best?"),a:L("Not blindly — a slightly higher fee can be worth real convenience or diversification (Module 4). But an unjustified high fee is pure drag.","आँख मूँदकर नहीं — थोड़ी ज़्यादा फीस असली सुविधा के लायक हो सकती। पर बेवजह ऊँची फीस शुद्ध बोझ।","Aankh moondkar nahi — thodi zyada fee asli suvidha ke layak ho sakti. Par bewajah oonchi fee shuddh bojh.")},
    {q:L("What's an exit load again?","एग्ज़िट लोड फिर से क्या?","Exit load phir se kya?"),a:L("A fee charged if you withdraw before a set period — a reason to match investments to their intended horizon.","तय अवधि से पहले निकालने की फीस — इन्वेस्टमेंट को होराइज़न से मैच करने का कारण।","Tay avadhi se pehle nikaalne ki fee — investment ko horizon se match karne ka kaaran.")}
   ]},
  terms:[{k:L("Expense ratio","एक्सपेंस रेशियो","Expense ratio"),d:L("A fund's annual charge as a % of your money.","फंड का सालाना चार्ज, आपके पैसे का %।","Fund ka saalaana charge, aapke paise ka %.")},{k:L("Exit load","एग्ज़िट लोड","Exit load"),d:L("A fee for withdrawing before a set period.","तय अवधि से पहले निकालने की फीस।","Tay avadhi se pehle nikaalne ki fee.")}],
  action:{h:L("0.5% vs 1.5% over decades","0.5% बनाम 1.5% दशकों में","0.5% banaam 1.5% dashakon mein"),p:L("Compare a long-run corpus with a 0.5% vs a 1.5% annual fee (illustrative).","एक लंबे corpus को 0.5% बनाम 1.5% सालाना फीस से तुलना करो (उदाहरण)।","Ek lambe corpus ko 0.5% banaam 1.5% saalaana fee se compare karo (udaharan)."),data:L("Illustrative on a real return series (in-app).","असली रिटर्न सीरीज़ पर उदाहरण (ऐप में)।","Asli return series pe udaharan (app mein).")},
  quiz:[
   {q:L("Why do small fees matter so much?","छोटी फीस इतनी क्यों मायने रखती हैं?","Chhoti fee itni kyun maayne rakhti hain?"),o:[L("They don't","नहीं रखतीं","Nahi rakhtin"),L("They compound over decades against you","दशकों आपके खिलाफ कंपाउंड","Dashakon aapke khilaaf compound"),L("They're refunded","वापस मिलती","Wapas milti"),L("They cut taxes","टैक्स घटातीं","Tax ghaatin")],a:1,why:L("A yearly fee compounds on a growing corpus — small % , big rupees.","सालाना फीस बढ़ते corpus पर कंपाउंड — छोटा %, बड़े रुपये।","Saalaana fee badhte corpus pe compound — chhota %, bade rupaye.")},
   {q:L("An exit load is charged when you…","एग्ज़िट लोड कब लगता जब आप…","Exit load kab lagta jab aap…"),o:[L("Invest more","और इन्वेस्ट करो","Aur invest karo"),L("Withdraw before a set period","तय अवधि से पहले निकालो","Tay avadhi se pehle nikaalo"),L("Hold long-term","लॉन्ग-टर्म रखो","Long-term rakho"),L("Pay tax","टैक्स दो","Tax do")],a:1,why:L("Exit loads penalise early withdrawal — match money to its horizon.","एग्ज़िट लोड जल्दी निकासी पर — पैसा होराइज़न से मैच।","Exit load jaldi nikaasi pe — paisa horizon se match.")}
  ],
  reflect:L("Do you know the fee on what you (or family) hold?","आप (या परिवार) जो रखते हो उसकी फीस पता है?","Aap (ya family) jo rakhte ho uski fee pata hai?"),
  tax:L("Fees and loads vary by product and change; regulators also cap some charges. (verify current rate before relying on this)","फीस और लोड प्रोडक्ट से अलग और बदलते; रेगुलेटर कुछ चार्ज सीमित भी करते हैं। (verify current rate before relying on this)","Fee aur load product se alag aur badalte; regulator kuch charge seemit bhi karte hain. (verify current rate before relying on this)")},

 {id:"m8l3",title:L("KYC, demat, folio — what are these?","KYC, डीमैट, फोलियो — ये क्या?","KYC, demat, folio — ye kya?"),sub:L("The account plumbing, demystified","अकाउंट प्लंबिंग, आसान भाषा में","The account plumbing, demystified"),mins:4,
  beats:{
   sit:L("You're ready to invest but hit a wall of jargon — KYC, demat, folio, PAN — and freeze.","आप इन्वेस्ट को तैयार, पर शब्दजाल की दीवार — KYC, डीमैट, फोलियो, PAN — और जम जाते हो।","Aap invest ko taiyaar, par shabdjaal ki deewar — KYC, demat, folio, PAN — aur jam jaate ho."),
   myth:{lie:L("The paperwork is too complex for me.","पेपरवर्क मेरे लिए बहुत जटिल है।","Paperwork mere liye bahut jatil hai."),truth:L("It's a one-time setup of a few standard things; once done, investing is simple.","यह कुछ मानक चीज़ों का एक-बार सेटअप है; हो जाने पर इन्वेस्टिंग आसान।","Yeh kuch maanak cheezon ka ek-baar setup hai; ho jaane pe investing aasaan.")},
   reflex:L("Putting off investing because setup feels intimidating.","सेटअप डरावना लगने से इन्वेस्टिंग टालना।","Setup daraavna lagne se investing taalna."),
   q:L("What accounts and paperwork do I actually need?","असल में कौन से अकाउंट/पेपरवर्क चाहिए?","Asal mein kaunse account/paperwork chahiye?"),
   fw:L("The plumbing, plainly: <b>KYC</b> (one-time identity verification required to invest), a <b>demat/investment account</b> (holds investments electronically), a <b>folio/account number</b> (your record with a fund/registrar), and <b>PAN</b> (tax ID linking it). One-time setup; after that you just invest.","प्लंबिंग सरलता से: <b>KYC</b> (इन्वेस्ट के लिए एक-बार पहचान), <b>डीमैट/इन्वेस्टमेंट अकाउंट</b> (इन्वेस्टमेंट इलेक्ट्रॉनिक रखे), <b>फोलियो/अकाउंट नंबर</b> (फंड/रजिस्ट्रार से रिकॉर्ड), और <b>PAN</b> (टैक्स ID)। एक-बार सेटअप; फिर बस इन्वेस्ट।","Plumbing saralta se: <b>KYC</b> (invest ke liye ek-baar pehchaan), <b>demat/investment account</b> (investment electronic rakhe), <b>folio/account number</b> (fund/registrar se record), aur <b>PAN</b> (tax ID). Ek-baar setup; phir bas invest."),
   call:L("Which provider/platform is your call; these concepts just remove the fear so you can start.","कौन सा प्रोवाइडर/प्लेटफॉर्म आपका फैसला; ये concept सिर्फ डर हटाते ताकि शुरू करो।","Kaunsa provider/platform aapka faisla; ye concept sirf dar hataate taaki shuru karo.")
  },
  dd:{ex:[
   L("None of these are as scary as they sound. KYC ('Know Your Customer') is a one-time identity check — PAN, ID and address proof — that regulations require before you can invest anywhere. A demat/investment account holds your investments electronically (no paper certificates). A folio or account number is simply your unique record with a particular fund house or registrar. PAN is your tax ID that ties it all together.","इनमें से कोई इतना डरावना नहीं। KYC ('नो योर कस्टमर') एक-बार पहचान जाँच — PAN, ID, पता — जो इन्वेस्ट से पहले नियम माँगते। डीमैट/इन्वेस्टमेंट अकाउंट इन्वेस्टमेंट इलेक्ट्रॉनिक रखे। फोलियो/अकाउंट नंबर फंड से आपका रिकॉर्ड। PAN टैक्स ID जो सब जोड़े।","Inmein se koi itna daraavna nahi. KYC ('Know Your Customer') ek-baar pehchaan jaanch — PAN, ID, pata — jo invest se pehle niyam maangte. Demat/investment account investment electronic rakhe. Folio/account number fund se aapka record. PAN tax ID jo sab jode."),
   L("The key point: this is a one-time setup. You do it once, and after that investing is just a few taps. Keep your credentials and documents safe (this is your money's front door), and you never have to fear the paperwork again. The jargon is designed to sound official, not to keep you out — millions of ordinary people complete it. We name no provider; the concept is all you need to start without freezing.","मुख्य बात: यह एक-बार सेटअप। एक बार करो, फिर इन्वेस्टिंग कुछ टैप। क्रेडेंशियल और दस्तावेज़ सुरक्षित रखो (यह आपके पैसे का दरवाज़ा), फिर पेपरवर्क से डर नहीं। शब्दजाल आधिकारिक लगने को है, रोकने को नहीं।","Mukhya baat: yeh ek-baar setup. Ek baar karo, phir investing kuch tap. Credential aur documents surakshit rakho (yeh aapke paise ka darwaaza), phir paperwork se dar nahi. Shabdjaal aadhikaarik lagne ko hai, rokne ko nahi.")],
   faq:[
    {q:L("Why so much verification?","इतनी जाँच क्यों?","Itni jaanch kyun?"),a:L("It protects you and the system from fraud and money-laundering — annoying once, but it's why your investments are traceably yours.","यह आपको और सिस्टम को फ्रॉड से बचाती — एक बार झंझट, पर इसी से इन्वेस्टमेंट पक्के आपके।","Yeh aapko aur system ko fraud se bachati — ek baar jhanjhat, par isi se investment pakke aapke.")},
    {q:L("Can I hold everything in one place?","सब एक जगह रख सकता हूँ?","Sab ek jagah rakh sakta hoon?"),a:L("Often yes — a single account can hold many investments, and consolidated statements pull it together (last lesson). Fewer logins, less mess.","अक्सर हाँ — एक अकाउंट कई इन्वेस्टमेंट रखे, consolidated स्टेटमेंट जोड़े। कम लॉगिन, कम झंझट।","Aksar haan — ek account kai investment rakhe, consolidated statement jode. Kam login, kam jhanjhat.")}
   ]},
  terms:[{k:L("KYC","KYC","KYC"),d:L("A one-time identity verification required before investing.","इन्वेस्ट से पहले ज़रूरी एक-बार पहचान जाँच।","Invest se pehle zaroori ek-baar pehchaan jaanch.")},{k:L("Demat account","डीमैट अकाउंट","Demat account"),d:L("An account that holds your investments electronically.","एक अकाउंट जो इन्वेस्टमेंट इलेक्ट्रॉनिक रखे।","Ek account jo investment electronic rakhe.")}],
  action:{h:L("Your setup checklist","आपकी सेटअप चेकलिस्ट","Aapki setup checklist"),p:L("Build a simple 'setup checklist' (PAN, KYC, account, nominee) and tick what you already have.","एक सरल 'सेटअप चेकलिस्ट' (PAN, KYC, अकाउंट, नॉमिनी) बनाओ और जो है टिक करो।","Ek saral 'setup checklist' (PAN, KYC, account, nominee) banao aur jo hai tick karo."),data:L("Your setup status (user-entered).","आपका सेटअप स्टेटस (यूज़र-डाला)।","Aapka setup status (user-entered).")},
  quiz:[
   {q:L("KYC is…","KYC है…","KYC hai…"),o:[L("A type of fund","एक तरह का फंड","Ek tarah ka fund"),L("A one-time identity verification","एक-बार पहचान जाँच","Ek-baar pehchaan jaanch"),L("A tax","एक टैक्स","Ek tax"),L("A stock","एक स्टॉक","Ek stock")],a:1,why:L("KYC is the one-time identity check required before you can invest.","KYC इन्वेस्ट से पहले एक-बार पहचान जाँच।","KYC invest se pehle ek-baar pehchaan jaanch.")},
   {q:L("The account setup is…","अकाउंट सेटअप है…","Account setup hai…"),o:[L("A daily chore","रोज़ का काम","Roz ka kaam"),L("A one-time thing, then investing is simple","एक-बार, फिर इन्वेस्टिंग आसान","Ek-baar, phir investing aasaan"),L("Impossible alone","अकेले असंभव","Akele asambhav"),L("Only for the rich","सिर्फ अमीरों के लिए","Sirf ameeron ke liye")],a:1,why:L("You set it up once; after that, investing is just a few taps.","एक बार सेट, फिर कुछ टैप।","Ek baar set, phir kuch tap.")}
  ],
  reflect:L("What's the one setup step stopping you from starting?","शुरू करने से रोकने वाला एक सेटअप स्टेप कौन सा?","Shuru karne se rokne wala ek setup step kaunsa?")},

 {id:"m8l4",title:L("No nominee? Big risk","नॉमिनी नहीं? बड़ा रिस्क","Nominee nahi? Bada risk"),sub:L("Nomination & succession basics","नॉमिनेशन और उत्तराधिकार बेसिक","Nomination & succession basics"),mins:4,
  beats:{
   sit:L("A relative passed away; the family spent months chasing paperwork to access investments that had no nominee.","एक रिश्तेदार गुज़रे; परिवार ने महीनों पेपरवर्क में लगाए ऐसे इन्वेस्टमेंट पाने को जिनका नॉमिनी नहीं था।","Ek rishtedaar guzre; family ne mahino paperwork mein lagaaye aise investment paane ko jinka nominee nahi tha."),
   myth:{lie:L("Nomination is a small, optional detail.","नॉमिनेशन एक छोटा, वैकल्पिक विवरण।","Nomination ek chhota, vaikalpik vivaran."),truth:L("A missing nominee can trap your money in red tape for your family — a five-minute step with huge payoff.","नॉमिनी न होना परिवार के लिए पैसा लालफीताशाही में फँसा सकता — पाँच मिनट का कदम, बड़ा फायदा।","Nominee na hona family ke liye paisa laalpheetashaahi mein phansa sakta — paanch minute ka kadam, bada fayda.")},
   reflex:L("Skipping the nominee field 'to do later'.","'बाद में' के चक्कर में नॉमिनी फील्ड छोड़ना।","'Baad mein' ke chakkar mein nominee field chhodna."),
   q:L("Do I really need to name a nominee?","क्या सच में नॉमिनी नाम करना ज़रूरी?","Kya sach mein nominee naam karna zaroori?"),
   fw:L("A <b>nominee</b> is the person who can receive/claim your investment if something happens to you — smoothing access for your family. It's not the same as a will (which decides ownership), but it makes the practical handover far faster. Add/update nominees on every account; revisit after big life events.","<b>नॉमिनी</b> वो व्यक्ति जो आपके साथ कुछ होने पर इन्वेस्टमेंट पा/क्लेम कर सके — परिवार के लिए एक्सेस आसान। यह वसीयत (मालिकाना तय) जैसा नहीं, पर व्यावहारिक हैंडओवर तेज़। हर अकाउंट पर नॉमिनी जोड़ो/अपडेट करो।","<b>Nominee</b> woh vyakti jo aapke saath kuch hone pe investment paa/claim kar sake — family ke liye access aasaan. Yeh wasiyat (maalikaana tay) jaisa nahi, par vyaavhaarik handover tez. Har account pe nominee jodo/update karo."),
   call:L("Whom to nominate is deeply personal; the non-negotiable is: don't leave the field blank.","किसे नॉमिनेट करना गहरा व्यक्तिगत; बात बस इतनी: फील्ड खाली मत छोड़ो।","Kise nominate karna gehra vyaktigat; baat bas itni: field khaali mat chhodo.")
  },
  dd:{ex:[
   L("A nominee is simply the person you name to receive or claim your investment if you're no longer around. Its whole purpose is practical: it lets your family access the money quickly and smoothly, instead of getting stuck in long, expensive legal processes. Leaving the nominee field blank is one of the most common and costly oversights — it can turn a simple handover into months of paperwork for grieving relatives.","नॉमिनी बस वो व्यक्ति जिसे आप नाम करते हो कि आपके न रहने पर इन्वेस्टमेंट पा/क्लेम करे। पूरा मकसद व्यावहारिक: परिवार जल्दी, आसानी से पैसा पाए, लंबी महँगी कानूनी प्रक्रिया में न फँसे। फील्ड खाली छोड़ना आम, महँगी चूक।","Nominee bas woh vyakti jise aap naam karte ho ki aapke na rehne pe investment paa/claim kare. Poora maqsad vyaavhaarik: family jaldi, aasaani se paisa paaye, lambi mehngi kaanooni prakriya mein na phanse. Field khaali chhodna aam, mehngi chook."),
   L("Two clarifications. A nominee is not the same as a will: a will decides who legally owns your assets, while a nominee is a trustee-like receiver who makes the handover easy — ideally the two align. And nominations aren't set-once: update them after major life events (marriage, a child, a death) so they stay current. Keep your family aware of what exists and where. Whom you choose is personal; that you choose someone is essential.","दो स्पष्टीकरण। नॉमिनी वसीयत जैसा नहीं: वसीयत मालिकाना तय, नॉमिनी हैंडओवर आसान करने वाला — दोनों मेल खाएँ तो बेस्ट। और नॉमिनेशन एक-बार नहीं: शादी, बच्चा, मृत्यु के बाद अपडेट। परिवार को पता हो क्या और कहाँ।","Do spashtikaran. Nominee wasiyat jaisa nahi: wasiyat maalikaana tay, nominee handover aasaan karne wala — dono mel khaayein toh best. Aur nomination ek-baar nahi: shaadi, bachcha, mrityu ke baad update. Family ko pata ho kya aur kahan.")],
   faq:[
    {q:L("Nominee vs will — the difference?","नॉमिनी बनाम वसीयत — फर्क?","Nominee banaam wasiyat — farak?"),a:L("A will decides legal ownership; a nominee eases the practical handover. Best when they point to the same people.","वसीयत मालिकाना तय; नॉमिनी हैंडओवर आसान। दोनों एक ही लोग हों तो बेस्ट।","Wasiyat maalikaana tay; nominee handover aasaan. Dono ek hi log hon toh best.")},
    {q:L("Can I have more than one nominee?","एक से ज़्यादा नॉमिनी हो सकते?","Ek se zyada nominee ho sakte?"),a:L("Often yes, with shares specified — check each account's rules and keep them updated.","अक्सर हाँ, हिस्से बताकर — हर अकाउंट के नियम देखो और अपडेट रखो।","Aksar haan, hisse batakar — har account ke niyam dekho aur update rakho.")}
   ]},
  terms:[{k:L("Nominee","नॉमिनी","Nominee"),d:L("The person named to receive/claim your investment if you're gone.","आपके न रहने पर इन्वेस्टमेंट पाने को नामित व्यक्ति।","Aapke na rehne pe investment paane ko naamit vyakti.")},{k:L("Succession","उत्तराधिकार","Succession"),d:L("How assets pass to family — smoother with nominees and a will.","संपत्ति परिवार तक कैसे पहुँचे — नॉमिनी और वसीयत से आसान।","Sampatti family tak kaise pahunche — nominee aur wasiyat se aasaan.")}],
  action:{h:L("Nominee audit","नॉमिनी ऑडिट","Nominee audit"),p:L("List your accounts and mark which have a nominee set and which don't.","अपने अकाउंट लिखो और मार्क करो किनमें नॉमिनी है, किनमें नहीं।","Apne account likho aur mark karo kinmein nominee hai, kinmein nahi."),data:L("Your accounts' nominee status (user-entered).","आपके अकाउंट का नॉमिनी स्टेटस (यूज़र-डाला)।","Aapke account ka nominee status (user-entered).")},
  quiz:[
   {q:L("A nominee's main purpose is to…","नॉमिनी का मुख्य मकसद…","Nominee ka mukhya maqsad…"),o:[L("Increase returns","रिटर्न बढ़ाना","Return badhaana"),L("Ease access for your family if you're gone","आपके न रहने पर परिवार को एक्सेस आसान","Aapke na rehne pe family ko access aasaan"),L("Save tax","टैक्स बचाना","Tax bachana"),L("Pick investments","इन्वेस्टमेंट चुनना","Investment chunna")],a:1,why:L("A nominee smooths and speeds the handover to your family.","नॉमिनी परिवार को हैंडओवर आसान और तेज़ करता।","Nominee family ko handover aasaan aur tez karta.")},
   {q:L("A nominee is…","नॉमिनी है…","Nominee hai…"),o:[L("The same as a will","वसीयत जैसा ही","Wasiyat jaisa hi"),L("Different from a will (eases handover)","वसीयत से अलग (हैंडओवर आसान)","Wasiyat se alag (handover aasaan)"),L("A type of tax","एक टैक्स","Ek tax"),L("Optional and pointless","वैकल्पिक और बेकार","Vaikalpik aur bekaar")],a:1,why:L("A will decides ownership; a nominee eases the practical handover.","वसीयत मालिकाना; नॉमिनी हैंडओवर आसान।","Wasiyat maalikaana; nominee handover aasaan.")}
  ],
  reflect:L("Which of your accounts has no nominee yet?","आपके किस अकाउंट में अब तक नॉमिनी नहीं है?","Aapke kis account mein ab tak nominee nahi hai?")},

 {id:"m8l5",title:L("Saving tax the wrong way","गलत तरीके से टैक्स बचाना","Galat tareeke se tax bachana"),sub:L("Don't let tax distort the decision","टैक्स को फैसला बिगाड़ने मत दो","Tax ko faisla bigaadne mat do"),mins:4,
  beats:{
   sit:L("It's March, and you're rushing to buy something 'to save tax' before the deadline, barely reading what it is.","मार्च है, और आप डेडलाइन से पहले 'टैक्स बचाने' को कुछ खरीदने की जल्दी में, मुश्किल से पढ़ते हुए।","March hai, aur aap deadline se pehle 'tax bachane' ko kuch khareedne ki jaldi mein, mushkil se padhte hue."),
   myth:{lie:L("If it saves tax, it's automatically a good investment.","अगर टैक्स बचाता है, तो अपने आप अच्छा इन्वेस्टमेंट।","Agar tax bachata hai, toh apne aap achha investment."),truth:L("Tax-saving should inform a decision, not distort it — a bad investment isn't good just because it cuts tax.","टैक्स-सेविंग फैसले को सूचित करे, बिगाड़े नहीं — बुरा इन्वेस्टमेंट सिर्फ टैक्स घटाने से अच्छा नहीं।","Tax-saving faisle ko soochit kare, bigaade nahi — bura investment sirf tax ghataane se achha nahi.")},
   reflex:L("Buying tax-savers in a panic without checking fit, lock-in, or returns.","बिना फिट, लॉक-इन, रिटर्न देखे पैनिक में टैक्स-सेवर खरीदना।","Bina fit, lock-in, return dekhe panic mein tax-saver khareedna."),
   q:L("Should I buy this just to save tax?","क्या सिर्फ टैक्स बचाने को यह खरीदूँ?","Kya sirf tax bachane ko yeh khareedun?"),
   fw:L("Tax benefits are real and worth using, but the tax tail shouldn't wag the investment dog. Something that saves some tax but has poor returns, a long lock-in, or doesn't fit your goal can cost more than it saves. Check fit first (goal, horizon, risk, cost), THEN let tax be a tiebreaker. Plan early to avoid the March panic.","टैक्स लाभ असली और उपयोगी, पर टैक्स की पूँछ इन्वेस्टमेंट के कुत्ते को न हिलाए। जो थोड़ा टैक्स बचाए पर खराब रिटर्न, लंबा लॉक-इन, या गोल से मेल न खाए, वो बचत से ज़्यादा खर्च करा सकता। पहले फिट देखो, फिर टैक्स tiebreaker। जल्दी प्लान।","Tax laabh asli aur upyogi, par tax ki poonch investment ke kutte ko na hilaaye. Jo thoda tax bachaaye par kharab return, lamba lock-in, ya goal se mel na khaaye, woh bachat se zyada kharch kara sakta. Pehle fit dekho, phir tax tiebreaker. Jaldi plan."),
   call:L("Use tax benefits, but choose by fit first and tax second; never buy blind to beat a deadline.","टैक्स लाभ लो, पर पहले फिट से चुनो, टैक्स बाद में; डेडलाइन के लिए आँख मूँदकर मत खरीदो।","Tax laabh lo, par pehle fit se chuno, tax baad mein; deadline ke liye aankh moondkar mat khareedo.")
  },
  dd:{ex:[
   L("There's an old saying: don't let the tax tail wag the investment dog. Tax breaks are genuinely valuable and you should use the ones you're entitled to — but they're a reason to prefer one good option over another, not a reason to buy something bad. A tax-saver with weak returns, a multi-year lock-in, or a poor fit for your goal can quietly cost you more than the tax it saves.","एक पुरानी कहावत: टैक्स की पूँछ इन्वेस्टमेंट के कुत्ते को न हिलाए। टैक्स छूट सच में मूल्यवान, हक की लो — पर वो एक अच्छे को दूसरे पर तरजीह देने का कारण, बुरा खरीदने का नहीं। कमज़ोर रिटर्न, लंबा लॉक-इन, खराब फिट वाला टैक्स-सेवर बचत से ज़्यादा खर्च करा सकता।","Ek purani kahaawat: tax ki poonch investment ke kutte ko na hilaaye. Tax chhoot sach mein mulyavaan, haq ki lo — par woh ek achhe ko doosre pe tarjeeh dene ka kaaran, bura khareedne ka nahi. Kamzor return, lamba lock-in, kharab fit wala tax-saver bachat se zyada kharch kara sakta."),
   L("The fix is an order of operations: first check fit using everything you've learned — does it match the goal's horizon, your risk, and is its cost reasonable (Modules 4-6). Only among options that pass should tax be the tiebreaker. And the annual March scramble is itself the trap: rushing a big decision under a deadline guarantees poor choices. Plan tax-linked investments early in the year, calmly, as part of your normal plan.","हल एक क्रम: पहले फिट देखो — गोल के होराइज़न, रिस्क, लागत से मेल? (मॉड्यूल 4-6)। जो पास हों उन्हीं में टैक्स tiebreaker। और मार्च की भागदौड़ खुद जाल: डेडलाइन में बड़ा फैसला = खराब। साल के शुरू में शांति से प्लान।","Hal ek kram: pehle fit dekho — goal ke horizon, risk, laagat se mel? (Module 4-6). Jo paas hon unhi mein tax tiebreaker. Aur March ki bhaagdaud khud jaal: deadline mein bada faisla = kharab. Saal ke shuru mein shaanti se plan.")],
   faq:[
    {q:L("So should I ignore tax benefits?","तो टैक्स लाभ अनदेखा करूँ?","Toh tax laabh andekha karun?"),a:L("No — use them! Just choose by fit first, then let a tax break tip you between otherwise-good options.","नहीं — इस्तेमाल करो! बस पहले फिट से चुनो, फिर टैक्स दो अच्छे में झुकाए।","Nahi — istemal karo! Bas pehle fit se chuno, phir tax do achhe mein jhukaaye.")},
    {q:L("Why is March such a trap?","मार्च इतना जाल क्यों?","March itna jaal kyun?"),a:L("Deadline pressure forces rushed, unresearched buys. Planning early in the year removes the panic and the bad choices.","डेडलाइन दबाव जल्दबाज़ी करवाता। साल के शुरू प्लान पैनिक हटाता।","Deadline dabaav jaldbaazi karwaata. Saal ke shuru plan panic hataata.")}
   ]},
  terms:[{k:L("Tax-saving instrument","टैक्स-सेविंग इंस्ट्रूमेंट","Tax-saving instrument"),d:L("An investment offering a tax break — good only if it also fits.","टैक्स छूट देने वाला इन्वेस्टमेंट — तभी अच्छा जब फिट भी हो।","Tax chhoot dene wala investment — tabhi achha jab fit bhi ho.")},{k:L("Lock-in","लॉक-इन","Lock-in"),d:L("A period during which you can't withdraw the money.","वो अवधि जिसमें पैसा निकाल नहीं सकते।","Woh avadhi jismein paisa nikaal nahi sakte.")}],
  action:{h:L("Fit first, tax second","पहले फिट, फिर टैक्स","Pehle fit, phir tax"),p:L("Judge a 'tax-saver' by fit first (goal, horizon, cost, lock-in), then tax — a mini checklist.","एक 'टैक्स-सेवर' को पहले फिट से जज करो (गोल, होराइज़न, लागत, लॉक-इन), फिर टैक्स — मिनी चेकलिस्ट।","Ek 'tax-saver' ko pehle fit se judge karo (goal, horizon, laagat, lock-in), phir tax — mini checklist."),data:L("The option's fit details (user-entered).","ऑप्शन की फिट डिटेल (यूज़र-डाला)।","Option ki fit detail (user-entered).")},
  quiz:[
   {q:L("'Don't let the tax tail wag the dog' means…","'टैक्स की पूँछ कुत्ते को न हिलाए' मतलब…","'Tax ki poonch kutte ko na hilaaye' matlab…"),o:[L("Ignore all tax","सारा टैक्स अनदेखा","Saara tax andekha"),L("Choose by fit first, tax second","पहले फिट, फिर टैक्स","Pehle fit, phir tax"),L("Only buy tax-savers","सिर्फ टैक्स-सेवर","Sirf tax-saver"),L("Never invest in March","मार्च में कभी नहीं","March mein kabhi nahi")],a:1,why:L("Tax should refine a good decision, not drive a bad one.","टैक्स अच्छे फैसले को निखारे, बुरे को न चलाए।","Tax achhe faisle ko nikhaare, bure ko na chalaaye.")},
   {q:L("The March tax-rush is risky because…","मार्च टैक्स-भागदौड़ रिस्की क्योंकि…","March tax-bhaagdaud risky kyunki…"),o:[L("March is unlucky","मार्च अशुभ","March ashubh"),L("Deadline pressure forces rushed choices","डेडलाइन दबाव जल्दबाज़ी","Deadline dabaav jaldbaazi"),L("Taxes are higher then","तब टैक्स ज़्यादा","Tab tax zyada"),L("Markets close","मार्केट बंद","Market band")],a:1,why:L("Rushing a big decision under a deadline leads to poor fit.","डेडलाइन में जल्दबाज़ी खराब फिट लाती।","Deadline mein jaldbaazi kharab fit laati.")}
  ],
  reflect:L("Have you ever bought something mainly to save tax and regretted the fit?","कभी मुख्यतः टैक्स बचाने को खरीदा और फिट पर पछताया?","Kabhi mukhyatah tax bachane ko khareeda aur fit pe pachtaaya?"),
  tax:L("Tax-saving options, limits and lock-ins are set by law and change; use them, but verify current rules. (verify current rate before relying on this)","टैक्स-सेविंग ऑप्शन, सीमाएँ और लॉक-इन कानून से और बदलते; इस्तेमाल करो पर verify। (verify current rate before relying on this)","Tax-saving option, seemayein aur lock-in kanoon se aur badalte; istemal karo par verify. (verify current rate before relying on this)")},

 {id:"m8l6",title:L("How to read your statement","अपना स्टेटमेंट कैसे पढ़ें","Apna statement kaise padhein"),sub:L("Portfolio / CAS, without fear","पोर्टफोलियो / CAS, बिना डर","Portfolio / CAS, without fear"),mins:4,
  beats:{
   sit:L("Your portfolio/CAS statement arrives — rows of numbers, jargon, XIRR — and you file it away unread.","आपका पोर्टफोलियो/CAS स्टेटमेंट आता है — नंबरों की पंक्तियाँ, शब्दजाल, XIRR — और आप बिना पढ़े रख देते हो।","Aapka portfolio/CAS statement aata hai — numberon ki panktiyaan, shabdjaal, XIRR — aur aap bina padhe rakh dete ho."),
   myth:{lie:L("Statements are for experts; I can't read mine.","स्टेटमेंट एक्सपर्ट के लिए; मैं अपना नहीं पढ़ सकता।","Statement expert ke liye; main apna nahi padh sakta."),truth:L("A few key fields tell you almost everything — invested, current value, returns, and costs.","कुछ मुख्य फील्ड लगभग सब बता देते — लगाया, मौजूदा वैल्यू, रिटर्न, लागत।","Kuch mukhya field lagbhag sab bata dete — lagaya, maujooda value, return, laagat.")},
   reflex:L("Ignoring statements entirely, or panicking at one number.","स्टेटमेंट पूरी तरह अनदेखा, या एक नंबर पर पैनिक।","Statement poori tarah andekha, ya ek number pe panic."),
   q:L("How do I read my own statement?","अपना स्टेटमेंट कैसे पढ़ूँ?","Apna statement kaise padhun?"),
   fw:L("Focus on a handful of fields: how much you <b>invested</b>, <b>current value</b>, <b>gain/return</b> (and <b>XIRR</b> — your actual annualised return accounting for timing), plus any <b>fees</b> and whether nominee/KYC are in order. Enough to answer 'am I on track, and what is this costing me?'","कुछ फील्ड पर ध्यान: कितना <b>लगाया</b>, <b>मौजूदा वैल्यू</b>, <b>गेन/रिटर्न</b> (और <b>XIRR</b> — टाइमिंग समेत असली सालाना रिटर्न), और <b>फीस</b>, नॉमिनी/KYC ठीक। बस 'ट्रैक पर हूँ?, कीमत क्या?' का जवाब।","Kuch field pe dhyan: kitna <b>lagaya</b>, <b>maujooda value</b>, <b>gain/return</b> (aur <b>XIRR</b> — timing samet asli saalaana return), aur <b>fees</b>, nominee/KYC theek. Bas 'track pe hoon?, keemat kya?' ka jawaab."),
   call:L("Read the few fields that matter on a schedule; understanding your own statement ends depending on anyone to tell you how you're doing.","शेड्यूल पर मायने रखने वाले कुछ फील्ड पढ़ो; अपना स्टेटमेंट समझना किसी पर निर्भरता खत्म करता।","Schedule pe maayne rakhne wale kuch field padho; apna statement samajhna kisi pe nirbharta khatam karta.")
  },
  dd:{ex:[
   L("A statement looks intimidating but you only need a few fields to understand it. Find: how much you've invested (your contributions), the current value (what it's worth now), your gain and return, and especially XIRR — your real annualised return that accounts for the timing of every instalment, which is the honest number for 'how am I actually doing'. Also glance at fees charged and whether your KYC/nominee are in order.","स्टेटमेंट डरावना दिखता पर समझने को कुछ फील्ड काफी। ढूंढो: कितना लगाया (योगदान), मौजूदा वैल्यू, गेन और रिटर्न, और खासकर XIRR — हर किस्त की टाइमिंग समेत असली सालाना रिटर्न। फीस और KYC/नॉमिनी पर नज़र।","Statement daraavna dikhta par samajhne ko kuch field kaafi. Dhoondo: kitna lagaya (yogdaan), maujooda value, gain aur return, aur khaaskar XIRR — har kist ki timing samet asli saalaana return. Fees aur KYC/nominee pe nazar."),
   L("You don't need to understand every row — just enough to answer two questions: am I on track for my goals, and what is this costing me? Read it on your review schedule (Module 6), not daily, and don't let a single scary number trigger action — check the trend and the plan. Being able to read your own statement is the quiet graduation of this module: you no longer depend on anyone else to tell you how your money is doing.","हर पंक्ति समझने की ज़रूरत नहीं — बस दो सवाल: गोल के लिए ट्रैक पर?, कीमत क्या? रिव्यू शेड्यूल पर पढ़ो, रोज़ नहीं, और एक डरावने नंबर पर action मत लो — ट्रेंड और प्लान देखो। अपना स्टेटमेंट पढ़ पाना इस मॉड्यूल का graduation।","Har pankti samajhne ki zaroorat nahi — bas do sawaal: goal ke liye track pe?, keemat kya? Review schedule pe padho, roz nahi, aur ek daraavne number pe action mat lo — trend aur plan dekho. Apna statement padh paana is module ka graduation.")],
   faq:[
    {q:L("What exactly is XIRR?","XIRR असल में क्या?","XIRR asal mein kya?"),a:L("Your real annualised return that accounts for when each instalment went in — the honest 'how am I doing' number for SIPs.","हर किस्त कब गई उसे गिनकर असली सालाना रिटर्न — SIP के लिए ईमानदार नंबर।","Har kist kab gayi use ginkar asli saalaana return — SIP ke liye imaandaar number.")},
    {q:L("How often should I read it?","कितनी बार पढ़ूँ?","Kitni baar padhun?"),a:L("On your review cadence (Module 6) — a couple of times a year — not daily, and never as a panic trigger.","अपनी रिव्यू कैडेंस पर (मॉड्यूल 6) — साल में दो बार — रोज़ नहीं।","Apni review cadence pe (Module 6) — saal mein do baar — roz nahi.")}
   ]},
  terms:[{k:L("CAS","CAS","CAS"),d:L("Consolidated Account Statement — one summary of your investments.","कंसॉलिडेटेड अकाउंट स्टेटमेंट — इन्वेस्टमेंट का एक सारांश।","Consolidated Account Statement — investment ka ek saaraansh.")},{k:L("XIRR","XIRR","XIRR"),d:L("Your true annualised return, accounting for the timing of each investment.","हर इन्वेस्टमेंट की टाइमिंग समेत आपका असली सालाना रिटर्न।","Har investment ki timing samet aapka asli saalaana return.")}],
  action:{h:L("Find the fields that matter","मायने रखने वाले फील्ड ढूंढो","Maayne rakhne wale field dhoondo"),p:L("Open a sample statement and locate invested, current value, return/XIRR, and fees.","एक सैंपल स्टेटमेंट खोलो और लगाया, मौजूदा वैल्यू, रिटर्न/XIRR, फीस ढूंढो।","Ek sample statement kholo aur lagaya, maujooda value, return/XIRR, fees dhoondo."),data:L("A sample statement (in-app).","एक सैंपल स्टेटमेंट (ऐप में)।","Ek sample statement (app mein).")},
  quiz:[
   {q:L("XIRR tells you your…","XIRR आपको बताता है आपका…","XIRR aapko bataata hai aapka…"),o:[L("Tax bill","टैक्स बिल","Tax bill"),L("Real annualised return (timing-aware)","असली सालाना रिटर्न (टाइमिंग समेत)","Asli saalaana return (timing samet)"),L("Nominee","नॉमिनी","Nominee"),L("Fund's logo","फंड का लोगो","Fund ka logo")],a:1,why:L("XIRR is your true annualised return accounting for instalment timing.","XIRR किस्त-टाइमिंग समेत असली सालाना रिटर्न।","XIRR kist-timing samet asli saalaana return.")},
   {q:L("You should read your statement…","स्टेटमेंट कब पढ़ना चाहिए…","Statement kab padhna chahiye…"),o:[L("Every hour","हर घंटे","Har ghante"),L("On your review cadence, calmly","रिव्यू कैडेंस पर, शांति से","Review cadence pe, shaanti se"),L("Never","कभी नहीं","Kabhi nahi"),L("Only in a panic","सिर्फ पैनिक में","Sirf panic mein")],a:1,why:L("A calm periodic read answers 'on track?' without feeding noise.","शांत आवधिक पढ़ाई 'ट्रैक पर?' का जवाब, बिना शोर।","Shaant aavadhik padhai 'track pe?' ka jawaab, bina shor.")}
  ],
  reflect:L("Could you currently tell your real return from your own statement?","क्या आप अभी अपने स्टेटमेंट से असली रिटर्न बता सकते हो?","Kya aap abhi apne statement se asli return bata sakte ho?")}
]};

const MODULE9={ id:"m9", n:10, title:L("Put it together: run it","सब जोड़ो: चलाओ","Sab jodo: chalao"), theme:L("Run a full plan end to end — and become the one who decides.","पूरा प्लान शुरू से आखिर चलाओ — और खुद फैसला लेने वाले बनो।","Poora plan shuru se aakhir chalao — aur khud faisla lene wale bano."),
 lessons:[
 {id:"m9l1",title:L("Write your one-page plan","अपना एक-पेज प्लान लिखो","Apna ek-page plan likho"),sub:L("Assemble goals into buckets","गोल को बकेट में जोड़ो","Goals ko bucket mein jodo"),mins:4,
  beats:{
   sit:L("You've learned the pieces — now you're staring at a blank page: 'so what's MY actual plan?'","आपने टुकड़े सीख लिए — अब खाली पेज देख रहे हो: 'तो मेरा असली प्लान क्या है?'","Aapne tukde seekh liye — ab khaali page dekh rahe ho: 'toh mera asli plan kya hai?'"),
   myth:{lie:L("A plan has to be complex and perfect to start.","प्लान शुरू करने को जटिल और परफेक्ट होना चाहिए।","Plan shuru karne ko jatil aur perfect hona chahiye."),truth:L("A usable plan is a simple page: your goals, each with a number, date, bucket, and monthly amount.","काम का प्लान एक सरल पेज है: आपके गोल, हर एक नंबर, डेट, बकेट, मंथली रकम के साथ।","Kaam ka plan ek saral page hai: aapke goal, har ek number, date, bucket, monthly raqam ke saath.")},
   reflex:L("Over-thinking it into paralysis, or never writing it down.","इतना सोचना कि जम जाओ, या कभी लिखो ही नहीं।","Itna sochna ki jam jao, ya kabhi likho hi nahi."),
   q:L("How do I turn everything into one plan?","सब कुछ एक प्लान में कैसे बदलूँ?","Sab kuch ek plan mein kaise badlun?"),
   fw:L("Assemble what you learned: list goals (number + date, M6), sort into buckets by horizon (M1/M5), pick a type & risk per bucket (M4/M5), set a monthly amount (SIP/step-up, M6), then automate + a review date (M6). One page. Written beats perfect-in-your-head.","जो सीखा जोड़ो: गोल लिखो (नंबर + डेट, M6), होराइज़न से बकेट (M1/M5), हर बकेट का टाइप और रिस्क (M4/M5), मंथली रकम (SIP/step-up, M6), फिर ऑटोमेट + रिव्यू डेट (M6)। एक पेज। लिखा हुआ, दिमाग में परफेक्ट से बेहतर।","Jo seekha jodo: goal likho (number + date, M6), horizon se bucket (M1/M5), har bucket ka type aur risk (M4/M5), monthly raqam (SIP/step-up, M6), phir automate + review date (M6). Ek page. Likha hua, dimaag mein perfect se behtar."),
   call:L("Your specific plan is yours; the win is writing it down so it's real and followable.","आपका खास प्लान आपका; जीत यह कि उसे लिखो ताकि वो असली और चलने लायक बने।","Aapka khaas plan aapka; jeet yeh ki use likho taaki woh asli aur chalne layak bane.")
  },
  dd:{ex:[
   L("A plan doesn't need to be a fat document — one clear page is enough, and far better than an elaborate one you never finish. For each goal, write four things: the amount, the date, which bucket (by horizon), and the monthly contribution. Add the type and risk level per bucket, an automation, and a review date. That single page turns eight modules of ideas into something you can actually run.","प्लान मोटा दस्तावेज़ नहीं — एक साफ पेज काफी, और उस विस्तृत से बेहतर जिसे कभी पूरा न करो। हर गोल के लिए चार चीज़ें: रकम, डेट, बकेट (होराइज़न से), मंथली योगदान। हर बकेट का टाइप-रिस्क, ऑटोमेशन, रिव्यू डेट। यही पेज आठ मॉड्यूल को चलने लायक बनाता।","Plan mota dastaavez nahi — ek saaf page kaafi, aur us vistrit se behtar jise kabhi poora na karo. Har goal ke liye chaar cheezein: raqam, date, bucket (horizon se), monthly yogdaan. Har bucket ka type-risk, automation, review date. Yahi page aath module ko chalne layak banata."),
   L("There's a hidden benefit to writing it down: a plan on paper becomes a rule you can hold onto when emotions run high. When a crash hits (Module 7), 'my written plan says hold and keep investing' is far stronger than trying to decide in the moment. A plan you can see is a plan you can keep — and keeping it is where almost all the results come from.","लिखने का छुपा फायदा: कागज़ पर प्लान एक नियम बन जाता जिसे भावनाओं के उफान में थाम सको। क्रैश में (M7) 'मेरा लिखा प्लान कहता है थामो और इन्वेस्ट करो' उस पल तय करने से कहीं मज़बूत। दिखता प्लान = थमने वाला प्लान।","Likhne ka chhupa fayda: kaagaz pe plan ek niyam ban jaata jise bhaavnaon ke ufaan mein thaam sako. Crash mein (M7) 'mera likha plan kehta hai thaamo aur invest karo' us pal tay karne se kahin mazboot. Dikhta plan = thamne wala plan.")],
   faq:[
    {q:L("What if my plan changes later?","अगर प्लान बाद में बदले?","Agar plan baad mein badle?"),a:L("It should evolve as life changes — that's healthy. A written plan is easier to update than a vague one in your head.","ज़िंदगी बदलने पर बदले — स्वस्थ है। लिखा प्लान धुंधले से अपडेट करना आसान।","Zindagi badalne pe badle — swasth hai. Likha plan dhundhle se update karna aasaan.")},
    {q:L("How detailed should it be?","कितना विस्तृत हो?","Kitna vistrit ho?"),a:L("Just detailed enough to follow: goals, buckets, amounts, and a review date. Simplicity you keep beats complexity you abandon.","बस इतना कि चला सको: गोल, बकेट, रकम, रिव्यू डेट। सादगी जो निभाओ, जटिलता जो छोड़ो, से बेहतर।","Bas itna ki chala sako: goal, bucket, raqam, review date. Saadgi jo nibhaao, jatilta jo chhodo, se behtar.")}
   ]},
  terms:[{k:L("Financial plan","फाइनेंशियल प्लान","Financial plan"),d:L("A simple written map of your goals, buckets, amounts and reviews.","गोल, बकेट, रकम और रिव्यू का एक सरल लिखित नक्शा।","Goal, bucket, raqam aur review ka ek saral likhit naksha.")},{k:L("Buckets","बकेट","Buckets"),d:L("Groups of money split by goal and horizon.","गोल और होराइज़न से बँटे पैसे के समूह।","Goal aur horizon se bante paise ke samooh.")}],
  action:{h:L("Build your one-page plan","अपना एक-पेज प्लान बनाओ","Apna ek-page plan banao"),p:L("In the app, assemble your goals, buckets and monthly amounts into a single plan page.","ऐप में अपने गोल, बकेट और मंथली रकम को एक प्लान पेज में जोड़ो।","App mein apne goal, bucket aur monthly raqam ko ek plan page mein jodo."),data:L("Your goals and amounts (user-entered).","आपके गोल और रकम (यूज़र-डाला)।","Aapke goal aur raqam (user-entered).")},
  quiz:[
   {q:L("A usable plan should be…","काम का प्लान होना चाहिए…","Kaam ka plan hona chahiye…"),o:[L("A huge perfect document","एक विशाल परफेक्ट दस्तावेज़","Ek vishaal perfect dastaavez"),L("A simple page you'll actually follow","एक सरल पेज जो निभाओगे","Ek saral page jo nibhaoge"),L("In your head only","सिर्फ दिमाग में","Sirf dimaag mein"),L("Copied from a friend","दोस्त से नकल","Dost se nakal")],a:1,why:L("Simplicity you keep beats complexity you never finish.","सादगी जो निभाओ, जटिलता जो अधूरी रहे, से बेहतर।","Saadgi jo nibhaao, jatilta jo adhoori rahe, se behtar.")},
   {q:L("A written plan mainly helps you…","लिखा प्लान मुख्यतः किसमें मदद…","Likha plan mukhyatah kismein madad…"),o:[L("Predict the market","मार्केट भविष्यवाणी","Market bhavishyavani"),L("Hold steady when emotions run high","भावनाओं के उफान में स्थिर रहना","Bhaavnaon ke ufaan mein sthir rehna"),L("Avoid all tax","सारा टैक्स टालना","Saara tax taalna"),L("Beat friends","दोस्तों को हराना","Doston ko haraana")],a:1,why:L("A visible rule is easier to hold in a crash than an in-the-moment decision.","दिखता नियम क्रैश में पल के फैसले से आसान।","Dikhta niyam crash mein pal ke faisle se aasaan.")}
  ],
  reflect:L("What's the first goal you'll commit to a number and date?","पहला गोल कौन सा जिसे नंबर और डेट दोगे?","Pehla goal kaunsa jise number aur date doge?")},

 {id:"m9l2",title:L("Run it through history","इतिहास से चलाकर देखो","Itihaas se chalaakar dekho"),sub:L("Backtest & time-compression","बैकटेस्ट और टाइम-कंप्रेशन","Backtest & time-compression"),mins:4,
  beats:{
   sit:L("You believe in 'stay invested for the long term', but you've never actually felt what a decade does.","आप 'लॉन्ग-टर्म टिके रहो' मानते हो, पर एक दशक क्या करता है यह कभी महसूस नहीं किया।","Aap 'long-term tike raho' maante ho, par ek dashak kya karta hai yeh kabhi mehsoos nahi kiya."),
   myth:{lie:L("I'll understand long-term investing by waiting years.","लॉन्ग-टर्म इन्वेस्टिंग साल इंतज़ार करके समझूँगा।","Long-term investing saal intzaar karke samjhunga."),truth:L("You can compress years into seconds — run your plan through real history to feel it before you live it.","सालों को सेकंड में सिकोड़ सकते हो — प्लान को असली इतिहास से चलाकर जीने से पहले महसूस करो।","Saalon ko second mein sikod sakte ho — plan ko asli itihaas se chalaakar jeene se pehle mehsoos karo.")},
   reflex:L("Acting on gut because the long term feels abstract.","लॉन्ग-टर्म अमूर्त लगने से दिल से फैसला।","Long-term amoort lagne se dil se faisla."),
   q:L("What would my plan have actually done over time?","मेरा प्लान समय के साथ असल में क्या करता?","Mera plan samay ke saath asal mein kya karta?"),
   fw:L("A <b>backtest</b> runs your plan across real historical data to show how it would have behaved — the flat stretches, the crashes, the recoveries, the end result. <b>Time-compression</b> turns 'trust me, stay invested' into something you've watched happen — building the conviction that stops panic-selling.","<b>बैकटेस्ट</b> आपके प्लान को असली ऐतिहासिक डेटा से चलाता है — फ्लैट दौर, क्रैश, रिकवरी, अंतिम नतीजा। <b>टाइम-कंप्रेशन</b> 'भरोसा करो, टिके रहो' को देखी हुई चीज़ बनाता — वो यकीन जो panic-selling रोके।","<b>Backtest</b> aapke plan ko asli aitihaasik data se chalaata hai — flat daur, crash, recovery, antim natija. <b>Time-compression</b> 'bharosa karo, tike raho' ko dekhi hui cheez banaata — woh yakeen jo panic-selling roke."),
   call:L("Use it to build conviction and stress your assumptions — not to find the 'best' past; the goal is understanding, not curve-fitting.","इससे यकीन बनाओ और अपनी मान्यताएँ जाँचो — 'बेस्ट' अतीत ढूंढने को नहीं; लक्ष्य समझ, कर्व-फिटिंग नहीं।","Isse yakeen banao aur apni maanyataayein jaancho — 'best' ateet dhoondhne ko nahi; lakshya samajh, curve-fitting nahi.")
  },
  dd:{ex:[
   L("A backtest plays your plan against what actually happened in markets — say the last 15-20 years — and shows the whole journey: the boring flat years, the scary crashes, and the recoveries that followed. Because investing is slow in real life, this 'time-compression' lets you experience a decade of ups and downs in seconds, so the long term stops being an abstract slogan and becomes something you've seen with your own eyes.","बैकटेस्ट आपके प्लान को मार्केट में जो सच में हुआ उससे चलाता — मान लो पिछले 15-20 साल — और पूरी यात्रा दिखाता: उबाऊ फ्लैट साल, डरावने क्रैश, रिकवरी। इन्वेस्टिंग असल में धीमी, तो यह 'टाइम-कंप्रेशन' दशक को सेकंड में दिखाता।","Backtest aapke plan ko market mein jo sach mein hua usse chalaata — maan lo pichhle 15-20 saal — aur poori yaatra dikhaata: ubaau flat saal, daraavne crash, recovery. Investing asal mein dheemi, toh yeh 'time-compression' dashak ko second mein dikhaata."),
   L("The real value isn't a number — it's conviction. Once you've watched a plan fall hard and then recover, holding through the next real crash gets far easier; you've felt the pattern. Two honest caveats: the past is not a promise (the future can differ), and you should never tweak a plan just to make its backtest look prettier ('curve-fitting'). Use history to understand and to test whether you could stay the course — not to predict.","असली मूल्य नंबर नहीं — यकीन है। एक बार प्लान को गिरकर उबरते देख लिया, तो अगले असली क्रैश में थामना आसान; पैटर्न महसूस हुआ। दो ईमानदार चेतावनी: अतीत वादा नहीं, और बैकटेस्ट सुंदर दिखाने को प्लान मत छेड़ो ('कर्व-फिटिंग')।","Asli mulya number nahi — yakeen hai. Ek baar plan ko girkar ubarte dekh liya, toh agle asli crash mein thaamna aasaan; pattern mehsoos hua. Do imaandaar chetaavni: ateet vaada nahi, aur backtest sundar dikhaane ko plan mat chhedo ('curve-fitting').")],
   faq:[
    {q:L("Does a good backtest mean a good future?","अच्छा बैकटेस्ट मतलब अच्छा भविष्य?","Achha backtest matlab achha bhavishya?"),a:L("No — it shows behaviour and builds conviction, but the future can differ. Treat it as understanding, not a guarantee.","नहीं — व्यवहार दिखाता और यकीन बनाता, पर भविष्य अलग हो सकता। समझ, गारंटी नहीं।","Nahi — vyavhaar dikhaata aur yakeen banaata, par bhavishya alag ho sakta. Samajh, guarantee nahi.")},
    {q:L("What should I look at in a backtest?","बैकटेस्ट में क्या देखूँ?","Backtest mein kya dekhun?"),a:L("The worst drop, how long recovery took, and whether you'd have held through it — more than the final number.","सबसे बुरी गिरावट, रिकवरी में कितना, और क्या आप थाम पाते — अंतिम नंबर से ज़्यादा।","Sabse buri giraavat, recovery mein kitna, aur kya aap thaam paate — antim number se zyada.")}
   ]},
  terms:[{k:L("Backtest","बैकटेस्ट","Backtest"),d:L("Running a plan across real past data to see how it would have behaved.","असली अतीत डेटा से प्लान चलाकर देखना वो कैसा करता।","Asli ateet data se plan chalaakar dekhna woh kaisa karta.")},{k:L("Time-compression","टाइम-कंप्रेशन","Time-compression"),d:L("Experiencing many years of a plan in seconds.","प्लान के कई साल सेकंड में अनुभव करना।","Plan ke kai saal second mein anubhav karna.")}],
  action:{h:L("Watch a decade in seconds","एक दशक सेकंड में देखो","Ek dashak second mein dekho"),p:L("Run your plan across a long historical window and watch the full journey — flats, crashes, recoveries.","अपने प्लान को एक लंबे ऐतिहासिक window में चलाओ और पूरी यात्रा देखो।","Apne plan ko ek lambe aitihaasik window mein chalao aur poori yaatra dekho."),data:L("A real long-run market series (fetched by the app).","असली लॉन्ग-रन मार्केट सीरीज़ (ऐप द्वारा)।","Asli long-run market series (app dwaara).")},
  quiz:[
   {q:L("The main value of a backtest is…","बैकटेस्ट का मुख्य मूल्य…","Backtest ka mukhya mulya…"),o:[L("Predicting exact future returns","सटीक भविष्य रिटर्न बताना","Sateek bhavishya return bataana"),L("Building conviction to stay invested","टिके रहने का यकीन बनाना","Tike rehne ka yakeen banaana"),L("Avoiding all crashes","सारे क्रैश टालना","Saare crash taalna"),L("Guaranteeing gains","फायदे की गारंटी","Faayde ki guarantee")],a:1,why:L("Seeing the journey builds the behaviour that keeps you invested.","यात्रा देखना टिके रहने का व्यवहार बनाता।","Yaatra dekhna tike rehne ka vyavhaar banaata.")},
   {q:L("Tweaking a plan to improve its backtest is called…","बैकटेस्ट सुधारने को प्लान छेड़ना कहलाता…","Backtest sudhaarne ko plan chhedna kehlata…"),o:[L("Smart investing","स्मार्ट इन्वेस्टिंग","Smart investing"),L("Curve-fitting (a trap)","कर्व-फिटिंग (एक जाल)","Curve-fitting (ek jaal)"),L("Rebalancing","रीबैलेंसिंग","Rebalancing"),L("Diversifying","डाइवर्सिफाइंग","Diversifying")],a:1,why:L("Fitting to the past doesn't predict the future — understand, don't over-optimise.","अतीत में फिट करना भविष्य नहीं बताता।","Ateet mein fit karna bhavishya nahi bataata.")}
  ],
  reflect:L("Seeing the ups and downs, could you have held through them?","उतार-चढ़ाव देखकर, क्या आप उनमें थाम पाते?","Utaar-chadhaav dekhkar, kya aap unmein thaam paate?")},

 {id:"m9l3",title:L("Stress-test a crash","क्रैश का स्ट्रेस-टेस्ट","Crash ka stress-test"),sub:L("Is your plan survivable?","क्या आपका प्लान झेलने लायक है?","Kya aapka plan jhelne layak hai?"),mins:4,
  beats:{
   sit:L("Everything looks great in a rising market — but you've never seen your plan in a brutal crash.","बढ़ते मार्केट में सब बढ़िया लगता — पर आपने अपना प्लान क्रूर क्रैश में कभी नहीं देखा।","Badhte market mein sab badhiya lagta — par aapne apna plan kroor crash mein kabhi nahi dekha."),
   myth:{lie:L("If my plan works in good times, it works.","अगर प्लान अच्छे समय में चलता है, तो चलता है।","Agar plan achhe samay mein chalta hai, toh chalta hai."),truth:L("A plan is only as strong as its worst moment — stress-testing a crash shows if you can really hold it.","प्लान अपने सबसे बुरे पल जितना ही मज़बूत — क्रैश स्ट्रेस-टेस्ट दिखाता क्या आप सच में थाम सको।","Plan apne sabse bure pal jitna hi mazboot — crash stress-test dikhaata kya aap sach mein thaam sako.")},
   reflex:L("Assuming calm markets, then breaking in the first real storm.","शांत मार्केट मानना, फिर पहले तूफ़ान में टूटना।","Shaant market maanna, phir pehle toofaan mein tootna."),
   q:L("What happens to my plan in a bad crash?","बुरे क्रैश में मेरे प्लान का क्या होता है?","Bure crash mein mere plan ka kya hota hai?"),
   fw:L("A <b>stress test</b> simulates a severe crash on your plan to reveal the deepest drop you'd face and whether it's within your sleep test (M5). If the worst case would make you panic-sell, you dial back risk NOW, in calm times — not mid-crash.","<b>स्ट्रेस टेस्ट</b> आपके प्लान पर गंभीर क्रैश सिम्युलेट करता ताकि सबसे गहरी गिरावट और वो नींद टेस्ट (M5) में है या नहीं दिखे। अगर सबसे बुरा panic-sell करवाए, तो रिस्क अभी, शांति में घटाओ — क्रैश के बीच नहीं।","<b>Stress test</b> aapke plan pe gambheer crash simulate karta taaki sabse gehri giraavat aur woh neend test (M5) mein hai ya nahi dikhe. Agar sabse bura panic-sell karwaaye, toh risk abhi, shaanti mein ghatao — crash ke beech nahi."),
   call:L("Right-size risk to the crash you can actually stomach; a plan you'll abandon at the bottom isn't a plan.","रिस्क को उस क्रैश के हिसाब से रखो जो सच में झेल सको; जिसे तली पर छोड़ोगे वो प्लान नहीं।","Risk ko us crash ke hisaab se rakho jo sach mein jhel sako; jise tali pe chhodoge woh plan nahi.")
  },
  dd:{ex:[
   L("Rising markets flatter every plan. The real test is the worst case: a stress test deliberately puts your plan through a severe crash to show the biggest drawdown you'd have to sit through. Then you compare that number to your sleep test (Module 5): could you actually hold, without selling, through a drop that deep? If yes, your risk is right-sized. If the honest answer is 'no, I'd panic', that's priceless information.","बढ़ते मार्केट हर प्लान को सुंदर दिखाते। असली टेस्ट सबसे बुरा हाल: स्ट्रेस टेस्ट जान-बूझकर प्लान को गंभीर क्रैश से गुज़ारता ताकि सबसे बड़ी गिरावट दिखे। फिर उसे नींद टेस्ट (M5) से तुलना: क्या इतनी गहरी गिरावट बिना बेचे थाम पाते?","Badhte market har plan ko sundar dikhaate. Asli test sabse bura haal: stress test jaan-boojhkar plan ko gambheer crash se guzaarta taaki sabse badi giraavat dikhe. Phir use neend test (M5) se tulna: kya itni gehri giraavat bina beche thaam paate?"),
   L("The whole point is to learn this in calm times, when you can act rationally — because in the middle of a real crash, fear takes over and it's too late to redesign. If the stress test shows a drop deeper than you could hold, you reduce risk now (shift some toward steadier assets), so the worst case stays inside your limit. Testing the worst case is how you make a plan survivable, not merely optimal — the difference between a plan that looks good and one you'll actually keep.","पूरा मकसद शांति में सीखना, जब तार्किक हो सको — क्योंकि असली क्रैश के बीच डर हावी, redesign में देर। अगर स्ट्रेस टेस्ट झेलने से गहरी गिरावट दिखाए, रिस्क अभी घटाओ (कुछ स्थिर की ओर)। सबसे बुरा टेस्ट करना प्लान को झेलने लायक बनाता, सिर्फ optimal नहीं।","Poora maqsad shaanti mein seekhna, jab taarkik ho sako — kyunki asli crash ke beech dar haavi, redesign mein der. Agar stress test jhelne se gehri giraavat dikhaaye, risk abhi ghatao (kuch sthir ki or). Sabse bura test karna plan ko jhelne layak banaata, sirf optimal nahi.")],
   faq:[
    {q:L("Isn't this scary and pessimistic?","क्या यह डरावना और निराशावादी नहीं?","Kya yeh daraavna aur niraashaavaadi nahi?"),a:L("It's the opposite — facing the worst case in calm builds confidence, so a real crash holds no surprises and you don't panic.","उल्टा — शांति में सबसे बुरा देखना आत्मविश्वास देता, तो असली क्रैश चौंकाता नहीं।","Ulta — shaanti mein sabse bura dekhna aatmavishwaas deta, toh asli crash chaunkaata nahi.")},
    {q:L("How bad a crash should I test?","कितना बुरा क्रैश टेस्ट करूँ?","Kitna bura crash test karun?"),a:L("A severe one, similar to historic big falls — if your plan survives that within your sleep test, milder ones are easy.","एक गंभीर, ऐतिहासिक बड़ी गिरावट जैसा — वो झेल गया तो हल्के आसान।","Ek gambheer, aitihaasik badi giraavat jaisa — woh jhel gaya toh halke aasaan.")}
   ]},
  terms:[{k:L("Stress test","स्ट्रेस टेस्ट","Stress test"),d:L("Simulating a severe crash to see if your plan survives it.","गंभीर क्रैश सिम्युलेट करना यह देखने को कि प्लान झेल पाए।","Gambheer crash simulate karna yeh dekhne ko ki plan jhel paaye.")},{k:L("Max drawdown","मैक्स ड्रॉडाउन","Max drawdown"),d:L("The deepest fall from a peak your plan would face.","शिखर से सबसे गहरी गिरावट जो प्लान झेले।","Shikhar se sabse gehri giraavat jo plan jhele.")}],
  action:{h:L("Crash-test your plan","अपना प्लान क्रैश-टेस्ट करो","Apna plan crash-test karo"),p:L("Run a severe crash on your plan and check the deepest drop against your sleep-test limit.","अपने प्लान पर गंभीर क्रैश चलाओ और सबसे गहरी गिरावट को नींद-टेस्ट सीमा से जाँचो।","Apne plan pe gambheer crash chalao aur sabse gehri giraavat ko neend-test seema se jaancho."),data:L("Your plan's mix (in-app).","आपके प्लान का मिक्स (ऐप में)।","Aapke plan ka mix (app mein).")},
  quiz:[
   {q:L("A stress test checks your plan against…","स्ट्रेस टेस्ट प्लान को किससे जाँचता…","Stress test plan ko kisse jaanchta…"),o:[L("Only good times","सिर्फ अच्छे समय","Sirf achhe samay"),L("A severe crash / worst case","गंभीर क्रैश / सबसे बुरा","Gambheer crash / sabse bura"),L("Tax rules","टैक्स नियम","Tax niyam"),L("A friend's plan","दोस्त का प्लान","Dost ka plan")],a:1,why:L("It reveals the deepest drop so you can check you'd hold.","सबसे गहरी गिरावट दिखाता ताकि जाँचो कि थाम पाओगे।","Sabse gehri giraavat dikhaata taaki jaancho ki thaam paoge.")},
   {q:L("If the worst case exceeds what you can hold, you should…","अगर सबसे बुरा झेलने से ज़्यादा हो, तो…","Agar sabse bura jhelne se zyada ho, toh…"),o:[L("Ignore it","अनदेखा करो","Andekha karo"),L("Reduce risk now, in calm times","अभी, शांति में रिस्क घटाओ","Abhi, shaanti mein risk ghatao"),L("Wait for the crash","क्रैश का इंतज़ार","Crash ka intzaar"),L("Add more risk","और रिस्क जोड़ो","Aur risk jodo")],a:1,why:L("Fix risk in calm times so a real crash stays inside your limit.","शांति में रिस्क ठीक करो ताकि असली क्रैश सीमा में रहे।","Shaanti mein risk theek karo taaki asli crash seema mein rahe.")}
  ],
  reflect:L("Does the worst-case drop stay within what you can hold?","क्या सबसे बुरी गिरावट आपके झेलने के अंदर रहती है?","Kya sabse buri giraavat aapke jhelne ke andar rehti hai?")},

 {id:"m9l4",title:L("The half-yearly review","छमाही रिव्यू","Chhamaahi review"),sub:L("Keep the plan aligned","प्लान को अलाइन रखो","Plan ko align rakho"),mins:4,
  beats:{
   sit:L("The plan's set and automated — but a plan left totally alone slowly drifts from your life.","प्लान सेट और ऑटोमेटेड — पर पूरी तरह अकेला छोड़ा प्लान धीरे ज़िंदगी से भटक जाता।","Plan set aur automated — par poori tarah akela chhoda plan dheere zindagi se bhatak jaata."),
   myth:{lie:L("A good plan never needs touching.","अच्छे प्लान को कभी छूने की ज़रूरत नहीं।","Achhe plan ko kabhi chhoone ki zaroorat nahi."),truth:L("A plan needs a light, scheduled review — enough to keep it aligned, not so much that you tinker.","प्लान को हल्का, शेड्यूल्ड रिव्यू चाहिए — अलाइन रखने भर, इतना नहीं कि छेड़छाड़ करो।","Plan ko halka, scheduled review chahiye — align rakhne bhar, itna nahi ki chhedchhaad karo.")},
   reflex:L("Either never reviewing, or fiddling constantly.","या कभी रिव्यू नहीं, या लगातार छेड़छाड़।","Ya kabhi review nahi, ya lagataar chhedchhaad."),
   q:L("What do I actually do at a review?","रिव्यू में असल में क्या करूँ?","Review mein asal mein kya karun?"),
   fw:L("On your cadence (say every 6 months, M6), run a short checklist: goals on track?, mix need rebalancing (M6)?, can you step up (M6)?, nominee/KYC/fees fine (M8)?, has your life changed? Change the plan only for real life changes, not market noise (M7). Then leave it alone.","अपनी कैडेंस पर (मान लो हर 6 महीने, M6) छोटी चेकलिस्ट: गोल ट्रैक पर?, मिक्स रीबैलेंस (M6)?, step-up (M6)?, नॉमिनी/KYC/फीस (M8) ठीक?, ज़िंदगी बदली? प्लान सिर्फ असली बदलाव पर बदलो, मार्केट शोर पर नहीं (M7)। फिर छोड़ दो।","Apni cadence pe (maan lo har 6 mahine, M6) chhoti checklist: goal track pe?, mix rebalance (M6)?, step-up (M6)?, nominee/KYC/fees (M8) theek?, zindagi badli? Plan sirf asli badlaav pe badlo, market shor pe nahi (M7). Phir chhod do."),
   call:L("Keep the review small and scheduled; its job is alignment, not action for action's sake.","रिव्यू छोटा और शेड्यूल्ड रखो; इसका काम अलाइनमेंट है, बिना वजह action नहीं।","Review chhota aur scheduled rakho; iska kaam alignment hai, bina wajah action nahi.")
  },
  dd:{ex:[
   L("Automation runs the day-to-day, but your life keeps changing — new goals, a raise, a new dependent — so a plan needs a light touch on a schedule to stay aligned. A good review is a short checklist, not an overhaul: are my goals still on track, does the mix need a rebalance back to target (Module 6), can I step up my contributions (Module 6), are my nominee, KYC and fees in order (Module 8), and has anything real in my life changed?","ऑटोमेशन रोज़ का चलाता, पर ज़िंदगी बदलती रहती — नए गोल, बढ़ोतरी, नया आश्रित — तो प्लान को अलाइन रहने को शेड्यूल पर हल्का स्पर्श चाहिए। अच्छा रिव्यू छोटी चेकलिस्ट, overhaul नहीं।","Automation roz ka chalaata, par zindagi badalti rehti — naye goal, badhotari, naya aashrit — toh plan ko align rehne ko schedule pe halka sparsh chahiye. Achha review chhoti checklist, overhaul nahi."),
   L("The discipline that makes reviews work: change the plan only when YOUR life changes, never because of a scary headline or a hot tip (Module 7). Market noise between reviews is meant to be ignored. Do the short checklist, make any genuine adjustments, and then deliberately step away until the next scheduled review. Alignment, not activity, is the goal — a plan you nudge twice a year and otherwise leave alone is the one that quietly wins.","अनुशासन जो रिव्यू को कारगर बनाता: प्लान सिर्फ जब आपकी ज़िंदगी बदले, कभी डरावनी हेडलाइन या टिप से नहीं (M7)। बीच का शोर अनदेखा। छोटी चेकलिस्ट, असली बदलाव, फिर अगले रिव्यू तक जानबूझकर दूर। अलाइनमेंट, गतिविधि नहीं।","Anushaasan jo review ko kaargar banaata: plan sirf jab aapki zindagi badle, kabhi daraavni headline ya tip se nahi (M7). Beech ka shor andekha. Chhoti checklist, asli badlaav, phir agle review tak jaanboojhkar door. Alignment, gatividhi nahi.")],
   faq:[
    {q:L("What triggers a real plan change?","असली प्लान बदलाव किससे?","Asli plan badlaav kisse?"),a:L("Life events — a new goal, marriage, a child, a big income change — not market ups and downs.","ज़िंदगी की घटनाएँ — नया गोल, शादी, बच्चा, बड़ा इनकम बदलाव — मार्केट नहीं।","Zindagi ki ghatnaayein — naya goal, shaadi, bachcha, bada income badlaav — market nahi.")},
    {q:L("Can I review too rarely?","क्या बहुत कम रिव्यू कर सकता हूँ?","Kya bahut kam review kar sakta hoon?"),a:L("Yes — never reviewing lets drift, stopped SIPs or off-track goals go unnoticed. Twice a year is a good balance.","हाँ — कभी न देखना ड्रिफ्ट/रुकी SIP छुपा देता। साल में दो बार संतुलन।","Haan — kabhi na dekhna drift/ruki SIP chhupa deta. Saal mein do baar santulan.")}
   ]},
  terms:[{k:L("Review checklist","रिव्यू चेकलिस्ट","Review checklist"),d:L("The few things to check each review — track, mix, step-up, paperwork.","हर रिव्यू में जाँचने की कुछ चीज़ें — ट्रैक, मिक्स, step-up, पेपरवर्क।","Har review mein jaanchne ki kuch cheezein — track, mix, step-up, paperwork.")},{k:L("Rebalancing","रीबैलेंसिंग","Rebalancing"),d:L("Nudging your mix back to its intended split at review time.","रिव्यू पर मिक्स को इरादे के स्प्लिट पर लाना।","Review pe mix ko iraade ke split pe laana.")}],
  action:{h:L("Do a mock review","एक मॉक रिव्यू करो","Ek mock review karo"),p:L("Run a mock 6-month review with the checklist on your virtual plan.","अपने वर्चुअल प्लान पर चेकलिस्ट के साथ एक मॉक 6-महीने रिव्यू चलाओ।","Apne virtual plan pe checklist ke saath ek mock 6-mahine review chalao."),data:L("Your virtual plan (in-app).","आपका वर्चुअल प्लान (ऐप में)।","Aapka virtual plan (app mein).")},
  quiz:[
   {q:L("You should change your plan when…","प्लान कब बदलो जब…","Plan kab badlo jab…"),o:[L("A scary headline appears","डरावनी हेडलाइन आए","Daraavni headline aaye"),L("Your real life changes","आपकी असली ज़िंदगी बदले","Aapki asli zindagi badle"),L("A friend changes theirs","दोस्त अपना बदले","Dost apna badle"),L("The market dips","मार्केट गिरे","Market gire")],a:1,why:L("Adjust for life events, not market noise or headlines.","ज़िंदगी की घटनाओं पर बदलो, मार्केट शोर पर नहीं।","Zindagi ki ghatnaon pe badlo, market shor pe nahi.")},
   {q:L("A good review is…","अच्छा रिव्यू है…","Achha review hai…"),o:[L("A full overhaul each time","हर बार पूरा overhaul","Har baar poora overhaul"),L("A short scheduled checklist","एक छोटी शेड्यूल्ड चेकलिस्ट","Ek chhoti scheduled checklist"),L("Daily tinkering","रोज़ छेड़छाड़","Roz chhedchhaad"),L("Never done","कभी नहीं","Kabhi nahi")],a:1,why:L("A light, scheduled checklist keeps the plan aligned without over-tinkering.","हल्की, शेड्यूल्ड चेकलिस्ट अलाइन रखती, बिना ज़्यादा छेड़े।","Halki, scheduled checklist align rakhti, bina zyada chhede.")}
  ],
  reflect:L("When will your first real review be — put a date on it?","आपका पहला असली रिव्यू कब — एक डेट डालो?","Aapka pehla asli review kab — ek date daalo?")},

 {id:"m9l5",title:L("Compare with your squad","अपनी स्क्वाड से तुलना","Apni squad se tulna"),sub:L("Social discipline, not tips","सोशल अनुशासन, टिप नहीं","Social discipline, not tips"),mins:4,
  beats:{
   sit:L("Doing this alone, motivation fades; a friend who quit their plan wishes someone had kept them accountable.","अकेले करते मोटिवेशन घटता; प्लान छोड़ने वाला दोस्त चाहता कि कोई जवाबदेह रखता।","Akele karte motivation ghatta; plan chhodne wala dost chahta ki koi jawaabdeh rakhta."),
   myth:{lie:L("Investing is a solo, private thing.","इन्वेस्टिंग अकेली, निजी चीज़ है।","Investing akeli, niji cheez hai."),truth:L("The right kind of social layer — shared discipline, not stock tips — keeps you consistent.","सही तरह की सोशल परत — साझा अनुशासन, स्टॉक टिप नहीं — आपको लगातार रखती है।","Sahi tarah ki social parat — saajha anushaasan, stock tip nahi — aapko lagataar rakhti hai.")},
   reflex:L("Either investing in isolation (and drifting) or copying friends' picks (M7 traps).","या अकेले इन्वेस्ट (और भटकना) या दोस्तों की पिक्स नकल (M7 जाल)।","Ya akele invest (aur bhatakna) ya doston ki picks nakal (M7 jaal)."),
   q:L("Can friends help me stick to my plan?","क्या दोस्त प्लान पर टिकने में मदद कर सकते?","Kya dost plan pe tikne mein madad kar sakte?"),
   fw:L("Use your squad for <b>accountability, not tips</b>: shared streaks, 'did everyone review this quarter', encouragement to stay the course in a crash. That's the good kind of social — it reinforces the boring, winning behaviours. The bad kind (copying picks, FOMO, hype) is what M7 warned against.","अपनी स्क्वाड को <b>जवाबदेही के लिए, टिप के लिए नहीं</b>: साझा स्ट्रीक, 'सबने इस तिमाही रिव्यू किया?', क्रैश में टिके रहने की हिम्मत। यह अच्छी सोशल — उबाऊ, जीतने वाले व्यवहार मज़बूत करती। बुरी (पिक्स नकल, FOMO) से M7 ने चेताया।","Apni squad ko <b>jawaabdehi ke liye, tip ke liye nahi</b>: saajha streak, 'sabne is timaahi review kiya?', crash mein tike rehne ki himmat. Yeh achhi social — ubaau, jeetne wale vyavhaar mazboot karti. Buri (picks nakal, FOMO) se M7 ne chetaaya."),
   call:L("Lean on your squad for consistency and calm, never for what to buy — decisions stay yours.","स्क्वाड पर लगातारता और शांति के लिए झुको, क्या खरीदना उसके लिए कभी नहीं — फैसले आपके।","Squad pe lagataarta aur shaanti ke liye jhuko, kya khareedna uske liye kabhi nahi — faisle aapke.")
  },
  dd:{ex:[
