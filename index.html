   L("The number-and-date combo also does the heavy lifting from earlier modules for you: the date sets the horizon, which sets the right type (Module 4) and risk level (Module 5). So a goal properly defined almost tells you how to invest for it. That's why 'no goal without a number and a date' is the first rule of a real plan.","नंबर-और-डेट पिछले मॉड्यूल का भारी काम भी कर देता है: डेट होराइज़न तय करती है, जो सही टाइप (मॉड्यूल 4) और रिस्क (मॉड्यूल 5) तय करता है। तो ठीक से परिभाषित गोल लगभग खुद बता देता है कैसे इन्वेस्ट करें।","Number-aur-date pichhle module ka bhaari kaam bhi kar deta hai: date horizon tay karti hai, jo sahi type (Module 4) aur risk (Module 5) tay karta hai. Toh theek se paribhaashit goal lagbhag khud bata deta hai kaise invest karein.")],
   faq:[
    {q:L("What if I can't afford the full monthly amount?","अगर पूरी मंथली रकम अफोर्ड न कर सकूँ?","Agar poori monthly raqam afford na kar sakun?"),a:L("Start with what you can and either extend the date or step it up later (next lessons). A partial start beats no start.","जो कर सको उससे शुरू करो और डेट बढ़ाओ या बाद में step-up करो। आंशिक शुरुआत, न-शुरुआत से बेहतर।","Jo kar sako usse shuru karo aur date badhao ya baad mein step-up karo. Aanshik shuruaat, na-shuruaat se behtar.")},
    {q:L("What if I have too many goals?","अगर बहुत सारे गोल हों?","Agar bahut saare goal hon?"),a:L("Rank them by importance and date; fund the non-negotiable near ones first, then the rest. Clarity beats trying to do all at once.","महत्व और डेट से रैंक करो; पहले ज़रूरी नज़दीकी, फिर बाकी।","Mahatva aur date se rank karo; pehle zaroori nazdeeki, phir baaki.")}
   ]},
  terms:[{k:L("Goal-based investing","गोल-बेस्ड इन्वेस्टिंग","Goal-based investing"),d:L("Investing tied to a specific goal with a number and a date.","किसी खास गोल से जुड़ा इन्वेस्टिंग, नंबर और डेट के साथ।","Kisi khaas goal se juda investing, number aur date ke saath.")},{k:L("Target corpus","टारगेट कॉर्पस","Target corpus"),d:L("The total amount a goal needs by its date.","एक गोल को उसकी डेट तक जितनी कुल राशि चाहिए।","Ek goal ko uski date tak jitni kul raashi chahiye.")}],
  action:{h:L("Define one real goal","एक असली गोल तय करो","Ek asli goal tay karo"),p:L("Write one real goal with a number and a date; the app shows the rough monthly amount needed.","एक असली गोल नंबर और डेट के साथ लिखो; ऐप मोटी मंथली रकम दिखाएगा।","Ek asli goal number aur date ke saath likho; app moti monthly raqam dikhayega."),data:L("Your goal amount and date (user-entered).","आपके गोल की राशि और डेट (यूज़र-डाला)।","Aapke goal ki raashi aur date (user-entered).")},
  quiz:[
   {q:L("A goal becomes a plan when you add…","गोल प्लान कब बनता है जब जोड़ो…","Goal plan kab banta hai jab jodo…"),o:[L("A hope","एक उम्मीद","Ek umeed"),L("A number and a date","एक नंबर और डेट","Ek number aur date"),L("A friend's tip","दोस्त की टिप","Dost ki tip"),L("A lucky charm","एक लकी चार्म","Ek lucky charm")],a:1,why:L("A number and a date make a goal measurable and fundable.","नंबर और डेट गोल को नापने और फंड करने लायक बनाते हैं।","Number aur date goal ko naapne aur fund karne layak banate hain.")},
   {q:L("A goal's date mainly sets its…","गोल की डेट मुख्यतः तय करती है…","Goal ki date mukhyatah tay karti hai…"),o:[L("Colour","रंग","Rang"),L("Horizon, and so its type & risk","होराइज़न, और इसलिए टाइप और रिस्क","Horizon, aur isliye type aur risk"),L("Tax rate","टैक्स रेट","Tax rate"),L("Brand","ब्रांड","Brand")],a:1,why:L("The date sets the horizon, which drives the right type and risk level.","डेट होराइज़न तय करती है, जो सही टाइप और रिस्क चलाता है।","Date horizon tay karti hai, jo sahi type aur risk chalata hai.")}
  ],
  reflect:L("Which of your goals has no number or date yet?","आपके किस गोल का अब तक नंबर या डेट नहीं है?","Aapke kis goal ka ab tak number ya date nahi hai?")},

 {id:"m6l2",title:L("One shot or steady drips?","एक साथ या थोड़ा-थोड़ा?","Ek saath ya thoda-thoda?"),sub:L("Lumpsum vs SIP","लमसम बनाम SIP","Lumpsum vs SIP"),mins:4,
  beats:{
   sit:L("You have ₹1.2 lakh saved and also a steady salary. Invest it all at once, or spread it monthly?","आपके पास ₹1.2 लाख जमा और एक स्थिर सैलरी भी है। सब एक साथ लगाओ, या मंथली फैलाओ?","Aapke paas ₹1.2 lakh jama aur ek sthir salary bhi hai. Sab ek saath lagao, ya monthly phailaao?"),
   myth:{lie:L("There's one right way to put money in.","पैसा लगाने का एक ही सही तरीका है।","Paisa lagaane ka ek hi sahi tareeka hai."),truth:L("Lumpsum suits money you already have; SIP suits money that arrives monthly — it's about the source, not a winner.","लमसम उस पैसे के लिए जो पहले से है; SIP उसके लिए जो मंथली आता है — बात स्रोत की है, विजेता की नहीं।","Lumpsum us paise ke liye jo pehle se hai; SIP uske liye jo monthly aata hai — baat source ki hai, vijeta ki nahi.")},
   reflex:L("Waiting for the 'perfect time' and never investing.","'सही समय' का इंतज़ार और कभी इन्वेस्ट न करना।","'Sahi samay' ka intzaar aur kabhi invest na karna."),
   q:L("One shot or steady drips?","एक साथ या थोड़ा-थोड़ा?","Ek saath ya thoda-thoda?"),
   fw:L("<b>Lumpsum</b> = invest a big amount at once (fits a windfall or existing pile). <b>SIP</b> = invest a fixed amount regularly (fits a monthly salary). SIP also averages your buy price across ups and downs and builds the habit. Neither wins universally — match to how your money arrives.","<b>लमसम</b> = बड़ी रकम एक साथ (windfall या मौजूद ढेर के लिए)। <b>SIP</b> = तय रकम नियमित (मंथली सैलरी के लिए)। SIP खरीद दाम को उतार-चढ़ाव में औसत करता और आदत बनाता है। कोई सार्वभौमिक विजेता नहीं।","<b>Lumpsum</b> = badi raqam ek saath (windfall ya maujood dher ke liye). <b>SIP</b> = tay raqam niyamit (monthly salary ke liye). SIP khareed daam ko utaar-chadhaav mein ausat karta aur aadat banata hai. Koi universal vijeta nahi."),
   call:L("Money you already have → lumpsum-style; money that comes monthly → SIP. Don't wait to 'time' it.","जो पैसा पहले से है → लमसम; जो मंथली आता है → SIP। 'टाइम' करने का इंतज़ार मत करो।","Jo paisa pehle se hai → lumpsum; jo monthly aata hai → SIP. 'Time' karne ka intzaar mat karo.")
  },
  dd:{ex:[
   L("Lumpsum and SIP aren't rivals — they fit different situations. If you already have a pile (a bonus, savings, an inheritance), that money can go in as a lumpsum. If your investable money arrives monthly from your salary, a SIP — a fixed amount at a regular date — fits naturally, because you invest as you earn.","लमसम और SIP प्रतिद्वंद्वी नहीं — अलग situations के लिए। पहले से ढेर (बोनस, सेविंग्स, विरासत) हो तो लमसम। मंथली सैलरी से पैसा आए तो SIP — तय तारीख पर तय रकम — स्वाभाविक।","Lumpsum aur SIP pratidwandwi nahi — alag situations ke liye. Pehle se dher (bonus, savings, viraasat) ho toh lumpsum. Monthly salary se paisa aaye toh SIP — tay taareekh pe tay raqam — swaabhaavik."),
   L("SIP has two quiet superpowers: it averages your purchase price across highs and lows (you buy more units when prices are low, fewer when high), and it builds an automatic habit that removes the temptation to 'time the market' — a temptation that trips up almost everyone (Module 7). The worst move is leaving money idle for months waiting for the 'perfect' entry that never obviously arrives.","SIP की दो खामोश ताकतें: यह खरीद दाम को ऊँच-नीच में औसत करता है (सस्ते में ज़्यादा यूनिट, महँगे में कम), और एक ऑटोमैटिक आदत बनाता है जो 'मार्केट टाइम' करने का लालच हटाती है। सबसे बुरा: महीनों पैसा idle छोड़ना।","SIP ki do khamosh taaqatein: yeh khareed daam ko oonch-neech mein ausat karta hai (saste mein zyada unit, mehnge mein kam), aur ek automatic aadat banata hai jo 'market time' karne ka laalach hataati hai. Sabse bura: mahinon paisa idle chhodna."),],
   faq:[
    {q:L("Should I wait for a dip to invest?","क्या डिप का इंतज़ार करूँ?","Kya dip ka intzaar karun?"),a:L("Timing the dip reliably beats almost no one (Module 7). Time in the market usually beats timing the market — start, don't wait.","डिप को भरोसे से टाइम करना लगभग किसी से नहीं होता। मार्केट में समय, टाइमिंग से बेहतर — शुरू करो।","Dip ko bharose se time karna lagbhag kisi se nahi hota. Market mein samay, timing se behtar — shuru karo.")},
    {q:L("Can I do both?","क्या दोनों कर सकता हूँ?","Kya dono kar sakta hoon?"),a:L("Yes — a lumpsum for what you have now, plus an ongoing SIP from salary. They serve different money.","हाँ — जो अभी है उसके लिए लमसम, और सैलरी से चलती SIP। अलग पैसे के लिए।","Haan — jo abhi hai uske liye lumpsum, aur salary se chalti SIP. Alag paise ke liye.")}
   ]},
  terms:[{k:L("SIP","SIP","SIP"),d:L("Systematic Investment Plan — a fixed amount invested at regular intervals.","सिस्टमैटिक इन्वेस्टमेंट प्लान — नियमित अंतराल पर तय रकम।","Systematic Investment Plan — niyamit antaraal pe tay raqam.")},{k:L("Rupee-cost averaging","रुपी-कॉस्ट एवरेजिंग","Rupee-cost averaging"),d:L("Investing steadily so you buy more when cheap, less when dear.","लगातार इन्वेस्ट करना — सस्ते में ज़्यादा, महँगे में कम।","Lagataar invest karna — saste mein zyada, mehnge mein kam.")}],
  action:{h:L("Lumpsum vs SIP","लमसम बनाम SIP","Lumpsum vs SIP"),p:L("Compare investing a lump at once vs the same total spread as a monthly SIP over a period.","एक साथ लमसम बनाम वही कुल मंथली SIP के तौर पर तुलना करो।","Ek saath lumpsum banaam wahi kul monthly SIP ke taur pe compare karo."),data:L("Illustrative amounts on a real return series (in-app).","असली रिटर्न सीरीज़ पर उदाहरण राशि (ऐप में)।","Asli return series pe udaharan raashi (app mein).")},
  quiz:[
   {q:L("A SIP fits best when your money…","SIP सबसे अच्छा जब आपका पैसा…","SIP sabse achha jab aapka paisa…"),o:[L("Is a one-time windfall","एकमुश्त windfall हो","Ekmusht windfall ho"),L("Arrives monthly from salary","सैलरी से मंथली आए","Salary se monthly aaye"),L("Is in a fixed deposit","FD में हो","FD mein ho"),L("Doesn't exist","मौजूद ही नहीं","Maujood hi nahi")],a:1,why:L("SIP matches money that arrives at regular intervals — you invest as you earn.","SIP नियमित आने वाले पैसे से मेल खाता है।","SIP niyamit aane wale paise se mel khaata hai.")},
   {q:L("A key benefit of SIP is…","SIP का एक मुख्य फायदा…","SIP ka ek mukhya fayda…"),o:[L("Guaranteed profit","मुनाफे की गारंटी","Munaafe ki guarantee"),L("Averaging your buy price + a habit","खरीद दाम औसत + आदत","Khareed daam ausat + aadat"),L("No risk","कोई रिस्क नहीं","Koi risk nahi"),L("Beating every lumpsum","हर लमसम को हराना","Har lumpsum ko haraana")],a:1,why:L("SIP averages your price across ups/downs and builds a steady habit.","SIP दाम औसत करता है और स्थिर आदत बनाता है।","SIP daam ausat karta hai aur sthir aadat banata hai.")}
  ],
  reflect:L("Is any money sitting idle because you're waiting to time it?","कोई पैसा idle बैठा है क्योंकि आप टाइम करने का इंतज़ार कर रहे हो?","Koi paisa idle baitha hai kyunki aap time karne ka intzaar kar rahe ho?")},

 {id:"m6l3",title:L("How much in growth vs safe?","कितना ग्रोथ में, कितना सेफ?","Kitna growth mein, kitna safe?"),sub:L("Asset allocation by horizon","होराइज़न से एसेट एलोकेशन","Asset allocation by horizon"),mins:4,
  beats:{
   sit:L("You've decided to invest for a goal, but freeze on 'how much in growth vs safe?'","आपने गोल के लिए इन्वेस्ट तय किया, पर 'कितना ग्रोथ बनाम सेफ?' पर अटक गए।","Aapne goal ke liye invest tay kiya, par 'kitna growth banaam safe?' pe atak gaye."),
   myth:{lie:L("There's a perfect equity percentage everyone should hold.","एक परफेक्ट इक्विटी % है जो सबको रखना चाहिए।","Ek perfect equity % hai jo sabko rakhna chahiye."),truth:L("The growth-vs-safe split follows the goal's horizon and your risk level — a framework, not a fixed number.","ग्रोथ-बनाम-सेफ स्प्लिट गोल के होराइज़न और आपके रिस्क लेवल से — फ्रेमवर्क, तय नंबर नहीं।","Growth-banaam-safe split goal ke horizon aur aapke risk level se — framework, tay number nahi.")},
   reflex:L("Copying a random 'X% equity' rule blindly.","किसी 'X% इक्विटी' रूल की आँख मूँदकर नकल।","Kisi 'X% equity' rule ki aankh moondkar nakal."),
   q:L("How much should be in growth vs safe?","कितना ग्रोथ में, कितना सेफ में?","Kitna growth mein, kitna safe mein?"),
   fw:L("<b>Asset allocation</b> = the split across growth (equity-type), steadier (debt-type), plus a hedge. Longer horizon + higher risk capacity → more growth; shorter/lower → more steady. Rules of thumb exist but must bend to YOUR horizon and sleep test.","<b>एसेट एलोकेशन</b> = ग्रोथ (इक्विटी-टाइप), स्थिर (डेट-टाइप), और एक हेज में बँटवारा। लंबा होराइज़न + ज़्यादा रिस्क कैपेसिटी → ज़्यादा ग्रोथ; छोटा/कम → ज़्यादा स्थिर। थंब रूल हैं पर आपके होराइज़न और नींद टेस्ट से झुकें।","<b>Asset allocation</b> = growth (equity-type), sthir (debt-type), aur ek hedge mein batwara. Lamba horizon + zyada risk capacity → zyada growth; chhota/kam → zyada sthir. Thumb rules hain par aapke horizon aur neend test se jhukein."),
   call:L("Set the split by each goal's horizon and your risk level; glide toward safer as the goal's date approaches.","स्प्लिट हर गोल के होराइज़न और रिस्क लेवल से तय करो; गोल की डेट पास आते सेफ की ओर सरको।","Split har goal ke horizon aur risk level se tay karo; goal ki date paas aate safe ki or sarko.")
  },
  dd:{ex:[
   L("Asset allocation is just the recipe: what share of a goal's money sits in growth-type assets (more return, more bumpiness) versus steadier ones (less bumpiness, less growth), plus maybe a small hedge. The single biggest driver is the goal's horizon — long horizons can hold more growth because they have time to recover from dips; short horizons need more safety.","एसेट एलोकेशन बस रेसिपी है: गोल के पैसे का कितना हिस्सा ग्रोथ-टाइप (ज़्यादा रिटर्न, ज़्यादा बंपी) बनाम स्थिर में, और शायद थोड़ा हेज। सबसे बड़ा ड्राइवर होराइज़न — लंबा ज़्यादा ग्रोथ, छोटा ज़्यादा सेफ्टी।","Asset allocation bas recipe hai: goal ke paise ka kitna hissa growth-type (zyada return, zyada bumpy) banaam sthir mein, aur shayad thoda hedge. Sabse bada driver horizon — lamba zyada growth, chhota zyada safety."),
   L("Popular rules of thumb (like a rough equity percentage) can be a starting point, but they must bend to YOUR horizon and your sleep test (Module 5) — a formula that ignores whether you'd panic-sell is dangerous. And allocation isn't set-once: as a goal's date approaches, you gradually shift it toward safer assets (a 'glide path'), so a crash right before you need the money can't wreck it. We give the framework; the exact split is yours.","लोकप्रिय थंब रूल शुरुआत हो सकते, पर आपके होराइज़न और नींद टेस्ट से झुकें — जो panic-sell को अनदेखा करे वो खतरनाक। एलोकेशन एक-बार नहीं: डेट पास आते धीरे सेफ की ओर ('ग्लाइड पाथ'), ताकि ज़रूरत से ठीक पहले क्रैश बर्बाद न करे।","Popular thumb rule shuruaat ho sakte, par aapke horizon aur neend test se jhukein — jo panic-sell ko andekha kare woh khatarnaak. Allocation ek-baar nahi: date paas aate dheere safe ki or ('glide path'), taaki zaroorat se theek pehle crash barbaad na kare.")],
   faq:[
    {q:L("Is 'equity % = 100 minus age' a good rule?","'इक्विटी % = 100 माइनस उम्र' अच्छा रूल?","'Equity % = 100 minus age' achha rule?"),a:L("It's a rough starting point, not gospel — adjust for the goal's horizon and your real tolerance, which age alone doesn't capture.","मोटी शुरुआत, कानून नहीं — गोल के होराइज़न और असली टॉलरेंस से एडजस्ट करो।","Moti shuruaat, kanoon nahi — goal ke horizon aur asli tolerance se adjust karo.")},
    {q:L("One allocation for all my money?","सारे पैसे के लिए एक एलोकेशन?","Saare paise ke liye ek allocation?"),a:L("Usually not — different goals with different horizons deserve different splits (Module 5). Allocate per bucket.","आमतौर पर नहीं — अलग होराइज़न वाले गोल को अलग स्प्लिट। हर बकेट के लिए एलोकेट।","Aam taur pe nahi — alag horizon wale goal ko alag split. Har bucket ke liye allocate.")}
   ]},
  terms:[{k:L("Asset allocation","एसेट एलोकेशन","Asset allocation"),d:L("How you split money across growth, steady, and hedge assets.","ग्रोथ, स्थिर और हेज में पैसा कैसे बाँटते हो।","Growth, sthir aur hedge mein paisa kaise baant-te ho.")},{k:L("Glide path","ग्लाइड पाथ","Glide path"),d:L("Gradually shifting toward safer assets as a goal nears.","गोल पास आते धीरे सेफ की ओर सरकना।","Goal paas aate dheere safe ki or sarakna.")}],
  action:{h:L("Split a near vs far goal","जल्द बनाम दूर गोल का स्प्लिट","Jald banaam door goal ka split"),p:L("Set a growth/safe split for a near-term and a long-term virtual goal and compare.","एक जल्द और एक लंबे वर्चुअल गोल के लिए ग्रोथ/सेफ स्प्लिट सेट करो और तुलना करो।","Ek jald aur ek lambe virtual goal ke liye growth/safe split set karo aur compare karo."),data:L("Your goal horizons (user-entered).","आपके गोल होराइज़न (यूज़र-डाला)।","Aapke goal horizon (user-entered).")},
  quiz:[
   {q:L("The biggest driver of a goal's growth/safe split is…","गोल के ग्रोथ/सेफ स्प्लिट का सबसे बड़ा ड्राइवर…","Goal ke growth/safe split ka sabse bada driver…"),o:[L("Its name","इसका नाम","Iska naam"),L("Its horizon","इसका होराइज़न","Iska horizon"),L("The news","न्यूज़","News"),L("A friend's split","दोस्त का स्प्लिट","Dost ka split")],a:1,why:L("Horizon decides how much bumpiness the money can bear.","होराइज़न तय करता है पैसा कितनी बंपीनेस झेल सके।","Horizon tay karta hai paisa kitni bumpiness jhel sake.")},
   {q:L("As a goal's date gets close, you should…","गोल की डेट पास आते आपको…","Goal ki date paas aate aapko…"),o:[L("Add more growth risk","और ग्रोथ रिस्क जोड़ो","Aur growth risk jodo"),L("Glide toward safer assets","सेफ की ओर सरको","Safe ki or sarko"),L("Sell everything","सब बेचो","Sab becho"),L("Ignore it","अनदेखा करो","Andekha karo")],a:1,why:L("A glide path protects the goal from a crash just before you need the money.","ग्लाइड पाथ ज़रूरत से ठीक पहले क्रैश से बचाता है।","Glide path zaroorat se theek pehle crash se bachata hai.")}
  ],
  reflect:L("Does your current split match your goals' horizons?","आपका मौजूदा स्प्लिट गोल के होराइज़न से मेल खाता है?","Aapka maujooda split goal ke horizon se mel khaata hai?")},

 {id:"m6l4",title:L("Grow it every year","हर साल बढ़ाओ","Har saal badhao"),sub:L("Step-up your contributions","अपना योगदान step-up करो","Apna yogdaan step-up karo"),mins:4,
  beats:{
   sit:L("Your salary went up 20% this year, but your investment stayed the same. Lifestyle quietly ate the raise.","इस साल सैलरी 20% बढ़ी, पर इन्वेस्टमेंट वही रहा। लाइफस्टाइल ने चुपचाप बढ़ोतरी खा ली।","Is saal salary 20% badhi, par investment wahi raha. Lifestyle ne chupchaap badhotari kha li."),
   myth:{lie:L("Once I set my SIP, I'm done.","एक बार SIP सेट, काम खत्म।","Ek baar SIP set, kaam khatam."),truth:L("Raising your contribution as income grows (step-up) massively boosts the outcome and beats lifestyle creep.","इनकम बढ़ते योगदान बढ़ाना (step-up) नतीजा बहुत बढ़ाता है और लाइफस्टाइल क्रीप को हराता है।","Income badhte yogdaan badhaana (step-up) natija bahut badhata hai aur lifestyle creep ko haraata hai.")},
   reflex:L("Keeping contributions flat as income rises.","इनकम बढ़ने पर योगदान वही रखना।","Income badhne pe yogdaan wahi rakhna."),
   q:L("Should my investing grow with my income?","क्या मेरा इन्वेस्टिंग इनकम के साथ बढ़े?","Kya mera investing income ke saath badhe?"),
   fw:L("<b>Step-up</b> = increasing your regular contribution over time (each year, or with each raise). Thanks to compounding + a higher base, small annual increases compound into a far bigger corpus — and it's the antidote to lifestyle creep (Module 2). Automate it.","<b>Step-up</b> = समय के साथ नियमित योगदान बढ़ाना (हर साल, या हर बढ़ोतरी पर)। कंपाउंडिंग + ऊँचे बेस से छोटी सालाना बढ़त बड़ा corpus बनाती है — और लाइफस्टाइल क्रीप का इलाज। ऑटोमेट करो।","<b>Step-up</b> = samay ke saath niyamit yogdaan badhaana (har saal, ya har badhotari pe). Compounding + ooncha base se chhoti saalaana badhat bada corpus banati hai — aur lifestyle creep ka ilaaj. Automate karo."),
   call:L("How much to step up is yours, but capturing part of every raise before lifestyle does is the highest-leverage habit.","कितना step-up आपका, पर हर बढ़ोतरी का हिस्सा लाइफस्टाइल से पहले पकड़ना सबसे बड़ी लीवरेज आदत।","Kitna step-up aapka, par har badhotari ka hissa lifestyle se pehle pakadna sabse badi leverage aadat.")
  },
  dd:{ex:[
   L("A step-up simply means your contribution isn't frozen — you raise it over time, typically each year or whenever your income jumps. It sounds small, but it's one of the most powerful moves in investing, because you're adding a bigger base to compounding every year. Over a couple of decades, a modest annual step-up can dwarf a flat contribution's final corpus.","step-up का मतलब योगदान जमा नहीं — समय के साथ बढ़ाओ, अक्सर हर साल या इनकम बढ़ने पर। छोटा लगता है, पर सबसे पावरफुल मूव, क्योंकि हर साल कंपाउंडिंग को बड़ा बेस देते हो। दशकों में मामूली step-up flat से कहीं बड़ा corpus।","Step-up ka matlab yogdaan jama nahi — samay ke saath badhao, aksar har saal ya income badhne pe. Chhota lagta hai, par sabse powerful move, kyunki har saal compounding ko bada base dete ho. Dashakon mein maamooli step-up flat se kahin bada corpus."),
   L("It's also the direct cure for lifestyle creep (Module 2): if you route a slice of every raise into investing BEFORE it inflates your spending, your savings rate actually rises with your income instead of standing still. The trick is to automate the step-up (many SIPs let you set an auto-increase) so it happens without you having to summon willpower each year.","यह लाइफस्टाइल क्रीप का सीधा इलाज भी: हर बढ़ोतरी का हिस्सा खर्च बढ़ने से पहले इन्वेस्टिंग में डालो, तो सेविंग्स रेट इनकम के साथ बढ़ता है। step-up को ऑटोमेट करो ताकि हर साल विलपावर न लगानी पड़े।","Yeh lifestyle creep ka seedha ilaaj bhi: har badhotari ka hissa kharch badhne se pehle investing mein daalo, toh savings rate income ke saath badhta hai. Step-up ko automate karo taaki har saal willpower na lagaani pade.")],
   faq:[
    {q:L("What if my income is irregular?","अगर इनकम अनियमित हो?","Agar income irregular ho?"),a:L("Step up in good months or after a big payment, even if not yearly — raise the base whenever you comfortably can.","अच्छे महीनों या बड़े पेमेंट के बाद बढ़ाओ, चाहे सालाना न हो।","Achhe mahinon ya bade payment ke baad badhao, chahe saalaana na ho.")},
    {q:L("Step up by how much?","कितना step-up करूँ?","Kitna step-up karun?"),a:L("Even a small yearly increase helps; a common approach is to raise it in line with your salary hike. Whatever you'll sustain.","छोटी सालाना बढ़त भी मदद; अक्सर सैलरी हाइक के बराबर बढ़ाते हैं। जो निभा सको।","Chhoti saalaana badhat bhi madad; aksar salary hike ke barabar badhate hain. Jo nibha sako.")}
   ]},
  terms:[{k:L("Step-up SIP","स्टेप-अप SIP","Step-up SIP"),d:L("A SIP whose amount rises over time, usually yearly.","एक SIP जिसकी रकम समय के साथ बढ़े, अक्सर सालाना।","Ek SIP jiski raqam samay ke saath badhe, aksar saalaana.")},{k:L("Lifestyle creep","लाइफस्टाइल क्रीप","Lifestyle creep"),d:L("Spending rising with income, freezing your savings rate.","इनकम बढ़ने पर खर्च बढ़ना, सेविंग्स रेट जमा देना।","Income badhne pe kharch badhna, savings rate jama dena.")}],
  action:{h:L("Flat vs step-up","फ्लैट बनाम स्टेप-अप","Flat banaam step-up"),p:L("Compare a flat contribution vs a small yearly step-up over many years.","एक फ्लैट योगदान बनाम छोटी सालाना step-up को कई सालों में तुलना करो।","Ek flat yogdaan banaam chhoti saalaana step-up ko kai saalon mein compare karo."),data:L("Your contribution and step-up % (user-entered).","आपका योगदान और step-up % (यूज़र-डाला)।","Aapka yogdaan aur step-up % (user-entered).")},
  quiz:[
   {q:L("Why is a step-up so powerful?","step-up इतना पावरफुल क्यों?","Step-up itna powerful kyun?"),o:[L("It removes risk","रिस्क हटाता है","Risk hataata hai"),L("It feeds compounding a bigger base yearly","हर साल कंपाउंडिंग को बड़ा बेस","Har saal compounding ko bada base"),L("It avoids tax","टैक्स बचाता है","Tax bachata hai"),L("It's guaranteed","गारंटीड है","Guaranteed hai")],a:1,why:L("Raising contributions grows the base that compounds each year.","योगदान बढ़ाना हर साल कंपाउंडिंग का बेस बढ़ाता है।","Yogdaan badhaana har saal compounding ka base badhata hai.")},
   {q:L("A step-up is the direct cure for…","step-up किसका सीधा इलाज है…","Step-up kiska seedha ilaaj hai…"),o:[L("Inflation","इन्फ्लेशन","Inflation"),L("Lifestyle creep","लाइफस्टाइल क्रीप","Lifestyle creep"),L("Taxes","टैक्स","Tax"),L("Market crashes","मार्केट क्रैश","Market crash")],a:1,why:L("Routing raises into investing stops spending from eating every hike.","बढ़ोतरी को इन्वेस्टिंग में डालना खर्च को हर हाइक खाने से रोकता है।","Badhotari ko investing mein daalna kharch ko har hike khaane se rokta hai.")}
  ],
  reflect:L("Did your last raise reach your investments, or just your spending?","आपकी पिछली बढ़ोतरी इन्वेस्टमेंट तक पहुँची, या सिर्फ खर्च तक?","Aapki pichhli badhotari investment tak pahunchi, ya sirf kharch tak?")},

 {id:"m6l5",title:L("Your mix drifted — fix it","आपका मिक्स बिगड़ा — ठीक करो","Aapka mix bigda — theek karo"),sub:L("Rebalancing","रीबैलेंसिंग","Rebalancing"),mins:4,
  beats:{
   sit:L("A year in, your growth part grew so much it's now a bigger share than you intended — quietly riskier than your plan.","एक साल बाद, आपका ग्रोथ हिस्सा इतना बढ़ा कि अब इरादे से बड़ा शेयर — चुपचाप प्लान से ज़्यादा रिस्की।","Ek saal baad, aapka growth hissa itna badha ki ab iraade se bada share — chupchaap plan se zyada risky."),
   myth:{lie:L("If it's growing, leave it — don't touch a winner.","अगर बढ़ रहा है, छोड़ो — विजेता को मत छुओ।","Agar badh raha hai, chhodo — vijeta ko mat chhuo."),truth:L("Growth can drift your mix off-target, quietly raising risk; rebalancing brings it back to your intended split.","ग्रोथ आपके मिक्स को टारगेट से भटका सकती है, चुपचाप रिस्क बढ़ाकर; रीबैलेंसिंग उसे इरादे के स्प्लिट पर लाती है।","Growth aapke mix ko target se bhatka sakti hai, chupchaap risk badhaakar; rebalancing use iraade ke split pe laati hai.")},
   reflex:L("Letting winners run until the mix is unrecognisable.","विजेताओं को तब तक चलने देना जब मिक्स पहचान से बाहर।","Vijetaon ko tab tak chalne dena jab mix pehchaan se baahar."),
   q:L("My mix drifted — what do I do?","मेरा मिक्स भटक गया — क्या करूँ?","Mera mix bhatak gaya — kya karun?"),
   fw:L("<b>Rebalancing</b> = periodically nudging your split back to your intended allocation (trim what grew too big, top up what lagged). It keeps risk at the level you chose and quietly enforces 'buy low, sell high'. Do it on a schedule or when the mix drifts past a band — not constantly.","<b>रीबैलेंसिंग</b> = समय-समय पर स्प्लिट को इरादे के एलोकेशन पर लाना (जो बहुत बढ़ा उसे छाँटो, जो पिछड़ा उसे भरो)। रिस्क आपके चुने लेवल पर रखता और 'सस्ते में खरीदो, महँगे में बेचो' लागू करता। शेड्यूल पर या band पार जाने पर, लगातार नहीं।","<b>Rebalancing</b> = samay-samay pe split ko iraade ke allocation pe laana (jo bahut badha use chhaanto, jo pichhda use bharo). Risk aapke chune level pe rakhta aur 'saste mein khareedo, mehnge mein becho' laagu karta. Schedule pe ya band paar jaane pe, lagataar nahi."),
   call:L("How often is your call, but check the mix periodically so your risk doesn't drift beyond your sleep test.","कितनी बार आपका, पर मिक्स समय-समय पर देखो ताकि रिस्क नींद टेस्ट से आगे न भटके।","Kitni baar aapka, par mix samay-samay pe dekho taaki risk neend test se aage na bhatke.")
  },
  dd:{ex:[
   L("Say you chose 60% growth, 40% safe. If growth has a great year, it might become 70% of your pot — meaning you're now taking more risk than you signed up for, without deciding to. Rebalancing simply trims the part that grew too big and tops up the part that lagged, returning you to your intended 60/40. It keeps your risk where your sleep test said it should be.","मान लो आपने 60% ग्रोथ, 40% सेफ चुना। ग्रोथ का अच्छा साल हो तो वो 70% बन सकता है — यानी अब बिना तय किए ज़्यादा रिस्क। रीबैलेंसिंग बड़े हिस्से को छाँटती और पिछड़े को भरती, आपको 60/40 पर लौटाती।","Maan lo aapne 60% growth, 40% safe chuna. Growth ka achha saal ho toh woh 70% ban sakta hai — yaani ab bina tay kiye zyada risk. Rebalancing bade hisse ko chhaanti aur pichhde ko bharti, aapko 60/40 pe lautaati."),
   L("A quiet bonus: rebalancing forces a disciplined 'buy low, sell high' — you trim what's expensive (grew a lot) and add to what's cheap (lagged), the opposite of the emotional urge to chase winners. But it can trigger costs and taxes (Module 8), so do it sparingly — on a schedule (say once a year) or only when the mix drifts past a set band, not every time the market wiggles.","खामोश बोनस: रीबैलेंसिंग अनुशासित 'सस्ते में खरीदो, महँगे में बेचो' थोपती है — महँगे को छाँटो, सस्ते को जोड़ो। पर लागत और टैक्स (मॉड्यूल 8) ला सकती, तो कम करो — साल में एक बार या band पार जाने पर, हर हलचल पर नहीं।","Khamosh bonus: rebalancing anushaasit 'saste mein khareedo, mehnge mein becho' thopti hai — mehnge ko chhaanto, saste ko jodo. Par laagat aur tax (Module 8) la sakti, toh kam karo — saal mein ek baar ya band paar jaane pe, har halchal pe nahi.")],
   faq:[
    {q:L("Doesn't selling winners hurt returns?","विजेता बेचना रिटर्न को नुकसान नहीं?","Vijeta bechna return ko nuksaan nahi?"),a:L("You only trim the excess back to target, not sell all — it controls risk and locks some gains, without abandoning growth.","सिर्फ अतिरिक्त को टारगेट तक छाँटते हो, सब नहीं — रिस्क कंट्रोल और कुछ लाभ पक्का।","Sirf atirikt ko target tak chhaant-te ho, sab nahi — risk control aur kuch laabh pakka.")},
    {q:L("How often should I rebalance?","कितनी बार रीबैलेंस करूँ?","Kitni baar rebalance karun?"),a:L("Commonly once a year, or when a part drifts several points past its target. Rarely, not constantly.","आमतौर पर साल में एक बार, या जब कोई हिस्सा टारगेट से कई पॉइंट भटके। कम, लगातार नहीं।","Aam taur pe saal mein ek baar, ya jab koi hissa target se kai point bhatke. Kam, lagataar nahi.")}
   ]},
  terms:[{k:L("Rebalancing","रीबैलेंसिंग","Rebalancing"),d:L("Returning your mix to its intended split periodically.","अपने मिक्स को समय-समय पर इरादे के स्प्लिट पर लाना।","Apne mix ko samay-samay pe iraade ke split pe laana.")},{k:L("Drift","ड्रिफ्ट","Drift"),d:L("When market moves push your mix away from your target split.","जब मार्केट आपके मिक्स को टारगेट स्प्लिट से हटा दे।","Jab market aapke mix ko target split se hata de.")}],
  action:{h:L("Watch a mix drift & rebalance","मिक्स ड्रिफ्ट और रीबैलेंस देखो","Mix drift aur rebalance dekho"),p:L("See a portfolio drift off-target over time, and the effect of one rebalance back to plan.","एक पोर्टफोलियो को समय के साथ टारगेट से भटकते और एक रीबैलेंस का असर देखो।","Ek portfolio ko samay ke saath target se bhatakte aur ek rebalance ka asar dekho."),data:L("Your intended split (user-entered).","आपका इरादे का स्प्लिट (यूज़र-डाला)।","Aapka iraade ka split (user-entered).")},
  quiz:[
   {q:L("Rebalancing mainly keeps your…","रीबैलेंसिंग मुख्यतः क्या बनाए रखती है…","Rebalancing mukhyatah kya banaaye rakhti hai…"),o:[L("Returns guaranteed","रिटर्न गारंटीड","Return guaranteed"),L("Risk at the level you chose","रिस्क आपके चुने लेवल पर","Risk aapke chune level pe"),L("Taxes at zero","टैक्स शून्य","Tax shoonya"),L("Broker happy","ब्रोकर खुश","Broker khush")],a:1,why:L("It returns your mix to target so risk doesn't silently climb.","यह मिक्स को टारगेट पर लौटाता ताकि रिस्क चुपचाप न बढ़े।","Yeh mix ko target pe lautaata taaki risk chupchaap na badhe.")},
   {q:L("Rebalancing should be done…","रीबैलेंसिंग कब करनी चाहिए…","Rebalancing kab karni chahiye…"),o:[L("Every single day","हर रोज़","Har roz"),L("On a schedule or past a drift band","शेड्यूल पर या ड्रिफ्ट band पार","Schedule pe ya drift band paar"),L("Never","कभी नहीं","Kabhi nahi"),L("Only in a crash","सिर्फ क्रैश में","Sirf crash mein")],a:1,why:L("Do it sparingly — costs and taxes mean constant rebalancing hurts.","कम करो — लागत और टैक्स के कारण लगातार नुकसानदेह।","Kam karo — laagat aur tax ke kaaran lagataar nuksaandeh.")}
  ],
  reflect:L("Has your growth/safe mix drifted from what you intended?","आपका ग्रोथ/सेफ मिक्स इरादे से भटक गया है?","Aapka growth/safe mix iraade se bhatak gaya hai?")},

 {id:"m6l6",title:L("Auto-pilot vs attention","ऑटो-पायलट बनाम ध्यान","Auto-pilot vs dhyaan"),sub:L("A review cadence you'll keep","एक रिव्यू कैडेंस जो निभाओगे","Ek review cadence jo nibhaoge"),mins:4,
  beats:{
   sit:L("Two extremes — one friend checks the app 20 times a day; another hasn't looked in 3 years and missed a goal going off-track.","दो चरम — एक दोस्त दिन में 20 बार ऐप देखता है; दूसरे ने 3 साल से नहीं देखा और एक गोल भटक गया।","Do charam — ek dost din mein 20 baar app dekhta hai; doosre ne 3 saal se nahi dekha aur ek goal bhatak gaya."),
   myth:{lie:L("More checking means better investing.","ज़्यादा चेक करना मतलब बेहतर इन्वेस्टिंग।","Zyada check karna matlab behtar investing."),truth:L("Investing rewards a calm, scheduled review — not daily monitoring, and not total neglect.","इन्वेस्टिंग शांत, शेड्यूल्ड रिव्यू को इनाम देती है — न रोज़ की निगरानी, न पूरी उपेक्षा।","Investing shaant, scheduled review ko inaam deti hai — na roz ki nigraani, na poori upeksha.")},
   reflex:L("Obsessive daily checking OR complete neglect.","जुनूनी रोज़ चेकिंग या पूरी उपेक्षा।","Junooni roz checking ya poori upeksha."),
   q:L("How often should I actually look?","असल में कितनी बार देखूँ?","Asal mein kitni baar dekhun?"),
   fw:L("Set a <b>review cadence</b> — a proper check every 6-12 months (rebalance, step-up, goals on track) plus automation running the day-to-day. Daily checking feeds anxiety and panic-selling; never checking lets goals silently derail. Automate contributions; review on a calendar, not on emotion.","एक <b>रिव्यू कैडेंस</b> सेट करो — हर 6-12 महीने ठीक से चेक (रीबैलेंस, step-up, गोल ट्रैक पर) और ऑटोमेशन रोज़ का चलाए। रोज़ चेकिंग चिंता और panic-selling देती; कभी न देखना गोल भटकाता। योगदान ऑटोमेट; रिव्यू कैलेंडर पर, भावना पर नहीं।","Ek <b>review cadence</b> set karo — har 6-12 mahine theek se check (rebalance, step-up, goal track pe) aur automation roz ka chalaaye. Roz checking chinta aur panic-selling deti; kabhi na dekhna goal bhatkaata. Yogdaan automate; review calendar pe, bhaavna pe nahi."),
   call:L("Pick a cadence you'll keep (say twice a year) and let automation handle the rest — a plan runs on rhythm, not vigilance.","एक कैडेंस चुनो जो निभाओगे (जैसे साल में दो बार) और बाकी ऑटोमेशन को दो — प्लान लय पर चलता है, सतर्कता पर नहीं।","Ek cadence chuno jo nibhaoge (jaise saal mein do baar) aur baaki automation ko do — plan lay pe chalta hai, satarkta pe nahi.")
  },
  dd:{ex:[
   L("There are two ways to wreck a good plan by how you watch it. Over-checking (glancing daily or hourly) floods you with meaningless noise and stokes the urge to react — the exact panic-selling that Module 5 warns against. Under-checking (never looking for years) lets problems build unseen: a goal falling behind, a badly drifted mix, a stopped SIP.","अच्छे प्लान को देखने के तरीके से बर्बाद करने के दो रास्ते। ओवर-चेकिंग (रोज़/हर घंटे) बेमतलब शोर भरती और react करने का लालच जगाती। अंडर-चेकिंग (सालों न देखना) समस्याएँ चुपचाप बढ़ने देती: गोल पिछड़ना, मिक्स भटकना, SIP रुकना।","Achhe plan ko dekhne ke tareeke se barbaad karne ke do raaste. Over-checking (roz/har ghante) bematlab shor bharti aur react karne ka laalach jagaati. Under-checking (saalon na dekhna) samasyaayein chupchaap badhne deti: goal pichhadna, mix bhatakna, SIP rukna."),
   L("The sweet spot: automate the boring day-to-day (contributions, SIPs, step-ups) so nothing depends on your mood, and put a real review on the calendar every 6-12 months. In that review you check three things — are goals on track, does the mix need rebalancing, and can you step up. Between reviews, you deliberately do nothing. A plan run on rhythm, not vigilance, is the one that survives — and that closes the whole planning module.","स्वीट स्पॉट: उबाऊ रोज़ का ऑटोमेट (योगदान, SIP, step-up) ताकि कुछ मूड पर न हो, और हर 6-12 महीने कैलेंडर पर असली रिव्यू। उसमें तीन चीज़ें: गोल ट्रैक पर?, मिक्स रीबैलेंस चाहिए?, step-up कर सकते? बीच में जानबूझकर कुछ नहीं।","Sweet spot: ubaau roz ka automate (yogdaan, SIP, step-up) taaki kuch mood pe na ho, aur har 6-12 mahine calendar pe asli review. Usmein teen cheezein: goal track pe?, mix rebalance chahiye?, step-up kar sakte? Beech mein jaanboojhkar kuch nahi.")],
   faq:[
    {q:L("What should a review actually check?","रिव्यू में असल में क्या देखें?","Review mein asal mein kya dekhein?"),a:L("Goals on track, mix vs target (rebalance?), room to step up, and that automations are still running. Not the daily price.","गोल ट्रैक पर, मिक्स बनाम टारगेट (रीबैलेंस?), step-up की गुंजाइश, ऑटोमेशन चल रहे। रोज़ का दाम नहीं।","Goal track pe, mix banaam target (rebalance?), step-up ki gunjaaish, automation chal rahe. Roz ka daam nahi.")},
    {q:L("Should market news change my plan?","क्या मार्केट न्यूज़ से प्लान बदले?","Kya market news se plan badle?"),a:L("Rarely — a plan built on your goals shouldn't lurch with headlines. Change it only if YOUR life or goals change.","शायद ही — गोल पर बना प्लान हेडलाइन से न डगमगाए। बदलो सिर्फ जब आपकी ज़िंदगी/गोल बदलें।","Shayad hi — goal pe bana plan headline se na dagmagaaye. Badlo sirf jab aapki zindagi/goal badlein.")}
   ]},
  terms:[{k:L("Review cadence","रिव्यू कैडेंस","Review cadence"),d:L("How regularly you formally check your plan — e.g. twice a year.","कितनी नियमित रूप से प्लान चेक करते हो — जैसे साल में दो बार।","Kitni niyamit roop se plan check karte ho — jaise saal mein do baar.")},{k:L("Automation","ऑटोमेशन","Automation"),d:L("Letting contributions and step-ups run without manual effort.","योगदान और step-up को बिना मेहनत चलने देना।","Yogdaan aur step-up ko bina mehnat chalne dena.")}],
  action:{h:L("Set your review rhythm","अपनी रिव्यू लय सेट करो","Apni review lay set karo"),p:L("Set a virtual review cadence and a checklist of what to review each time.","एक वर्चुअल रिव्यू कैडेंस और हर बार क्या देखना है उसकी चेकलिस्ट सेट करो।","Ek virtual review cadence aur har baar kya dekhna hai uski checklist set karo."),data:L("Your chosen cadence (user-entered).","आपकी चुनी कैडेंस (यूज़र-डाला)।","Aapki chuni cadence (user-entered).")},
  quiz:[
   {q:L("The healthiest way to watch a plan is…","प्लान देखने का सबसे स्वस्थ तरीका…","Plan dekhne ka sabse swasth tareeka…"),o:[L("Check hourly","हर घंटे चेक","Har ghante check"),L("A scheduled review every 6-12 months + automation","हर 6-12 महीने रिव्यू + ऑटोमेशन","Har 6-12 mahine review + automation"),L("Never check","कभी न देखो","Kabhi na dekho"),L("Only when scared","सिर्फ डर में","Sirf dar mein")],a:1,why:L("Automation handles the day-to-day; a calm periodic review handles the rest.","ऑटोमेशन रोज़ का, शांत आवधिक रिव्यू बाकी संभालता है।","Automation roz ka, shaant aavadhik review baaki sambhaalta hai.")},
   {q:L("Daily checking mainly leads to…","रोज़ चेकिंग मुख्यतः किस ओर ले जाती है…","Roz checking mukhyatah kis or le jaati hai…"),o:[L("Better returns","बेहतर रिटर्न","Behtar return"),L("Anxiety and panic-selling","चिंता और panic-selling","Chinta aur panic-selling"),L("Lower taxes","कम टैक्स","Kam tax"),L("Nothing at all","कुछ नहीं","Kuch nahi")],a:1,why:L("Noise breeds emotional reactions — the enemy of a long-term plan.","शोर भावनात्मक प्रतिक्रिया जगाता है — लॉन्ग-टर्म प्लान का दुश्मन।","Shor bhaavnaatmak pratikriya jagaata hai — long-term plan ka dushman.")}
  ],
  reflect:L("Are you an over-checker or a neglecter — and what's your ideal cadence?","आप ओवर-चेकर हो या नेगलेक्टर — और आपकी आदर्श कैडेंस क्या है?","Aap over-checker ho ya neglecter — aur aapki aadarsh cadence kya hai?")}
]};

const MODULE7={ id:"m7", n:7, title:L("The costly mistakes","महँगी गलतियाँ","Galtiyan jo mehngi padti hain"), theme:L("The behaviour traps — caught in the moment, so you catch yourself.","बिहेवियर ट्रैप — उसी पल में पकड़े, ताकि आप खुद को रोक सको।","Behaviour traps — usi pal mein pakde, taaki aap khud ko rok sako."),
 lessons:[
 {id:"m7l1",title:L("Last year's topper — buy it now?","पिछले साल का टॉपर — अभी खरीदूँ?","Pichhle saal ka topper — abhi khareedun?"),sub:L("Return chasing & recency bias","रिटर्न चेजिंग और रीसेंसी बायस","Return chasing & recency bias"),mins:4,
  beats:{
   sit:L("You see 'last year's #1: +45%!' and want to jump in right now.","आप देखते हो 'पिछले साल का #1: +45%!' और अभी कूदना चाहते हो।","Aap dekhte ho 'pichhle saal ka #1: +45%!' aur abhi koodna chahte ho."),
   myth:{lie:L("Last year's top performer is the best place to invest now.","पिछले साल का टॉप परफॉर्मर अभी इन्वेस्ट करने की सबसे अच्छी जगह।","Pichhle saal ka top performer abhi invest karne ki sabse achhi jagah."),truth:L("Chasing last year's winner often means buying high, right before it cools.","पिछले साल के विजेता का पीछा अक्सर महँगे में खरीदना है, ठंडा होने से ठीक पहले।","Pichhle saal ke vijeta ka peechha aksar mehnge mein khareedna hai, thanda hone se theek pehle.")},
   reflex:L("Piling into whatever just went up the most.","जो अभी सबसे ज़्यादा चढ़ा उसमें कूदना।","Jo abhi sabse zyada chadha usmein koodna."),
   q:L("Should I buy what topped the charts last year?","पिछले साल चार्ट टॉप करने वाला खरीदूँ?","Pichhle saal chart top karne wala khareedun?"),
   fw:L("<b>Recency bias</b> = assuming the recent past will continue. Past performance doesn't guarantee future returns; today's hot performer is often tomorrow's laggard — and by the time it's 'hot', you're buying at a high.","<b>रीसेंसी बायस</b> = मान लेना कि हाल का बीता चलता रहेगा। बीता प्रदर्शन भविष्य की गारंटी नहीं; आज का हॉट अक्सर कल का पिछड़ा — और जब तक 'हॉट' है, आप महँगे में खरीद रहे हो।","<b>Recency bias</b> = maan lena ki haal ka beeta chalta rahega. Beeta pradarshan bhavishya ki guarantee nahi; aaj ka hot aksar kal ka pichhda — aur jab tak 'hot' hai, aap mehnge mein khareed rahe ho."),
   call:L("Pick by suitability (horizon, risk, diversification), not by the leaderboard. Yesterday's winner is not a plan.","सूटेबिलिटी से चुनो (होराइज़न, रिस्क, डाइवर्सिफिकेशन), लीडरबोर्ड से नहीं। कल का विजेता प्लान नहीं।","Suitability se chuno (horizon, risk, diversification), leaderboard se nahi. Kal ka vijeta plan nahi.")
  },
  dd:{ex:[
   L("Recency bias is our brain's tendency to assume whatever just happened will keep happening. In investing it shows up as return chasing: you see something returned 45% last year and pour money in, quietly assuming it'll repeat. But past performance carries no guarantee — and a thing that's already surged is, almost by definition, no longer cheap.","रीसेंसी बायस दिमाग की आदत: जो अभी हुआ वही चलता रहेगा। इन्वेस्टिंग में रिटर्न चेजिंग: कुछ पिछले साल 45% दिया देख पैसा डालते हो, मानकर कि दोहराएगा। पर बीता प्रदर्शन गारंटी नहीं — और जो पहले ही उछला वो सस्ता नहीं रहा।","Recency bias dimaag ki aadat: jo abhi hua wahi chalta rahega. Investing mein return chasing: kuch pichhle saal 45% diya dekh paisa daalte ho, maankar ki dohraayega. Par beeta pradarshan guarantee nahi — aur jo pehle hi uchhla woh sasta nahi raha."),
   L("Market leadership rotates: the sector or fund on top this year is frequently middling or worse the next, while last year's laggards sometimes lead. Chasing the leaderboard means systematically buying high and selling low — the exact opposite of what works. The fix is to choose by fit (your goal's horizon, your risk, and diversification), and let a steady plan carry you rather than the recent scoreboard.","मार्केट लीडरशिप घूमती है: इस साल टॉप सेक्टर/फंड अगले साल अक्सर मध्यम या बदतर। लीडरबोर्ड का पीछा मतलब व्यवस्थित रूप से महँगे में खरीदना, सस्ते में बेचना। हल: फिट से चुनो (होराइज़न, रिस्क, डाइवर्सिफिकेशन)।","Market leadership ghoomti hai: is saal top sector/fund agle saal aksar madhyam ya badtar. Leaderboard ka peechha matlab vyavasthit roop se mehnge mein khareedna, saste mein bechna. Hal: fit se chuno (horizon, risk, diversification).")],
   faq:[
    {q:L("So past performance is useless?","तो बीता प्रदर्शन बेकार है?","Toh beeta pradarshan bekaar hai?"),a:L("It's context, not a promise. Use it to understand behaviour and consistency, never as a guarantee the run continues.","यह संदर्भ है, वादा नहीं। व्यवहार समझने को इस्तेमाल करो, गारंटी नहीं।","Yeh sandarbh hai, vaada nahi. Vyavhaar samajhne ko istemal karo, guarantee nahi.")},
    {q:L("How should I compare options then?","तो ऑप्शन कैसे तुलना करूँ?","Toh option kaise tulna karun?"),a:L("By fit to your goal, its horizon, cost, and how diversified it is — not by who topped a single recent year.","गोल से फिट, होराइज़न, लागत, डाइवर्सिफिकेशन से — एक हाल के साल के टॉपर से नहीं।","Goal se fit, horizon, laagat, diversification se — ek haal ke saal ke topper se nahi.")}
   ]},
  terms:[{k:L("Recency bias","रीसेंसी बायस","Recency bias"),d:L("Assuming the recent past will simply continue.","मान लेना कि हाल का बीता वैसे ही चलेगा।","Maan lena ki haal ka beeta waise hi chalega.")},{k:L("Past performance","पास्ट परफॉर्मेंस","Past performance"),d:L("How something did before — context, never a guarantee of the future.","किसी ने पहले कैसा किया — संदर्भ, भविष्य की गारंटी नहीं।","Kisi ne pehle kaisa kiya — sandarbh, bhavishya ki guarantee nahi.")}],
  action:{h:L("Do toppers stay on top?","क्या टॉपर टॉप पर रहते हैं?","Kya topper top pe rehte hain?"),p:L("View several past 'toppers' and where they ranked the very next year.","कुछ पिछले 'टॉपर' और अगले ही साल उनकी रैंक देखो।","Kuch pichhle 'topper' aur agle hi saal unki rank dekho."),data:L("Real year-by-year performance rankings (fetched by the app).","असली साल-दर-साल परफॉर्मेंस रैंकिंग (ऐप द्वारा)।","Asli saal-dar-saal performance ranking (app dwaara).")},
  quiz:[
   {q:L("Buying last year's top performer risks…","पिछले साल का टॉपर खरीदने का रिस्क…","Pichhle saal ka topper khareedne ka risk…"),o:[L("Guaranteed repeat gains","पक्का दोहराव","Pakka dohraav"),L("Buying high before it cools","ठंडा होने से पहले महँगे में","Thanda hone se pehle mehnge mein"),L("Zero risk","कोई रिस्क नहीं","Koi risk nahi"),L("Lower taxes","कम टैक्स","Kam tax")],a:1,why:L("Leadership rotates — chasing it often means buying at a high.","लीडरशिप घूमती है — पीछा अक्सर महँगे में खरीदना।","Leadership ghoomti hai — peechha aksar mehnge mein khareedna.")},
   {q:L("You should pick investments by…","इन्वेस्टमेंट किससे चुनो…","Investment kisse chuno…"),o:[L("Last year's ranking","पिछले साल की रैंक","Pichhle saal ki rank"),L("Fit to your goal, horizon & risk","गोल, होराइज़न और रिस्क से फिट","Goal, horizon aur risk se fit"),L("The biggest headline","सबसे बड़ी हेडलाइन","Sabse badi headline"),L("A group chat","ग्रुप चैट","Group chat")],a:1,why:L("Suitability beats the leaderboard — yesterday's winner isn't a plan.","सूटेबिलिटी लीडरबोर्ड से बेहतर।","Suitability leaderboard se behtar.")}
  ],
  reflect:L("Have you ever bought something just because it recently shot up?","कभी सिर्फ इसलिए खरीदा कि वो अभी उछला था?","Kabhi sirf isliye khareeda ki woh abhi uchhla tha?")},

 {id:"m7l2",title:L("Waiting for the perfect moment","सही पल का इंतज़ार","Sahi pal ka intzaar"),sub:L("Timing the market","मार्केट टाइमिंग","Timing the market"),mins:4,
  beats:{
   sit:L("You're sitting on cash, waiting for the 'right moment' to invest — and the market keeps moving without you.","आप कैश पर बैठे हो, इन्वेस्ट करने के 'सही पल' का इंतज़ार — और मार्केट आपके बिना चलता रहता है।","Aap cash pe baithe ho, invest karne ke 'sahi pal' ka intzaar — aur market aapke bina chalta rehta hai."),
   myth:{lie:L("Smart investors get in at the bottom and out at the top.","स्मार्ट इन्वेस्टर तली पर घुसते और शिखर पर निकलते हैं।","Smart investor tali pe ghuste aur shikhar pe nikalte hain."),truth:L("Reliably timing the market beats almost no one; time IN the market usually beats timing it.","भरोसे से मार्केट टाइम करना लगभग किसी से नहीं होता; मार्केट में समय, टाइमिंग से बेहतर।","Bharose se market time karna lagbhag kisi se nahi hota; market mein samay, timing se behtar.")},
   reflex:L("Waiting for a crash, or trying to buy the dip and sell the peak.","क्रैश का इंतज़ार, या डिप पर खरीद और शिखर पर बेचने की कोशिश।","Crash ka intzaar, ya dip pe khareed aur shikhar pe bechne ki koshish."),
   q:L("Should I wait for the perfect entry?","परफेक्ट एंट्री का इंतज़ार करूँ?","Perfect entry ka intzaar karun?"),
   fw:L("Nobody reliably predicts short-term tops and bottoms — even pros mostly fail. Missing just a few of the best days (which cluster near the worst) can gut long-run returns. A steady SIP (Module 6) sidesteps timing entirely.","कोई भरोसे से छोटे-समय के शिखर-तली नहीं बताता — प्रोज़ भी ज़्यादातर फेल। बस कुछ बेस्ट दिन चूकना (जो सबसे बुरे के पास होते) लॉन्ग-रन रिटर्न चौपट कर सकता। स्थिर SIP टाइमिंग को पूरी तरह टालता है।","Koi bharose se chhote-samay ke shikhar-tali nahi bataata — pros bhi zyadatar fail. Bas kuch best din chookna (jo sabse bure ke paas hote) long-run return chaupat kar sakta. Sthir SIP timing ko poori tarah taalta hai."),
   call:L("Start now and stay invested for your horizon; don't gamble your plan on predicting the market.","अभी शुरू करो और अपने होराइज़न तक टिको; मार्केट भविष्यवाणी पर प्लान मत जुआ खेलो।","Abhi shuru karo aur apne horizon tak tiko; market bhavishyavani pe plan mat jua khelo.")
  },
  dd:{ex:[
   L("Market timing means trying to buy just before a rise and sell just before a fall. It sounds smart, but no one does it reliably — the future is genuinely unpredictable in the short term, and even professionals mostly fail at it. Worse, the market's very best days often come clustered right after the worst ones, in the scariest moments; if you're on the sidelines waiting, you miss them.","मार्केट टाइमिंग यानी उछाल से ठीक पहले खरीद, गिरावट से ठीक पहले बेच। स्मार्ट लगता, पर कोई भरोसे से नहीं करता — छोटे समय में भविष्य सच में अप्रत्याशित। बुरा यह कि बेस्ट दिन अक्सर सबसे बुरे के तुरंत बाद, डरावने पलों में; किनारे बैठे तो चूक जाते।","Market timing yaani uchhaal se theek pehle khareed, giraavat se theek pehle bech. Smart lagta, par koi bharose se nahi karta — chhote samay mein bhavishya sach mein apratyaashit. Bura yeh ki best din aksar sabse bure ke turant baad, daraavne palon mein; kinaare baithe toh chook jaate."),
   L("Studies repeatedly show that missing just a handful of the best days over many years can slash your total return dramatically. That's why 'time IN the market beats timing the market' — being consistently invested matters more than a clever entry. A steady SIP dodges the whole problem: you invest on a schedule regardless of the mood, so you're always present for the good days. Waiting for certainty just guarantees you invest late.","अध्ययन बार-बार दिखाते हैं कि सालों में बस कुछ बेस्ट दिन चूकना कुल रिटर्न भारी घटाता है। इसलिए 'मार्केट में समय, टाइमिंग से बेहतर'। स्थिर SIP पूरी समस्या टालता है: शेड्यूल पर इन्वेस्ट, मूड चाहे जो। निश्चितता का इंतज़ार सिर्फ देर करवाता है।","Adhyayan baar-baar dikhate hain ki saalon mein bas kuch best din chookna kul return bhaari ghataata hai. Isliye 'market mein samay, timing se behtar'. Sthir SIP poori samasya taalta hai: schedule pe invest, mood chahe jo. Nishchitta ka intzaar sirf der karwaata hai.")],
   faq:[
    {q:L("But the market seems high right now?","पर मार्केट अभी ऊँचा लगता है?","Par market abhi ooncha lagta hai?"),a:L("It often feels high, yet keeps rising over the long run. For a long horizon, starting a SIP now beats waiting for a dip that may never obviously come.","अक्सर ऊँचा लगता, फिर भी लंबे में बढ़ता है। लंबे होराइज़न को अभी SIP शुरू करना, डिप के इंतज़ार से बेहतर।","Aksar ooncha lagta, phir bhi lambe mein badhta hai. Lambe horizon ko abhi SIP shuru karna, dip ke intzaar se behtar.")},
    {q:L("What about obvious bubbles?","स्पष्ट बबल का क्या?","Spasht bubble ka kya?"),a:L("They're obvious mostly in hindsight. Diversification and a steady plan protect you better than trying to call the top.","वे ज़्यादातर बाद में स्पष्ट होते। डाइवर्सिफिकेशन और स्थिर प्लान बेहतर बचाते।","Ve zyadatar baad mein spasht hote. Diversification aur sthir plan behtar bachate.")}
   ]},
  terms:[{k:L("Market timing","मार्केट टाइमिंग","Market timing"),d:L("Trying to buy before rises and sell before falls — rarely works.","उछाल से पहले खरीद, गिरावट से पहले बेच — शायद ही चलता।","Uchhaal se pehle khareed, giraavat se pehle bech — shayad hi chalta.")},{k:L("Time in the market","टाइम इन द मार्केट","Time in the market"),d:L("Staying invested through ups and downs — usually beats timing.","उतार-चढ़ाव में टिके रहना — आमतौर पर टाइमिंग से बेहतर।","Utaar-chadhaav mein tike rehna — aam taur pe timing se behtar.")}],
  action:{h:L("The cost of missing the best days","बेस्ट दिन चूकने की कीमत","Best din chookne ki keemat"),p:L("Compare staying fully invested vs missing just the best few days over a long period.","पूरी तरह इन्वेस्टेड रहना बनाम बस कुछ बेस्ट दिन चूकना, लंबे समय में तुलना करो।","Poori tarah invested rehna banaam bas kuch best din chookna, lambe samay mein compare karo."),data:L("A real long-run index series (fetched by the app).","असली लॉन्ग-रन इंडेक्स सीरीज़ (ऐप द्वारा)।","Asli long-run index series (app dwaara).")},
  quiz:[
   {q:L("'Time in the market beats timing' because…","'टाइम इन द मार्केट बेहतर' क्योंकि…","'Time in the market behtar' kyunki…"),o:[L("Timing is easy","टाइमिंग आसान","Timing aasaan"),L("Missing a few best days guts returns","कुछ बेस्ट दिन चूकना रिटर्न चौपट","Kuch best din chookna return chaupat"),L("Markets never fall","मार्केट कभी नहीं गिरते","Market kabhi nahi girte"),L("Cash grows faster","कैश तेज़ बढ़ता","Cash tez badhta")],a:1,why:L("Best days cluster near the worst; being out risks missing them.","बेस्ट दिन सबसे बुरे के पास; बाहर रहना चूक जोखिम।","Best din sabse bure ke paas; baahar rehna chook jokhim.")},
   {q:L("A SIP helps with timing because…","SIP टाइमिंग में मदद करता क्योंकि…","SIP timing mein madad karta kyunki…"),o:[L("It predicts the bottom","तली बताता है","Tali bataata hai"),L("It invests on a schedule regardless of mood","मूड चाहे जो, शेड्यूल पर इन्वेस्ट","Mood chahe jo, schedule pe invest"),L("It avoids all risk","सारा रिस्क टालता","Saara risk taalta"),L("It's guaranteed","गारंटीड","Guaranteed")],a:1,why:L("Investing on a schedule removes the timing decision entirely.","शेड्यूल पर इन्वेस्ट टाइमिंग निर्णय हटा देता है।","Schedule pe invest timing nirnay hata deta hai.")}
  ],
  reflect:L("Is fear of a crash keeping your money on the sidelines?","क्या क्रैश का डर आपका पैसा किनारे रखे है?","Kya crash ka dar aapka paisa kinaare rakhe hai?")},

 {id:"m7l3",title:L("Everyone's in — should I be too?","सब लगे हैं — मैं भी?","Sab lage hain — main bhi?"),sub:L("FOMO & herd behaviour","FOMO और हर्ड बिहेवियर","FOMO & herd behaviour"),mins:4,
  beats:{
   sit:L("Everyone in your group chat is 'making money' on the same trending thing; you feel left behind.","आपके ग्रुप चैट में सब उसी ट्रेंडिंग चीज़ पर 'पैसा बना रहे'; आप पीछे छूटा महसूस करते हो।","Aapke group chat mein sab usi trending cheez pe 'paisa bana rahe'; aap peeche chhoota mehsoos karte ho."),
   myth:{lie:L("If everyone's rushing in, it must be a good opportunity.","अगर सब कूद रहे हैं, तो अच्छा मौका होगा।","Agar sab kood rahe hain, toh achha mauka hoga."),truth:L("Herd euphoria often marks the top; FOMO makes you buy high, late, and unquestioningly.","हर्ड यूफोरिया अक्सर शिखर का निशान; FOMO आपको महँगे में, देर से, बिना सवाल खरीदवाता है।","Herd euphoria aksar shikhar ka nishaan; FOMO aapko mehnge mein, der se, bina sawaal khareedvaata hai.")},
   reflex:L("Buying because everyone else is, not because it fits you.","सब खरीद रहे इसलिए खरीदना, फिट होने से नहीं।","Sab khareed rahe isliye khareedna, fit hone se nahi."),
   q:L("Everyone's in — should I be too?","सब लगे हैं — मैं भी लगूँ?","Sab lage hain — main bhi lagun?"),
   fw:L("<b>Herd behaviour</b> = following the crowd; <b>FOMO</b> = fear of missing out. By the time something is everywhere and everyone's euphoric, prices are often stretched and you're the late money — arriving right before the drop. Decide by your plan, not the crowd's mood.","<b>हर्ड बिहेवियर</b> = भीड़ का पीछा; <b>FOMO</b> = छूट जाने का डर। जब तक कोई चीज़ हर जगह और सब यूफोरिक, दाम अक्सर खिंचे और आप देर का पैसा — गिरावट से ठीक पहले। प्लान से तय करो, भीड़ के मूड से नहीं।","<b>Herd behaviour</b> = bheed ka peechha; <b>FOMO</b> = chhoot jaane ka dar. Jab tak koi cheez har jagah aur sab euphoric, daam aksar khinche aur aap der ka paisa — giraavat se theek pehle. Plan se tay karo, bheed ke mood se nahi."),
   call:L("Judge any hyped thing against your own goals and risk; a crowd is not analysis.","किसी भी हाइप्ड चीज़ को अपने गोल और रिस्क से जज करो; भीड़ विश्लेषण नहीं।","Kisi bhi hyped cheez ko apne goal aur risk se judge karo; bheed vishleshan nahi.")
  },
  dd:{ex:[
   L("Humans are wired to follow the crowd — if everyone's doing something, it feels safe and right. FOMO adds fuel: watching others (or claiming to) make quick money triggers a fear of being left behind, and that fear overrides careful thinking. Together they push you to buy something not because it fits your plan, but because everyone else is.","इंसान भीड़ का पीछा करने को बने हैं — सब कर रहे तो सेफ लगता। FOMO ईंधन जोड़ता: दूसरों को जल्दी पैसा बनाते देख (या दावा) छूटने का डर, जो सोच पर हावी। दोनों मिलकर प्लान से नहीं, बाकी सब कर रहे इसलिए खरीदवाते।","Insaan bheed ka peechha karne ko bane hain — sab kar rahe toh safe lagta. FOMO eendhan jodta: doosron ko jaldi paisa banaate dekh (ya daava) chhootne ka dar, jo soch pe haavi. Dono milkar plan se nahi, baaki sab kar rahe isliye khareedvaate."),
   L("The trap: by the time something is on every group chat and everyone's euphoric, the easy gains are usually gone and prices are stretched — you're the 'late money' that often arrives just before the fall. The crowd feels like safety but is frequently a warning sign near a peak. Real protection is judging any opportunity against YOUR goals, horizon and risk — a crowd's excitement is emotion, not analysis.","जाल: जब तक हर ग्रुप चैट पर और सब यूफोरिक, आसान लाभ जा चुके और दाम खिंचे — आप 'देर का पैसा' अक्सर गिरावट से ठीक पहले। भीड़ सेफ्टी लगती पर शिखर के पास चेतावनी। असली बचाव: हर मौके को अपने गोल, होराइज़न, रिस्क से जज।","Jaal: jab tak har group chat pe aur sab euphoric, aasaan laabh ja chuke aur daam khinche — aap 'der ka paisa' aksar giraavat se theek pehle. Bheed safety lagti par shikhar ke paas chetaavni. Asli bachaav: har mauke ko apne goal, horizon, risk se judge.")],
   faq:[
    {q:L("But sometimes the crowd is right?","पर कभी-कभी भीड़ सही होती है?","Par kabhi-kabhi bheed sahi hoti hai?"),a:L("Sometimes — but you can't tell which time from inside the hype. Judging by your own plan protects you when the crowd is wrong.","कभी — पर हाइप के अंदर से पता नहीं चलता। अपने प्लान से जज करना गलत भीड़ से बचाता है।","Kabhi — par hype ke andar se pata nahi chalta. Apne plan se judge karna galat bheed se bachata hai.")},
    {q:L("How do I resist FOMO?","FOMO का विरोध कैसे करूँ?","FOMO ka virodh kaise karun?"),a:L("Pause and ask 'does this fit MY goal and risk?' If the only reason is 'everyone's in', that's your answer.","रुककर पूछो 'क्या यह मेरे गोल और रिस्क से फिट?' अगर कारण सिर्फ 'सब लगे हैं', वही जवाब।","Rukkar poocho 'kya yeh mere goal aur risk se fit?' Agar kaaran sirf 'sab lage hain', wahi jawaab.")}
   ]},
  terms:[{k:L("Herd behaviour","हर्ड बिहेवियर","Herd behaviour"),d:L("Following the crowd instead of your own judgment.","अपने विवेक की जगह भीड़ का पीछा।","Apne vivek ki jagah bheed ka peechha.")},{k:L("FOMO","FOMO","FOMO"),d:L("Fear of missing out — buying from anxiety, not analysis.","छूट जाने का डर — चिंता से खरीदना, विश्लेषण से नहीं।","Chhoot jaane ka dar — chinta se khareedna, vishleshan se nahi.")}],
  action:{h:L("Recall a hype cycle","एक हाइप साइकल याद करो","Ek hype cycle yaad karo"),p:L("Think of a past craze everyone rushed into — note what happened to late buyers after the peak.","एक पुराने क्रेज़ को याद करो जिसमें सब कूदे — शिखर के बाद देर वालों का क्या हुआ नोट करो।","Ek purane craze ko yaad karo jismein sab koode — shikhar ke baad der walon ka kya hua note karo."),data:L("Your own recollection (reflection).","आपकी अपनी याद (रिफ्लेक्शन)।","Aapki apni yaad (reflection).")},
  quiz:[
   {q:L("Widespread euphoria about an asset often signals…","किसी एसेट पर व्यापक यूफोरिया अक्सर संकेत…","Kisi asset pe vyaapak euphoria aksar sanket…"),o:[L("A safe, sure thing","सेफ, पक्की चीज़","Safe, pakki cheez"),L("Stretched prices near a top","शिखर के पास खिंचे दाम","Shikhar ke paas khinche daam"),L("Guaranteed gains","पक्का फायदा","Pakka fayda"),L("Lower risk","कम रिस्क","Kam risk")],a:1,why:L("By peak euphoria, prices are often stretched and you're the late money.","शिखर यूफोरिया पर दाम खिंचे और आप देर का पैसा।","Shikhar euphoria pe daam khinche aur aap der ka paisa.")},
   {q:L("The antidote to FOMO is…","FOMO का इलाज…","FOMO ka ilaaj…"),o:[L("Follow the loudest chat","सबसे तेज़ चैट फॉलो","Sabse tez chat follow"),L("Judge by your own goals & risk","अपने गोल और रिस्क से जज","Apne goal aur risk se judge"),L("Buy faster than others","सबसे तेज़ खरीदो","Sabse tez khareedo"),L("Borrow to keep up","साथ रहने को उधार","Saath rehne ko udhaar")],a:1,why:L("Your plan is analysis; the crowd's mood is just emotion.","आपका प्लान विश्लेषण; भीड़ का मूड भावना।","Aapka plan vishleshan; bheed ka mood bhaavna.")}
  ],
  reflect:L("What's the last thing you almost bought purely from FOMO?","आखिरी बार FOMO में क्या लगभग खरीद लिया था?","Aakhri baar FOMO mein kya lagbhag khareed liya tha?")},

 {id:"m7l4",title:L("Checking 15 times a day","दिन में 15 बार चेक","Din mein 15 baar check"),sub:L("Over-monitoring & the anxiety tax","ओवर-मॉनिटरिंग और चिंता टैक्स","Over-monitoring & anxiety tax"),mins:4,
  beats:{
   sit:L("You check your portfolio 15 times a day; every red tick ruins your mood and tempts you to act.","आप दिन में 15 बार पोर्टफोलियो देखते हो; हर लाल टिक मूड बिगाड़ता और action का लालच देता।","Aap din mein 15 baar portfolio dekhte ho; har laal tick mood bigaadta aur action ka laalach deta."),
   myth:{lie:L("Watching closely keeps me in control.","करीब से देखना मुझे कंट्रोल में रखता है।","Kareeb se dekhna mujhe control mein rakhta hai."),truth:L("Constant checking mostly breeds anxiety and impulsive decisions — not control.","लगातार चेकिंग ज़्यादातर चिंता और आवेगी फैसले देती — कंट्रोल नहीं।","Lagataar checking zyadatar chinta aur aavegi faisle deti — control nahi.")},
   reflex:L("Refreshing the app obsessively.","जुनूनी तरीके से ऐप रिफ्रेश करना।","Junooni tareeke se app refresh karna."),
   q:L("Is watching all the time helping or hurting?","हर समय देखना मदद कर रहा या नुकसान?","Har samay dekhna madad kar raha ya nuksaan?"),
   fw:L("For a long-term plan, daily price noise is meaningless but emotionally loud — it triggers the urge to tinker, chase, or panic-sell (the behaviour gap, Module 5). Less looking usually means better behaviour. Set a review cadence (Module 6) and otherwise leave it alone.","लॉन्ग-टर्म प्लान के लिए रोज़ का दाम-शोर बेमतलब पर भावनात्मक रूप से तेज़ — छेड़छाड़, चेज़, panic-sell का लालच (बिहेवियर गैप)। कम देखना = बेहतर व्यवहार। कैडेंस सेट करो, बाकी छोड़ दो।","Long-term plan ke liye roz ka daam-shor bematlab par bhaavnaatmak roop se tez — chhedchhaad, chase, panic-sell ka laalach (behaviour gap). Kam dekhna = behtar vyavhaar. Cadence set karo, baaki chhod do."),
   call:L("Check on a schedule, not on impulse — your calm is part of your return.","शेड्यूल पर चेक करो, आवेग पर नहीं — आपकी शांति रिटर्न का हिस्सा है।","Schedule pe check karo, aaveg pe nahi — aapki shaanti return ka hissa hai.")
  },
  dd:{ex:[
   L("Prices bounce around every day for reasons that mean nothing to a 15-year goal. But each red flicker feels urgent and personal, so constant checking floods you with emotionally-charged noise. That noise doesn't inform you — it agitates you, feeding the itch to 'do something': tinker with the plan, chase a rising thing, or sell in fear. This gap between a good plan and bad behaviour is where most returns are actually lost (Module 5).","दाम रोज़ ऐसे कारणों से उछलते जो 15-साल गोल के लिए बेमतलब। पर हर लाल झलक ज़रूरी और निजी लगती, तो लगातार चेकिंग भावनात्मक शोर भरती। वो शोर सूचित नहीं करता — उकसाता है, 'कुछ करो' की खुजली देता। यहीं ज़्यादातर रिटर्न खोता।","Daam roz aise kaaranon se uchhalte jo 15-saal goal ke liye bematlab. Par har laal jhalak zaroori aur niji lagti, toh lagataar checking bhaavnaatmak shor bharti. Woh shor soochit nahi karta — uksaata hai, 'kuch karo' ki khujli deta. Yahin zyadatar return khota."),
   L("The counterintuitive truth: for a long-term investor, looking LESS usually produces better results, because it removes the temptation to act on noise. Combine automation for the day-to-day (Module 6) with a scheduled review every few months, and deliberately ignore the ticker in between. Your discipline and calm aren't just nice-to-haves — they directly protect your returns from your own worst impulses.","विरोधाभासी सच: लॉन्ग-टर्म के लिए कम देखना अक्सर बेहतर नतीजा, क्योंकि शोर पर action का लालच हटता। ऑटोमेशन + हर कुछ महीने रिव्यू, बीच में जानबूझकर टिकर अनदेखा। आपका अनुशासन और शांति सीधे रिटर्न बचाते।","Virodhaabhaasi sach: long-term ke liye kam dekhna aksar behtar natija, kyunki shor pe action ka laalach hatta. Automation + har kuch mahine review, beech mein jaanboojhkar ticker andekha. Aapka anushaasan aur shaanti seedhe return bachate.")],
   faq:[
    {q:L("But shouldn't I stay informed?","पर क्या सूचित न रहूँ?","Par kya soochit na rahun?"),a:L("Informed about your goals and plan, yes — informed about every daily tick, no. That's noise, not information.","गोल और प्लान के बारे में हाँ — हर रोज़ के टिक के बारे में नहीं। वो शोर है।","Goal aur plan ke baare mein haan — har roz ke tick ke baare mein nahi. Woh shor hai.")},
    {q:L("What if something's really wrong?","अगर सच में कुछ गलत हो?","Agar sach mein kuch galat ho?"),a:L("Real problems (a goal off-track, a stopped SIP) show up in your scheduled review — not in the minute-by-minute price.","असली दिक्कतें शेड्यूल्ड रिव्यू में दिखेंगी — मिनट-दर-मिनट दाम में नहीं।","Asli dikkatein scheduled review mein dikhengi — minute-dar-minute daam mein nahi.")}
   ]},
  terms:[{k:L("Noise vs signal","शोर बनाम सिग्नल","Noise vs signal"),d:L("Daily price wiggles (noise) vs what actually matters to your plan (signal).","रोज़ की हलचल (शोर) बनाम प्लान के लिए जो मायने रखे (सिग्नल)।","Roz ki halchal (shor) banaam plan ke liye jo maayne rakhe (signal).")},{k:L("Behaviour gap","बिहेवियर गैप","Behaviour gap"),d:L("Returns lost to acting on emotion instead of holding the plan.","भावना पर action से खोया रिटर्न, प्लान थामे रहने के बजाय।","Bhaavna pe action se khoya return, plan thaame rehne ke bajaaye.")}],
  action:{h:L("A 'don't-check' rule","एक 'न-चेक' नियम","Ek 'na-check' niyam"),p:L("Note how many times a day you currently check, then set a 'do not check between reviews' rule.","नोट करो दिन में कितनी बार चेक करते हो, फिर 'रिव्यू के बीच न देखने' का नियम सेट करो।","Note karo din mein kitni baar check karte ho, phir 'review ke beech na dekhne' ka niyam set karo."),data:L("Your self-reported checking habit (user-entered).","आपकी बताई चेकिंग आदत (यूज़र-डाला)।","Aapki bataai checking aadat (user-entered).")},
  quiz:[
   {q:L("For a long-term plan, checking daily mostly…","लॉन्ग-टर्म प्लान के लिए रोज़ चेक करना ज़्यादातर…","Long-term plan ke liye roz check karna zyadatar…"),o:[L("Improves returns","रिटर्न सुधारता","Return sudhaarta"),L("Breeds anxiety and impulsive acts","चिंता और आवेगी काम देता","Chinta aur aavegi kaam deta"),L("Lowers taxes","टैक्स घटाता","Tax ghataata"),L("Does nothing","कुछ नहीं","Kuch nahi")],a:1,why:L("Daily noise triggers emotion — the enemy of a long-term plan.","रोज़ का शोर भावना जगाता — प्लान का दुश्मन।","Roz ka shor bhaavna jagaata — plan ka dushman.")},
   {q:L("For a long-term investor, looking less usually…","लॉन्ग-टर्म इन्वेस्टर के लिए कम देखना आमतौर पर…","Long-term investor ke liye kam dekhna aam taur pe…"),o:[L("Hurts results","नतीजे बिगाड़ता","Natije bigaadta"),L("Improves behaviour and results","व्यवहार और नतीजे सुधारता","Vyavhaar aur natije sudhaarta"),L("Is impossible","असंभव","Asambhav"),L("Raises fees","फीस बढ़ाता","Fee badhaata")],a:1,why:L("Less noise means fewer impulsive mistakes — better behaviour, better outcomes.","कम शोर = कम आवेगी गलती।","Kam shor = kam aavegi galti.")}
  ],
  reflect:L("How does checking your portfolio actually make you feel?","पोर्टफोलियो चेक करना असल में आपको कैसा महसूस कराता है?","Portfolio check karna asal mein aapko kaisa mehsoos karaata hai?")},

 {id:"m7l5",title:L("Guaranteed 3% a month?","गारंटीड 3% महीना?","Guaranteed 3% mahina?"),sub:L("Scam & Ponzi red flags","स्कैम और पोंज़ी रेड फ्लैग","Scam & Ponzi red flags"),mins:5,
  beats:{
   sit:L("A slick message promises 'guaranteed 3% per month, refer friends for a bonus, limited slots'.","एक चिकनी मैसेज वादा करती है 'गारंटीड 3% हर महीना, दोस्तों को रेफर करो बोनस, सीमित स्लॉट'।","Ek chikni message vaada karti hai 'guaranteed 3% har mahina, doston ko refer karo bonus, seemit slot'."),
   myth:{lie:L("High guaranteed returns from a confident source must be legit.","कॉन्फिडेंट स्रोत से हाई गारंटीड रिटर्न असली होगा।","Confident source se high guaranteed return asli hoga."),truth:L("Guaranteed high returns + urgency + referral bonuses are classic scam/Ponzi red flags.","गारंटीड हाई रिटर्न + अर्जेंसी + रेफरल बोनस क्लासिक स्कैम/पोंज़ी रेड फ्लैग।","Guaranteed high return + urgency + referral bonus classic scam/Ponzi red flag.")},
   reflex:L("Trusting confidence, testimonials, or a friend's referral over the red flags.","रेड फ्लैग के बजाय कॉन्फिडेंस, टेस्टिमोनियल, दोस्त के रेफरल पर भरोसा।","Red flag ke bajaye confidence, testimonial, dost ke referral pe bharosa."),
   q:L("Is this a real opportunity or a scam?","यह असली मौका है या स्कैम?","Yeh asli mauka hai ya scam?"),
   fw:L("Red flags: <b>guaranteed high returns</b> (no real investment can), <b>pressure/urgency</b>, <b>'refer to earn'</b> (a Ponzi hallmark — old investors paid by new), vague strategy, unregistered operators. If it can't survive slow scrutiny and independent checks, walk away. Verify the entity with the regulator.","रेड फ्लैग: <b>गारंटीड हाई रिटर्न</b> (कोई असली इन्वेस्टमेंट नहीं दे सकता), <b>दबाव/अर्जेंसी</b>, <b>'रेफर करो कमाओ'</b> (पोंज़ी पहचान — पुराने को नए से भुगतान), धुंधली रणनीति, अपंजीकृत। धीमी जाँच न झेले तो छोड़ो। रेगुलेटर से सत्यापित करो।","Red flag: <b>guaranteed high return</b> (koi asli investment nahi de sakta), <b>dabaav/urgency</b>, <b>'refer karo kamao'</b> (Ponzi pehchaan — purane ko naye se bhugtaan), dhundhli ranneeti, apanjeekrit. Dheemi jaanch na jhele toh chhodo. Regulator se satyaapit karo."),
   call:L("No legitimate investment guarantees high returns or needs you to hurry — treat those as automatic no's, and report or avoid.","कोई असली इन्वेस्टमेंट हाई रिटर्न की गारंटी या जल्दी नहीं माँगता — इन्हें अपने आप 'ना' मानो, रिपोर्ट या टालो।","Koi asli investment high return ki guarantee ya jaldi nahi maangta — inhe apne aap 'na' maano, report ya taalo.")
  },
  dd:{ex:[
   L("Learn this checklist and you'll dodge most financial frauds for life. The big red flags: (1) guaranteed high returns — impossible for any genuine investment, since real returns are uncertain; (2) pressure and urgency ('limited slots, act now') to stop you thinking; (3) 'refer friends to earn' — the signature of a Ponzi, where returns come not from investing but from new people's money; (4) a vague or secret 'strategy'; (5) operators not registered with the regulator.","यह चेकलिस्ट सीखो और ज़िंदगीभर ज़्यादातर फ्रॉड से बचोगे। बड़े रेड फ्लैग: (1) गारंटीड हाई रिटर्न — असली के लिए असंभव; (2) दबाव और अर्जेंसी सोचने से रोकने को; (3) 'दोस्त रेफर करो कमाओ' — पोंज़ी की पहचान; (4) धुंधली/गुप्त रणनीति; (5) रेगुलेटर से अपंजीकृत।","Yeh checklist seekho aur zindagi-bhar zyadatar fraud se bachoge. Bade red flag: (1) guaranteed high return — asli ke liye asambhav; (2) dabaav aur urgency sochne se rokne ko; (3) 'dost refer karo kamao' — Ponzi ki pehchaan; (4) dhundhli/gupt ranneeti; (5) regulator se apanjeekrit."),
   L("A Ponzi scheme survives only by paying old investors with new investors' money — which is exactly why early 'members' really do get paid (that's the bait) and why referrals are pushed so hard. It works until new money slows, then collapses, and most people lose everything. Your defence is simple and boring: never invest on urgency, verify the operator's registration with the regulator (like SEBI/RBI) yourself, and if returns are 'guaranteed' and high, treat it as fake by default. (verify registration/rules before relying on this)","पोंज़ी सिर्फ पुराने को नए के पैसे से भुगतान करके टिकता — इसीलिए शुरुआती 'मेंबर' सच में पैसे पाते (यही चारा) और रेफरल इतना धकेला जाता। नया पैसा धीमा होते ढह जाता, ज़्यादातर सब खोते। बचाव: अर्जेंसी पर कभी नहीं, रजिस्ट्रेशन खुद सत्यापित। (verify registration/rules)","Ponzi sirf purane ko naye ke paise se bhugtaan karke tikta — isiliye shuruaati 'member' sach mein paise paate (yahi chaara) aur referral itna dhakela jaata. Naya paisa dheema hote dheh jaata, zyadatar sab khote. Bachaav: urgency pe kabhi nahi, registration khud satyaapit. (verify registration/rules)")],
   faq:[
    {q:L("But I saw people actually getting paid?","पर मैंने लोगों को सच में पैसे पाते देखा?","Par maine logon ko sach mein paise paate dekha?"),a:L("That's the trap — early payouts (from new members' money) exist to lure you and referrers. The collapse comes later, for the majority.","यही जाल — शुरुआती भुगतान (नए के पैसे से) लुभाने को। ढहना बाद में, बहुमत के लिए।","Yahi jaal — shuruaati bhugtaan (naye ke paise se) lubhaane ko. Dhehna baad mein, bahumat ke liye.")},
    {q:L("How do I verify something's legit?","असली है यह कैसे सत्यापित करूँ?","Asli hai yeh kaise satyaapit karun?"),a:L("Check the operator's registration on the regulator's official site, search for complaints, and never rely on their own claims or a friend's word.","रेगुलेटर की आधिकारिक साइट पर रजिस्ट्रेशन देखो, शिकायतें सर्च करो, उनके दावे/दोस्त पर भरोसा नहीं।","Regulator ki aadhikaarik site pe registration dekho, shikaayatein search karo, unke daave/dost pe bharosa nahi.")}
   ]},
  terms:[{k:L("Ponzi scheme","पोंज़ी स्कीम","Ponzi scheme"),d:L("A fraud that pays old investors with new investors' money until it collapses.","एक फ्रॉड जो पुराने को नए के पैसे से भुगतान करे, फिर ढह जाए।","Ek fraud jo purane ko naye ke paise se bhugtaan kare, phir dheh jaaye.")},{k:L("Due diligence","ड्यू डिलिजेंस","Due diligence"),d:L("Independently checking the facts before you invest.","इन्वेस्ट से पहले खुद तथ्य जाँचना।","Invest se pehle khud tathya jaanchna.")}],
  action:{h:L("Count the red flags","रेड फ्लैग गिनो","Red flag gino"),p:L("Run a suspicious 'offer' through the red-flag checklist and count how many it trips.","एक संदिग्ध 'ऑफर' को रेड-फ्लैग चेकलिस्ट से चलाओ और गिनो कितने ट्रिगर होते।","Ek sandigdh 'offer' ko red-flag checklist se chalao aur gino kitne trigger hote."),data:L("The offer's details (user-entered).","ऑफर की डिटेल (यूज़र-डाला)।","Offer ki detail (user-entered).")},
  quiz:[
   {q:L("Which is a classic scam/Ponzi red flag?","कौन सा क्लासिक स्कैम/पोंज़ी रेड फ्लैग?","Kaunsa classic scam/Ponzi red flag?"),o:[L("Uncertain, variable returns","अनिश्चित, बदलते रिटर्न","Anishchit, badalte return"),L("Guaranteed high returns + 'refer to earn'","गारंटीड हाई रिटर्न + 'रेफर कमाओ'","Guaranteed high return + 'refer kamao'"),L("Registered with the regulator","रेगुलेटर से पंजीकृत","Regulator se panjeekrit"),L("A clear, public strategy","स्पष्ट, सार्वजनिक रणनीति","Spasht, saarvajanik ranneeti")],a:1,why:L("Guaranteed high returns are impossible; 'refer to earn' is a Ponzi hallmark.","गारंटीड हाई रिटर्न असंभव; 'रेफर कमाओ' पोंज़ी पहचान।","Guaranteed high return asambhav; 'refer kamao' Ponzi pehchaan.")},
   {q:L("The safest response to urgency + guarantees is…","अर्जेंसी + गारंटी का सबसे सुरक्षित जवाब…","Urgency + guarantee ka sabse surakshit jawaab…"),o:[L("Invest before slots fill","स्लॉट भरने से पहले इन्वेस्ट","Slot bharne se pehle invest"),L("Treat it as fake and verify independently","फेक मानो और खुद सत्यापित करो","Fake maano aur khud satyaapit karo"),L("Refer friends fast","जल्दी दोस्त रेफर","Jaldi dost refer"),L("Borrow to join","जुड़ने को उधार","Judne ko udhaar")],a:1,why:L("No real investment guarantees returns or rushes you — verify with the regulator.","कोई असली इन्वेस्टमेंट गारंटी/जल्दी नहीं — रेगुलेटर से सत्यापित।","Koi asli investment guarantee/jaldi nahi — regulator se satyaapit.")}
  ],
  reflect:L("Have you or someone you know been pitched something like this?","आपको या किसी परिचित को ऐसा कुछ ऑफर हुआ है?","Aapko ya kisi parichit ko aisa kuch offer hua hai?")},

 {id:"m7l6",title:L("The market's crashing — get out?","मार्केट क्रैश — निकल जाऊँ?","Market crash — nikal jaun?"),sub:L("Panic selling","पैनिक सेलिंग","Panic selling"),mins:4,
  beats:{
   sit:L("The market crashed 25%, the news is scary, and you sold everything to 'stop the bleeding'. Then it recovered.","मार्केट 25% गिरा, न्यूज़ डरावनी, और आपने 'नुकसान रोकने' को सब बेच दिया। फिर वो रिकवर हो गया।","Market 25% gira, news daraavni, aur aapne 'nuksaan rokne' ko sab bech diya. Phir woh recover ho gaya."),
   myth:{lie:L("Selling in a crash protects me.","क्रैश में बेचना मुझे बचाता है।","Crash mein bechna mujhe bachata hai."),truth:L("Panic-selling locks in the loss and usually makes you miss the recovery — the single most expensive mistake.","पैनिक-सेलिंग नुकसान पक्का करती और अक्सर रिकवरी छुड़ाती — सबसे महँगी गलती।","Panic-selling nuksaan pakka karti aur aksar recovery chhudaati — sabse mehngi galti.")},
   reflex:L("Selling at the bottom out of fear, then buying back higher.","डर में तली पर बेचना, फिर महँगे में वापस खरीदना।","Dar mein tali pe bechna, phir mehnge mein wapas khareedna."),
   q:L("The market's crashing — should I get out?","मार्केट क्रैश हो रहा — निकल जाऊँ?","Market crash ho raha — nikal jaun?"),
   fw:L("A crash is a <b>paper</b> loss until you sell (Module 5). Selling turns it permanent AND you typically miss the rebound that follows, then re-enter higher — a double loss. The urge is strongest exactly when acting on it is worst. That's why you set risk to your sleep test and decide your rule in calm times.","क्रैश बेचने तक <b>कागज़ी</b> नुकसान (मॉड्यूल 5)। बेचना उसे स्थायी बनाता और आप रिबाउंड चूकते, फिर महँगे में वापस — दोहरा नुकसान। लालच सबसे तेज़ तभी जब action सबसे बुरा। इसलिए रिस्क नींद टेस्ट से, नियम शांति में तय।","Crash bechne tak <b>kaagzi</b> nuksaan (Module 5). Bechna use sthaayi banata aur aap rebound chookte, phir mehnge mein wapas — dohra nuksaan. Laalach sabse tez tabhi jab action sabse bura. Isliye risk neend test se, niyam shaanti mein tay."),
   call:L("If your goals and horizon haven't changed, a crash is not a reason to sell; hold your plan. Decide this now, not mid-panic.","अगर गोल और होराइज़न नहीं बदले, क्रैश बेचने का कारण नहीं; प्लान थामो। यह अभी तय करो, पैनिक के बीच नहीं।","Agar goal aur horizon nahi badle, crash bechne ka kaaran nahi; plan thaamo. Yeh abhi tay karo, panic ke beech nahi.")
  },
  dd:{ex:[
   L("A crash on your screen is a paper loss — real only if you sell. Panic-selling does two damaging things at once: it converts that temporary loss into a permanent one, and it puts you on the sidelines for the recovery, which historically has followed crashes given time. Most people who bail then re-enter later at higher prices — selling low and buying high, the exact opposite of the goal. It's the most expensive single move in investing.","स्क्रीन पर क्रैश कागज़ी नुकसान — असली तभी जब बेचो। पैनिक-सेलिंग दो नुकसान एक साथ: अस्थायी को स्थायी बनाती, और रिकवरी के लिए किनारे कर देती। ज़्यादातर बेचकर बाद में महँगे में वापस — सस्ते में बेच, महँगे में खरीद। सबसे महँगी चाल।","Screen pe crash kaagzi nuksaan — asli tabhi jab becho. Panic-selling do nuksaan ek saath: asthaayi ko sthaayi banati, aur recovery ke liye kinaare kar deti. Zyadatar bechkar baad mein mehnge mein wapas — saste mein bech, mehnge mein khareed. Sabse mehngi chaal."),
