   L("Willpower alone fades, and doing everything privately makes it easy to quietly quit your plan when motivation dips. A squad fixes this — but only the right kind of social. The good kind is accountability: shared streaks, checking in that everyone did their quarterly review, and talking each other OUT of panic-selling during a crash. It makes the boring, winning behaviours feel shared and sustainable.","अकेली विलपावर घटती, और सब निजी करने से मोटिवेशन गिरते चुपचाप प्लान छोड़ना आसान। स्क्वाड इसे ठीक करती — पर सिर्फ सही सोशल। अच्छी: जवाबदेही — साझा स्ट्रीक, तिमाही रिव्यू, क्रैश में एक-दूसरे को बेचने से रोकना।","Akeli willpower ghatti, aur sab niji karne se motivation girte chupchaap plan chhodna aasaan. Squad ise theek karti — par sirf sahi social. Achhi: jawaabdehi — saajha streak, timaahi review, crash mein ek-doosre ko bechne se rokna."),
   L("The dangerous kind of social is exactly what Module 7 warned about: copying each other's picks, hyping the same trending thing, and feeding each other's FOMO. The rule is simple — keep the DISCIPLINE social and keep the DECISIONS your own. Your squad should help you stay the course you designed, never tell you what to buy. Since your first audience really is your friends, this is your superpower: turn the group into a force for consistency, not a herd.","खतरनाक सोशल वही जिससे M7 ने चेताया: एक-दूसरे की पिक्स नकल, वही ट्रेंडिंग हाइप, आपसी FOMO। नियम: अनुशासन सोशल, फैसले अपने। स्क्वाड आपके बनाए रास्ते पर टिकाए, क्या खरीदना कभी न बताए।","Khatarnaak social wahi jisse M7 ne chetaaya: ek-doosre ki picks nakal, wahi trending hype, aapsi FOMO. Niyam: anushaasan social, faisle apne. Squad aapke banaaye raaste pe tikaaye, kya khareedna kabhi na bataaye.")],
   faq:[
    {q:L("Won't friends push me into hype?","क्या दोस्त हाइप में धकेलेंगे?","Kya dost hype mein dhakelenge?"),a:L("They can — which is why you agree upfront: this squad is for accountability and staying the course, not tips. Decisions stay individual.","धकेल सकते — इसलिए पहले तय: यह स्क्वाड जवाबदेही के लिए, टिप नहीं। फैसले अलग।","Dhakel sakte — isliye pehle tay: yeh squad jawaabdehi ke liye, tip nahi. Faisle alag.")},
    {q:L("Who should be in my squad?","स्क्वाड में कौन हो?","Squad mein kaun ho?"),a:L("People who'll cheer your discipline and talk you off a ledge in a crash — not the loudest tipsters.","जो आपके अनुशासन को सराहें और क्रैश में रोकें — सबसे तेज़ टिप वाले नहीं।","Jo aapke anushaasan ko saraahein aur crash mein rokein — sabse tez tip wale nahi.")}
   ]},
  terms:[{k:L("Accountability","जवाबदेही","Accountability"),d:L("A social nudge that keeps you doing what you planned.","एक सोशल धक्का जो आपको प्लान पर बनाए रखे।","Ek social dhakka jo aapko plan pe banaaye rakhe.")},{k:L("Herd behaviour","हर्ड बिहेवियर","Herd behaviour"),d:L("Following the crowd's picks — the bad kind of social to avoid.","भीड़ की पिक्स का पीछा — बचने वाली बुरी सोशल।","Bheed ki picks ka peechha — bachne wali buri social.")}],
  action:{h:L("Set a squad focus","स्क्वाड फोकस सेट करो","Squad focus set karo"),p:L("Open the Squad tab and set a shared streak or 'everyone reviews this quarter' challenge — accountability, not tips.","स्क्वाड टैब खोलो और एक साझा स्ट्रीक या 'सब इस तिमाही रिव्यू' चैलेंज सेट करो — जवाबदेही, टिप नहीं।","Squad tab kholo aur ek saajha streak ya 'sab is timaahi review' challenge set karo — jawaabdehi, tip nahi."),data:L("Your squad activity (in-app).","आपकी स्क्वाड गतिविधि (ऐप में)।","Aapki squad gatividhi (app mein).")},
  quiz:[
   {q:L("The GOOD use of a squad is…","स्क्वाड का अच्छा इस्तेमाल…","Squad ka achha istemal…"),o:[L("Copying each other's picks","एक-दूसरे की पिक्स नकल","Ek-doosre ki picks nakal"),L("Accountability & staying the course","जवाबदेही और टिके रहना","Jawaabdehi aur tike rehna"),L("Hyping trends together","साथ ट्रेंड हाइप","Saath trend hype"),L("Racing to buy first","पहले खरीदने की रेस","Pehle khareedne ki race")],a:1,why:L("Social discipline reinforces the winning behaviours; tips don't.","सोशल अनुशासन जीतने वाले व्यवहार मज़बूत करता; टिप नहीं।","Social anushaasan jeetne wale vyavhaar mazboot karta; tip nahi.")},
   {q:L("Decisions about what to buy should stay…","क्या खरीदना उसके फैसले रहें…","Kya khareedna uske faisle rahein…"),o:[L("With the group","ग्रुप के साथ","Group ke saath"),L("Your own","आपके अपने","Aapke apne"),L("With the loudest friend","सबसे तेज़ दोस्त के साथ","Sabse tez dost ke saath"),L("Random","बेतरतीब","Betarteeb")],a:1,why:L("Keep discipline social but decisions individual — avoid the herd (M7).","अनुशासन सोशल, फैसले अपने — भीड़ से बचो।","Anushaasan social, faisle apne — bheed se bacho.")}
  ],
  reflect:L("Who could keep you accountable without pushing tips?","कौन आपको बिना टिप दिए जवाबदेह रख सकता है?","Kaun aapko bina tip diye jawaabdeh rakh sakta hai?")},

 {id:"m9l6",title:L("Graduation — the call is yours","ग्रेजुएशन — फैसला आपका","Graduation — faisla aapka"),sub:L("You can now reason it yourself","अब आप खुद सोच सकते हो","Ab aap khud soch sakte ho"),mins:5,
  beats:{
   sit:L("You started unsure and dependent on tips; now you can reason about your own money.","आप अनिश्चित और टिप पर निर्भर शुरू हुए; अब अपने पैसे पर खुद सोच सकते हो।","Aap anishchit aur tip pe nirbhar shuru hue; ab apne paise pe khud soch sakte ho."),
   myth:{lie:L("I still need someone to tell me what to buy.","मुझे अब भी कोई चाहिए जो बताए क्या खरीदूँ।","Mujhe ab bhi koi chahiye jo bataaye kya khareedun."),truth:L("You now have the frameworks to make your own calls — that's the whole point of this course.","अब आपके पास अपने फैसले लेने के फ्रेमवर्क हैं — यही इस कोर्स का पूरा मकसद।","Ab aapke paas apne faisle lene ke framework hain — yahi is course ka poora maqsad.")},
   reflex:L("Reaching for a guru instead of trusting your own reasoning.","अपनी सोच पर भरोसे की जगह गुरु ढूंढना।","Apni soch pe bharose ki jagah guru dhoondhna."),
   q:L("Am I actually ready to run my own money?","क्या मैं सच में अपना पैसा चलाने को तैयार हूँ?","Kya main sach mein apna paisa chalaane ko taiyaar hoon?"),
   fw:L("Your toolkit: cushion &amp; horizon (M1), budgeting (M2), killing debt (M3), the building blocks (M4), your own risk level (M5), a written plan (M6), the behaviour traps (M7), tax/fees/paperwork (M8), and the psychology of money (M9). Together they let you look at any situation and reason the right call yourself — without a tip. The goal was never answers; it was judgment.","आपका टूलकिट: कुशन और होराइज़न (M1), बजटिंग (M2), कर्ज़ खत्म (M3), बिल्डिंग ब्लॉक (M4), अपना रिस्क लेवल (M5), लिखा प्लान (M6), बिहेवियर ट्रैप (M7), टैक्स/फीस/पेपरवर्क (M8), और पैसे का मनोविज्ञान (M9)। मिलकर ये किसी भी situation में सही फैसला खुद सोचने देते — बिना टिप। लक्ष्य जवाब नहीं, विवेक था।","Aapka toolkit: cushion aur horizon (M1), budgeting (M2), karza khatam (M3), building block (M4), apna risk level (M5), likha plan (M6), behaviour trap (M7), tax/fees/paperwork (M8), aur paise ka manovigyaan (M9). Milkar ye kisi bhi situation mein sahi faisla khud sochne dete — bina tip. Lakshya jawaab nahi, vivek tha."),
   call:L("Keep learning and stay humble, but trust the frameworks — you're equipped to take your own calls now. This is your call to make.","सीखते रहो और विनम्र रहो, पर फ्रेमवर्क पर भरोसा करो — अब आप अपने फैसले लेने को तैयार हो। यह आपका फैसला है।","Seekhte raho aur vinamra raho, par framework pe bharosa karo — ab aap apne faisle lene ko taiyaar ho. Yeh aapka faisla hai.")
  },
  dd:{ex:[
   L("Look at how far you've come. You can now size an emergency cushion and think in horizons (M1), run a budget and pay yourself first (M2), clear expensive debt in the right order (M3), understand what any investment actually is (M4), know your own true risk level (M5), turn goals into a written plan (M6), spot the behaviour traps as they happen (M7), handle tax, fees and paperwork (M8), and understand the psychology that drives every money decision (M9). That's not trivia — it's a complete way of reasoning about money.","देखो आप कितनी दूर आए। अब इमरजेंसी कुशन नाप सकते और होराइज़न में सोच सकते (M1), बजट और pay-yourself-first (M2), सही क्रम में कर्ज़ (M3), कोई इन्वेस्टमेंट असल में क्या समझना (M4), अपना असली रिस्क (M5), गोल को लिखे प्लान में (M6), बिहेवियर ट्रैप पहचानना (M7), टैक्स/फीस/पेपरवर्क (M8), और हर पैसे-फैसले के पीछे का मनोविज्ञान समझना (M9)।","Dekho aap kitni door aaye. Ab emergency cushion naap sakte aur horizon mein soch sakte (M1), budget aur pay-yourself-first (M2), sahi kram mein karza (M3), koi investment asal mein kya samajhna (M4), apna asli risk (M5), goal ko likhe plan mein (M6), behaviour trap pehchaanna (M7), tax/fees/paperwork (M8), aur har paise-faisle ke peeche ka manovigyaan samajhna (M9)."),
   L("This course never gave you a single 'buy this' — on purpose. Answers expire and make you dependent; judgment lasts a lifetime and makes you free. When the next windfall, tip, crash or 'guaranteed' scheme arrives, you'll no longer need a guru — you'll run it through your own frameworks and reason the right call. Stay humble and keep learning, but know this: you are now equipped to run your own money. From here, every call is yours to make.","इस कोर्स ने कभी एक 'यह खरीदो' नहीं दिया — जान-बूझकर। जवाब खत्म होते और निर्भर बनाते; विवेक जीवनभर, आज़ाद करता। अगला windfall, टिप, क्रैश या 'गारंटीड' स्कीम आए, अब गुरु नहीं चाहिए — अपने फ्रेमवर्क से सोचोगे। विनम्र रहो, सीखते रहो, पर जानो: अब आप अपना पैसा चला सकते हो।","Is course ne kabhi ek 'yeh khareedo' nahi diya — jaan-boojhkar. Jawaab khatam hote aur nirbhar banaate; vivek jeevanbhar, aazaad karta. Agla windfall, tip, crash ya 'guaranteed' scheme aaye, ab guru nahi chahiye — apne framework se sochoge. Vinamra raho, seekhte raho, par jaano: ab aap apna paisa chala sakte ho.")],
   faq:[
    {q:L("What if I still feel unsure?","अगर अब भी अनिश्चित लगूँ?","Agar ab bhi anishchit lagun?"),a:L("That's normal and healthy — confidence grows with practice. Start small with your virtual and real plan; the frameworks work even while you're still learning.","सामान्य और स्वस्थ — आत्मविश्वास अभ्यास से। छोटे से शुरू; फ्रेमवर्क सीखते हुए भी काम करते।","Saamaanya aur swasth — aatmavishwaas abhyaas se. Chhote se shuru; framework seekhte hue bhi kaam karte.")},
    {q:L("Where do I go from here?","अब आगे कहाँ?","Ab aage kahan?"),a:L("Run your real one-page plan, keep the review rhythm, and revisit any module when a situation arises. This app is your reference for life.","अपना असली एक-पेज प्लान चलाओ, रिव्यू लय रखो, ज़रूरत पर कोई मॉड्यूल दोबारा देखो।","Apna asli ek-page plan chalao, review lay rakho, zaroorat pe koi module dobaara dekho.")}
   ]},
  terms:[{k:L("Judgment","विवेक","Judgment"),d:L("The ability to reason the right call yourself for any situation.","किसी भी situation में खुद सही फैसला सोचने की क्षमता।","Kisi bhi situation mein khud sahi faisla sochne ki kshamta.")},{k:L("Financial independence","फाइनेंशियल आज़ादी","Financial aazaadi"),d:L("Here: not depending on anyone to tell you what to do with your money.","यहाँ: पैसे का क्या करना, किसी पर निर्भर नहीं।","Yahaan: paise ka kya karna, kisi pe nirbhar nahi.")}],
  action:{h:L("Commit your first real step","अपना पहला असली कदम तय करो","Apna pehla asli kadam tay karo"),p:L("Revisit your one-page plan and commit to your first real-world step from it — a small checklist.","अपने एक-पेज प्लान पर लौटो और उससे अपना पहला असली-दुनिया कदम तय करो।","Apne ek-page plan pe lauto aur usse apna pehla asli-duniya kadam tay karo."),data:L("Your plan (in-app).","आपका प्लान (ऐप में)।","Aapka plan (app mein).")},
  quiz:[
   {q:L("The real goal of this whole course was…","इस पूरे कोर्स का असली लक्ष्य था…","Is poore course ka asli lakshya tha…"),o:[L("To tell you what to buy","आपको बताना क्या खरीदो","Aapko bataana kya khareedo"),L("To give you judgment to decide yourself","खुद फैसला लेने का विवेक देना","Khud faisla lene ka vivek dena"),L("To pick stocks for you","आपके लिए स्टॉक चुनना","Aapke liye stock chunna"),L("To guarantee returns","रिटर्न की गारंटी","Return ki guarantee")],a:1,why:L("Judgment lasts a lifetime; answers expire and create dependence.","विवेक जीवनभर; जवाब खत्म होते और निर्भरता बनाते।","Vivek jeevanbhar; jawaab khatam hote aur nirbharta banaate.")},
   {q:L("When a 'guaranteed' scheme arrives next, you'll…","अगली 'गारंटीड' स्कीम आए, आप…","Agli 'guaranteed' scheme aaye, aap…"),o:[L("Ask a guru","गुरु से पूछो","Guru se poocho"),L("Run it through your own frameworks","अपने फ्रेमवर्क से सोचो","Apne framework se socho"),L("Join fast","जल्दी जुड़ो","Jaldi judo"),L("Panic","घबराओ","Ghabraao")],a:1,why:L("You now reason the call yourself — the point of the whole course.","अब आप खुद फैसला सोचते हो — पूरे कोर्स का मकसद।","Ab aap khud faisla sochte ho — poore course ka maqsad.")}
  ],
  reflect:L("Which framework changed how you think about money the most?","किस फ्रेमवर्क ने पैसे के बारे में आपकी सोच सबसे ज़्यादा बदली?","Kis framework ne paise ke baare mein aapki soch sabse zyada badli?")}
]};

const MODULEPSY={ id:"mpsy", n:9, title:L("The psychology of money","पैसे का मनोविज्ञान","Paise ka manovigyaan"), theme:L("Money is emotional and human — the mindset behind every decision.","पैसा भावनात्मक और इंसानी है — हर फैसले के पीछे की सोच।","Paisa bhaavnaatmak aur insaani hai — har faisle ke peeche ki soch."),
 lessons:[
 {id:"mpsy1",title:L("How much is 'enough'?","कितना 'काफी' है?","Kitna 'kaafi' hai?"),sub:L("The moving goalpost","खिसकता गोलपोस्ट","Khiskta goalpost"),mins:4,
  beats:{
   sit:L("You finally hit a money milestone you once dreamed of — and within days you want the next, bigger one. The finish line just moved.","आप उस पैसे के पड़ाव तक पहुँचे जिसका कभी सपना देखा था — और कुछ दिन में अगला, बड़ा चाहिए। फिनिश लाइन खिसक गई।","Aap us paise ke padaav tak pahunche jiska kabhi sapna dekha tha — aur kuch din mein agla, bada chahiye. Finish line khisak gayi."),
   myth:{lie:L("A bit more money will finally make me feel secure and content.","थोड़ा और पैसा आखिरकार मुझे सुरक्षित और संतुष्ट कर देगा।","Thoda aur paisa aakhirkaar mujhe surakshit aur santusht kar dega."),truth:L("Without defining 'enough', the goalpost keeps moving — more never feels like enough.","'काफी' तय किए बिना गोलपोस्ट खिसकता रहता है — ज़्यादा कभी काफी नहीं लगता।","'Kaafi' tay kiye bina goalpost khisakta rehta hai — zyada kabhi kaafi nahi lagta.")},
   reflex:L("Chasing the next number endlessly, sure that contentment is just beyond it.","अगले नंबर का अंतहीन पीछा, यकीन कि संतोष बस उसके आगे है।","Agle number ka antaheen peechha, yakeen ki santosh bas uske aage hai."),
   q:L("What amount, and what life, would actually be 'enough' for me?","मेरे लिए असल में कितना, और कैसी ज़िंदगी 'काफी' होगी?","Mere liye asal mein kitna, aur kaisi zindagi 'kaafi' hogi?"),
   fw:L("Define <b>enough</b> — a personal level of money and lifestyle that buys real security and freedom. Past that point, chasing more can quietly cost your health, relationships, and peace. Knowing when to stop is a skill, not a lack of ambition.","<b>काफी</b> तय करो — पैसे और लाइफस्टाइल का एक निजी स्तर जो असली सुरक्षा और आज़ादी दे। उसके आगे ज़्यादा का पीछा चुपचाप सेहत, रिश्ते, शांति की कीमत ले सकता। कब रुकना, यह हुनर है।","<b>Kaafi</b> tay karo — paise aur lifestyle ka ek niji star jo asli suraksha aur aazaadi de. Uske aage zyada ka peechha chupchaap sehat, rishte, shaanti ki keemat le sakta. Kab rukna, yeh hunar hai."),
   call:L("What 'enough' looks like is deeply personal; the win is naming it, so you can enjoy arriving instead of endlessly chasing.","'काफी' कैसा दिखता है यह गहरा निजी; जीत उसे नाम देना, ताकि पहुँचने का आनंद लो, अंतहीन पीछा नहीं।","'Kaafi' kaisa dikhta hai yeh gehra niji; jeet use naam dena, taaki pahunchne ka aanand lo, antaheen peechha nahi.")
  },
  dd:{ex:[
   L("Our minds are wired to adapt: reach a goal and the thrill fades fast, so we reset our sights on a bigger one. This 'moving goalpost' means that, without a deliberate definition of enough, no amount ever feels sufficient — a person earning many times what they once wished for can feel just as anxious as before. The problem isn't the money; it's the missing finish line.","हमारा मन ढलने को बना है: गोल पाओ और रोमांच जल्दी फीका, तो नज़र बड़े पर। यह 'खिसकता गोलपोस्ट' मतलब — 'काफी' की सोची-समझी परिभाषा बिना कोई रकम पर्याप्त नहीं लगती। समस्या पैसा नहीं; गायब फिनिश लाइन है।","Hamara mann dhalne ko bana hai: goal pao aur romaanch jaldi feeka, toh nazar bade pe. Yeh 'khiskta goalpost' matlab — 'kaafi' ki sochi-samjhi paribhaasha bina koi raqam paryaapt nahi lagti. Samasya paisa nahi; gayab finish line hai."),
   L("Defining 'enough' is not about limiting ambition — it's about aiming it. When you know the level of money and lifestyle that genuinely gives you security and freedom, you can pursue it hard AND recognise when you've arrived, instead of sacrificing health, relationships and time for a number that keeps running away. The most dangerous financial trap isn't earning too little; it's never deciding what's enough.","'काफी' तय करना महत्वाकांक्षा घटाना नहीं — उसे निशाना देना है। जब पता हो कौन सा स्तर सच में सुरक्षा-आज़ादी देता, तो कड़ी मेहनत भी करो और पहुँचना पहचानो भी — भागते नंबर के लिए सेहत, रिश्ते, समय कुर्बान किए बिना।","'Kaafi' tay karna mahatvaakaanksha ghataana nahi — use nishaana dena hai. Jab pata ho kaun sa star sach mein suraksha-aazaadi deta, toh kadi mehnat bhi karo aur pahunchna pehchaano bhi — bhaagte number ke liye sehat, rishte, samay kurbaan kiye bina.")],
   faq:[
    {q:L("Isn't 'enough' just settling for less?","क्या 'काफी' मतलब कम में समझौता?","Kya 'kaafi' matlab kam mein samjhauta?"),a:L("No — it's aiming ambition at what actually gives you freedom, so you don't sacrifice everything for a number that never satisfies.","नहीं — महत्वाकांक्षा को आज़ादी देने वाले पर निशाना, ताकि कभी न भरने वाले नंबर के लिए सब कुर्बान न हो।","Nahi — mahatvaakaanksha ko aazaadi dene wale pe nishaana, taaki kabhi na bharne wale number ke liye sab kurbaan na ho.")},
    {q:L("Can 'enough' change over time?","क्या 'काफी' समय के साथ बदल सकता है?","Kya 'kaafi' samay ke saath badal sakta hai?"),a:L("Yes, as life changes (a family, new goals) — the point is to keep it a conscious choice, not an ever-running reflex.","हाँ, ज़िंदगी बदलने पर — बात इसे सोचा-समझा रखने की, अंतहीन रिफ्लेक्स नहीं।","Haan, zindagi badalne pe — baat ise socha-samjha rakhne ki, antaheen reflex nahi.")}
   ]},
  terms:[{k:L("Enough","काफी","Enough"),d:L("A conscious level of money/lifestyle that gives you real security and freedom.","पैसे/लाइफस्टाइल का सोचा-समझा स्तर जो असली सुरक्षा और आज़ादी दे।","Paise/lifestyle ka socha-samjha star jo asli suraksha aur aazaadi de.")},{k:L("Moving goalpost","खिसकता गोलपोस्ट","Moving goalpost"),d:L("The habit of wanting more the moment you reach a target.","गोल पाते ही और चाहने की आदत।","Goal paate hi aur chaahne ki aadat.")}],
  action:{h:L("Write your 'enough'","अपना 'काफी' लिखो","Apna 'kaafi' likho"),p:L("In your own words, describe the lifestyle and rough amount that would genuinely feel like enough for you.","अपने शब्दों में वो लाइफस्टाइल और मोटी रकम लिखो जो आपको सच में 'काफी' लगे।","Apne shabdon mein woh lifestyle aur moti raqam likho jo aapko sach mein 'kaafi' lage.")},
  quiz:[
   {q:L("Why does 'more' often never feel like enough?","'ज़्यादा' अक्सर काफी क्यों नहीं लगता?","'Zyada' aksar kaafi kyun nahi lagta?"),o:[L("Money is fake","पैसा नकली है","Paisa nakli hai"),L("The goalpost keeps moving without a defined 'enough'","'काफी' तय बिना गोलपोस्ट खिसकता","'Kaafi' tay bina goalpost khiskta"),L("Prices rise","दाम बढ़ते","Daam badhte"),L("Banks steal it","बैंक चुराते","Bank churaate")],a:1,why:L("Without defining enough, each target resets to a bigger one.","'काफी' तय बिना हर टारगेट बड़े पर रीसेट।","'Kaafi' tay bina har target bade pe reset.")},
   {q:L("Defining 'enough' mainly helps you…","'काफी' तय करना मुख्यतः…","'Kaafi' tay karna mukhyatah…"),o:[L("Earn less on purpose","जान-बूझकर कम कमाना","Jaan-boojhkar kam kamaana"),L("Aim ambition and enjoy arriving","महत्वाकांक्षा को निशाना और पहुँचने का आनंद","Mahatvaakaanksha ko nishaana aur pahunchne ka aanand"),L("Avoid all risk","सारा रिस्क टालना","Saara risk taalna"),L("Beat others","दूसरों को हराना","Doosron ko haraana")],a:1,why:L("It aims your ambition and lets you recognise success instead of chasing forever.","यह महत्वाकांक्षा को निशाना देता और सफलता पहचानने देता।","Yeh mahatvaakaanksha ko nishaana deta aur safalta pehchaanne deta.")}
  ],
  reflect:L("If you hit your 'enough' today, what would you stop chasing?","अगर आज 'काफी' पहुँच जाओ, क्या पीछा करना छोड़ दोगे?","Agar aaj 'kaafi' pahunch jao, kya peechha karna chhod doge?")},

 {id:"mpsy2",title:L("Real wealth is what you don't see","असली अमीरी वो जो दिखती नहीं","Asli ameeri woh jo dikhti nahi"),sub:L("Status spending vs freedom","स्टेटस खर्च बनाम आज़ादी","Status kharch vs aazaadi"),mins:4,
  beats:{
   sit:L("A neighbour rolls up in a shiny new car and everyone assumes they're rich; you quietly feel behind.","पड़ोसी चमचमाती नई गाड़ी में आता है, सब मानते हैं वो अमीर है; आप चुपचाप पीछे महसूस करते हो।","Padosi chamchamaati nayi gaadi mein aata hai, sab maante hain woh ameer hai; aap chupchaap peeche mehsoos karte ho."),
   myth:{lie:L("Visible, flashy spending is a sign of wealth.","दिखने वाला, चमकीला खर्च अमीरी की निशानी है।","Dikhne wala, chamkeela kharch ameeri ki nishaani hai."),truth:L("Real wealth is the money NOT spent — it's invisible. Flashy spending often signals debt, not wealth.","असली अमीरी वो पैसा जो खर्च नहीं हुआ — अदृश्य। चमकीला खर्च अक्सर कर्ज़ का संकेत, अमीरी का नहीं।","Asli ameeri woh paisa jo kharch nahi hua — adrishya. Chamkeela kharch aksar karza ka sanket, ameeri ka nahi.")},
   reflex:L("Judging wealth (yours and others') by visible stuff.","अमीरी (अपनी और दूसरों की) दिखने वाले सामान से आँकना।","Ameeri (apni aur doosron ki) dikhne wale saamaan se aankna."),
   q:L("What am I actually buying — stuff, or freedom?","मैं असल में क्या खरीद रहा हूँ — सामान, या आज़ादी?","Main asal mein kya khareed raha hoon — saamaan, ya aazaadi?"),
   fw:L("'Rich' is visible income and spending; <b>wealth</b> is the assets you DON'T spend — invisible, quietly compounding. Status spending buys others' approval at the cost of your own freedom. The gap between your ego and your income is your savings — and that gap is where real wealth is built.","'रिच' दिखने वाली इनकम और खर्च; <b>वेल्थ</b> वो एसेट जो खर्च नहीं करते — अदृश्य, चुपचाप कंपाउंडिंग। स्टेटस खर्च दूसरों की मंज़ूरी खरीदता, अपनी आज़ादी की कीमत पर। ईगो और इनकम का फासला ही बचत — वहीं असली वेल्थ बनती।","'Rich' dikhne wali income aur kharch; <b>wealth</b> woh asset jo kharch nahi karte — adrishya, chupchaap compounding. Status kharch doosron ki manzoori khareedta, apni aazaadi ki keemat pe. Ego aur income ka faasla hi bachat — wahin asli wealth banti."),
   call:L("Decide what you're really buying — approval, or freedom. We won't tell you what to spend on; just see the trade clearly.","तय करो असल में क्या खरीद रहे हो — मंज़ूरी, या आज़ादी। हम नहीं बताते किस पर खर्च करो; बस सौदा साफ देखो।","Tay karo asal mein kya khareed rahe ho — manzoori, ya aazaadi. Hum nahi bataate kis pe kharch karo; bas sauda saaf dekho.")
  },
  dd:{ex:[
   L("There's a crucial difference between being 'rich' and being 'wealthy'. Rich is what you can see — a big salary, a new car, a flashy lifestyle. Wealth is what you can't see — the money that was NOT spent, quietly invested and compounding. Ironically, the flashiest spenders are often not wealthy at all: the car and the lifestyle can be signals of debt and thin savings, not a fat net worth.","'रिच' और 'वेल्दी' में अहम फर्क। रिच वो जो दिखे — बड़ी सैलरी, नई गाड़ी, चमकीली लाइफस्टाइल। वेल्थ वो जो न दिखे — जो पैसा खर्च नहीं हुआ, चुपचाप निवेशित और कंपाउंडिंग। अक्सर सबसे चमकीले खर्च करने वाले अमीर होते ही नहीं — गाड़ी कर्ज़ का संकेत हो सकती।","'Rich' aur 'wealthy' mein aham farak. Rich woh jo dikhe — badi salary, nayi gaadi, chamkeeli lifestyle. Wealth woh jo na dikhe — jo paisa kharch nahi hua, chupchaap niveshit aur compounding. Aksar sabse chamkeele kharch karne wale ameer hote hi nahi — gaadi karza ka sanket ho sakti."),
   L("A lot of spending is really about buying other people's approval — we think a purchase will earn respect, but people mostly notice the object, not us. Meanwhile that same money, unspent, could have bought the thing everyone actually wants: freedom. Your savings rate is simply the gap between your ego (what you show) and your income (what you make). Keep that gap wide, and invisible wealth — and the freedom it buys — grows quietly in the background.","बहुत सा खर्च असल में दूसरों की मंज़ूरी खरीदना है — लगता खरीद इज़्ज़त दिलाएगी, पर लोग चीज़ देखते, हमें नहीं। वही पैसा बिना खर्चे वो खरीद सकता जो सब सच में चाहते: आज़ादी। बचत दर = ईगो और इनकम का फासला। फासला चौड़ा रखो, अदृश्य वेल्थ बढ़ती।","Bahut sa kharch asal mein doosron ki manzoori khareedna hai — lagta khareed izzat dilaayegi, par log cheez dekhte, hamein nahi. Wahi paisa bina kharche woh khareed sakta jo sab sach mein chahte: aazaadi. Bachat dar = ego aur income ka faasla. Faasla chauda rakho, adrishya wealth badhti.")],
   faq:[
    {q:L("So I should never spend on nice things?","तो अच्छी चीज़ों पर कभी खर्च न करूँ?","Toh achhi cheezon pe kabhi kharch na karun?"),a:L("Spend on what you truly value — the point is to spend for yourself, not for others' approval, and to see the freedom you trade away.","जो सच में value करते उस पर खर्च करो — बात खुद के लिए खर्च, दूसरों की मंज़ूरी के लिए नहीं।","Jo sach mein value karte us pe kharch karo — baat khud ke liye kharch, doosron ki manzoori ke liye nahi.")},
    {q:L("How do I know if I'm 'wealthy'?","कैसे पता मैं 'वेल्दी' हूँ?","Kaise pata main 'wealthy' hoon?"),a:L("By what you've kept and invested (net worth, freedom), not by what you display. Wealth is the choices you can afford, unseen.","जो रखा और निवेश किया उससे (नेट वर्थ, आज़ादी), दिखावे से नहीं।","Jo rakha aur nivesh kiya usse (net worth, aazaadi), dikhaave se nahi.")}
   ]},
  terms:[{k:L("Wealth vs rich","वेल्थ बनाम रिच","Wealth vs rich"),d:L("Rich is visible spending; wealth is the invisible money you kept.","रिच दिखने वाला खर्च; वेल्थ अदृश्य रखा पैसा।","Rich dikhne wala kharch; wealth adrishya rakha paisa.")},{k:L("Status spending","स्टेटस खर्च","Status spending"),d:L("Buying things mainly to earn others' approval.","मुख्यतः दूसरों की मंज़ूरी के लिए खरीदना।","Mukhyatah doosron ki manzoori ke liye khareedna.")}],
  action:{h:L("Approval or freedom?","मंज़ूरी या आज़ादी?","Manzoori ya aazaadi?"),p:L("List your last few big spends and mark each: for yourself, or for others' approval? Notice the pattern.","अपने पिछले कुछ बड़े खर्च लिखो और मार्क करो: खुद के लिए, या दूसरों की मंज़ूरी के लिए? पैटर्न देखो।","Apne pichhle kuch bade kharch likho aur mark karo: khud ke liye, ya doosron ki manzoori ke liye? Pattern dekho.")},
  quiz:[
   {q:L("Real wealth is best described as…","असली वेल्थ सबसे अच्छे से…","Asli wealth sabse achhe se…"),o:[L("A flashy car","चमकीली गाड़ी","Chamkeeli gaadi"),L("The money you didn't spend, invested","जो पैसा खर्च नहीं किया, निवेशित","Jo paisa kharch nahi kiya, niveshit"),L("A big visible salary","बड़ी दिखने वाली सैलरी","Badi dikhne wali salary"),L("Designer clothes","डिज़ाइनर कपड़े","Designer kapde")],a:1,why:L("Wealth is invisible — the assets you kept and compounded, not the display.","वेल्थ अदृश्य — रखा और कंपाउंड किया पैसा, दिखावा नहीं।","Wealth adrishya — rakha aur compound kiya paisa, dikhaava nahi.")},
   {q:L("Your savings rate is the gap between…","बचत दर किसका फासला है…","Bachat dar kiska faasla hai…"),o:[L("Income and inflation","इनकम और इन्फ्लेशन","Income aur inflation"),L("Your ego and your income","आपके ईगो और इनकम","Aapke ego aur income"),L("Two banks","दो बैंक","Do bank"),L("Age and returns","उम्र और रिटर्न","Umar aur return")],a:1,why:L("Spend less to impress (ego) than you earn — that gap is savings and future freedom.","इनकम से कम दिखावे पर खर्च — वो फासला बचत और आज़ादी।","Income se kam dikhaave pe kharch — woh faasla bachat aur aazaadi.")}
  ],
  reflect:L("What's one recent purchase you made for others' approval, not your own joy?","हाल की एक खरीद जो दूसरों की मंज़ूरी के लिए थी, अपनी खुशी नहीं?","Haal ki ek khareed jo doosron ki manzoori ke liye thi, apni khushi nahi?")},

 {id:"mpsy3",title:L("Luck and risk — the hidden players","किस्मत और रिस्क — छुपे खिलाड़ी","Kismat aur risk — chhupe khiladi"),sub:L("Stay humble, leave room for error","विनम्र रहो, गलती की गुंजाइश रखो","Vinamra raho, galti ki gunjaaish rakho"),mins:4,
  beats:{
   sit:L("A friend's one big win gets called 'genius'; someone else's loss gets called 'stupidity'. Both stories feel too neat.","एक दोस्त की बड़ी जीत को 'जीनियस' कहा जाता; किसी की हार को 'बेवकूफी'। दोनों कहानियाँ बहुत साफ-सुथरी लगती हैं।","Ek dost ki badi jeet ko 'genius' kaha jaata; kisi ki haar ko 'bewakoofi'. Dono kahaaniyaan bahut saaf-suthri lagti hain."),
   myth:{lie:L("Outcomes are pure skill — winners are smart, losers are foolish.","नतीजे शुद्ध स्किल — जीतने वाले समझदार, हारने वाले बेवकूफ।","Natije shuddh skill — jeetne wale samajhdaar, haarne wale bewakoof."),truth:L("Luck and risk are the invisible siblings of every outcome. Success isn't all skill; failure isn't all fault.","किस्मत और रिस्क हर नतीजे के अदृश्य भाई-बहन। सफलता सिर्फ स्किल नहीं; असफलता सिर्फ गलती नहीं।","Kismat aur risk har natije ke adrishya bhai-behen. Safalta sirf skill nahi; asaphalta sirf galti nahi.")},
   reflex:L("Copying a lucky winner's moves, or harshly judging an unlucky loss.","किस्मत वाले विजेता की नकल, या बदकिस्मत हार को कठोर आँकना।","Kismat wale vijeta ki nakal, ya badkismat haar ko kathor aankna."),
   q:L("How much of this outcome was skill — and how much luck or risk?","इस नतीजे में कितना स्किल था — और कितनी किस्मत या रिस्क?","Is natije mein kitna skill tha — aur kitni kismat ya risk?"),
   fw:L("Respect <b>luck</b> and <b>risk</b> — the same invisible forces, one helping, one hurting. So stay humble in wins and kind (to yourself and others) in losses. Because you can't control tail events, build <b>room for error</b> (a margin of safety) and above all <b>avoid ruin</b>, so you can stay in the game long enough for compounding to work.","<b>किस्मत</b> और <b>रिस्क</b> का सम्मान करो — वही अदृश्य ताकतें, एक मदद, एक चोट। तो जीत में विनम्र, हार में (खुद पर और दूसरों पर) नरम। tail घटनाएँ काबू में नहीं, तो <b>गलती की गुंजाइश</b> (मार्जिन ऑफ सेफ्टी) रखो और सबसे ज़रूरी <b>बर्बादी से बचो</b>, ताकि खेल में टिके रहो।","<b>Kismat</b> aur <b>risk</b> ka sammaan karo — wahi adrishya taaqatein, ek madad, ek chot. Toh jeet mein vinamra, haar mein (khud pe aur doosron pe) naram. Tail ghatnaayein kaaboo mein nahi, toh <b>galti ki gunjaaish</b> (margin of safety) rakho aur sabse zaroori <b>barbaadi se bacho</b>, taaki khel mein tike raho."),
   call:L("Never bet the farm on a single outcome; leave a margin of safety so bad luck can't take you out of the game.","किसी एक नतीजे पर सब मत लगाओ; गुंजाइश रखो ताकि बदकिस्मती आपको खेल से बाहर न करे।","Kisi ek natije pe sab mat lagao; gunjaaish rakho taaki badkismti aapko khel se baahar na kare.")
  },
  dd:{ex:[
   L("Every financial outcome is a mix of decisions AND two invisible forces: luck (things going right for reasons outside your control) and risk (things going wrong for the same reasons). We love tidy stories — 'they won because they're brilliant', 'they lost because they're foolish' — but those stories usually overstate skill and ignore the roll of the dice. The humbling truth: some of your best results owe a lot to luck, and some failures were mostly bad risk, not bad judgment.","हर नतीजा फैसलों और दो अदृश्य ताकतों का मेल: किस्मत (काबू के बाहर सही होना) और रिस्क (उन्हीं कारणों से गलत)। हमें साफ कहानियाँ पसंद — 'जीता क्योंकि जीनियस', 'हारा क्योंकि बेवकूफ' — पर वे स्किल बढ़ा-चढ़ाकर पासे को अनदेखा करती हैं।","Har natija faislon aur do adrishya taaqaton ka mel: kismat (kaaboo ke baahar sahi hona) aur risk (unhi kaaranon se galat). Hamein saaf kahaaniyaan pasand — 'jeeta kyunki genius', 'haara kyunki bewakoof' — par ve skill badha-chadhaakar paase ko andekha karti hain."),
   L("Two practical lessons follow. First, humility and kindness: don't blindly copy a lucky winner or harshly judge an unlucky loss (including your own). Second, and most important, build in <b>room for error</b> — a margin of safety — and avoid any bet that could wipe you out. Because compounding only works if you survive, the number-one rule is to never be forced out of the game. Reasonable caution beats fragile brilliance.","दो व्यावहारिक सबक। एक: विनम्रता और नरमी — किस्मत वाले विजेता की आँख मूँदकर नकल या बदकिस्मत हार (अपनी भी) को कठोर मत आँको। दो, सबसे ज़रूरी: <b>गलती की गुंजाइश</b> रखो और ऐसा दांव नहीं जो मिटा दे। कंपाउंडिंग तभी जब बचो — खेल से बाहर कभी मत होओ।","Do vyaavhaarik sabak. Ek: vinamrata aur narmi — kismat wale vijeta ki aankh moondkar nakal ya badkismat haar (apni bhi) ko kathor mat aanko. Do, sabse zaroori: <b>galti ki gunjaaish</b> rakho aur aisa daanv nahi jo mita de. Compounding tabhi jab bacho — khel se baahar kabhi mat hoo.")],
   faq:[
    {q:L("So skill doesn't matter?","तो स्किल मायने नहीं रखती?","Toh skill maayne nahi rakhti?"),a:L("It does — but it shares the stage with luck and risk. Respecting all three keeps you humble and cautious, which is itself a skill.","रखती है — पर किस्मत और रिस्क के साथ मंच बाँटती है। तीनों का सम्मान विनम्र और सतर्क रखता।","Rakhti hai — par kismat aur risk ke saath manch baant-ti hai. Teenon ka sammaan vinamra aur satark rakhta.")},
    {q:L("What's 'room for error'?","'गलती की गुंजाइश' क्या है?","'Galti ki gunjaaish' kya hai?"),a:L("A buffer (extra savings, lower risk, not over-betting) so that when things go wrong — and they will — you survive it.","एक बफर (ज़्यादा बचत, कम रिस्क, over-bet नहीं) ताकि गलत होने पर बचो।","Ek buffer (zyada bachat, kam risk, over-bet nahi) taaki galat hone pe bacho.")}
   ]},
  terms:[{k:L("Luck vs risk","किस्मत बनाम रिस्क","Luck vs risk"),d:L("The same outside forces — one helps you, one hurts you.","वही बाहरी ताकतें — एक मदद, एक चोट।","Wahi baahari taaqatein — ek madad, ek chot.")},{k:L("Margin of safety","मार्जिन ऑफ सेफ्टी","Margin of safety"),d:L("Room for error so bad luck can't ruin you.","गलती की गुंजाइश ताकि बदकिस्मती बर्बाद न करे।","Galti ki gunjaaish taaki badkismti barbaad na kare.")}],
  action:{h:L("Skill or luck?","स्किल या किस्मत?","Skill ya kismat?"),p:L("Pick one money 'win' and one 'loss' from your life and honestly estimate how much was skill vs luck/risk.","अपनी ज़िंदगी की एक 'जीत' और एक 'हार' लो और ईमानदारी से आँको कितना स्किल बनाम किस्मत/रिस्क।","Apni zindagi ki ek 'jeet' aur ek 'haar' lo aur imaandaari se aanko kitna skill banaam kismat/risk.")},
  quiz:[
   {q:L("Luck and risk are…","किस्मत और रिस्क…","Kismat aur risk…"),o:[L("Opposites unrelated to each other","एक-दूसरे से बेमेल विपरीत","Ek-doosre se bemel vipreet"),L("Two sides of the same coin — outside forces","एक ही सिक्के के दो पहलू — बाहरी ताकतें","Ek hi sikke ke do pehlu — baahari taaqatein"),L("Always predictable","हमेशा predictable","Hamesha predictable"),L("Only for gamblers","सिर्फ जुआरियों के लिए","Sirf juaariyon ke liye")],a:1,why:L("Both are outside forces; one helps, one hurts — respect both.","दोनों बाहरी; एक मदद, एक चोट — दोनों का सम्मान।","Dono baahari; ek madad, ek chot — dono ka sammaan.")},
   {q:L("The most important rule around risk is to…","रिस्क का सबसे ज़रूरी नियम…","Risk ka sabse zaroori niyam…"),o:[L("Bet everything on your best idea","अपने बेस्ट आइडिया पर सब लगाओ","Apne best idea pe sab lagao"),L("Avoid ruin so you stay in the game","बर्बादी से बचो ताकि खेल में रहो","Barbaadi se bacho taaki khel mein raho"),L("Ignore it","अनदेखा करो","Andekha karo"),L("Copy lucky winners","किस्मत वालों की नकल","Kismat walon ki nakal")],a:1,why:L("Compounding needs survival — never let one bet take you out.","कंपाउंडिंग को टिकना चाहिए — एक दांव बाहर न करे।","Compounding ko tikna chahiye — ek daanv baahar na kare.")}
  ],
  reflect:L("Where in your finances would one stroke of bad luck hurt the most — and is there room for error?","आपकी फाइनेंस में एक बदकिस्मती सबसे ज़्यादा कहाँ चोट देगी — और क्या गुंजाइश है?","Aapki finance mein ek badkismti sabse zyada kahan chot degi — aur kya gunjaaish hai?")},

 {id:"mpsy4",title:L("Your money story started in childhood","आपके पैसे की कहानी बचपन से","Aapke paise ki kahani bachpan se"),sub:L("Money scripts — reasonable beats rational","मनी स्क्रिप्ट — reasonable, rational से बेहतर","Money scripts — reasonable beats rational"),mins:4,
  beats:{
   sit:L("You and a friend react totally differently to the same market dip — one grew up in scarcity, the other in comfort.","आप और एक दोस्त उसी मार्केट डिप पर बिल्कुल अलग react करते हो — एक अभाव में बड़ा हुआ, दूसरा आराम में।","Aap aur ek dost usi market dip pe bilkul alag react karte ho — ek abhaav mein bada hua, doosra aaraam mein."),
   myth:{lie:L("Everyone should feel the same about money, and my way is the rational default.","सबको पैसे पर एक जैसा महसूस करना चाहिए, और मेरा तरीका rational डिफ़ॉल्ट है।","Sabko paise pe ek jaisa mehsoos karna chahiye, aur mera tareeka rational default hai."),truth:L("Your money beliefs were shaped by your unique upbringing and experiences — your 'money scripts'.","आपके पैसे के विश्वास आपकी अनोखी परवरिश और अनुभवों से बने — आपकी 'मनी स्क्रिप्ट'।","Aapke paise ke vishwaas aapki anokhi parwarish aur anubhavon se bane — aapki 'money scripts'.")},
   reflex:L("Assuming your money feelings are the objective 'correct' ones.","मान लेना कि आपकी पैसे की भावनाएँ ही वस्तुनिष्ठ 'सही' हैं।","Maan lena ki aapki paise ki bhaavnaayein hi vastunishth 'sahi' hain."),
   q:L("Where do my gut money reactions actually come from?","मेरी पैसे की सहज प्रतिक्रियाएँ असल में कहाँ से?","Meri paise ki sehaj pratikriyaayein asal mein kahan se?"),
   fw:L("Recognise your <b>money scripts</b> — deep beliefs like scarcity, avoidance, money-worship, or status — formed by your past. Once you see them, they can inform your decisions instead of secretly running them. And aim for <b>reasonable</b>, not textbook-<b>rational</b>: a slightly 'suboptimal' plan you can actually stick with beats a perfect one you'll abandon.","अपनी <b>मनी स्क्रिप्ट</b> पहचानो — अभाव, बचाव, पैसा-पूजा, या स्टेटस जैसे गहरे विश्वास, अतीत से बने। देख लो तो वे फैसलों को सूचित करें, चुपचाप चलाएँ नहीं। और <b>reasonable</b> बनो, किताबी-<b>rational</b> नहीं: थोड़ा 'सबऑप्टिमल' पर निभने वाला प्लान, परफेक्ट पर छूटने वाले से बेहतर।","Apni <b>money scripts</b> pehchaano — abhaav, bachaav, paisa-pooja, ya status jaise gehre vishwaas, ateet se bane. Dekh lo toh ve faislon ko soochit karein, chupchaap chalaayein nahi. Aur <b>reasonable</b> bano, kitaabi-<b>rational</b> nahi: thoda 'suboptimal' par nibhne wala plan, perfect par chhootne wale se behtar."),
   call:L("Name your money scripts and choose a reasonable plan you can live with — that's more useful than a 'perfect' one on paper.","अपनी मनी स्क्रिप्ट को नाम दो और ऐसा reasonable प्लान चुनो जिसके साथ जी सको — यह कागज़ी 'परफेक्ट' से ज़्यादा काम का।","Apni money scripts ko naam do aur aisa reasonable plan chuno jiske saath jee sako — yeh kaagzi 'perfect' se zyada kaam ka.")
  },
  dd:{ex:[
   L("Nobody is crazy with money — they're just playing out beliefs formed by a life you haven't lived. Someone who grew up in scarcity may hoard cash and fear every dip; someone raised in comfort may take risks casually. These 'money scripts' — scarcity, avoidance, money as worship, money as status — run silently in the background and explain why two sensible people make opposite choices. The first step is simply seeing your own scripts, so they inform your decisions instead of secretly steering them.","पैसे में कोई पागल नहीं — बस उन विश्वासों को जी रहा जो एक ऐसी ज़िंदगी से बने जो आपने नहीं जी। अभाव में बड़ा हुआ कैश जमा करे, हर डिप से डरे; आराम में पला जोखिम आराम से ले। ये 'मनी स्क्रिप्ट' चुपचाप चलती हैं। पहला कदम अपनी स्क्रिप्ट देखना।","Paise mein koi paagal nahi — bas un vishwaason ko jee raha jo ek aisi zindagi se bane jo aapne nahi jee. Abhaav mein bada hua cash jama kare, har dip se dare; aaraam mein pala jokhim aaraam se le. Ye 'money scripts' chupchaap chalti hain. Pehla kadam apni script dekhna."),
   L("This leads to a freeing idea: aim to be <b>reasonable</b>, not perfectly <b>rational</b>. On a spreadsheet the 'optimal' plan wins, but real humans have emotions, sleep, and scripts. A slightly less-than-optimal plan that fits your temperament — one you'll calmly stick with through crashes and years — will beat a theoretically perfect plan you abandon at the first storm. Money is a soft skill, where how you behave matters more than what you know.","इससे एक आज़ाद करने वाला विचार: <b>reasonable</b> बनो, पूरी तरह <b>rational</b> नहीं। स्प्रेडशीट पर 'ऑप्टिमल' जीतता, पर असली इंसान में भावनाएँ, नींद, स्क्रिप्ट। थोड़ा कम-ऑप्टिमल पर आपके स्वभाव से मेल खाता प्लान — जिसे शांति से निभाओ — परफेक्ट पर छूटने वाले से जीतता। पैसा soft skill है।","Isse ek aazaad karne wala vichaar: <b>reasonable</b> bano, poori tarah <b>rational</b> nahi. Spreadsheet pe 'optimal' jeetta, par asli insaan mein bhaavnaayein, neend, script. Thoda kam-optimal par aapke swabhaav se mel khaata plan — jise shaanti se nibhaao — perfect par chhootne wale se jeetta. Paisa soft skill hai.")],
   faq:[
    {q:L("How do I spot my money scripts?","अपनी मनी स्क्रिप्ट कैसे पहचानूँ?","Apni money scripts kaise pehchaanun?"),a:L("Notice your gut reactions to money and where they came from — a parent's habit, a hard time, a childhood lesson. Naming them loosens their grip.","पैसे पर अपनी सहज प्रतिक्रियाएँ और उनका स्रोत देखो — माता-पिता की आदत, कठिन दौर, बचपन का सबक।","Paise pe apni sehaj pratikriyaayein aur unka srot dekho — maata-pita ki aadat, kathin daur, bachpan ka sabak.")},
    {q:L("Isn't 'rational' always better?","क्या 'rational' हमेशा बेहतर नहीं?","Kya 'rational' hamesha behtar nahi?"),a:L("On paper, yes; in life, a reasonable plan you'll actually keep beats an optimal one you'll quit. Behaviour wins.","कागज़ पर हाँ; ज़िंदगी में निभने वाला reasonable प्लान छूटने वाले optimal से जीतता।","Kaagaz pe haan; zindagi mein nibhne wala reasonable plan chhootne wale optimal se jeetta.")}
   ]},
  terms:[{k:L("Money scripts","मनी स्क्रिप्ट","Money scripts"),d:L("Deep money beliefs formed by your upbringing and experiences.","परवरिश और अनुभवों से बने गहरे पैसे-विश्वास।","Parwarish aur anubhavon se bane gehre paise-vishwaas.")},{k:L("Reasonable vs rational","Reasonable बनाम rational","Reasonable vs rational"),d:L("A plan you can stick with beats a 'perfect' one you'll abandon.","निभने वाला प्लान, छूटने वाले 'परफेक्ट' से बेहतर।","Nibhne wala plan, chhootne wale 'perfect' se behtar.")}],
  action:{h:L("Name your scripts","अपनी स्क्रिप्ट नाम दो","Apni script naam do"),p:L("Write one strong money belief you hold and trace where it came from in your past.","अपना एक मज़बूत पैसे-विश्वास लिखो और खोजो वो अतीत में कहाँ से आया।","Apna ek mazboot paise-vishwaas likho aur khojo woh ateet mein kahan se aaya.")},
  quiz:[
   {q:L("Two sensible people make opposite money choices mainly because…","दो समझदार लोग उलटे पैसे-फैसले मुख्यतः क्यों…","Do samajhdaar log ulte paise-faisle mukhyatah kyun…"),o:[L("One is stupid","एक बेवकूफ है","Ek bewakoof hai"),L("Their money scripts differ","उनकी मनी स्क्रिप्ट अलग","Unki money scripts alag"),L("Math changes","गणित बदलता","Ganit badalta"),L("Luck only","सिर्फ किस्मत","Sirf kismat")],a:1,why:L("Beliefs formed by different pasts drive different gut reactions.","अलग अतीत से बने विश्वास अलग प्रतिक्रिया चलाते।","Alag ateet se bane vishwaas alag pratikriya chalaate.")},
   {q:L("'Reasonable beats rational' means…","'reasonable, rational से बेहतर' मतलब…","'Reasonable, rational se behtar' matlab…"),o:[L("Ignore math entirely","गणित पूरी तरह अनदेखा","Ganit poori tarah andekha"),L("A plan you'll stick with beats a perfect one you'll quit","निभने वाला प्लान छूटने वाले परफेक्ट से बेहतर","Nibhne wala plan chhootne wale perfect se behtar"),L("Never plan","कभी प्लान न करो","Kabhi plan na karo"),L("Copy experts","एक्सपर्ट की नकल","Expert ki nakal")],a:1,why:L("Behaviour you can sustain matters more than paper-perfect optimisation.","निभने वाला व्यवहार कागज़ी परफेक्शन से ज़्यादा मायने रखता।","Nibhne wala vyavhaar kaagzi perfection se zyada maayne rakhta.")}
  ],
  reflect:L("Which money belief from your childhood still drives you today?","बचपन का कौन सा पैसे-विश्वास आज भी आपको चलाता है?","Bachpan ka kaunsa paise-vishwaas aaj bhi aapko chalata hai?")},

 {id:"mpsy5",title:L("The best dividend is freedom","सबसे बड़ी dividend — आज़ादी","Sabse badi dividend — aazaadi"),sub:L("Money buys control over your time","पैसा समय पर कंट्रोल खरीदता","Paisa samay pe control khareedta"),mins:4,
  beats:{
   sit:L("A higher-paying job that eats all your time, vs a modest one with control over your days — which is 'richer'?","एक ज़्यादा तनख्वाह वाली नौकरी जो सारा समय खा जाए, बनाम एक मामूली जिसमें दिनों पर कंट्रोल — कौन 'अमीर'?","Ek zyada tankhwaah wali naukri jo saara samay kha jaaye, banaam ek maamooli jismein dinon pe control — kaun 'ameer'?"),
   myth:{lie:L("More money always means a better life.","ज़्यादा पैसा हमेशा बेहतर ज़िंदगी।","Zyada paisa hamesha behtar zindagi."),truth:L("Money's highest dividend is control over your own time; beyond 'enough', freedom drives happiness more than more stuff.","पैसे की सबसे बड़ी dividend अपने समय पर कंट्रोल; 'काफी' के आगे आज़ादी, ज़्यादा सामान से ज़्यादा खुशी देती।","Paise ki sabse badi dividend apne samay pe control; 'kaafi' ke aage aazaadi, zyada saamaan se zyada khushi deti.")},
   reflex:L("Optimising only for income, ignoring the time and autonomy it costs.","सिर्फ इनकम के लिए optimise, उसकी समय-कीमत अनदेखा।","Sirf income ke liye optimise, uski samay-keemat andekha."),
   q:L("Am I using money to buy stuff — or to buy freedom over my time?","मैं पैसे से सामान खरीद रहा हूँ — या अपने समय पर आज़ादी?","Main paise se saamaan khareed raha hoon — ya apne samay pe aazaadi?"),
   fw:L("Beyond covering your needs and 'enough', money's most valuable use is buying <b>control over your time</b> — the ability to do what you want, when you want, with whom you want. Research and experience agree: autonomy over your day drives lasting happiness far more than another upgrade. Use money to build options — a buffer, the power to say no, to walk away.","ज़रूरतों और 'काफी' के आगे, पैसे का सबसे कीमती इस्तेमाल <b>अपने समय पर कंट्रोल</b> खरीदना — जो चाहो, जब चाहो, जिसके साथ चाहो करना। अनुभव और शोध सहमत: दिन पर autonomy, एक और अपग्रेड से कहीं ज़्यादा टिकाऊ खुशी देती। पैसे से options बनाओ — बफर, ना कहने की ताकत।","Zaroorton aur 'kaafi' ke aage, paise ka sabse keemti istemal <b>apne samay pe control</b> khareedna — jo chaho, jab chaho, jiske saath chaho karna. Anubhav aur shodh sehmat: din pe autonomy, ek aur upgrade se kahin zyada tikaau khushi deti. Paise se options banao — buffer, na kehne ki taaqat."),
   call:L("Optimise for control over your time, not just the highest income; what freedom you buy is your call.","सिर्फ सबसे ज़्यादा इनकम नहीं, अपने समय पर कंट्रोल के लिए optimise करो; कौन सी आज़ादी खरीदो, आपका फैसला।","Sirf sabse zyada income nahi, apne samay pe control ke liye optimise karo; kaun si aazaadi khareedo, aapka faisla.")
  },
  dd:{ex:[
   L("Once your basic needs and your 'enough' are covered, extra money's greatest power isn't buying more things — it's buying control over your time. Being able to wake up and shape your own day, take a break, refuse work that drains you, or leave a bad situation is a form of wealth that stuff can't match. A big salary that owns every hour of your life can leave you poorer, in what matters, than a modest income with real autonomy.","बुनियादी ज़रूरतें और 'काफी' पूरे होने पर, बचे पैसे की सबसे बड़ी ताकत ज़्यादा सामान नहीं — अपने समय पर कंट्रोल। अपना दिन खुद बनाना, ब्रेक लेना, थकाऊ काम मना करना, बुरी स्थिति छोड़ना — यह वेल्थ सामान नहीं दे सकता। हर घंटा छीनती बड़ी सैलरी असल में गरीब कर सकती।","Buniyaadi zaroortein aur 'kaafi' poore hone pe, bache paise ki sabse badi taaqat zyada saamaan nahi — apne samay pe control. Apna din khud banaana, break lena, thakaau kaam mana karna, buri sthiti chhodna — yeh wealth saamaan nahi de sakta. Har ghanta chheenti badi salary asal mein gareeb kar sakti."),
   L("This reframes why we save and invest at all: not to hoard a big number, but to slowly buy freedom — a buffer that lets you say no, take risks, or ride out a crash without panic (M5/M7). Every rupee of savings is a small piece of future autonomy. So when you weigh a choice — a job, a purchase, a hustle — ask not just 'what does it pay?' but 'what does it cost me in time and control, and what freedom does it buy?'","यह फिर से बताता क्यों बचाते-निवेश करते हैं: बड़ा नंबर जमा करने को नहीं, धीरे-धीरे आज़ादी खरीदने को — एक बफर जो ना कहने, जोखिम लेने, बिना पैनिक क्रैश झेलने दे (M5/M7)। हर रुपया भविष्य की autonomy का टुकड़ा। तो पूछो सिर्फ 'कितना देता?' नहीं, 'समय-कंट्रोल में क्या लेता, कौन सी आज़ादी देता?'","Yeh phir se bataata kyun bachaate-nivesh karte hain: bada number jama karne ko nahi, dheere-dheere aazaadi khareedne ko — ek buffer jo na kehne, jokhim lene, bina panic crash jhelne de (M5/M7). Har rupaya bhavishya ki autonomy ka tukda. Toh poocho sirf 'kitna deta?' nahi, 'samay-control mein kya leta, kaun si aazaadi deta?'")],
   faq:[
    {q:L("Does this mean don't chase a good income?","तो अच्छी इनकम का पीछा न करूँ?","Toh achhi income ka peechha na karun?"),a:L("Chase it — but count the time-and-control cost too, and use the money to buy freedom, not just a bigger lifestyle.","करो — पर समय-कंट्रोल की कीमत भी गिनो, और पैसे से आज़ादी खरीदो, बड़ी लाइफस्टाइल नहीं।","Karo — par samay-control ki keemat bhi gino, aur paise se aazaadi khareedo, badi lifestyle nahi.")},
    {q:L("How does saving buy freedom?","बचत आज़ादी कैसे खरीदती?","Bachat aazaadi kaise khareedti?"),a:L("A buffer lets you say no, take breaks, and survive shocks without panic — options are freedom.","बफर ना कहने, ब्रेक, बिना पैनिक झटके झेलने देता — options ही आज़ादी।","Buffer na kehne, break, bina panic jhatke jhelne deta — options hi aazaadi.")}
   ]},
  terms:[{k:L("Time autonomy","समय की autonomy","Time autonomy"),d:L("Control over how you spend your own time — money's highest dividend.","अपना समय कैसे बिताएँ उस पर कंट्रोल — पैसे की सबसे बड़ी dividend।","Apna samay kaise bitaayein us pe control — paise ki sabse badi dividend.")},{k:L("Financial freedom","फाइनेंशियल आज़ादी","Financial aazaadi"),d:L("Enough buffer/assets to have real choices about your life.","ज़िंदगी पर असली विकल्प देने भर बफर/एसेट।","Zindagi pe asli vikalp dene bhar buffer/asset.")}],
  action:{h:L("Price the freedom","आज़ादी की कीमत","Aazaadi ki keemat"),p:L("Think of one choice you'd make if money gave you full control of your time — write it down.","एक चीज़ सोचो जो करते अगर पैसा समय पर पूरा कंट्रोल देता — लिख लो।","Ek cheez socho jo karte agar paisa samay pe poora control deta — likh lo.")},
  quiz:[
   {q:L("Beyond 'enough', money's most valuable use is…","'काफी' के आगे पैसे का सबसे कीमती इस्तेमाल…","'Kaafi' ke aage paise ka sabse keemti istemal…"),o:[L("Buying more stuff","ज़्यादा सामान खरीदना","Zyada saamaan khareedna"),L("Buying control over your time","अपने समय पर कंट्रोल खरीदना","Apne samay pe control khareedna"),L("Impressing people","लोगों को इम्प्रेस","Logon ko impress"),L("Taking big bets","बड़े दांव","Bade daanv")],a:1,why:L("Autonomy over your time drives lasting happiness more than more things.","समय पर autonomy, ज़्यादा सामान से ज़्यादा टिकाऊ खुशी।","Samay pe autonomy, zyada saamaan se zyada tikaau khushi.")},
   {q:L("Savings, in this view, are really buying…","इस नज़रिए में बचत असल में खरीदती…","Is nazariye mein bachat asal mein khareedti…"),o:[L("A bigger number to brag about","शेखी बघारने को बड़ा नंबर","Shekhi baghaarne ko bada number"),L("Future freedom and options","भविष्य की आज़ादी और options","Bhavishya ki aazaadi aur options"),L("Guaranteed status","पक्का स्टेटस","Pakka status"),L("Nothing useful","कुछ काम का नहीं","Kuch kaam ka nahi")],a:1,why:L("Each rupee saved is a piece of future autonomy — the power to choose.","हर बचा रुपया भविष्य की autonomy — चुनने की ताकत।","Har bacha rupaya bhavishya ki autonomy — chunne ki taaqat.")}
  ],
  reflect:L("What would you do differently with more control over your time?","अपने समय पर ज़्यादा कंट्रोल से आप क्या अलग करते?","Apne samay pe zyada control se aap kya alag karte?")},

 {id:"mpsy6",title:L("Comparison, the thief of joy","तुलना, खुशी की चोर","Tulna, khushi ki chor"),sub:L("Run your own race","अपनी दौड़ दौड़ो","Apni daud daudo"),mins:4,
  beats:{
   sit:L("Doom-scrolling everyone's vacations and 'gains', you feel poor and behind — even though you're actually doing fine.","सबकी छुट्टियाँ और 'gains' स्क्रॉल करते, आप गरीब और पीछे महसूस करते हो — जबकि असल में ठीक कर रहे हो।","Sabki chhuttiyaan aur 'gains' scroll karte, aap gareeb aur peeche mehsoos karte ho — jabki asal mein theek kar rahe ho."),
   myth:{lie:L("I'll finally be happy once I catch up to everyone else.","सबके बराबर पहुँचते ही मैं खुश हो जाऊँगा।","Sabke barabar pahunchte hi main khush ho jaunga."),truth:L("Comparison is the thief of contentment — there's always someone richer, and feeds show highlight reels, not balance sheets.","तुलना संतोष की चोर — हमेशा कोई ज़्यादा अमीर, और feeds highlight दिखाते हैं, balance sheet नहीं।","Tulna santosh ki chor — hamesha koi zyada ameer, aur feeds highlight dikhate hain, balance sheet nahi.")},
   reflex:L("Measuring your worth against others' visible highlights.","अपनी कीमत दूसरों के दिखने वाले highlights से नापना।","Apni keemat doosron ke dikhne wale highlights se naapna."),
   q:L("Whose scoreboard am I actually playing on?","मैं असल में किसका स्कोरबोर्ड खेल रहा हूँ?","Main asal mein kiska scoreboard khel raha hoon?"),
   fw:L("<b>Comparison</b> never ends — climb one rung and there's always someone above, so it steals joy no matter how well you do. Social feeds make it worse: you see others' highlight reels against your full, messy reality. The cure is to run your own race — measure against <b>your</b> goals and your past self, powered by 'enough' (lesson 1) and gratitude. This closes the psychology module.","<b>तुलना</b> कभी खत्म नहीं — एक सीढ़ी चढ़ो, ऊपर कोई और; तो चाहे कितना अच्छा करो, खुशी चुराती। Social feeds और बदतर: दूसरों के highlight बनाम आपकी पूरी, बिखरी हकीकत। इलाज: अपनी दौड़ — <b>अपने</b> गोल और पुराने खुद से नापो, 'काफी' और आभार से। यह psychology मॉड्यूल बंद करता।","<b>Tulna</b> kabhi khatam nahi — ek seedhi chadho, upar koi aur; toh chahe kitna achha karo, khushi churaati. Social feeds aur badtar: doosron ke highlight banaam aapki poori, bikhri haqeeqat. Ilaaj: apni daud — <b>apne</b> goal aur purane khud se naapo, 'kaafi' aur aabhaar se. Yeh psychology module band karta."),
   call:L("Define your own scoreboard — your goals, your progress — and stop racing feeds that only show the highlights.","अपना स्कोरबोर्ड तय करो — अपने गोल, अपनी प्रगति — और उन feeds से रेस बंद करो जो सिर्फ highlight दिखाती हैं।","Apna scoreboard tay karo — apne goal, apni pragati — aur un feeds se race band karo jo sirf highlight dikhaati hain.")
  },
  dd:{ex:[
   L("Comparison is a game you can't win, because the ladder has no top: earn more and your reference group shifts upward, so someone is always ahead. That's why chasing 'more than them' steals contentment no matter how well you're objectively doing. Social media pours fuel on it — you're comparing your ordinary, complete life to everyone else's carefully curated highlight reel (the vacations and wins, never the debts and stress).","तुलना ऐसी बाज़ी जो जीत नहीं सकते, क्योंकि सीढ़ी का शिखर नहीं: ज़्यादा कमाओ, संदर्भ ऊपर खिसके, कोई हमेशा आगे। इसीलिए 'उनसे ज़्यादा' का पीछा संतोष चुराता, चाहे आप कितना अच्छा करो। Social media आग में घी — आपकी पूरी ज़िंदगी बनाम दूसरों की छँटी highlight reel।","Tulna aisi baazi jo jeet nahi sakte, kyunki seedhi ka shikhar nahi: zyada kamao, sandarbh upar khiske, koi hamesha aage. Isiliye 'unse zyada' ka peechha santosh churaata, chahe aap kitna achha karo. Social media aag mein ghee — aapki poori zindagi banaam doosron ki chhanti highlight reel."),
   L("The way out isn't to win the comparison — it's to stop playing that game and run your own race. Measure yourself against your OWN goals (Module 6) and your past self, not strangers' feeds. Anchored by a clear sense of 'enough' (lesson 1) and a habit of gratitude for what you already have, contentment becomes possible at almost any income. This is the heart of the psychology of money: the goal was never to have the most — it was to be at peace with your own enough, free to live your own life.","रास्ता तुलना जीतना नहीं — वो खेल छोड़कर अपनी दौड़ दौड़ना। खुद को <b>अपने</b> गोल (मॉड्यूल 6) और पुराने खुद से नापो, अजनबियों की feeds से नहीं। साफ 'काफी' और आभार से, लगभग किसी भी इनकम पर संतोष मुमकिन। यही psychology of money का दिल।","Raasta tulna jeetna nahi — woh khel chhodkar apni daud daudna. Khud ko apne goal (Module 6) aur purane khud se naapo, ajnabiyon ki feeds se nahi. Saaf 'kaafi' aur aabhaar se, lagbhag kisi bhi income pe santosh mumkin. Yahi psychology of money ka dil.")],
   faq:[
    {q:L("But some comparison motivates me?","पर कुछ तुलना मुझे प्रेरित करती है?","Par kuch tulna mujhe prerit karti hai?"),a:L("A little inspiration is fine; the trap is measuring your worth by it. Aim it at learning, not at feeling behind.","थोड़ी प्रेरणा ठीक; जाल अपनी कीमत उससे नापना। सीखने पर लगाओ, पीछे महसूस करने पर नहीं।","Thodi prerna theek; jaal apni keemat usse naapna. Seekhne pe lagao, peeche mehsoos karne pe nahi.")},
    {q:L("How do I actually stop comparing?","असल में तुलना कैसे रोकूँ?","Asal mein tulna kaise rokun?"),a:L("Define your own goals and 'enough', practise gratitude, and cut the feeds that reliably make you feel behind.","अपने गोल और 'काफी' तय करो, आभार, और उन feeds को काटो जो पीछे महसूस कराती हैं।","Apne goal aur 'kaafi' tay karo, aabhaar, aur un feeds ko kaato jo peeche mehsoos karaati hain.")}
   ]},
  terms:[{k:L("Social comparison","सोशल तुलना","Social comparison"),d:L("Judging your worth against others — usually their highlights.","अपनी कीमत दूसरों से आँकना — अक्सर उनके highlights से।","Apni keemat doosron se aankna — aksar unke highlights se.")},{k:L("Contentment","संतोष","Contentment"),d:L("Peace with your own 'enough', independent of others.","अपने 'काफी' से शांति, दूसरों से स्वतंत्र।","Apne 'kaafi' se shaanti, doosron se swatantra.")}],
  action:{h:L("Define your scoreboard","अपना स्कोरबोर्ड तय करो","Apna scoreboard tay karo"),p:L("Write the 2-3 personal measures you'll judge your progress by — and one feed you'll mute that makes you feel behind.","2-3 निजी माप लिखो जिनसे प्रगति आँकोगे — और एक feed जो पीछे महसूस कराती है, म्यूट करो।","2-3 niji maap likho jinse pragati aankoge — aur ek feed jo peeche mehsoos karaati hai, mute karo.")},
  quiz:[
   {q:L("Why is comparison called the thief of joy?","तुलना को खुशी की चोर क्यों कहते?","Tulna ko khushi ki chor kyun kehte?"),o:[L("It's illegal","यह गैरकानूनी","Yeh gairkaanooni"),L("There's always someone ahead, so it never satisfies","हमेशा कोई आगे, तो कभी संतोष नहीं","Hamesha koi aage, toh kabhi santosh nahi"),L("It costs money","इसमें पैसा लगता","Ismein paisa lagta"),L("It's slow","यह धीमी","Yeh dheemi")],a:1,why:L("The ladder has no top — comparison steals contentment at every level.","सीढ़ी का शिखर नहीं — तुलना हर स्तर पर संतोष चुराती।","Seedhi ka shikhar nahi — tulna har star pe santosh churaati.")},
   {q:L("The cure for comparison is to…","तुलना का इलाज…","Tulna ka ilaaj…"),o:[L("Earn more than everyone","सबसे ज़्यादा कमाना","Sabse zyada kamaana"),L("Run your own race vs your goals & past self","अपने गोल और पुराने खुद से अपनी दौड़","Apne goal aur purane khud se apni daud"),L("Scroll more feeds","और feeds scroll","Aur feeds scroll"),L("Hide your money","पैसा छुपाना","Paisa chhupaana")],a:1,why:L("Measure against your own goals and 'enough', not strangers' highlights.","अपने गोल और 'काफी' से नापो, अजनबियों के highlights से नहीं।","Apne goal aur 'kaafi' se naapo, ajnabiyon ke highlights se nahi.")}
  ],
  reflect:L("Whose highlight reel most makes you feel behind — and is that comparison even fair?","किसकी highlight reel आपको सबसे ज़्यादा पीछे महसूस कराती है — और क्या वो तुलना वाजिब भी है?","Kiski highlight reel aapko sabse zyada peeche mehsoos karaati hai — aur kya woh tulna vaajib bhi hai?")}
]};

function today(){return new Date().toISOString().slice(0,10);}
function bumpStreak(){const t=today();if(S.last===t)return;const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  S.streak=(S.last===y)?S.streak+1:1;S.last=t;S.longest=Math.max(S.longest,S.streak);
  S.days=[...new Set([...S.days,t])].slice(-30);save();}
function levelOf(x){let L=LEVELS[0],i=0;for(let k=0;k<LEVELS.length;k++){if(x>=LEVELS[k].x){L=LEVELS[k];i=k;}}
  const next=LEVELS[i+1];return{L,i,next,pct:next?Math.min(1,(x-L.x)/(next.x-L.x)):1};}
function nextLesson(){for(let mi=0;mi<MODULES.length;mi++){if(!moduleUnlocked(mi))break;for(const les of MODULES[mi].lessons)if(!S.done.includes(les.id))return les;}return null;}

let simMode="lump";const SIMCHIPS={lump:[["₹500",500],["₹2,000",2000],["₹10,000",10000],["₹25,000",25000]],sip:[["₹500",500],["₹1,000",1000],["₹2,500",2500],["₹5,000",5000]]};
let simA=500,simY=15,simR=11;
function Sim(){

  view.innerHTML=`<div class="screen pad">
    <div class="eyebrow">${t(UI.simEyebrow)}</div>
    <h1 class="h-title" style="font-size:1.6rem;margin:6px 0 4px">${t(UI.simH)}</h1>

      <div class="field"><div class="flab"><span class="l" id="amL">${simMode==='sip'?t(UI.amtMonth):t(UI.amtOnce)}</span><span class="v">₹<span id="amV">${simA}</span></span></div>
        <div class="chips" id="amChips"></div>

      <div class="field"><div class="flab"><span class="l">${t(UI.years)}</span><span class="v"><span id="yrV">${simY}</span> ${t(UI.bendYearW)}s</span></div><input type="range" id="yrR" min="1" max="30" value="${simY}"></div>
      <div class="field" style="margin-bottom:0"><div class="flab"><span class="l">${t(UI.assumedRet)}</span><span class="v"><span id="rV">${simR}</span>%</span></div><input type="range" id="rR" min="4" max="15" step="0.5" value="${simR}">
        <div class="faint" style="font-size:.72rem;margin-top:5px">${t(UI.simRateNote)}</div></div>
    </div>
    <div class="simres"><div class="r"><div class="k">${t(UI.invested)}</div><div class="n" id="sInv">—</div></div><div class="r total"><div class="k">${t(UI.growsTo)}</div><div class="n" id="sTot">—</div></div><div class="r gain"><div class="k">${t(UI.growth)}</div><div class="n" id="sGain">—</div></div></div>
    <div class="card pad"><canvas id="simCv" width="700" height="360" style="width:100%;height:auto;display:block"></canvas>
      <div class="legend"><span><span class="sw" style="background:var(--line-strong)"></span>${t(UI.invested)}</span><span><span class="sw" style="background:var(--accent)"></span>${t(UI.growsTo)}</span><span><span class="sw" style="background:var(--gold)"></span>Bend</span></div>
      <div class="bendnote">${t(UI.bendAround)} <b>${t(UI.bendYearW)} <span id="bY">—</span></b> ${t(UI.bendMsg)}</div>
    </div>
  </div>`;
  renderSimChips();
  ["amR","yrR","rR"].forEach(id=>document.getElementById(id).addEventListener("input",readSim));
  readSim();
}
window.setSimMode=m=>{simMode=m;simA=m==='sip'?2000:500;Sim();};
function renderSimChips(){const box=document.getElementById("amChips");box.innerHTML="";SIMCHIPS[simMode].forEach(([lab,val])=>{const b=document.createElement("button");b.className="chip"+(val===simA?" on":"");b.textContent=lab;b.onclick=()=>{simA=val;document.getElementById("amR").value=val;readSim();};box.appendChild(b);});}
function readSim(){simA=+document.getElementById("amR").value;simY=+document.getElementById("yrR").value;simR=+document.getElementById("rR").value;
  document.getElementById("amV").textContent=simA.toLocaleString("en-IN");document.getElementById("yrV").textContent=simY;document.getElementById("rV").textContent=simR;
  [...document.querySelectorAll("#amChips .chip")].forEach((c,i)=>c.classList.toggle("on",SIMCHIPS[simMode][i][1]===simA));
  const s=simSeries(simA,simY,simR/100),last=s[s.length-1];
  document.getElementById("sInv").textContent=short(last.inv);document.getElementById("sTot").textContent=short(last.val);document.getElementById("sGain").textContent=short(last.val-last.inv);
  const by=s.find(p=>p.y>0&&(p.val-p.inv)>=p.inv);document.getElementById("bY").textContent=by?by.y:("beyond "+simY);
  drawSim(s);}
function simSeries(P,Y,r){const a=[];if(simMode==="lump"){for(let y=0;y<=Y;y++)a.push({y,inv:P,val:P*Math.pow(1+r,y)});}else{const i=r/12;for(let y=0;y<=Y;y++){const n=y*12,val=i===0?P*n:P*((Math.pow(1+i,n)-1)/i)*(1+i);a.push({y,inv:P*n,val});}}return a;}
function short(n){if(n>=1e7)return"₹"+(n/1e7).toFixed(2)+"Cr";if(n>=1e5)return"₹"+(n/1e5).toFixed(2)+"L";if(n>=1e3)return"₹"+(n/1e3).toFixed(0)+"k";return"₹"+Math.round(n);}
function cssv(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function drawSim(s){const cv=document.getElementById("simCv");if(!cv)return;const dpr=Math.min(devicePixelRatio||1,2),W=cv.clientWidth||700,H=360;cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+"px";const x=cv.getContext("2d");x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);
  const pT=12,pB=22,pS=6,Y=s[s.length-1].y,mx=s[s.length-1].val||1;const px=v=>pS+(W-2*pS)*(v/Y),py=v=>H-pB-(H-pB-pT)*(v/mx);
  x.strokeStyle=cssv("--line");x.lineWidth=1;for(let g=0;g<=4;g++){const gy=pT+(H-pB-pT)*g/4;x.globalAlpha=.7;x.beginPath();x.moveTo(pS,gy);x.lineTo(W-pS,gy);x.stroke();x.globalAlpha=1;}
  // gains band
  x.beginPath();s.forEach((p,i)=>{const X=px(p.y),V=py(p.val);i?x.lineTo(X,V):x.moveTo(X,V);});for(let i=s.length-1;i>=0;i--)x.lineTo(px(s[i].y),py(s[i].inv));x.closePath();x.fillStyle=cssv("--accent-wash");x.fill();
  // principal band
  x.beginPath();s.forEach((p,i)=>{const X=px(p.y),V=py(p.inv);i?x.lineTo(X,V):x.moveTo(X,V);});x.lineTo(px(Y),py(0));x.lineTo(px(0),py(0));x.closePath();x.fillStyle=cssv("--line-strong");x.globalAlpha=.5;x.fill();x.globalAlpha=1;
  // value line
  x.beginPath();s.forEach((p,i)=>{const X=px(p.y),V=py(p.val);i?x.lineTo(X,V):x.moveTo(X,V);});x.strokeStyle=cssv("--accent");x.lineWidth=2.6;x.lineJoin="round";x.stroke();
  // invested dashed
  x.setLineDash([4,4]);x.beginPath();s.forEach((p,i)=>{const X=px(p.y),V=py(p.inv);i?x.lineTo(X,V):x.moveTo(X,V);});x.strokeStyle=cssv("--ink-faint");x.lineWidth=1.5;x.stroke();x.setLineDash([]);
  const by=s.find(p=>p.y>0&&(p.val-p.inv)>=p.inv);if(by){const X=px(by.y),V=py(by.val);x.strokeStyle=cssv("--gold");x.setLineDash([3,3]);x.beginPath();x.moveTo(X,pT);x.lineTo(X,H-pB);x.stroke();x.setLineDash([]);x.fillStyle=cssv("--gold");x.beginPath();x.arc(X,V,5,0,7);x.fill();}
  x.fillStyle=cssv("--ink-faint");x.font="11px 'Space Mono',monospace";x.textAlign="center";[0,Math.round(Y/2),Y].forEach(yy=>x.fillText("yr"+yy,px(yy),H-6));}

/* ---------- PROFILE / SCORECARD ---------- */
function Profile(){
  const lv=levelOf(S.xp),circ=2*Math.PI*54,off=circ*(1-lv.pct);
  const arche=S.done.length>=6?t(UI.archThinker):S.done.length>=3?t(UI.archCurious):S.done.length>=1?t(UI.archStart):t(UI.archNew);

  const masteryRows=MODULES.map(m=>{const dn=m.lessons.filter(l=>S.done.includes(l.id)).length,pct=Math.round(dn/m.lessons.length*100);

    +(LOCKED[0]?`<div class="mrow"><div class="top"><span class="faint">${t(LOCKED[0].title)}</span><span class="mono faint">${t(UI.locked)}</span></div><div class="mbar"><i style="width:0"></i></div></div>`:"");
  view.innerHTML=`<div class="screen pad">
    <div class="pcard">
      <div class="levelring"><svg width="130" height="130" viewBox="0 0 130 130"><circle cx="65" cy="65" r="54" fill="none" stroke="var(--surface-3)" stroke-width="10"/><circle cx="65" cy="65" r="54" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" transform="rotate(-90 65 65)" id="lvRing"/></svg>
        <div class="mid"><div style="font-size:1.9rem">${lv.L.e}</div><div class="lv">${t(UI.levelW)} ${lv.i+1}</div><div class="nm">${lv.L.n}</div></div></div>
      <div class="archetype">${arche}</div>

      <div class="flames7">${last7.map(f=>`<div class="fd ${f.on?'on':''}">${f.on?'🔥':'·'}<span class="dn">${f.d}</span></div>`).join("")}</div>
      <div class="faint" style="font-size:.75rem">${t(UI.current)} ${S.streak}🔥 · ${t(UI.best)} ${S.longest}🔥</div>
    </div>

    <div class="sect-h"><span class="t">${t(UI.achievements)}</span><span class="a">${S.badges.length}/${BADGES.length}</span></div>
    <div class="badges">${BADGES.map(b=>{const u=S.badges.includes(b.id);return `<div class="bdg ${u?'unlocked':'locked'}"><div class="em">${b.em}</div><div class="bn">${t(BADGENAMES[b.id])}</div><div class="bd">${u?t(UI.unlocked):b.d}</div></div>`;}).join("")}</div>

    <button class="btn ghost" style="margin-top:16px" onclick="resetAll()">${t(UI.resetProg)}</button>

  requestAnimationFrame(()=>{const r=document.getElementById("lvRing");if(r){r.style.transition="stroke-dashoffset 1.1s ease";r.style.strokeDashoffset=off;}document.querySelectorAll(".mbar i[data-w]").forEach(i=>i.style.width=i.dataset.w+"%");});
}
window.resetAll=()=>{if(confirm(t(UI.resetConfirm))){S=Object.assign({},DEFAULT);save();go("home");}};

/* ---------- FX ---------- */
function countUp(){document.querySelectorAll("[data-count]").forEach(el=>{const t=+el.dataset.count;if(t===0){el.textContent="0";return;}let c=0;const st=Math.max(1,Math.ceil(t/28));const iv=setInterval(()=>{c+=st;if(c>=t){c=t;clearInterval(iv);}el.textContent=c;},22);});}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2200);}
const cc=document.getElementById("confetti");let cctx=cc.getContext("2d");
function reduced(){return matchMedia("(prefers-reduced-motion:reduce)").matches;}
function bigConfetti(){if(reduced())return;const dev=cc.parentElement.getBoundingClientRect();cc.width=dev.width;cc.height=dev.height;
  const cols=["#0E8C6B","#C77E1A","#5B54B8","#37C098","#E0A43A"];let P=[...Array(90)].map(()=>({x:cc.width/2,y:cc.height*.32,vx:(Math.random()-.5)*11,vy:Math.random()*-11-3,r:Math.random()*5+3,c:cols[Math.random()*cols.length|0],a:1,rot:Math.random()*6}));
  let n=0;(function anim(){cctx.clearRect(0,0,cc.width,cc.height);n++;P.forEach(p=>{p.vy+=.32;p.x+=p.vx;p.y+=p.vy;p.rot+=.2;p.a-=.011;cctx.globalAlpha=Math.max(0,p.a);cctx.fillStyle=p.c;cctx.save();cctx.translate(p.x,p.y);cctx.rotate(p.rot);cctx.fillRect(-p.r,-p.r,p.r*2,p.r*1.4);cctx.restore();});cctx.globalAlpha=1;if(n<130)requestAnimationFrame(anim);else cctx.clearRect(0,0,cc.width,cc.height);})();}
function burstAt(el){if(reduced())return;const dev=cc.parentElement.getBoundingClientRect(),r=el.getBoundingClientRect();cc.width=dev.width;cc.height=dev.height;const ox=r.left-dev.left+r.width/2,oy=r.top-dev.top+r.height/2;const cols=["#0E8C6B","#37C098","#E0A43A"];let P=[...Array(24)].map(()=>({x:ox,y:oy,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,r:Math.random()*3+2,c:cols[Math.random()*3|0],a:1}));let n=0;(function a2(){cctx.clearRect(0,0,cc.width,cc.height);n++;P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.a-=.03;cctx.globalAlpha=Math.max(0,p.a);cctx.fillStyle=p.c;cctx.beginPath();cctx.arc(p.x,p.y,p.r,0,7);cctx.fill();});cctx.globalAlpha=1;if(n<45)requestAnimationFrame(a2);else cctx.clearRect(0,0,cc.width,cc.height);})();}

  document.getElementById("langsheet").classList.remove("open");
