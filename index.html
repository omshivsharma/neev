    {q:L("Can market-linked lose money?","क्या मार्केट-लिंक्ड पैसा खो सकता है?","Kya market-linked paisa kho sakta hai?"),a:L("Yes, especially over short periods — which is exactly why it suits long horizons that can ride out the dips.","हाँ, खासकर छोटे समय में — इसीलिए यह लंबे होराइज़न को सूट करता है जो डिप झेल सके।","Haan, khaaskar chhote samay mein — isiliye yeh lambe horizon ko suit karta hai jo dip jhel sake.")}
   ]},
  terms:[{k:L("Fixed-return","फिक्स्ड-रिटर्न","Fixed-return"),d:L("A known, steady return decided up front — predictable, usually lower.","पहले से तय ज्ञात, स्थिर रिटर्न — predictable, आमतौर पर कम।","Pehle se tay gyaat, steady return — predictable, aam taur pe kam.")},{k:L("Market-linked","मार्केट-लिंक्ड","Market-linked"),d:L("Returns that swing with the market — bumpier, higher long-run potential.","रिटर्न जो मार्केट के साथ झूलें — बंपी, लंबे में ज़्यादा संभावना।","Return jo market ke saath jhoolein — bumpy, lambe mein zyada sambhavna.")}],
  action:L("Compare a fixed rate vs a market index over 1 year and over a longer window (real data).","एक फिक्स्ड रेट बनाम मार्केट इंडेक्स को 1 साल और लंबे window में तुलना करो (असली डेटा)।","Ek fixed rate banaam market index ko 1 saal aur lambe window mein compare karo (real data)."),
  quiz:[
   {q:L("Market-linked investments are best suited to…","मार्केट-लिंक्ड सबसे बेहतर किसके लिए…","Market-linked sabse behtar kiske liye…"),o:[L("Money needed next month","अगले महीने चाहिए पैसा","Agle mahine chahiye paisa"),L("Long horizons that can ride bumps","लंबे होराइज़न जो बंप झेल सकें","Lambe horizon jo bump jhel sakein"),L("Emergency funds","इमरजेंसी फंड","Emergency fund"),L("Nobody","किसी के लिए नहीं","Kisi ke liye nahi")],a:1,why:L("Bumps need time to recover — long horizons can absorb them for higher potential.","बंप को recover का समय चाहिए — लंबे होराइज़न झेल लेते हैं।","Bump ko recover ka samay chahiye — lambe horizon jhel lete hain.")},
   {q:L("'Fixed = safe' is only true against…","'फिक्स्ड = सेफ' सिर्फ किसके खिलाफ सच…","'Fixed = safe' sirf kiske khilaaf sach…"),o:[L("Inflation","इन्फ्लेशन","Inflation"),L("Bumpiness (volatility)","बंपीनेस (वोलैटिलिटी)","Bumpiness (volatility)"),L("Everything","सब कुछ","Sab kuch"),L("Nothing","कुछ नहीं","Kuch nahi")],a:1,why:L("Fixed protects from swings but its real value can still lose to inflation.","फिक्स्ड झूलों से बचाता है पर असली वैल्यू इन्फ्लेशन से हार सकती है।","Fixed jhoolon se bachata hai par asli value inflation se haar sakti hai.")}
  ],
  reflect:L("Which type were you defaulting to — and did the horizon justify it?","आप कौन सा टाइप डिफ़ॉल्ट कर रहे थे — होराइज़न ने उसे सही ठहराया?","Aap kaunsa type default kar rahe the — horizon ne use sahi thehraaya?")},

 {id:"m4l5",title:L("Pick it yourself, or let a vehicle do it","खुद चुनो, या किसी वाहन को चुनने दो","Khud chuno, ya kisi vehicle ko chunne do"),sub:L("Direct vs pooled/managed","डायरेक्ट बनाम पूल्ड/मैनेज्ड","Direct vs pooled/managed"),mins:4,
  beats:{
   sit:L("You can pick investments yourself, or let a pooled/managed vehicle do it. The choice feels overwhelming.","आप खुद इन्वेस्टमेंट चुन सकते हो, या किसी पूल्ड/मैनेज्ड वाहन को करने दो। चुनाव भारी लगता है।","Aap khud investment chun sakte ho, ya kisi pooled/managed vehicle ko karne do. Chunaav bhaari lagta hai."),
   myth:{lie:L("Doing it yourself is always cheaper and better.","खुद करना हमेशा सस्ता और बेहतर है।","Khud karna hamesha sasta aur behtar hai."),truth:L("Managed vehicles trade a fee for convenience & diversification; direct gives control but needs time & skill.","मैनेज्ड वाहन फीस के बदले सुविधा और डाइवर्सिफिकेशन देते हैं; डायरेक्ट कंट्रोल पर समय और स्किल माँगता है।","Managed vehicle fee ke badle suvidha aur diversification dete hain; direct control par samay aur skill maangta hai.")},
   reflex:L("Assuming one is universally right, or avoiding investing because self-selecting feels hard.","मान लेना कि एक हमेशा सही, या खुद चुनना मुश्किल लगने से इन्वेस्टिंग टालना।","Maan lena ki ek hamesha sahi, ya khud chunna mushkil lagne se investing taalna."),
   q:L("Pick myself or let a vehicle do it?","खुद चुनूँ या वाहन को करने दूँ?","Khud chunun ya vehicle ko karne dun?"),
   fw:L("<b>Direct</b> = you choose each holding — full control, but needs time, knowledge, discipline. <b>Pooled/managed</b> = your money joins others', spread across many holdings, run for you — convenient and diversified, but carries a fee (which compounds — Module 3). Both are valid.","<b>डायरेक्ट</b> = आप हर होल्डिंग चुनो — पूरा कंट्रोल, पर समय, ज्ञान, अनुशासन चाहिए। <b>पूल्ड/मैनेज्ड</b> = पैसा दूसरों के साथ, कई होल्डिंग में फैला, आपके लिए चलाया — सुविधाजनक, पर फीस (जो कंपाउंड होती है)। दोनों वैध।","<b>Direct</b> = aap har holding chuno — poora control, par samay, gyaan, anushaasan chahiye. <b>Pooled/managed</b> = paisa doosron ke saath, kai holding mein phaila, aapke liye chalaya — suvidhajanak, par fee (jo compound hoti hai). Dono vaidh."),
   call:L("Which route depends on how much time/skill you have and the cost you'll accept — your call, not a product name.","कौन सा रास्ता = आपके पास कितना समय/स्किल और आप कितनी कीमत मानो — आपका फैसला, प्रोडक्ट नाम नहीं।","Kaunsa rasta = aapke paas kitna samay/skill aur aap kitni keemat maano — aapka faisla, product naam nahi.")
  },
  dd:{ex:[
   L("Direct investing means you research and choose every holding yourself — you get full control and pay no manager, but it demands real time, knowledge and the discipline to not panic. A pooled/managed vehicle bundles your money with many others', spreads it across lots of holdings, and someone runs it for you — instant diversification and convenience, in exchange for a fee.","डायरेक्ट इन्वेस्टिंग यानी आप हर होल्डिंग खुद रिसर्च और चुनो — पूरा कंट्रोल, कोई मैनेजर फीस नहीं, पर असली समय, ज्ञान और घबराने न देने का अनुशासन चाहिए। पूल्ड/मैनेज्ड वाहन आपका पैसा कई के साथ बाँधकर फैलाता, कोई चलाता — तुरंत डाइवर्सिफिकेशन, फीस के बदले।","Direct investing yaani aap har holding khud research aur chuno — poora control, koi manager fee nahi, par asli samay, gyaan aur ghabraane na dene ka anushaasan chahiye. Pooled/managed vehicle aapka paisa kai ke saath baandh ke phailaata, koi chalata — turant diversification, fee ke badle."),
   L("The fee is the key trade-off, because costs compound just like returns (Module 3): a small annual fee, over decades, quietly eats a real chunk of your corpus. So the honest question isn't 'which is better' but 'is the convenience and diversification worth this fee for me, given my time and skill?'. Many people even mix both. We name no product — only the trade-offs.","फीस मुख्य ट्रेड-ऑफ है, क्योंकि लागत रिटर्न की तरह कंपाउंड होती है (मॉड्यूल 3): छोटी सालाना फीस दशकों में corpus का असली हिस्सा खा जाती है। तो सवाल 'कौन बेहतर' नहीं बल्कि 'क्या सुविधा और डाइवर्सिफिकेशन इस फीस के लायक है?'। कई लोग दोनों मिलाते हैं।","Fee mukhya trade-off hai, kyunki laagat return ki tarah compound hoti hai (Module 3): chhoti saalaana fee dashakon mein corpus ka asli hissa kha jaati hai. Toh sawaal 'kaun behtar' nahi balki 'kya suvidha aur diversification is fee ke layak hai?'. Kai log dono milaate hain.")],
   faq:[
    {q:L("Are the fees worth it?","क्या फीस worth है?","Kya fee worth hai?"),a:L("Depends on you — if you lack time/skill, the convenience and diversification can be worth a low fee; if you have both, direct saves cost. Compare honestly.","आप पर निर्भर — समय/स्किल नहीं तो कम फीस worth; दोनों हैं तो डायरेक्ट सस्ता। ईमानदारी से तुलना करो।","Aap pe nirbhar — samay/skill nahi toh kam fee worth; dono hain toh direct sasta. Imaandaari se tulna karo.")},
    {q:L("Can I mix both?","क्या दोनों मिला सकता हूँ?","Kya dono mila sakta hoon?"),a:L("Yes — many keep a managed core for convenience and a small direct portion for control. It's not either/or.","हाँ — कई एक मैनेज्ड कोर और छोटा डायरेक्ट हिस्सा रखते हैं। यह या/या नहीं।","Haan — kai ek managed core aur chhota direct hissa rakhte hain. Yeh ya/ya nahi.")}
   ]},
  terms:[{k:L("Direct investing","डायरेक्ट इन्वेस्टिंग","Direct investing"),d:L("Choosing each holding yourself — full control, needs time & skill.","हर होल्डिंग खुद चुनना — पूरा कंट्रोल, समय और स्किल चाहिए।","Har holding khud chunna — poora control, samay aur skill chahiye.")},{k:L("Pooled/managed vehicle","पूल्ड/मैनेज्ड वाहन","Pooled/managed vehicle"),d:L("Money bundled with others', diversified and run for you, for a fee.","पैसा दूसरों के साथ, फैला और आपके लिए चलाया, फीस के बदले।","Paisa doosron ke saath, phaila aur aapke liye chalaya, fee ke badle.")}],
  action:L("Compare the effect of a small annual fee vs none on a long-run corpus (illustrative — fees compound).","एक छोटी सालाना फीस बनाम शून्य का लंबे corpus पर असर देखो (उदाहरणात्मक — फीस कंपाउंड होती है)।","Ek chhoti saalaana fee banaam shoonya ka lambe corpus pe asar dekho (udaharanaatmak — fee compound hoti hai)."),
  quiz:[
   {q:L("A pooled/managed vehicle mainly offers…","पूल्ड/मैनेज्ड वाहन मुख्यतः क्या देता है…","Pooled/managed vehicle mukhyatah kya deta hai…"),o:[L("Guaranteed returns","गारंटीड रिटर्न","Guaranteed return"),L("Convenience & diversification for a fee","फीस के बदले सुविधा और डाइवर्सिफिकेशन","Fee ke badle suvidha aur diversification"),L("Zero risk","ज़ीरो रिस्क","Zero risk"),L("No fee ever","कभी फीस नहीं","Kabhi fee nahi")],a:1,why:L("You trade a fee for convenience and instant diversification.","आप फीस के बदले सुविधा और तुरंत डाइवर्सिफिकेशन पाते हो।","Aap fee ke badle suvidha aur turant diversification paate ho.")},
   {q:L("Why do fees matter so much long-term?","लंबे में फीस इतनी क्यों मायने रखती है?","Lambe mein fee itni kyun maayne rakhti hai?"),o:[L("They don't","नहीं रखती","Nahi rakhti"),L("Costs compound like returns","लागत रिटर्न की तरह कंपाउंड","Laagat return ki tarah compound"),L("They're refunded","वापस मिल जाती है","Wapas mil jaati hai"),L("They avoid tax","टैक्स बचाती है","Tax bachaati hai")],a:1,why:L("A small fee, compounding over decades, quietly eats a real chunk of the corpus.","छोटी फीस, दशकों कंपाउंड होकर, corpus का असली हिस्सा खा जाती है।","Chhoti fee, dashakon compound ho ke, corpus ka asli hissa kha jaati hai.")}
  ],
  reflect:L("Do you honestly have the time & interest to go direct?","क्या सच में आपके पास डायरेक्ट जाने का समय और रुचि है?","Kya sach mein aapke paas direct jaane ka samay aur ruchi hai?")},

 {id:"m4l6",title:L("Match the type to the goal","टाइप को गोल से मैच करो","Type ko goal se match karo"),sub:L("A framework, not a pick","एक फ्रेमवर्क, पिक नहीं","A framework, not a pick"),mins:4,
  beats:{
   sit:L("You now know the blocks — equity, debt, gold, fixed, market-linked. But which for which goal?","अब आप ब्लॉक जानते हो — इक्विटी, डेट, गोल्ड, फिक्स्ड, मार्केट-लिंक्ड। पर किस गोल के लिए कौन?","Ab aap block jaante ho — equity, debt, gold, fixed, market-linked. Par kis goal ke liye kaun?"),
   myth:{lie:L("There's one best instrument everyone should use.","एक बेस्ट इंस्ट्रूमेंट है जो सबको इस्तेमाल करना चाहिए।","Ek best instrument hai jo sabko istemal karna chahiye."),truth:L("The right type follows the goal's horizon, liquidity need, and your risk capacity — not a universal pick.","सही टाइप गोल के होराइज़न, लिक्विडिटी ज़रूरत और रिस्क कैपेसिटी से आता है — कोई सार्वभौमिक पिक नहीं।","Sahi type goal ke horizon, liquidity zaroorat aur risk capacity se aata hai — koi universal pick nahi.")},
   reflex:L("Asking 'which is the best investment?' instead of 'best for this goal?'","'सबसे अच्छा इन्वेस्टमेंट कौन?' पूछना, 'इस गोल के लिए सबसे अच्छा?' नहीं।","'Sabse achha investment kaun?' poochhna, 'is goal ke liye sabse achha?' nahi."),
   q:L("Which type fits which goal?","कौन सा टाइप किस गोल के लिए?","Kaunsa type kis goal ke liye?"),
   fw:L("Map each goal by three filters — <b>horizon</b>, <b>liquidity need</b> (both Module 1), and <b>risk capacity</b>. Near + reachable → steadier types; long + can-bear-bumps → growth types; a small hedge for balance. This bridges to building a plan.","हर गोल को तीन फिल्टर से मैप करो — <b>होराइज़न</b>, <b>लिक्विडिटी ज़रूरत</b> (दोनों मॉड्यूल 1), और <b>रिस्क कैपेसिटी</b>। जल्द + रीचेबल → स्थिर टाइप; लंबा + बंप झेल सके → ग्रोथ टाइप; संतुलन को थोड़ा हेज।","Har goal ko teen filter se map karo — <b>horizon</b>, <b>liquidity zaroorat</b> (dono Module 1), aur <b>risk capacity</b>. Jald + reachable → steady type; lamba + bump jhel sake → growth type; santulan ko thoda hedge."),
   call:L("The exact instrument is always your call from these filters — the course makes you able to reason it, not dependent on a tip.","सटीक इंस्ट्रूमेंट हमेशा इन फिल्टर से आपका फैसला — कोर्स आपको सोचने लायक बनाता है, टिप पर निर्भर नहीं।","Sateek instrument hamesha in filter se aapka faisla — course aapko sochne layak banata hai, tip pe nirbhar nahi.")
  },
  dd:{ex:[
   L("Here's the whole module coming together. Don't ask 'what's the best investment?' — ask 'what's best for THIS goal?'. Run each goal through three filters: its horizon (how long till you need it), its liquidity need (how reachable it must be), and your risk capacity (how much bumpiness you can bear). Those three point you to a TYPE, not a product.","यहाँ पूरा मॉड्यूल जुड़ता है। 'सबसे अच्छा इन्वेस्टमेंट?' मत पूछो — 'इस गोल के लिए सबसे अच्छा?' पूछो। हर गोल को तीन फिल्टर से चलाओ: होराइज़न, लिक्विडिटी ज़रूरत, रिस्क कैपेसिटी। ये तीन एक टाइप की ओर इशारा करते हैं, प्रोडक्ट की नहीं।","Yahaan poora module judta hai. 'Sabse achha investment?' mat poochho — 'is goal ke liye sabse achha?' poochho. Har goal ko teen filter se chalao: horizon, liquidity zaroorat, risk capacity. Ye teen ek TYPE ki or ishaara karte hain, product ki nahi."),
   L("Worked mapping — an 8-month goal (a wedding) needs reachable, steady money, so it leans fixed/steadier types; a 20-year goal (retirement) can ride market-linked bumps for growth, with maybe a small hedge for balance. Same logic as Module 1's horizon lesson, now choosing the type. We never name the instrument — we teach the mapping, so you can pick for any goal, for the rest of your life.","उदाहरण — 8-महीने का गोल (शादी) रीचेबल, स्थिर पैसा चाहिए, तो फिक्स्ड/स्थिर की ओर; 20-साल का गोल (रिटायरमेंट) ग्रोथ के लिए मार्केट बंप झेल सकता है, संतुलन को थोड़ा हेज। वही मॉड्यूल 1 का तर्क, अब टाइप चुनते हुए।","Udaharan — 8-mahine ka goal (shaadi) reachable, steady paisa chahiye, toh fixed/steady ki or; 20-saal ka goal (retirement) growth ke liye market bump jhel sakta hai, santulan ko thoda hedge. Wahi Module 1 ka tark, ab type chunte hue.")],
   faq:[

function load(){try{const r=localStorage.getItem("neev");if(r)return Object.assign({},DEFAULT,JSON.parse(r));}catch(e){}return Object.assign({},DEFAULT);}
function save(){try{localStorage.setItem("neev",JSON.stringify(S));}catch(e){}}
function today(){return new Date().toISOString().slice(0,10);}
function bumpStreak(){const t=today();if(S.last===t)return;const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  S.streak=(S.last===y)?S.streak+1:1;S.last=t;S.longest=Math.max(S.longest,S.streak);
  S.days=[...new Set([...S.days,t])].slice(-30);save();}
function levelOf(x){let L=LEVELS[0],i=0;for(let k=0;k<LEVELS.length;k++){if(x>=LEVELS[k].x){L=LEVELS[k];i=k;}}
  const next=LEVELS[i+1];return{L,i,next,pct:next?Math.min(1,(x-L.x)/(next.x-L.x)):1};}
function nextLesson(){for(let mi=0;mi<MODULES.length;mi++){if(!moduleUnlocked(mi))break;for(const les of MODULES[mi].lessons)if(!S.done.includes(les.id))return les;}return null;}
function award(id){if(!S.badges.includes(id)){S.badges.push(id);save();return true;}return false;}

  lNext.textContent=t(UI.done);
  requestAnimationFrame(()=>{const c=document.getElementById("ringC");if(c)c.style.transition="stroke-dashoffset 1s ease",c.style.strokeDashoffset="0";});
}
function finishLesson(){
  const firstTime=!S.done.includes(CURL.id);
  if(firstTime){S.done.push(CURL.id);S.xp+=60;S.myths+=1;bumpStreak();save();}
  let newB=[];
  if(S.done.length>=1&&award("first"))newB.push("first");
  const perfect=CURL.quiz.every((q,i)=>quizState[i]===q.a);
  if(perfect&&award("ace"))newB.push("ace");
  if(S.myths>=3&&award("myth3"))newB.push("myth3");
  if(S.streak>=7&&award("week"))newB.push("week");
  if(S.done.length>=MODULE1.lessons.length&&award("m1"))newB.push("m1");
  save();
  lessonEl.classList.remove("open");
  bigConfetti();
  if(newB.length)setTimeout(()=>toast("🏅 "+t(UI.badgeUnlocked)+" "+t(BADGENAMES[newB[0]])),700);
  go(cur==="learn"?"learn":"home");
}

/* ---------- SIMULATOR ---------- */
let simMode="lump";const SIMCHIPS={lump:[["₹500",500],["₹2,000",2000],["₹10,000",10000],["₹25,000",25000]],sip:[["₹500",500],["₹1,000",1000],["₹2,500",2500],["₹5,000",5000]]};
let simA=500,simY=15,simR=11;
function Sim(){
  if(!S.simUsed){S.simUsed=true;if(award("sim"))setTimeout(()=>toast("🏅 "+t(UI.badgeUnlocked)+" "+t(BADGENAMES.sim)),400);save();}
  view.innerHTML=`<div class="screen pad">
    <div class="eyebrow">${t(UI.simEyebrow)}</div>
    <h1 class="h-title" style="font-size:1.6rem;margin:6px 0 4px">${t(UI.simH)}</h1>
    <p class="dim" style="font-size:.88rem;margin:0 0 18px">${t(UI.simP)}</p>
    <div class="card pad simctrl">
      <div class="modes"><button id="mL" class="${simMode==='lump'?'on':''}" onclick="setSimMode('lump')">${t(UI.onetime)}</button><button id="mS" class="${simMode==='sip'?'on':''}" onclick="setSimMode('sip')">${t(UI.monthly)}</button></div>
      <div class="field"><div class="flab"><span class="l" id="amL">${simMode==='sip'?t(UI.amtMonth):t(UI.amtOnce)}</span><span class="v">₹<span id="amV">${simA}</span></span></div>
        <div class="chips" id="amChips"></div>
        <input type="range" id="amR" min="100" max="50000" step="100" value="${simA}"></div>
      <div class="field"><div class="flab"><span class="l">${t(UI.years)}</span><span class="v"><span id="yrV">${simY}</span> ${t(UI.bendYearW)}s</span></div><input type="range" id="yrR" min="1" max="30" value="${simY}"></div>
      <div class="field" style="margin-bottom:0"><div class="flab"><span class="l">${t(UI.assumedRet)}</span><span class="v"><span id="rV">${simR}</span>%</span></div><input type="range" id="rR" min="4" max="15" step="0.5" value="${simR}">
        <div class="faint" style="font-size:.72rem;margin-top:5px">${t(UI.simRateNote)}</div></div>
    </div>
    <div class="simres"><div class="r"><div class="k">${t(UI.invested)}</div><div class="n" id="sInv">—</div></div><div class="r total"><div class="k">${t(UI.growsTo)}</div><div class="n" id="sTot">—</div></div><div class="r gain"><div class="k">${t(UI.growth)}</div><div class="n" id="sGain">—</div></div></div>
    <div class="card pad"><canvas id="simCv" width="700" height="360" style="width:100%;height:auto;display:block"></canvas>
      <div class="legend"><span><span class="sw" style="background:var(--line-strong)"></span>${t(UI.invested)}</span><span><span class="sw" style="background:var(--accent)"></span>${t(UI.growsTo)}</span><span><span class="sw" style="background:var(--gold)"></span>Bend</span></div>
      <div class="bendnote">${t(UI.bendAround)} <b>${t(UI.bendYearW)} <span id="bY">—</span></b> ${t(UI.bendMsg)}</div>
    </div>
  </div>`;
  renderSimChips();
  ["amR","yrR","rR"].forEach(id=>document.getElementById(id).addEventListener("input",readSim));
  readSim();
}
window.setSimMode=m=>{simMode=m;simA=m==='sip'?2000:500;Sim();};
function renderSimChips(){const box=document.getElementById("amChips");box.innerHTML="";SIMCHIPS[simMode].forEach(([lab,val])=>{const b=document.createElement("button");b.className="chip"+(val===simA?" on":"");b.textContent=lab;b.onclick=()=>{simA=val;document.getElementById("amR").value=val;readSim();};box.appendChild(b);});}
function readSim(){simA=+document.getElementById("amR").value;simY=+document.getElementById("yrR").value;simR=+document.getElementById("rR").value;
  document.getElementById("amV").textContent=simA.toLocaleString("en-IN");document.getElementById("yrV").textContent=simY;document.getElementById("rV").textContent=simR;
  [...document.querySelectorAll("#amChips .chip")].forEach((c,i)=>c.classList.toggle("on",SIMCHIPS[simMode][i][1]===simA));
  const s=simSeries(simA,simY,simR/100),last=s[s.length-1];
  document.getElementById("sInv").textContent=short(last.inv);document.getElementById("sTot").textContent=short(last.val);document.getElementById("sGain").textContent=short(last.val-last.inv);
  const by=s.find(p=>p.y>0&&(p.val-p.inv)>=p.inv);document.getElementById("bY").textContent=by?by.y:("beyond "+simY);
  drawSim(s);}
function simSeries(P,Y,r){const a=[];if(simMode==="lump"){for(let y=0;y<=Y;y++)a.push({y,inv:P,val:P*Math.pow(1+r,y)});}else{const i=r/12;for(let y=0;y<=Y;y++){const n=y*12,val=i===0?P*n:P*((Math.pow(1+i,n)-1)/i)*(1+i);a.push({y,inv:P*n,val});}}return a;}
function short(n){if(n>=1e7)return"₹"+(n/1e7).toFixed(2)+"Cr";if(n>=1e5)return"₹"+(n/1e5).toFixed(2)+"L";if(n>=1e3)return"₹"+(n/1e3).toFixed(0)+"k";return"₹"+Math.round(n);}
function cssv(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function drawSim(s){const cv=document.getElementById("simCv");if(!cv)return;const dpr=Math.min(devicePixelRatio||1,2),W=cv.clientWidth||700,H=360;cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+"px";const x=cv.getContext("2d");x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);
  const pT=12,pB=22,pS=6,Y=s[s.length-1].y,mx=s[s.length-1].val||1;const px=v=>pS+(W-2*pS)*(v/Y),py=v=>H-pB-(H-pB-pT)*(v/mx);
  x.strokeStyle=cssv("--line");x.lineWidth=1;for(let g=0;g<=4;g++){const gy=pT+(H-pB-pT)*g/4;x.globalAlpha=.7;x.beginPath();x.moveTo(pS,gy);x.lineTo(W-pS,gy);x.stroke();x.globalAlpha=1;}
  // gains band
  x.beginPath();s.forEach((p,i)=>{const X=px(p.y),V=py(p.val);i?x.lineTo(X,V):x.moveTo(X,V);});for(let i=s.length-1;i>=0;i--)x.lineTo(px(s[i].y),py(s[i].inv));x.closePath();x.fillStyle=cssv("--accent-wash");x.fill();
  // principal band
  x.beginPath();s.forEach((p,i)=>{const X=px(p.y),V=py(p.inv);i?x.lineTo(X,V):x.moveTo(X,V);});x.lineTo(px(Y),py(0));x.lineTo(px(0),py(0));x.closePath();x.fillStyle=cssv("--line-strong");x.globalAlpha=.5;x.fill();x.globalAlpha=1;
  // value line
  x.beginPath();s.forEach((p,i)=>{const X=px(p.y),V=py(p.val);i?x.lineTo(X,V):x.moveTo(X,V);});x.strokeStyle=cssv("--accent");x.lineWidth=2.6;x.lineJoin="round";x.stroke();
  // invested dashed
  x.setLineDash([4,4]);x.beginPath();s.forEach((p,i)=>{const X=px(p.y),V=py(p.inv);i?x.lineTo(X,V):x.moveTo(X,V);});x.strokeStyle=cssv("--ink-faint");x.lineWidth=1.5;x.stroke();x.setLineDash([]);
  const by=s.find(p=>p.y>0&&(p.val-p.inv)>=p.inv);if(by){const X=px(by.y),V=py(by.val);x.strokeStyle=cssv("--gold");x.setLineDash([3,3]);x.beginPath();x.moveTo(X,pT);x.lineTo(X,H-pB);x.stroke();x.setLineDash([]);x.fillStyle=cssv("--gold");x.beginPath();x.arc(X,V,5,0,7);x.fill();}
  x.fillStyle=cssv("--ink-faint");x.font="11px 'Space Mono',monospace";x.textAlign="center";[0,Math.round(Y/2),Y].forEach(yy=>x.fillText("yr"+yy,px(yy),H-6));}

      <div style="flex:1">${segs.map(([n,v,c])=>`<div class="bucket"><span class="sw" style="background:${c}"></span><span class="bt"><span class="a">${n}</span><span class="b">${Math.round(v/total*100)}% ${t(UI.ofPot)}</span></span><span class="amt">${short(v)}</span></div>`).join("")}</div></div></div>

/* ---------- PROFILE / SCORECARD ---------- */
function Profile(){

  const arche=S.done.length>=6?t(UI.archThinker):S.done.length>=3?t(UI.archCurious):S.done.length>=1?t(UI.archStart):t(UI.archNew);
  const last7=[...Array(7)].map((_,i)=>{const d=new Date(Date.now()-(6-i)*864e5).toISOString().slice(0,10);return{on:S.days.includes(d),d:["S","M","T","W","T","F","S"][new Date(d).getDay()]};});
  const masteryRows=MODULES.map(m=>{const dn=m.lessons.filter(l=>S.done.includes(l.id)).length,pct=Math.round(dn/m.lessons.length*100);
    return `<div class="mrow"><div class="top"><span>${t(m.title)}</span><span class="mono">${pct}%</span></div><div class="mbar"><i style="width:0" data-w="${pct}"></i></div></div>`;}).join("")

window.resetAll=()=>{if(confirm(t(UI.resetConfirm))){S=Object.assign({},DEFAULT);save();go("home");}};

/* ---------- FX ---------- */
function countUp(){document.querySelectorAll("[data-count]").forEach(el=>{const t=+el.dataset.count;if(t===0){el.textContent="0";return;}let c=0;const st=Math.max(1,Math.ceil(t/28));const iv=setInterval(()=>{c+=st;if(c>=t){c=t;clearInterval(iv);}el.textContent=c;},22);});}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2200);}
const cc=document.getElementById("confetti");let cctx=cc.getContext("2d");
function reduced(){return matchMedia("(prefers-reduced-motion:reduce)").matches;}
function bigConfetti(){if(reduced())return;const dev=cc.parentElement.getBoundingClientRect();cc.width=dev.width;cc.height=dev.height;
  const cols=["#0E8C6B","#C77E1A","#5B54B8","#37C098","#E0A43A"];let P=[...Array(90)].map(()=>({x:cc.width/2,y:cc.height*.32,vx:(Math.random()-.5)*11,vy:Math.random()*-11-3,r:Math.random()*5+3,c:cols[Math.random()*cols.length|0],a:1,rot:Math.random()*6}));
  let n=0;(function anim(){cctx.clearRect(0,0,cc.width,cc.height);n++;P.forEach(p=>{p.vy+=.32;p.x+=p.vx;p.y+=p.vy;p.rot+=.2;p.a-=.011;cctx.globalAlpha=Math.max(0,p.a);cctx.fillStyle=p.c;cctx.save();cctx.translate(p.x,p.y);cctx.rotate(p.rot);cctx.fillRect(-p.r,-p.r,p.r*2,p.r*1.4);cctx.restore();});cctx.globalAlpha=1;if(n<130)requestAnimationFrame(anim);else cctx.clearRect(0,0,cc.width,cc.height);})();}
function burstAt(el){if(reduced())return;const dev=cc.parentElement.getBoundingClientRect(),r=el.getBoundingClientRect();cc.width=dev.width;cc.height=dev.height;const ox=r.left-dev.left+r.width/2,oy=r.top-dev.top+r.height/2;const cols=["#0E8C6B","#37C098","#E0A43A"];let P=[...Array(24)].map(()=>({x:ox,y:oy,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,r:Math.random()*3+2,c:cols[Math.random()*3|0],a:1}));let n=0;(function a2(){cctx.clearRect(0,0,cc.width,cc.height);n++;P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.a-=.03;cctx.globalAlpha=Math.max(0,p.a);cctx.fillStyle=p.c;cctx.beginPath();cctx.arc(p.x,p.y,p.r,0,7);cctx.fill();});cctx.globalAlpha=1;if(n<45)requestAnimationFrame(a2);else cctx.clearRect(0,0,cc.width,cc.height);})();}
