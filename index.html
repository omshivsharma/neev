   L("That's why beginners usually start with a broad basket rather than hunting single winners: it removes the need to be right about one company and smooths the ride. Single names aren't forbidden — some investors hold a few — but they're a concentrated bet that needs more knowledge and a stomach for swings. We're not naming any basket; just the principle of one vs many.","इसलिए शुरुआती अक्सर broad टोकरी से शुरू करते हैं, सिंगल विनर ढूंढने से नहीं: एक कंपनी के बारे में सही होने की ज़रूरत हटती है। सिंगल नाम मना नहीं, पर concentrated दांव जिसे ज़्यादा ज्ञान और झेलने की हिम्मत चाहिए।","Isliye shuruaati aksar broad tokri se shuru karte hain, single winner dhoondhne se nahi: ek company ke baare mein sahi hone ki zaroorat hatti hai. Single naam mana nahi, par concentrated daanv jise zyada gyaan aur jhelne ki himmat chahiye.")],
   faq:[
    {q:L("Can't one stock make me rich fast?","क्या एक स्टॉक जल्दी अमीर नहीं बना सकता?","Kya ek stock jaldi ameer nahi bana sakta?"),a:L("It can — or wipe you out. High concentration cuts both ways; a basket trades the jackpot for a steadier climb.","बना सकता है — या डुबो भी सकता है। ज़्यादा concentration दोनों तरफ काटता है; टोकरी जैकपॉट छोड़कर स्थिर चढ़ाई देती है।","Bana sakta hai — ya dubo bhi sakta hai. Zyada concentration dono taraf kaat-ta hai; tokri jackpot chhod ke steady chadhai deti hai.")},
    {q:L("What exactly is an index?","इंडेक्स असल में क्या है?","Index asal mein kya hai?"),a:L("As a concept: a ready-made basket tracking many companies together, so you own a slice of the whole group at once.","आइडिया के तौर पर: एक तैयार टोकरी जो कई कंपनियों को साथ ट्रैक करती है, तो आप पूरे समूह का हिस्सा रखते हो।","Idea ke taur pe: ek taiyaar tokri jo kai companyon ko saath track karti hai, toh aap poore samooh ka hissa rakhte ho.")}
   ]},
  terms:[{k:L("Single security","सिंगल सिक्योरिटी","Single security"),d:L("One company's stock — its fate rides on that one firm.","एक कंपनी का स्टॉक — किस्मत उसी एक फर्म पर।","Ek company ka stock — kismat usi ek firm pe.")},{k:L("Index / basket","इंडेक्स / टोकरी","Index / basket"),d:L("Many holdings bundled together, spreading the risk.","कई होल्डिंग एक साथ, रिस्क फैलाती हुई।","Kai holdings ek saath, risk phailaati hui.")}],
  action:L("Compare a single stock's 1-year path with a broad basket over the same period (real data) — feel the bumpiness gap.","एक स्टॉक की 1-साल चाल को एक broad टोकरी से तुलना करो (असली डेटा) — बंपीनेस का फर्क महसूस करो।","Ek stock ki 1-saal chaal ko ek broad tokri se compare karo (real data) — bumpiness ka farak mehsoos karo."),
  quiz:[
   {q:L("A basket (fund/index) mainly helps by…","एक टोकरी मुख्यतः किससे मदद करती है…","Ek tokri mukhyatah kisse madad karti hai…"),o:[L("Guaranteeing profit","मुनाफे की गारंटी","Munaafe ki guarantee"),L("Spreading risk across many holdings","कई होल्डिंग में रिस्क फैलाना","Kai holdings mein risk phailaana"),L("Removing all risk","सारा रिस्क हटाना","Saara risk hataana"),L("Avoiding tax","टैक्स बचाना","Tax bachana")],a:1,why:L("Many holdings cushion any one bad performer — less bumpiness.","कई होल्डिंग किसी एक खराब को संभालती हैं — कम बंपीनेस।","Kai holdings kisi ek kharab ko sambhaalti hain — kam bumpiness.")},
   {q:L("A single stock carries more of which risk?","एक स्टॉक ज़्यादा कौन सा रिस्क रखता है?","Ek stock zyada kaunsa risk rakhta hai?"),o:[L("Concentration risk","कंसंट्रेशन रिस्क","Concentration risk"),L("No risk","कोई रिस्क नहीं","Koi risk nahi"),L("Tax risk only","सिर्फ टैक्स रिस्क","Sirf tax risk"),L("Inflation only","सिर्फ इन्फ्लेशन","Sirf inflation")],a:0,why:L("Everything rides on one company — that's concentration risk.","सब एक कंपनी पर — यही कंसंट्रेशन रिस्क।","Sab ek company pe — yahi concentration risk.")}
  ],
  reflect:L("How concentrated would you have been if you'd followed the tip?","अगर टिप मानते तो कितने concentrated होते?","Agar tip maante toh kitne concentrated hote?")},

 {id:"m4l3",title:L("Gold's real place","सोने की असली जगह","Sone ki asli jagah"),sub:L("A hedge, not a guarantee","एक हेज, गारंटी नहीं","A hedge, not a guarantee"),mins:4,
  beats:{
   sit:L("Family says 'gold is safest, always buy gold'. At a wedding, everyone's buying.","परिवार कहता है 'सोना सबसे सेफ, हमेशा खरीदो'। शादी में सब खरीद रहे हैं।","Family kehta hai 'sona sabse safe, hamesha khareedo'. Shaadi mein sab khareed rahe hain."),
   myth:{lie:L("Gold is a guaranteed, always-up safe investment.","सोना एक गारंटीड, हमेशा-ऊपर सेफ इन्वेस्टमेंट है।","Sona ek guaranteed, hamesha-upar safe investment hai."),truth:L("Gold often moves differently from stocks — a hedge, not a guarantee.","सोना अक्सर स्टॉक से अलग चलता है — एक हेज, गारंटी नहीं।","Sona aksar stock se alag chalta hai — ek hedge, guarantee nahi.")},
   reflex:L("Treating gold as risk-free or as the whole plan.","सोने को रिस्क-फ्री या पूरा प्लान समझना।","Sone ko risk-free ya poora plan samajhna."),
   q:L("What role does gold actually play?","सोना असल में क्या भूमिका निभाता है?","Sona asal mein kya bhumika nibhata hai?"),
   fw:L("Gold often zigs when stocks zag, so a little can steady a portfolio (a <b>hedge</b>). But it earns no interest or dividends and can be flat or fall for long stretches. A role player, not the star. No form named.","सोना अक्सर तब चढ़ता है जब स्टॉक गिरते हैं, तो थोड़ा पोर्टफोलियो को स्थिर कर सकता है (<b>हेज</b>)। पर यह ब्याज/डिविडेंड नहीं देता और लंबे समय फ्लैट या गिर सकता है। रोल प्लेयर, स्टार नहीं।","Sona aksar tab chadhta hai jab stock girte hain, toh thoda portfolio ko steady kar sakta hai (<b>hedge</b>). Par yeh interest/dividend nahi deta aur lambe samay flat ya gir sakta hai. Role player, star nahi."),
   call:L("How much gold, if any, and in what form is your call by goal and comfort — we only explain its behavior.","कितना सोना, अगर हो, और किस रूप में = आपका फैसला गोल और सहजता से — हम सिर्फ इसका व्यवहार समझाते हैं।","Kitna sona, agar ho, aur kis roop mein = aapka faisla goal aur sehajta se — hum sirf iska vyavhaar samjhaate hain.")
  },
  dd:{ex:[
   L("Gold's useful trait is that it often moves independently of stocks — when markets fall in fear, gold sometimes rises, so a small amount can cushion a portfolio. That's what 'hedge' means: not extra growth, but a steadier overall ride. It's insurance-like, not a growth engine.","सोने की उपयोगी बात: यह अक्सर स्टॉक से स्वतंत्र चलता है — जब मार्केट डर में गिरते हैं, सोना कभी चढ़ता है, तो थोड़ा पोर्टफोलियो को कुशन देता है। 'हेज' का यही मतलब: ग्रोथ नहीं, स्थिर सवारी।","Sone ki upyogi baat: yeh aksar stock se swatantra chalta hai — jab market dar mein girte hain, sona kabhi chadhta hai, toh thoda portfolio ko cushion deta hai. 'Hedge' ka yahi matlab: growth nahi, steady sawaari."),
   L("But gold has real limits: it pays no interest or dividend, it can sit flat or fall for years, and physical gold carries storage, purity and making-charge costs. So treating it as 'the safest, buy-only' asset — or as your whole plan — misreads it. It's a supporting role player for balance, sized small, not the star of the portfolio. We name no form or product.","पर सोने की हदें: यह ब्याज/डिविडेंड नहीं देता, सालों फ्लैट या गिर सकता है, फिजिकल गोल्ड में स्टोरेज, शुद्धता, मेकिंग-चार्ज। तो इसे 'सबसे सेफ, सिर्फ खरीदो' या पूरा प्लान समझना गलत। संतुलन के लिए छोटा सहायक रोल।","Par sone ki hadein: yeh interest/dividend nahi deta, saalon flat ya gir sakta hai, physical gold mein storage, shuddhta, making-charge. Toh ise 'sabse safe, sirf khareedo' ya poora plan samajhna galat. Santulan ke liye chhota sahaayak role.")],
   faq:[
    {q:L("Is gold better than stocks?","क्या सोना स्टॉक से बेहतर है?","Kya sona stock se behtar hai?"),a:L("Different jobs — stocks are a growth engine, gold a stabiliser. 'Better' depends on the role you need, not a ranking.","अलग काम — स्टॉक ग्रोथ इंजन, सोना स्टेबलाइज़र। 'बेहतर' आपकी ज़रूरत के रोल पर।","Alag kaam — stock growth engine, sona stabiliser. 'Behtar' aapki zaroorat ke role pe.")},
    {q:L("Is jewellery a good investment?","क्या ज्वेलरी अच्छा इन्वेस्टमेंट है?","Kya jewellery achha investment hai?"),a:L("Making charges and purity issues make jewellery a poor investment vehicle versus its role as an ornament — the app explains behaviour, not products.","मेकिंग चार्ज और शुद्धता के कारण ज्वेलरी निवेश के तौर पर कमज़ोर — ऐप व्यवहार समझाता है, प्रोडक्ट नहीं।","Making charge aur shuddhta ke kaaran jewellery nivesh ke taur pe kamzor — app vyavhaar samjhaata hai, product nahi.")}
   ]},
  terms:[{k:L("Hedge","हेज","Hedge"),d:L("Something that often moves opposite to your main holdings, steadying the ride.","जो अक्सर आपकी मुख्य होल्डिंग के उलट चले, सवारी स्थिर करे।","Jo aksar aapki mukhya holding ke ulat chale, sawaari steady kare.")},{k:L("Asset class","एसेट क्लास","Asset class"),d:L("A broad category of investment with its own behaviour (equity, debt, gold, cash).","अपने व्यवहार वाली इन्वेस्टमेंट की श्रेणी (इक्विटी, डेट, गोल्ड, कैश)।","Apne vyavhaar wali investment ki category (equity, debt, gold, cash).")}],
  action:L("View gold's path next to a broad index over a period (real data) — see how differently they move.","सोने की चाल को एक broad इंडेक्स के साथ देखो (असली डेटा) — कितने अलग चलते हैं।","Sone ki chaal ko ek broad index ke saath dekho (real data) — kitne alag chalte hain."),
  quiz:[
   {q:L("Gold's main portfolio role is as a…","पोर्टफोलियो में सोने की मुख्य भूमिका…","Portfolio mein sone ki mukhya bhumika…"),o:[L("Growth engine","ग्रोथ इंजन","Growth engine"),L("Hedge / stabiliser","हेज / स्टेबलाइज़र","Hedge / stabiliser"),L("Guaranteed doubler","गारंटीड डबलर","Guaranteed doubler"),L("Income source","इनकम स्रोत","Income source")],a:1,why:L("Gold often moves opposite to stocks, steadying the overall ride.","सोना अक्सर स्टॉक के उलट चलता है, सवारी स्थिर करता है।","Sona aksar stock ke ulat chalta hai, sawaari steady karta hai.")},
   {q:L("A real limit of gold is…","सोने की एक असली हद…","Sone ki ek asli had…"),o:[L("It pays no interest/dividend","यह ब्याज/डिविडेंड नहीं देता","Yeh interest/dividend nahi deta"),L("It always rises","यह हमेशा चढ़ता है","Yeh hamesha chadhta hai"),L("It's tax-free forever","यह हमेशा टैक्स-फ्री","Yeh hamesha tax-free"),L("It has no cost","इसकी कोई कीमत नहीं","Iski koi keemat nahi")],a:0,why:L("Gold earns no income and can stay flat for years — a supporting role, not the star.","सोना कोई इनकम नहीं देता और सालों फ्लैट रह सकता है।","Sona koi income nahi deta aur saalon flat reh sakta hai.")}
  ],
  reflect:L("Were you treating gold as a hedge or as the whole plan?","आप सोने को हेज समझ रहे थे या पूरा प्लान?","Aap sone ko hedge samajh rahe the ya poora plan?")},

 {id:"m4l4",title:L("Fixed vs market-linked","फिक्स्ड बनाम मार्केट-लिंक्ड","Fixed vs market-linked"),sub:L("The trade you're choosing","आप जो ट्रेड चुन रहे हो","The trade you're choosing"),mins:4,
  beats:{
   sit:L("One option promises a fixed return; another moves with the market. Which is 'better'?","एक ऑप्शन फिक्स्ड रिटर्न देता है; दूसरा मार्केट के साथ चलता है। कौन 'बेहतर'?","Ek option fixed return deta hai; doosra market ke saath chalta hai. Kaun 'behtar'?"),
   myth:{lie:L("Fixed-return is always safer and better.","फिक्स्ड-रिटर्न हमेशा सेफ और बेहतर।","Fixed-return hamesha safe aur behtar."),truth:L("Fixed = steadier but usually lower; market-linked = bumpier but historically higher over long periods. A trade, not a winner.","फिक्स्ड = स्थिर पर आमतौर पर कम; मार्केट-लिंक्ड = बंपी पर लंबे में ऐतिहासिक रूप से ज़्यादा। ट्रेड, विजेता नहीं।","Fixed = steady par aam taur pe kam; market-linked = bumpy par lambe mein historically zyada. Trade, vijeta nahi.")},
   reflex:L("Chasing whatever sounds safest, or whatever sounds highest.","जो सबसे सेफ लगे, या जो सबसे ज़्यादा लगे, उसका पीछा।","Jo sabse safe lage, ya jo sabse zyada lage, uska peechha."),
   q:L("Fixed or market-linked — which fits?","फिक्स्ड या मार्केट-लिंक्ड — कौन फिट?","Fixed ya market-linked — kaun fit?"),
   fw:L("Fixed-return gives a known, steady return (lower, predictable). Market-linked swings with markets (higher potential over long horizons, bumpy). Neither is universally better — it depends on your horizon and risk capacity.","फिक्स्ड-रिटर्न एक ज्ञात, स्थिर रिटर्न (कम, predictable)। मार्केट-लिंक्ड मार्केट के साथ झूलता (लंबे में ज़्यादा संभावना, बंपी)। कोई सार्वभौमिक बेहतर नहीं — होराइज़न और रिस्क कैपेसिटी पर।","Fixed-return ek gyaat, steady return (kam, predictable). Market-linked market ke saath jhoolta (lambe mein zyada sambhavna, bumpy). Koi universal behtar nahi — horizon aur risk capacity pe."),
   call:L("Match to the money's horizon — short/near → lean steadier; long → can bear market-linked bumps. Your call.","पैसे के होराइज़न से मैच करो — जल्द → स्थिर की ओर; लंबा → मार्केट बंप झेल सकता है। आपका फैसला।","Paise ke horizon se match karo — jald → steady ki or; lamba → market bumps jhel sakta hai. Aapka faisla.")
  },
  dd:{ex:[
   L("A fixed-return instrument tells you the return up front — steady and predictable, but usually modest. A market-linked one moves with the markets — it can be bumpy year to year, but over long horizons has historically delivered more. This is the risk-return trade-off from Module 1, wearing a product-shaped hat: you choose calm-but-lower or bumpy-but-potentially-higher.","फिक्स्ड-रिटर्न इंस्ट्रूमेंट रिटर्न पहले बता देता है — स्थिर, predictable, पर आमतौर पर मामूली। मार्केट-लिंक्ड मार्केट के साथ चलता — साल-दर-साल बंपी, पर लंबे में ऐतिहासिक रूप से ज़्यादा। यही रिस्क-रिटर्न ट्रेड-ऑफ।","Fixed-return instrument return pehle bata deta hai — steady, predictable, par aam taur pe maamooli. Market-linked market ke saath chalta — saal-dar-saal bumpy, par lambe mein historically zyada. Yahi risk-return trade-off."),
   L("The catch people miss: a 'safe' fixed return that grows slower than prices can still lose to inflation over long horizons (Module 1). So 'fixed = safe' is only true against bumpiness, not against inflation. Match the type to the money's horizon: near-term money leans fixed/steady; long-term money can accept market-linked bumps for the chance at real growth. We name no product.","लोग जो चूकते हैं: 'सेफ' फिक्स्ड रिटर्न जो दाम से धीरे बढ़े, लंबे में इन्फ्लेशन से हार सकता है (मॉड्यूल 1)। तो 'फिक्स्ड = सेफ' सिर्फ बंपीनेस के खिलाफ, इन्फ्लेशन के नहीं। टाइप को होराइज़न से मैच करो।","Log jo chookte hain: 'safe' fixed return jo daam se dheere badhe, lambe mein inflation se haar sakta hai (Module 1). Toh 'fixed = safe' sirf bumpiness ke khilaaf, inflation ke nahi. Type ko horizon se match karo.")],
   faq:[
    {q:L("Is a fixed return truly guaranteed?","क्या फिक्स्ड रिटर्न सच में गारंटीड है?","Kya fixed return sach mein guaranteed hai?"),a:L("The rate is known upfront, but its real value can still be eroded by inflation, and no return is entirely without risk. Steady, not magic.","रेट पहले से पता, पर उसकी असली वैल्यू इन्फ्लेशन से घट सकती है, और कोई रिटर्न पूरी तरह रिस्क-फ्री नहीं।","Rate pehle se pata, par uski asli value inflation se ghat sakti hai, aur koi return poori tarah risk-free nahi.")},
    {q:L("Can market-linked lose money?","क्या मार्केट-लिंक्ड पैसा खो सकता है?","Kya market-linked paisa kho sakta hai?"),a:L("Yes, especially over short periods — which is exactly why it suits long horizons that can ride out the dips.","हाँ, खासकर छोटे समय में — इसीलिए यह लंबे होराइज़न को सूट करता है जो डिप झेल सके।","Haan, khaaskar chhote samay mein — isiliye yeh lambe horizon ko suit karta hai jo dip jhel sake.")}
   ]},
  terms:[{k:L("Fixed-return","फिक्स्ड-रिटर्न","Fixed-return"),d:L("A known, steady return decided up front — predictable, usually lower.","पहले से तय ज्ञात, स्थिर रिटर्न — predictable, आमतौर पर कम।","Pehle se tay gyaat, steady return — predictable, aam taur pe kam.")},{k:L("Market-linked","मार्केट-लिंक्ड","Market-linked"),d:L("Returns that swing with the market — bumpier, higher long-run potential.","रिटर्न जो मार्केट के साथ झूलें — बंपी, लंबे में ज़्यादा संभावना।","Return jo market ke saath jhoolein — bumpy, lambe mein zyada sambhavna.")}],
  action:L("Compare a fixed rate vs a market index over 1 year and over a longer window (real data).","एक फिक्स्ड रेट बनाम मार्केट इंडेक्स को 1 साल और लंबे window में तुलना करो (असली डेटा)।","Ek fixed rate banaam market index ko 1 saal aur lambe window mein compare karo (real data)."),
  quiz:[
   {q:L("Market-linked investments are best suited to…","मार्केट-लिंक्ड सबसे बेहतर किसके लिए…","Market-linked sabse behtar kiske liye…"),o:[L("Money needed next month","अगले महीने चाहिए पैसा","Agle mahine chahiye paisa"),L("Long horizons that can ride bumps","लंबे होराइज़न जो बंप झेल सकें","Lambe horizon jo bump jhel sakein"),L("Emergency funds","इमरजेंसी फंड","Emergency fund"),L("Nobody","किसी के लिए नहीं","Kisi ke liye nahi")],a:1,why:L("Bumps need time to recover — long horizons can absorb them for higher potential.","बंप को recover का समय चाहिए — लंबे होराइज़न झेल लेते हैं।","Bump ko recover ka samay chahiye — lambe horizon jhel lete hain.")},
   {q:L("'Fixed = safe' is only true against…","'फिक्स्ड = सेफ' सिर्फ किसके खिलाफ सच…","'Fixed = safe' sirf kiske khilaaf sach…"),o:[L("Inflation","इन्फ्लेशन","Inflation"),L("Bumpiness (volatility)","बंपीनेस (वोलैटिलिटी)","Bumpiness (volatility)"),L("Everything","सब कुछ","Sab kuch"),L("Nothing","कुछ नहीं","Kuch nahi")],a:1,why:L("Fixed protects from swings but its real value can still lose to inflation.","फिक्स्ड झूलों से बचाता है पर असली वैल्यू इन्फ्लेशन से हार सकती है।","Fixed jhoolon se bachata hai par asli value inflation se haar sakti hai.")}
  ],
  reflect:L("Which type were you defaulting to — and did the horizon justify it?","आप कौन सा टाइप डिफ़ॉल्ट कर रहे थे — होराइज़न ने उसे सही ठहराया?","Aap kaunsa type default kar rahe the — horizon ne use sahi thehraaya?")},

 {id:"m4l5",title:L("Pick it yourself, or let a vehicle do it","खुद चुनो, या किसी वाहन को चुनने दो","Khud chuno, ya kisi vehicle ko chunne do"),sub:L("Direct vs pooled/managed","डायरेक्ट बनाम पूल्ड/मैनेज्ड","Direct vs pooled/managed"),mins:4,
  beats:{
   sit:L("You can pick investments yourself, or let a pooled/managed vehicle do it. The choice feels overwhelming.","आप खुद इन्वेस्टमेंट चुन सकते हो, या किसी पूल्ड/मैनेज्ड वाहन को करने दो। चुनाव भारी लगता है।","Aap khud investment chun sakte ho, ya kisi pooled/managed vehicle ko karne do. Chunaav bhaari lagta hai."),
   myth:{lie:L("Doing it yourself is always cheaper and better.","खुद करना हमेशा सस्ता और बेहतर है।","Khud karna hamesha sasta aur behtar hai."),truth:L("Managed vehicles trade a fee for convenience & diversification; direct gives control but needs time & skill.","मैनेज्ड वाहन फीस के बदले सुविधा और डाइवर्सिफिकेशन देते हैं; डायरेक्ट कंट्रोल पर समय और स्किल माँगता है।","Managed vehicle fee ke badle suvidha aur diversification dete hain; direct control par samay aur skill maangta hai.")},
   reflex:L("Assuming one is universally right, or avoiding investing because self-selecting feels hard.","मान लेना कि एक हमेशा सही, या खुद चुनना मुश्किल लगने से इन्वेस्टिंग टालना।","Maan lena ki ek hamesha sahi, ya khud chunna mushkil lagne se investing taalna."),
   q:L("Pick myself or let a vehicle do it?","खुद चुनूँ या वाहन को करने दूँ?","Khud chunun ya vehicle ko karne dun?"),
   fw:L("<b>Direct</b> = you choose each holding — full control, but needs time, knowledge, discipline. <b>Pooled/managed</b> = your money joins others', spread across many holdings, run for you — convenient and diversified, but carries a fee (which compounds — Module 3). Both are valid.","<b>डायरेक्ट</b> = आप हर होल्डिंग चुनो — पूरा कंट्रोल, पर समय, ज्ञान, अनुशासन चाहिए। <b>पूल्ड/मैनेज्ड</b> = पैसा दूसरों के साथ, कई होल्डिंग में फैला, आपके लिए चलाया — सुविधाजनक, पर फीस (जो कंपाउंड होती है)। दोनों वैध।","<b>Direct</b> = aap har holding chuno — poora control, par samay, gyaan, anushaasan chahiye. <b>Pooled/managed</b> = paisa doosron ke saath, kai holding mein phaila, aapke liye chalaya — suvidhajanak, par fee (jo compound hoti hai). Dono vaidh."),
   call:L("Which route depends on how much time/skill you have and the cost you'll accept — your call, not a product name.","कौन सा रास्ता = आपके पास कितना समय/स्किल और आप कितनी कीमत मानो — आपका फैसला, प्रोडक्ट नाम नहीं।","Kaunsa rasta = aapke paas kitna samay/skill aur aap kitni keemat maano — aapka faisla, product naam nahi.")
  },
  dd:{ex:[
   L("Direct investing means you research and choose every holding yourself — you get full control and pay no manager, but it demands real time, knowledge and the discipline to not panic. A pooled/managed vehicle bundles your money with many others', spreads it across lots of holdings, and someone runs it for you — instant diversification and convenience, in exchange for a fee.","डायरेक्ट इन्वेस्टिंग यानी आप हर होल्डिंग खुद रिसर्च और चुनो — पूरा कंट्रोल, कोई मैनेजर फीस नहीं, पर असली समय, ज्ञान और घबराने न देने का अनुशासन चाहिए। पूल्ड/मैनेज्ड वाहन आपका पैसा कई के साथ बाँधकर फैलाता, कोई चलाता — तुरंत डाइवर्सिफिकेशन, फीस के बदले।","Direct investing yaani aap har holding khud research aur chuno — poora control, koi manager fee nahi, par asli samay, gyaan aur ghabraane na dene ka anushaasan chahiye. Pooled/managed vehicle aapka paisa kai ke saath baandh ke phailaata, koi chalata — turant diversification, fee ke badle."),
   L("The fee is the key trade-off, because costs compound just like returns (Module 3): a small annual fee, over decades, quietly eats a real chunk of your corpus. So the honest question isn't 'which is better' but 'is the convenience and diversification worth this fee for me, given my time and skill?'. Many people even mix both. We name no product — only the trade-offs.","फीस मुख्य ट्रेड-ऑफ है, क्योंकि लागत रिटर्न की तरह कंपाउंड होती है (मॉड्यूल 3): छोटी सालाना फीस दशकों में corpus का असली हिस्सा खा जाती है। तो सवाल 'कौन बेहतर' नहीं बल्कि 'क्या सुविधा और डाइवर्सिफिकेशन इस फीस के लायक है?'। कई लोग दोनों मिलाते हैं।","Fee mukhya trade-off hai, kyunki laagat return ki tarah compound hoti hai (Module 3): chhoti saalaana fee dashakon mein corpus ka asli hissa kha jaati hai. Toh sawaal 'kaun behtar' nahi balki 'kya suvidha aur diversification is fee ke layak hai?'. Kai log dono milaate hain.")],
   faq:[
    {q:L("Are the fees worth it?","क्या फीस worth है?","Kya fee worth hai?"),a:L("Depends on you — if you lack time/skill, the convenience and diversification can be worth a low fee; if you have both, direct saves cost. Compare honestly.","आप पर निर्भर — समय/स्किल नहीं तो कम फीस worth; दोनों हैं तो डायरेक्ट सस्ता। ईमानदारी से तुलना करो।","Aap pe nirbhar — samay/skill nahi toh kam fee worth; dono hain toh direct sasta. Imaandaari se tulna karo.")},
    {q:L("Can I mix both?","क्या दोनों मिला सकता हूँ?","Kya dono mila sakta hoon?"),a:L("Yes — many keep a managed core for convenience and a small direct portion for control. It's not either/or.","हाँ — कई एक मैनेज्ड कोर और छोटा डायरेक्ट हिस्सा रखते हैं। यह या/या नहीं।","Haan — kai ek managed core aur chhota direct hissa rakhte hain. Yeh ya/ya nahi.")}
   ]},
  terms:[{k:L("Direct investing","डायरेक्ट इन्वेस्टिंग","Direct investing"),d:L("Choosing each holding yourself — full control, needs time & skill.","हर होल्डिंग खुद चुनना — पूरा कंट्रोल, समय और स्किल चाहिए।","Har holding khud chunna — poora control, samay aur skill chahiye.")},{k:L("Pooled/managed vehicle","पूल्ड/मैनेज्ड वाहन","Pooled/managed vehicle"),d:L("Money bundled with others', diversified and run for you, for a fee.","पैसा दूसरों के साथ, फैला और आपके लिए चलाया, फीस के बदले।","Paisa doosron ke saath, phaila aur aapke liye chalaya, fee ke badle.")}],
  action:L("Compare the effect of a small annual fee vs none on a long-run corpus (illustrative — fees compound).","एक छोटी सालाना फीस बनाम शून्य का लंबे corpus पर असर देखो (उदाहरणात्मक — फीस कंपाउंड होती है)।","Ek chhoti saalaana fee banaam shoonya ka lambe corpus pe asar dekho (udaharanaatmak — fee compound hoti hai)."),
  quiz:[
   {q:L("A pooled/managed vehicle mainly offers…","पूल्ड/मैनेज्ड वाहन मुख्यतः क्या देता है…","Pooled/managed vehicle mukhyatah kya deta hai…"),o:[L("Guaranteed returns","गारंटीड रिटर्न","Guaranteed return"),L("Convenience & diversification for a fee","फीस के बदले सुविधा और डाइवर्सिफिकेशन","Fee ke badle suvidha aur diversification"),L("Zero risk","ज़ीरो रिस्क","Zero risk"),L("No fee ever","कभी फीस नहीं","Kabhi fee nahi")],a:1,why:L("You trade a fee for convenience and instant diversification.","आप फीस के बदले सुविधा और तुरंत डाइवर्सिफिकेशन पाते हो।","Aap fee ke badle suvidha aur turant diversification paate ho.")},
   {q:L("Why do fees matter so much long-term?","लंबे में फीस इतनी क्यों मायने रखती है?","Lambe mein fee itni kyun maayne rakhti hai?"),o:[L("They don't","नहीं रखती","Nahi rakhti"),L("Costs compound like returns","लागत रिटर्न की तरह कंपाउंड","Laagat return ki tarah compound"),L("They're refunded","वापस मिल जाती है","Wapas mil jaati hai"),L("They avoid tax","टैक्स बचाती है","Tax bachaati hai")],a:1,why:L("A small fee, compounding over decades, quietly eats a real chunk of the corpus.","छोटी फीस, दशकों कंपाउंड होकर, corpus का असली हिस्सा खा जाती है।","Chhoti fee, dashakon compound ho ke, corpus ka asli hissa kha jaati hai.")}
  ],
  reflect:L("Do you honestly have the time & interest to go direct?","क्या सच में आपके पास डायरेक्ट जाने का समय और रुचि है?","Kya sach mein aapke paas direct jaane ka samay aur ruchi hai?")},

 {id:"m4l6",title:L("Match the type to the goal","टाइप को गोल से मैच करो","Type ko goal se match karo"),sub:L("A framework, not a pick","एक फ्रेमवर्क, पिक नहीं","A framework, not a pick"),mins:4,
  beats:{
   sit:L("You now know the blocks — equity, debt, gold, fixed, market-linked. But which for which goal?","अब आप ब्लॉक जानते हो — इक्विटी, डेट, गोल्ड, फिक्स्ड, मार्केट-लिंक्ड। पर किस गोल के लिए कौन?","Ab aap block jaante ho — equity, debt, gold, fixed, market-linked. Par kis goal ke liye kaun?"),
   myth:{lie:L("There's one best instrument everyone should use.","एक बेस्ट इंस्ट्रूमेंट है जो सबको इस्तेमाल करना चाहिए।","Ek best instrument hai jo sabko istemal karna chahiye."),truth:L("The right type follows the goal's horizon, liquidity need, and your risk capacity — not a universal pick.","सही टाइप गोल के होराइज़न, लिक्विडिटी ज़रूरत और रिस्क कैपेसिटी से आता है — कोई सार्वभौमिक पिक नहीं।","Sahi type goal ke horizon, liquidity zaroorat aur risk capacity se aata hai — koi universal pick nahi.")},
   reflex:L("Asking 'which is the best investment?' instead of 'best for this goal?'","'सबसे अच्छा इन्वेस्टमेंट कौन?' पूछना, 'इस गोल के लिए सबसे अच्छा?' नहीं।","'Sabse achha investment kaun?' poochhna, 'is goal ke liye sabse achha?' nahi."),
   q:L("Which type fits which goal?","कौन सा टाइप किस गोल के लिए?","Kaunsa type kis goal ke liye?"),
   fw:L("Map each goal by three filters — <b>horizon</b>, <b>liquidity need</b> (both Module 1), and <b>risk capacity</b>. Near + reachable → steadier types; long + can-bear-bumps → growth types; a small hedge for balance. This bridges to building a plan.","हर गोल को तीन फिल्टर से मैप करो — <b>होराइज़न</b>, <b>लिक्विडिटी ज़रूरत</b> (दोनों मॉड्यूल 1), और <b>रिस्क कैपेसिटी</b>। जल्द + रीचेबल → स्थिर टाइप; लंबा + बंप झेल सके → ग्रोथ टाइप; संतुलन को थोड़ा हेज।","Har goal ko teen filter se map karo — <b>horizon</b>, <b>liquidity zaroorat</b> (dono Module 1), aur <b>risk capacity</b>. Jald + reachable → steady type; lamba + bump jhel sake → growth type; santulan ko thoda hedge."),
   call:L("The exact instrument is always your call from these filters — the course makes you able to reason it, not dependent on a tip.","सटीक इंस्ट्रूमेंट हमेशा इन फिल्टर से आपका फैसला — कोर्स आपको सोचने लायक बनाता है, टिप पर निर्भर नहीं।","Sateek instrument hamesha in filter se aapka faisla — course aapko sochne layak banata hai, tip pe nirbhar nahi.")
  },
  dd:{ex:[
   L("Here's the whole module coming together. Don't ask 'what's the best investment?' — ask 'what's best for THIS goal?'. Run each goal through three filters: its horizon (how long till you need it), its liquidity need (how reachable it must be), and your risk capacity (how much bumpiness you can bear). Those three point you to a TYPE, not a product.","यहाँ पूरा मॉड्यूल जुड़ता है। 'सबसे अच्छा इन्वेस्टमेंट?' मत पूछो — 'इस गोल के लिए सबसे अच्छा?' पूछो। हर गोल को तीन फिल्टर से चलाओ: होराइज़न, लिक्विडिटी ज़रूरत, रिस्क कैपेसिटी। ये तीन एक टाइप की ओर इशारा करते हैं, प्रोडक्ट की नहीं।","Yahaan poora module judta hai. 'Sabse achha investment?' mat poochho — 'is goal ke liye sabse achha?' poochho. Har goal ko teen filter se chalao: horizon, liquidity zaroorat, risk capacity. Ye teen ek TYPE ki or ishaara karte hain, product ki nahi."),
   L("Worked mapping — an 8-month goal (a wedding) needs reachable, steady money, so it leans fixed/steadier types; a 20-year goal (retirement) can ride market-linked bumps for growth, with maybe a small hedge for balance. Same logic as Module 1's horizon lesson, now choosing the type. We never name the instrument — we teach the mapping, so you can pick for any goal, for the rest of your life.","उदाहरण — 8-महीने का गोल (शादी) रीचेबल, स्थिर पैसा चाहिए, तो फिक्स्ड/स्थिर की ओर; 20-साल का गोल (रिटायरमेंट) ग्रोथ के लिए मार्केट बंप झेल सकता है, संतुलन को थोड़ा हेज। वही मॉड्यूल 1 का तर्क, अब टाइप चुनते हुए।","Udaharan — 8-mahine ka goal (shaadi) reachable, steady paisa chahiye, toh fixed/steady ki or; 20-saal ka goal (retirement) growth ke liye market bump jhel sakta hai, santulan ko thoda hedge. Wahi Module 1 ka tark, ab type chunte hue.")],
   faq:[
    {q:L("Just tell me what to buy?","बस बता दो क्या खरीदूँ?","Bas bata do kya khareedun?"),a:L("That would make you dependent forever. The mapping makes you able to decide for any goal yourself — a far more valuable skill than one tip.","इससे आप हमेशा निर्भर रहोगे। मैपिंग आपको हर गोल के लिए खुद तय करने लायक बनाती है — एक टिप से कहीं मूल्यवान।","Isse aap hamesha nirbhar rahoge. Mapping aapko har goal ke liye khud tay karne layak banati hai — ek tip se kahin mulyavaan.")},
    {q:L("Can one type serve all goals?","क्या एक टाइप सब गोल के लिए?","Kya ek type sab goal ke liye?"),a:L("Rarely — a near-term goal and a decades-away goal have opposite needs, so most people use different types for different buckets.","शायद ही — नज़दीकी और दशकों दूर गोल की ज़रूरतें उलट हैं, तो अलग बकेट के लिए अलग टाइप।","Shayad hi — nazdeeki aur dashakon door goal ki zarooratein ulat hain, toh alag bucket ke liye alag type.")}
   ]},
  terms:[{k:L("Asset class","एसेट क्लास","Asset class"),d:L("A broad investment category with its own behaviour.","अपने व्यवहार वाली broad इन्वेस्टमेंट श्रेणी।","Apne vyavhaar wali broad investment category.")},{k:L("Suitability","सूटेबिलिटी","Suitability"),d:L("How well an investment type matches a specific goal and person.","कोई इन्वेस्टमेंट टाइप किसी गोल और व्यक्ति से कितना मेल खाता है।","Koi investment type kisi goal aur vyakti se kitna mel khaata hai.")}],
  action:L("Tag your virtual goals with a suitable TYPE (steadier / growth / hedge) using the three filters — no product.","अपने वर्चुअल गोल को तीन फिल्टर से एक उपयुक्त TYPE (स्थिर / ग्रोथ / हेज) टैग करो — कोई प्रोडक्ट नहीं।","Apne virtual goals ko teen filter se ek upyukt TYPE (steady / growth / hedge) tag karo — koi product nahi."),
  quiz:[
   {q:L("The right investment type follows…","सही इन्वेस्टमेंट टाइप किससे आता है…","Sahi investment type kisse aata hai…"),o:[L("A universal 'best' pick","सार्वभौमिक 'बेस्ट' पिक","Universal 'best' pick"),L("Horizon, liquidity need & risk capacity","होराइज़न, लिक्विडिटी और रिस्क कैपेसिटी","Horizon, liquidity aur risk capacity"),L("Last year's winner","पिछले साल का विजेता","Pichhle saal ka vijeta"),L("A friend's tip","दोस्त की टिप","Dost ki tip")],a:1,why:L("Suitability flows from the goal's horizon and liquidity plus your risk capacity.","सूटेबिलिटी गोल के होराइज़न, लिक्विडिटी और आपकी रिस्क कैपेसिटी से।","Suitability goal ke horizon, liquidity aur aapki risk capacity se.")},
   {q:L("An 8-month goal should lean toward…","8-महीने का गोल किसकी ओर झुके…","8-mahine ka goal kiski or jhuke…"),o:[L("Bumpy growth types","बंपी ग्रोथ टाइप","Bumpy growth type"),L("Steadier, reachable types","स्थिर, रीचेबल टाइप","Steady, reachable type"),L("All-in on one stock","एक स्टॉक पर सब","Ek stock pe sab"),L("Only gold","सिर्फ सोना","Sirf sona")],a:1,why:L("Near-term money can't afford bumps — it needs to stay steady and reachable.","जल्द चाहिए पैसा बंप नहीं झेल सकता — स्थिर और रीचेबल चाहिए।","Jald chahiye paisa bump nahi jhel sakta — steady aur reachable chahiye.")}
  ],
  reflect:L("Which goal were you about to mis-match to the wrong type?","आप कौन सा गोल गलत टाइप से मिसमैच करने वाले थे?","Aap kaunsa goal galat type se mismatch karne wale the?")}
]};

const MODULE5={ id:"m5", n:5, title:L("How much risk is right for you?","आपके लिए कितना रिस्क सही?","Kitna risk theek hai?"), theme:L("Bumpiness isn't the enemy — learn how much your situation can carry.","बंपीनेस दुश्मन नहीं — जानो आपकी situation कितना झेल सकती है।","Bumpiness dushman nahi — jaano aapki situation kitna jhel sakti hai."),
 lessons:[
 {id:"m5l1",title:L("The screen's red — should I sell?","स्क्रीन लाल — बेचूँ?","Screen laal — bechun?"),sub:L("Volatility & drawdowns","वोलैटिलिटी और ड्रॉडाउन","Volatility & drawdowns"),mins:4,
  beats:{
   sit:L("You open the app: the portfolio is deep red, down 15%. Your heart sinks, your finger hovers over 'sell'.","आप ऐप खोलते हो: पोर्टफोलियो गहरा लाल, 15% नीचे। दिल बैठ जाता है, उंगली 'बेचो' पर।","Aap app kholte ho: portfolio gehra laal, 15% neeche. Dil baith jaata hai, ungli 'becho' pe."),
   myth:{lie:L("A falling price means I've lost money.","गिरता दाम मतलब मेरा पैसा डूब गया।","Girta daam matlab mera paisa doob gaya."),truth:L("A paper drop isn't a loss until you sell — for a long-term holding, it's the normal bumpy ride.","कागज़ी गिरावट बेचने तक नुकसान नहीं — लॉन्ग-टर्म होल्डिंग के लिए यह सामान्य बंपी सवारी है।","Kaagzi giraavat bechne tak nuksaan nahi — long-term holding ke liye yeh saamaanya bumpy sawaari hai.")},
   reflex:L("Panic-selling near the bottom.","तली के पास घबराकर बेचना।","Tali ke paas ghabraakar bechna."),
   q:L("Should I sell just because it's down?","सिर्फ इसलिए बेचूँ कि नीचे है?","Sirf isliye bechun ki neeche hai?"),
   fw:L("Volatility = how much value swings up and down. A drop on screen is a <b>paper</b> loss; it only becomes real if you sell. For a diversified long-term holding, red days are the price of admission, not a signal to run.","वोलैटिलिटी = वैल्यू कितना ऊपर-नीचे झूलती है। स्क्रीन पर गिरावट <b>कागज़ी</b> नुकसान; असली तभी जब बेचो। डाइवर्सिफाइड लॉन्ग-टर्म होल्डिंग के लिए लाल दिन प्रवेश शुल्क हैं, भागने का संकेत नहीं।","Volatility = value kitna upar-neeche jhoolti hai. Screen pe giraavat <b>kaagzi</b> nuksaan; asli tabhi jab becho. Diversified long-term holding ke liye laal din pravesh shulk hain, bhaagne ka sanket nahi."),
   call:L("Whether to hold depends on your horizon and why you bought — not the red number. If nothing about the plan changed, the red screen isn't news.","होल्ड करना = आपका होराइज़न और आपने क्यों खरीदा — लाल नंबर नहीं। अगर प्लान में कुछ नहीं बदला, लाल स्क्रीन खबर नहीं।","Hold karna = aapka horizon aur aapne kyun khareeda — laal number nahi. Agar plan mein kuch nahi badla, laal screen khabar nahi.")
  },
  dd:{ex:[
   L("When your portfolio shows a loss, that's a 'paper' (unrealised) loss — a number on a screen. It only turns into a real, permanent loss the moment you sell. For a diversified, long-term holding, prices swinging down is volatility — completely normal, and the very reason such investments can grow more over time. The dips are the toll you pay for the long-run climb.","जब पोर्टफोलियो नुकसान दिखाए, वह 'कागज़ी' (unrealised) नुकसान है — स्क्रीन पर नंबर। असली, स्थायी नुकसान तभी जब आप बेचो। डाइवर्सिफाइड लॉन्ग-टर्म होल्डिंग के लिए दाम का गिरना वोलैटिलिटी है — बिल्कुल सामान्य।","Jab portfolio nuksaan dikhaye, wah 'kaagzi' (unrealised) nuksaan hai — screen pe number. Asli, sthaayi nuksaan tabhi jab aap becho. Diversified long-term holding ke liye daam ka girna volatility hai — bilkul saamaanya."),
   L("The real damage is almost never the dip itself — it's panic-selling during the dip, which locks in the loss AND makes you miss the recovery that historically follows. The hardest, most valuable skill in investing is doing nothing when the screen is red and your plan hasn't changed. A drawdown (a fall from a peak) feels awful, but selling into it is what turns a temporary number into a permanent hole.","असली नुकसान डिप नहीं — डिप में घबराकर बेचना, जो नुकसान पक्का करता है और रिकवरी छुड़ाता है। सबसे कठिन, मूल्यवान स्किल: स्क्रीन लाल हो पर प्लान न बदला हो तो कुछ न करना।","Asli nuksaan dip nahi — dip mein ghabraakar bechna, jo nuksaan pakka karta hai aur recovery chhudaata hai. Sabse kathin, mulyavaan skill: screen laal ho par plan na badla ho toh kuch na karna.")],
   faq:[
    {q:L("What if it never recovers?","अगर कभी रिकवर न हो?","Agar kabhi recover na ho?"),a:L("A single stock might not — which is why we diversify (Module 4). A broad, diversified basket has historically recovered over long horizons, though never guaranteed.","एक स्टॉक शायद न हो — इसलिए डाइवर्सिफाई करते हैं। broad बास्केट ऐतिहासिक रूप से रिकवर हुआ है, गारंटी नहीं।","Ek stock shayad na ho — isliye diversify karte hain. Broad basket historically recover hua hai, guarantee nahi.")},
    {q:L("How do I stop myself panicking?","घबराने से खुद को कैसे रोकूँ?","Ghabraane se khud ko kaise rokun?"),a:L("Decide your rule in calm times ('I don't sell a long-term holding on a dip'), and match your risk to what you can bear (next lessons).","शांत समय में नियम तय करो ('डिप पर लॉन्ग-टर्म नहीं बेचता'), और रिस्क को झेलने लायक रखो।","Shaant samay mein niyam tay karo ('dip pe long-term nahi bechta'), aur risk ko jhelne layak rakho.")}
   ]},
  terms:[{k:L("Volatility","वोलैटिलिटी","Volatility"),d:L("How much an investment's value swings up and down.","इन्वेस्टमेंट की वैल्यू कितना ऊपर-नीचे झूलती है।","Investment ki value kitna upar-neeche jhoolti hai.")},{k:L("Drawdown","ड्रॉडाउन","Drawdown"),d:L("A fall from a recent peak — a paper loss until you sell.","हाल के शिखर से गिरावट — बेचने तक कागज़ी नुकसान।","Haal ke shikhar se giraavat — bechne tak kaagzi nuksaan.")}],
  action:{h:L("See a big drop and its recovery","एक बड़ी गिरावट और रिकवरी देखो","Ek badi giraavat aur recovery dekho"),p:L("View a broad index's worst drop over the last few years, and where it stood later.","एक broad इंडेक्स की पिछले कुछ सालों की सबसे बड़ी गिरावट देखो, और बाद में वो कहाँ था।","Ek broad index ki pichhle kuch saalon ki sabse badi giraavat dekho, aur baad mein woh kahan tha."),data:L("A real multi-year index series (fetched by the app).","असली मल्टी-ईयर इंडेक्स सीरीज़ (ऐप द्वारा)।","Asli multi-year index series (app dwaara).")},
  quiz:[
   {q:L("A drop on your screen becomes a real loss only when…","स्क्रीन पर गिरावट असली नुकसान कब बनती है…","Screen pe giraavat asli nuksaan kab banti hai…"),o:[L("The market opens","मार्केट खुले","Market khule"),L("You sell","आप बेचो","Aap becho"),L("A year passes","एक साल बीते","Ek saal beete"),L("A friend tells you","दोस्त बताए","Dost bataaye")],a:1,why:L("Until you sell it's a paper (unrealised) loss; selling makes it permanent.","बेचने तक कागज़ी नुकसान; बेचना स्थायी बनाता है।","Bechne tak kaagzi nuksaan; bechna sthaayi banata hai.")},
   {q:L("For a diversified long-term holding, red days are…","डाइवर्सिफाइड लॉन्ग-टर्म होल्डिंग के लिए लाल दिन…","Diversified long-term holding ke liye laal din…"),o:[L("A signal to sell","बेचने का संकेत","Bechne ka sanket"),L("A normal part of the ride","सवारी का सामान्य हिस्सा","Sawaari ka saamaanya hissa"),L("A guarantee of ruin","बर्बादी की गारंटी","Barbaadi ki guarantee"),L("Proof it's broken","खराब होने का सबूत","Kharab hone ka saboot")],a:1,why:L("Volatility is the normal price of higher long-run growth.","वोलैटिलिटी ज़्यादा लॉन्ग-रन ग्रोथ की सामान्य कीमत है।","Volatility zyada long-run growth ki saamaanya keemat hai.")}
  ],
  reflect:L("Last time markets fell, what did you feel like doing?","पिछली बार मार्केट गिरा, आपका क्या करने का मन था?","Pichhli baar market gira, aapka kya karne ka mann tha?")},

 {id:"m5l2",title:L("Can-bear vs can-stomach","झेल सकते बनाम सह सकते","Jhel sakte vs seh sakte"),sub:L("Risk capacity vs risk tolerance","रिस्क कैपेसिटी बनाम टॉलरेंस","Risk capacity vs tolerance"),mins:4,
  beats:{
   sit:L("Two friends, same salary. A 20% drop barely bothers one; the other can't sleep. Same investment, opposite reaction.","दो दोस्त, same सैलरी। 20% गिरावट एक को मुश्किल से चुभती है; दूसरा सो नहीं पाता। same इन्वेस्टमेंट, उलट प्रतिक्रिया।","Do dost, same salary. 20% giraavat ek ko mushkil se chubhti hai; doosra so nahi paata. Same investment, ulat pratikriya."),
   myth:{lie:L("Risk is one number, the same for everyone.","रिस्क एक नंबर है, सबके लिए समान।","Risk ek number hai, sabke liye samaan."),truth:L("There are two risks: how much you can financially afford to lose (capacity), and how much you can emotionally bear (tolerance).","दो रिस्क हैं: आर्थिक रूप से कितना खो सकते हो (कैपेसिटी), और भावनात्मक रूप से कितना सह सकते हो (टॉलरेंस)।","Do risk hain: aarthik roop se kitna kho sakte ho (capacity), aur bhaavnaatmak roop se kitna seh sakte ho (tolerance).")},
   reflex:L("Copying someone else's risk level.","किसी और का रिस्क लेवल नकल करना।","Kisi aur ka risk level nakal karna."),
   q:L("How much risk is right for ME?","मेरे लिए कितना रिस्क सही?","Mere liye kitna risk sahi?"),
   fw:L("<b>Risk capacity</b> = your financial ability to withstand a loss (income stability, dependents, timeline, emergency fund). <b>Risk tolerance</b> = your emotional comfort with swings. The right risk sits where both agree.","<b>रिस्क कैपेसिटी</b> = नुकसान झेलने की आर्थिक क्षमता (इनकम स्थिरता, आश्रित, टाइमलाइन, इमरजेंसी फंड)। <b>रिस्क टॉलरेंस</b> = झूलों के साथ भावनात्मक सहजता। सही रिस्क वहाँ जहाँ दोनों सहमत।","<b>Risk capacity</b> = nuksaan jhelne ki aarthik kshamta (income sthirta, aashrit, timeline, emergency fund). <b>Risk tolerance</b> = jhoolon ke saath bhaavnaatmak sehajta. Sahi risk wahaan jahan dono sehmat."),
   call:L("Match your risk to the LOWER of the two — no plan survives if it makes you sell in fear.","अपना रिस्क दोनों में से कम वाले से मैच करो — कोई प्लान नहीं टिकता अगर वो डर में बिकवा दे।","Apna risk dono mein se kam wale se match karo — koi plan nahi tikta agar woh dar mein bikwa de.")
  },
  dd:{ex:[
   L("Risk capacity is objective and financial: how big a loss can your life actually absorb? Stable income, few dependents, a long timeline and a solid emergency fund all raise it. Risk tolerance is subjective and emotional: how much can you watch your money swing without panicking? Two people with identical finances can have very different tolerance.","रिस्क कैपेसिटी वस्तुनिष्ठ और आर्थिक है: आपकी ज़िंदगी कितना नुकसान सोख सकती है? स्थिर इनकम, कम आश्रित, लंबी टाइमलाइन, ठोस इमरजेंसी फंड इसे बढ़ाते हैं। रिस्क टॉलरेंस व्यक्तिगत, भावनात्मक: बिना घबराए कितना झूलता देख सकते हो।","Risk capacity vastunishth aur aarthik hai: aapki zindagi kitna nuksaan sokh sakti hai? Sthir income, kam aashrit, lambi timeline, thos emergency fund ise badhate hain. Risk tolerance vyaktigat, bhaavnaatmak: bina ghabraaye kitna jhoolta dekh sakte ho."),
   L("The danger is a mismatch. High tolerance but low capacity = you're comfortable taking risks your finances can't actually survive (dangerous). High capacity but low tolerance = you could afford more, but you'll panic-sell, so you must dial back to a level you can hold. The workable risk is the LOWER of the two — because the best plan on paper is worthless if you abandon it in a crash.","खतरा mismatch है। ज़्यादा टॉलरेंस पर कम कैपेसिटी = ऐसा रिस्क जो आपकी फाइनेंस झेल न सके (खतरनाक)। ज़्यादा कैपेसिटी पर कम टॉलरेंस = वहन कर सकते पर घबराकर बेचोगे, तो कम करो। काम का रिस्क दोनों में कम वाला।","Khatra mismatch hai. Zyada tolerance par kam capacity = aisa risk jo aapki finance jhel na sake (khatarnaak). Zyada capacity par kam tolerance = vahan kar sakte par ghabraakar bechoge, toh kam karo. Kaam ka risk dono mein kam wala.")],
   faq:[
    {q:L("Can tolerance change over time?","क्या टॉलरेंस समय के साथ बदलती है?","Kya tolerance samay ke saath badalti hai?"),a:L("Yes — experience and a bigger safety net usually raise it. But don't overestimate it before you've lived through a real crash.","हाँ — अनुभव और बड़ा सेफ्टी नेट इसे बढ़ाते हैं। पर असली क्रैश झेलने से पहले इसे ज़्यादा मत आँको।","Haan — anubhav aur bada safety net ise badhate hain. Par asli crash jhelne se pehle ise zyada mat aanko.")},
    {q:L("Whose risk should a couple use?","एक जोड़े को किसका रिस्क लेना चाहिए?","Ek jode ko kiska risk lena chahiye?"),a:L("Usually the more cautious partner's tolerance for shared money — so neither is forced to panic-sell.","आमतौर पर साझा पैसे के लिए ज़्यादा सतर्क पार्टनर की टॉलरेंस — ताकि कोई घबराकर न बेचे।","Aam taur pe saajha paise ke liye zyada satark partner ki tolerance — taaki koi ghabraakar na beche.")}
   ]},
  terms:[{k:L("Risk capacity","रिस्क कैपेसिटी","Risk capacity"),d:L("Your financial ability to absorb a loss without derailing life.","बिना ज़िंदगी बिगाड़े नुकसान सोखने की आर्थिक क्षमता।","Bina zindagi bigaade nuksaan sokhne ki aarthik kshamta.")},{k:L("Risk tolerance","रिस्क टॉलरेंस","Risk tolerance"),d:L("Your emotional comfort watching your money swing.","पैसा झूलता देख आपकी भावनात्मक सहजता।","Paisa jhoolta dekh aapki bhaavnaatmak sehajta.")}],
  action:{h:L("Locate your two risks","अपने दो रिस्क खोजो","Apne do risk khojo"),p:L("Answer a couple of prompts on your financial stability and your comfort with swings; the app shows where your two risks sit.","अपनी आर्थिक स्थिरता और झूलों के साथ सहजता पर कुछ सवाल; ऐप दिखाएगा आपके दो रिस्क कहाँ हैं।","Apni aarthik sthirta aur jhoolon ke saath sehajta pe kuch sawaal; app dikhayega aapke do risk kahan hain."),data:L("Your self-assessment inputs (user-entered).","आपके स्व-आकलन इनपुट (यूज़र-डाला)।","Aapke sva-aakalan input (user-entered).")},
  quiz:[
   {q:L("Risk capacity is mainly about your…","रिस्क कैपेसिटी मुख्यतः आपके…","Risk capacity mukhyatah aapke…"),o:[L("Mood","मूड","Mood"),L("Financial ability to absorb loss","नुकसान सोखने की आर्थिक क्षमता","Nuksaan sokhne ki aarthik kshamta"),L("Favourite stock","पसंदीदा स्टॉक","Pasandeeda stock"),L("Age only","सिर्फ उम्र","Sirf umar")],a:1,why:L("Capacity is objective: income, dependents, timeline, safety net.","कैपेसिटी वस्तुनिष्ठ: इनकम, आश्रित, टाइमलाइन, सेफ्टी नेट।","Capacity vastunishth: income, aashrit, timeline, safety net.")},
   {q:L("Your workable risk level is…","आपका काम का रिस्क लेवल…","Aapka kaam ka risk level…"),o:[L("The higher of capacity/tolerance","कैपेसिटी/टॉलरेंस में ज़्यादा","Capacity/tolerance mein zyada"),L("The lower of the two","दोनों में कम वाला","Dono mein kam wala"),L("Always maximum","हमेशा अधिकतम","Hamesha adhiktam"),L("Whatever a friend does","जो दोस्त करे","Jo dost kare")],a:1,why:L("A plan you'll panic-sell is useless — respect the lower limit.","जिसे घबराकर बेचोगे वो बेकार — कम सीमा का सम्मान करो।","Jise ghabraakar bechoge woh bekaar — kam seema ka sammaan karo.")}
  ],
  reflect:L("Are your capacity and tolerance aligned, or fighting each other?","आपकी कैपेसिटी और टॉलरेंस मेल में हैं या आपस में लड़ रहे?","Aapki capacity aur tolerance mel mein hain ya aapas mein lad rahe?")},

 {id:"m5l3",title:L("Don't crowd into one basket","एक टोकरी में मत भरो","Ek tokri mein mat bharo"),sub:L("Diversification, in practice","डाइवर्सिफिकेशन, व्यवहार में","Diversification, in practice"),mins:4,
  beats:{
   sit:L("All your investment is in one thing — one stock, or the one sector everyone hyped. It's been fine… so far.","आपका सारा इन्वेस्टमेंट एक चीज़ में — एक स्टॉक, या वो सेक्टर जिसका सबने हाइप किया। अब तक ठीक… चल रहा है।","Aapka saara investment ek cheez mein — ek stock, ya woh sector jiska sabne hype kiya. Ab tak theek… chal raha hai."),
   myth:{lie:L("If it's doing well, concentrating is smart.","अगर अच्छा चल रहा है, concentrate करना समझदारी।","Agar achha chal raha hai, concentrate karna samajhdaari."),truth:L("Concentration magnifies both luck and disaster; spreading out is the closest thing to a free lunch.","Concentration किस्मत और तबाही दोनों बढ़ाता है; फैलाना 'फ्री लंच' के सबसे करीब।","Concentration kismat aur tabaahi dono badhata hai; phailaana 'free lunch' ke sabse kareeb.")},
   reflex:L("Piling even more into the one winner.","एक विजेता में और ज़्यादा डालना।","Ek vijeta mein aur zyada daalna."),
   q:L("Is it risky to have it all in one place?","सब एक जगह रखना रिस्की है?","Sab ek jagah rakhna risky hai?"),
   fw:L("Diversification = spreading across different things so one bad outcome can't sink you. It reduces bumpiness for a given return — a rare 'free lunch'. It doesn't remove risk (a whole market can fall), but it removes the single-point-of-failure risk.","डाइवर्सिफिकेशन = अलग चीज़ों में फैलाना ताकि एक बुरा नतीजा डुबो न सके। यह उतने रिटर्न के लिए बंपीनेस घटाता है — दुर्लभ 'फ्री लंच'। रिस्क नहीं हटाता (पूरा मार्केट गिर सकता है), पर सिंगल-पॉइंट-फेलियर हटाता है।","Diversification = alag cheezon mein phailaana taaki ek bura natija dubo na sake. Yeh utne return ke liye bumpiness ghataata hai — durlabh 'free lunch'. Risk nahi hataata (poora market gir sakta hai), par single-point-failure hataata hai."),
   call:L("How much to diversify is your call, but betting the farm on one thing is a risk most people can't actually afford.","कितना डाइवर्सिफाई = आपका फैसला, पर सब एक पर लगाना ऐसा रिस्क जो ज़्यादातर वहन नहीं कर सकते।","Kitna diversify = aapka faisla, par sab ek pe lagaana aisa risk jo zyadatar vahan nahi kar sakte.")
  },
  dd:{ex:[
   L("Diversification is the one place in investing you get something close to a free lunch: by holding many different things, you can cut the bumpiness of your portfolio without necessarily giving up return. When one holding has a bad year, others may not — so the whole ride is smoother. This is Module 1's idea made concrete.","डाइवर्सिफिकेशन इन्वेस्टिंग की वो जगह है जहाँ 'फ्री लंच' के करीब कुछ मिलता है: कई अलग चीज़ें रखकर आप पोर्टफोलियो की बंपीनेस घटा सकते हो बिना ज़रूरी रूप से रिटर्न छोड़े। एक का बुरा साल, बाकी का नहीं।","Diversification investing ki woh jagah hai jahan 'free lunch' ke kareeb kuch milta hai: kai alag cheezein rakh ke aap portfolio ki bumpiness ghata sakte ho bina zaroori roop se return chhode. Ek ka bura saal, baaki ka nahi."),
   L("Be honest about its limits, though: diversification softens single-company or single-sector failures, but it cannot save you from a market-wide fall where almost everything drops together. That's why it pairs with a long horizon (time to recover) and the right risk level. It removes the avoidable risk of putting everything on one bet — the kind that ruins people — not all risk.","इसकी हदें भी मानो: डाइवर्सिफिकेशन एक कंपनी/सेक्टर की विफलता नरम करता है, पर मार्केट-भर गिरावट से नहीं बचा सकता जहाँ सब साथ गिरे। इसलिए यह लंबे होराइज़न और सही रिस्क लेवल के साथ जुड़ता है।","Iski hadein bhi maano: diversification ek company/sector ki viphalta naram karta hai, par market-bhar giraavat se nahi bacha sakta jahan sab saath gire. Isliye yeh lambe horizon aur sahi risk level ke saath judta hai.")],
   faq:[
    {q:L("Doesn't diversifying lower my returns?","क्या डाइवर्सिफाई करने से रिटर्न घटता है?","Kya diversify karne se return ghatta hai?"),a:L("It trims the extremes — you give up the jackpot of one big winner in exchange for far less risk of ruin. For most people that's a great deal.","यह चरम काटता है — एक बड़े विजेता का जैकपॉट छोड़कर तबाही का रिस्क बहुत कम। ज़्यादातर के लिए बढ़िया सौदा।","Yeh charam kaat-ta hai — ek bade vijeta ka jackpot chhod ke tabaahi ka risk bahut kam. Zyadatar ke liye badhiya sauda.")},
    {q:L("How many holdings is 'enough'?","कितनी होल्डिंग 'काफी' है?","Kitni holding 'kaafi' hai?"),a:L("Enough that no single one can seriously hurt you — a broad basket does this automatically (Module 4).","इतनी कि कोई एक गंभीर चोट न दे सके — एक broad बास्केट यह अपने आप करती है।","Itni ki koi ek gambheer chot na de sake — ek broad basket yeh apne aap karti hai.")}
   ]},
  terms:[{k:L("Diversification","डाइवर्सिफिकेशन","Diversification"),d:L("Spreading money so one bad outcome can't sink everything.","पैसा फैलाना ताकि एक बुरा नतीजा सब न डुबोए।","Paisa phailaana taaki ek bura natija sab na duboye.")},{k:L("Correlation","कोरिलेशन","Correlation"),d:L("How much two holdings tend to move together — low is good for spreading risk.","दो होल्डिंग कितना साथ चलती हैं — कम अच्छा रिस्क फैलाने को।","Do holding kitna saath chalti hain — kam achha risk phailaane ko.")}],
  action:{h:L("Single sector vs broad basket","सिंगल सेक्टर बनाम broad बास्केट","Single sector vs broad basket"),p:L("Compare one hyped sector's bumpy year against a broad, spread-out basket over the same period.","एक हाइप्ड सेक्टर के बंपी साल को एक broad, फैली बास्केट से तुलना करो।","Ek hyped sector ke bumpy saal ko ek broad, phaili basket se compare karo."),data:L("Real sector vs broad-index series (fetched by the app).","असली सेक्टर बनाम broad-इंडेक्स सीरीज़ (ऐप द्वारा)।","Asli sector banaam broad-index series (app dwaara).")},
  quiz:[
   {q:L("Diversification is called a 'free lunch' because it can…","डाइवर्सिफिकेशन को 'फ्री लंच' क्यों कहते हैं…","Diversification ko 'free lunch' kyun kehte hain…"),o:[L("Guarantee profit","मुनाफे की गारंटी","Munaafe ki guarantee"),L("Cut bumpiness without necessarily cutting return","रिटर्न घटाए बिना बंपीनेस कम करना","Return ghataaye bina bumpiness kam karna"),L("Remove all risk","सारा रिस्क हटाना","Saara risk hataana"),L("Beat every market","हर मार्केट को हराना","Har market ko haraana")],a:1,why:L("Spreading can lower volatility for a similar return — rare in investing.","फैलाना उतने रिटर्न पर वोलैटिलिटी घटा सकता है — दुर्लभ।","Phailaana utne return pe volatility ghata sakta hai — durlabh.")},
   {q:L("Diversification does NOT protect you from…","डाइवर्सिफिकेशन किससे नहीं बचाता…","Diversification kisse nahi bachata…"),o:[L("One company failing","एक कंपनी की विफलता","Ek company ki viphalta"),L("A market-wide fall","मार्केट-भर गिरावट","Market-bhar giraavat"),L("One sector crashing","एक सेक्टर क्रैश","Ek sector crash"),L("A single bad bet","एक बुरे दांव","Ek bure daanv")],a:1,why:L("When almost everything falls together, spreading can't save you — horizon does.","जब सब साथ गिरे, फैलाना नहीं बचाता — होराइज़न बचाता है।","Jab sab saath gire, phailaana nahi bachata — horizon bachata hai.")}
  ],
  reflect:L("What's your single biggest concentration right now?","अभी आपका सबसे बड़ा concentration क्या है?","Abhi aapka sabse bada concentration kya hai?")},

 {id:"m5l4",title:L("Salary here, savings here too","सैलरी यहीं, सेविंग्स भी यहीं","Salary yahin, savings bhi yahin"),sub:L("Concentration risk & your employer","कंसंट्रेशन रिस्क और आपका एम्प्लॉयर","Concentration risk & your employer"),mins:4,
  beats:{
   sit:L("You work at a company, get its stock as a bonus, and also invest your savings in it. It feels loyal and smart.","आप एक कंपनी में काम करते हो, बोनस में उसका स्टॉक मिलता है, और सेविंग्स भी उसी में लगाते हो। वफादार और समझदार लगता है।","Aap ek company mein kaam karte ho, bonus mein uska stock milta hai, aur savings bhi usi mein lagate ho. Wafaadaar aur samajhdaar lagta hai."),
   myth:{lie:L("Backing the company I know best is the safe bet.","जिस कंपनी को सबसे अच्छे से जानता हूँ, उस पर लगाना सेफ।","Jis company ko sabse achhe se jaanta hoon, us pe lagaana safe."),truth:L("If your salary AND savings ride on one company, one bad event hits you twice.","अगर सैलरी और सेविंग्स एक कंपनी पर हों, एक बुरी घटना दो बार चोट देती है।","Agar salary aur savings ek company pe hon, ek buri ghatna do baar chot deti hai.")},
   reflex:L("Over-loading on your employer's stock.","एम्प्लॉयर के स्टॉक पर ज़्यादा लादना।","Employer ke stock pe zyada laadna."),
   q:L("Is it risky to tie my money to my employer?","अपना पैसा एम्प्लॉयर से बाँधना रिस्की है?","Apna paisa employer se baandhna risky hai?"),
   fw:L("Concentration risk = too much depending on a single thing. Your job already ties your income to your employer; putting savings there too <b>doubles the same risk</b> — a struggling company could take your income and savings together.","कंसंट्रेशन रिस्क = एक चीज़ पर बहुत निर्भरता। आपकी नौकरी पहले से इनकम को एम्प्लॉयर से बाँधती है; सेविंग्स भी वहाँ <b>वही रिस्क दुगुना</b> — संघर्षरत कंपनी इनकम और सेविंग्स साथ ले सकती है।","Concentration risk = ek cheez pe bahut nirbharta. Aapki naukri pehle se income ko employer se baandhti hai; savings bhi wahaan <b>wahi risk duguna</b> — sangharshrat company income aur savings saath le sakti hai."),
   call:L("How much employer exposure is your call, but stacking income + savings on one name is a concentration most can't afford.","कितना एम्प्लॉयर एक्सपोज़र = आपका फैसला, पर इनकम + सेविंग्स एक नाम पर लादना ऐसा concentration जो ज़्यादातर वहन नहीं कर सकते।","Kitna employer exposure = aapka faisla, par income + savings ek naam pe laadna aisa concentration jo zyadatar vahan nahi kar sakte.")
  },
  dd:{ex:[
   L("Your paycheck already makes you heavily dependent on one company — your employer. If that company also holds a big chunk of your savings (through its stock or ESOPs), you've concentrated your whole financial life on a single point of failure. If it hits trouble, you could lose your job AND watch your savings drop at the same moment — exactly when you need them most.","आपकी तनख्वाह पहले से आपको एक कंपनी पर बहुत निर्भर बनाती है। अगर उसी में सेविंग्स का बड़ा हिस्सा (स्टॉक/ESOP) भी हो, तो आपने पूरी फाइनेंशियल ज़िंदगी एक सिंगल पॉइंट पर लगा दी। दिक्कत में नौकरी और सेविंग्स साथ गिर सकती हैं।","Aapki tankhwaah pehle se aapko ek company pe bahut nirbhar banati hai. Agar usi mein savings ka bada hissa (stock/ESOP) bhi ho, toh aapne poori financial zindagi ek single point pe laga di. Dikkat mein naukri aur savings saath gir sakti hain."),
   L("This isn't only about employers. The same trap is one sector holding all your investments, or all your wealth locked in a single property. The fix is simple to state: keep your savings spread away from your single biggest source of income and from any one bet. Believing in your company is fine; betting your salary and your savings on it together is a risk few can truly afford.","यह सिर्फ एम्प्लॉयर की बात नहीं। वही जाल — सब निवेश एक सेक्टर में, या पूरी दौलत एक प्रॉपर्टी में। हल सरल: सेविंग्स को अपने सबसे बड़े इनकम स्रोत और किसी एक दांव से दूर फैलाओ।","Yeh sirf employer ki baat nahi. Wahi jaal — sab nivesh ek sector mein, ya poori daulat ek property mein. Hal saral: savings ko apne sabse bade income source aur kisi ek daanv se door phailaao.")],
   faq:[
    {q:L("But I truly believe in my company!","पर मुझे सच में अपनी कंपनी पर भरोसा है!","Par mujhe sach mein apni company pe bharosa hai!"),a:L("Belief is fine — just don't let one belief hold both your salary and your savings. Even great companies can stumble.","भरोसा ठीक — बस एक भरोसा आपकी सैलरी और सेविंग्स दोनों न थामे। बढ़िया कंपनियाँ भी लड़खड़ाती हैं।","Bharosa theek — bas ek bharosa aapki salary aur savings dono na thaame. Badhiya companyaan bhi ladkhadaati hain.")},
    {q:L("ESOPs — hold or sell?","ESOP — रखूँ या बेचूँ?","ESOP — rakhun ya bechun?"),a:L("Many gradually diversify out of employer stock to avoid double exposure — the specifics (and tax) are your call to research.","कई धीरे-धीरे एम्प्लॉयर स्टॉक से डाइवर्सिफाई करते हैं — बारीकी (और टैक्स) आपका शोध।","Kai dheere-dheere employer stock se diversify karte hain — baareeki (aur tax) aapka shodh.")}
   ]},
  terms:[{k:L("Concentration risk","कंसंट्रेशन रिस्क","Concentration risk"),d:L("The danger of too much riding on a single thing.","एक चीज़ पर बहुत निर्भर होने का खतरा।","Ek cheez pe bahut nirbhar hone ka khatra.")},{k:L("Single point of failure","सिंगल पॉइंट ऑफ फेलियर","Single point of failure"),d:L("One thing whose failure would break the whole picture.","एक चीज़ जिसकी विफलता पूरी तस्वीर बिगाड़ दे।","Ek cheez jiski viphalta poori tasveer bigaad de.")}],
  action:{h:L("Flag your overlap","अपना ओवरलैप देखो","Apna overlap dekho"),p:L("Tag your virtual holdings and your income source; the app flags where they overlap on one company/sector.","अपनी वर्चुअल होल्डिंग और इनकम स्रोत टैग करो; ऐप बताएगा कहाँ ओवरलैप है।","Apni virtual holding aur income source tag karo; app bataayega kahan overlap hai."),data:L("Your income source and holdings (user-entered).","आपका इनकम स्रोत और होल्डिंग (यूज़र-डाला)।","Aapka income source aur holding (user-entered).")},
  quiz:[
   {q:L("Investing your savings in your own employer risks…","अपने एम्प्लॉयर में सेविंग्स लगाने का रिस्क…","Apne employer mein savings lagaane ka risk…"),o:[L("Nothing, it's loyal","कुछ नहीं, वफादारी","Kuch nahi, wafaadaari"),L("Losing income and savings together","इनकम और सेविंग्स साथ खोना","Income aur savings saath khona"),L("Lower taxes","कम टैक्स","Kam tax"),L("Guaranteed gains","पक्का फायदा","Pakka fayda")],a:1,why:L("One bad event at the company can hit your job and your savings at once.","कंपनी की एक बुरी घटना नौकरी और सेविंग्स दोनों पर।","Company ki ek buri ghatna naukri aur savings dono pe.")},
   {q:L("The fix for concentration risk is to…","कंसंट्रेशन रिस्क का हल…","Concentration risk ka hal…"),o:[L("Add more of the same","उसी का और जोड़ो","Usi ka aur jodo"),L("Spread savings away from your biggest bet","सेविंग्स को सबसे बड़े दांव से दूर फैलाओ","Savings ko sabse bade daanv se door phailaao"),L("Stop saving","बचत बंद करो","Bachat band karo"),L("Ignore it","अनदेखा करो","Andekha karo")],a:1,why:L("Diversify away from your single biggest income source and any one bet.","अपने सबसे बड़े इनकम स्रोत और किसी एक दांव से दूर फैलाओ।","Apne sabse bade income source aur kisi ek daanv se door phailaao.")}
  ],
  reflect:L("How correlated are your income and your savings right now?","अभी आपकी इनकम और सेविंग्स कितनी जुड़ी हैं?","Abhi aapki income aur savings kitni judi hain?")},

 {id:"m5l5",title:L("Ten-year money, ten-day panic","10-साल का पैसा, 10-दिन की टेंशन","10-saal ka paisa, 10-din ki tension"),sub:L("Matching risk to horizon","रिस्क को होराइज़न से मैच","Matching risk to horizon"),mins:4,
  beats:{
   sit:L("You put money you'll need in a year into a bumpy investment; a dip arrives right when you need it.","आप साल भर में चाहिए पैसा एक बंपी इन्वेस्टमेंट में डालते हो; ज़रूरत के वक्त ही डिप आ जाता है।","Aap saal bhar mein chahiye paisa ek bumpy investment mein daalte ho; zaroorat ke waqt hi dip aa jaata hai."),
   myth:{lie:L("More risk always means more reward, so go aggressive.","ज़्यादा रिस्क मतलब ज़्यादा इनाम, तो आक्रामक बनो।","Zyada risk matlab zyada inaam, toh aakraamak bano."),truth:L("The risk you can take depends on your time — long horizons can bear bumps, short ones can't.","आप कितना रिस्क ले सकते हो = आपका समय — लंबे होराइज़न बंप झेलें, छोटे नहीं।","Aap kitna risk le sakte ho = aapka samay — lambe horizon bump jhelein, chhote nahi.")},
   reflex:L("Taking the same aggressive risk no matter when the money is needed.","पैसा कब चाहिए इसकी परवाह किए बिना वही आक्रामक रिस्क।","Paisa kab chahiye iski parwah kiye bina wahi aakraamak risk."),
   q:L("How much risk can THIS money take?","यह पैसा कितना रिस्क ले सकता है?","Yeh paisa kitna risk le sakta hai?"),
   fw:L("Time changes how much bumpiness money can bear. <b>Long-horizon</b> money has years to recover from dips, so it can carry more risk for growth. <b>Short-horizon</b> money can't — a badly-timed dip forces a loss. Risk isn't just personality; it's each goal's clock.","समय बदलता है पैसा कितनी बंपीनेस झेल सके। <b>लंबे-होराइज़न</b> पैसे के पास डिप से उबरने के साल हैं, तो ज़्यादा रिस्क। <b>छोटे-होराइज़न</b> नहीं — गलत समय डिप नुकसान करवाता है। रिस्क सिर्फ स्वभाव नहीं; हर गोल की घड़ी।","Samay badalta hai paisa kitni bumpiness jhel sake. <b>Lambe-horizon</b> paise ke paas dip se ubarne ke saal hain, toh zyada risk. <b>Chhote-horizon</b> nahi — galat samay dip nuksaan karwaata hai. Risk sirf swabhaav nahi; har goal ki ghadi."),
   call:L("Set each bucket's risk by its horizon — not one 'aggressive/conservative' label for all your money.","हर बकेट का रिस्क उसके होराइज़न से तय करो — सारे पैसे के लिए एक 'आक्रामक/सतर्क' लेबल नहीं।","Har bucket ka risk uske horizon se tay karo — saare paise ke liye ek 'aakraamak/satark' label nahi.")
  },
  dd:{ex:[
   L("Your ability to take risk isn't a single personality setting — it changes with each goal's timeline. Money you won't touch for 15+ years can ride out crashes, because history says markets have recovered given enough time; so it can carry growth-type risk. Money you need next year cannot afford a badly-timed dip, because there's no time to recover before you must sell.","रिस्क लेने की क्षमता एक स्थायी स्वभाव नहीं — हर गोल की टाइमलाइन से बदलती है। 15+ साल न छुए जाने वाला पैसा क्रैश झेल सकता है; अगले साल चाहिए पैसा गलत समय डिप नहीं झेल सकता।","Risk lene ki kshamta ek sthaayi swabhaav nahi — har goal ki timeline se badalti hai. 15+ saal na chhue jaane wala paisa crash jhel sakta hai; agle saal chahiye paisa galat samay dip nahi jhel sakta."),
   L("So the same person can be aggressive AND conservative at once — aggressive with a 25-year retirement bucket, conservative with next year's wedding money. This is Module 1's horizon lesson and the risk-capacity idea joined together. The mistake is applying one blanket risk level to all your money instead of letting each goal's clock decide.","तो एक ही व्यक्ति एक साथ आक्रामक और सतर्क हो सकता है — 25-साल रिटायरमेंट बकेट में आक्रामक, अगले साल की शादी में सतर्क। यही मॉड्यूल 1 का होराइज़न + रिस्क-कैपेसिटी। गलती: सारे पैसे पर एक ही रिस्क लगाना।","Toh ek hi vyakti ek saath aakraamak aur satark ho sakta hai — 25-saal retirement bucket mein aakraamak, agle saal ki shaadi mein satark. Yahi Module 1 ka horizon + risk-capacity. Galti: saare paise pe ek hi risk lagaana.")],
   faq:[
    {q:L("I'm young — should everything be aggressive?","मैं युवा हूँ — क्या सब आक्रामक हो?","Main yuva hoon — kya sab aakraamak ho?"),a:L("Long-term money, yes; but your near-term goals still need caution regardless of age. Horizon per goal, not age alone.","लॉन्ग-टर्म पैसा हाँ; पर नज़दीकी गोल अब भी सतर्कता चाहिए, उम्र चाहे जो हो।","Long-term paisa haan; par nazdeeki goal ab bhi satarkta chahiye, umar chahe jo ho.")},
    {q:L("What counts as a 'long' horizon?","'लंबा' होराइज़न क्या है?","'Lamba' horizon kya hai?"),a:L("Broadly, the more years the better — enough that a crash has time to recover before you need the money (often 7+ years).","मोटे तौर पर जितने ज़्यादा साल उतना अच्छा — इतने कि क्रैश ज़रूरत से पहले रिकवर हो (अक्सर 7+ साल)।","Mote taur pe jitne zyada saal utna achha — itne ki crash zaroorat se pehle recover ho (aksar 7+ saal).")}
   ]},
  terms:[{k:L("Time horizon","टाइम होराइज़न","Time horizon"),d:L("How long until you need a specific pot — it governs how much risk it can take.","किसी पॉट की ज़रूरत तक का समय — तय करता है कितना रिस्क।","Kisi pot ki zaroorat tak ka samay — tay karta hai kitna risk.")},{k:L("Risk capacity","रिस्क कैपेसिटी","Risk capacity"),d:L("Here, driven by time — more years means more capacity to ride bumps.","यहाँ समय से — ज़्यादा साल मतलब बंप झेलने की ज़्यादा क्षमता।","Yahaan samay se — zyada saal matlab bump jhelne ki zyada kshamta.")}],
  action:{h:L("Risk by horizon","होराइज़न से रिस्क","Horizon se risk"),p:L("For two virtual goals (near and far), set a risk level by horizon and compare the outcomes.","दो वर्चुअल गोल (जल्द और दूर) के लिए होराइज़न से रिस्क सेट करो और नतीजे तुलना करो।","Do virtual goals (jald aur door) ke liye horizon se risk set karo aur natije compare karo."),data:L("Your goal timelines (user-entered).","आपकी गोल टाइमलाइन (यूज़र-डाला)।","Aapki goal timelines (user-entered).")},
  quiz:[
   {q:L("Which money can take more risk?","कौन सा पैसा ज़्यादा रिस्क ले सकता है?","Kaunsa paisa zyada risk le sakta hai?"),o:[L("Money needed next year","अगले साल चाहिए पैसा","Agle saal chahiye paisa"),L("Money not needed for 15+ years","15+ साल न चाहिए पैसा","15+ saal na chahiye paisa"),L("Emergency fund","इमरजेंसी फंड","Emergency fund"),L("Rent money","किराए का पैसा","Kiraaye ka paisa")],a:1,why:L("Long horizons have time to recover from dips, so they can bear more risk.","लंबे होराइज़न के पास रिकवर का समय, तो ज़्यादा रिस्क।","Lambe horizon ke paas recover ka samay, toh zyada risk.")},
   {q:L("Risk level should be set…","रिस्क लेवल किससे तय हो…","Risk level kisse tay ho…"),o:[L("Once for all your money","सारे पैसे के लिए एक बार","Saare paise ke liye ek baar"),L("Per goal, by its horizon","हर गोल के लिए, होराइज़न से","Har goal ke liye, horizon se"),L("By your mood","अपने मूड से","Apne mood se"),L("By a tip","टिप से","Tip se")],a:1,why:L("Each goal's clock decides its risk — not one blanket label.","हर गोल की घड़ी उसका रिस्क तय करती है।","Har goal ki ghadi uska risk tay karti hai.")}
  ],
  reflect:L("Is any short-term money of yours taking long-term risk?","आपका कोई शॉर्ट-टर्म पैसा लॉन्ग-टर्म रिस्क तो नहीं ले रहा?","Aapka koi short-term paisa long-term risk toh nahi le raha?")},

 {id:"m5l6",title:L("The sleep test","नींद टेस्ट","Neend test"),sub:L("Find the risk you can actually hold","वो रिस्क खोजो जो सच में झेल सको","Woh risk khojo jo sach mein jhel sako"),mins:4,
  beats:{
   sit:L("On paper you chose an 'aggressive' plan, but every dip has you checking the app at 2am. The numbers say one thing, your gut another.","कागज़ पर आपने 'आक्रामक' प्लान चुना, पर हर डिप पर 2 बजे ऐप चेक करते हो। नंबर कुछ कहते हैं, दिल कुछ।","Kaagaz pe aapne 'aakraamak' plan chuna, par har dip pe 2 baje app check karte ho. Number kuch kehte hain, dil kuch."),
   myth:{lie:L("The optimal risk level is whatever the math says maximises returns.","ऑप्टिमल रिस्क वही जो गणित के हिसाब से रिटर्न अधिकतम करे।","Optimal risk wahi jo ganit ke hisaab se return adhiktam kare."),truth:L("The best risk level is the one you can hold through a crash without panic-selling — the sleep test.","सबसे अच्छा रिस्क वो जो आप क्रैश में बिना घबराए झेल सको — नींद टेस्ट।","Sabse achha risk woh jo aap crash mein bina ghabraaye jhel sako — neend test.")},
   reflex:L("Overriding your emotions with a spreadsheet, then breaking under stress.","स्प्रेडशीट से भावनाओं को दबाना, फिर तनाव में टूटना।","Spreadsheet se bhaavnaon ko dabaana, phir tanaav mein tootna."),
   q:L("How do I find my real risk level?","अपना असली रिस्क लेवल कैसे खोजूँ?","Apna asli risk level kaise khojun?"),
   fw:L("The <b>sleep test</b>: imagine your portfolio dropping sharply (say a third) — at what point would you lose sleep or want to sell? That point reveals your true tolerance. A slightly lower-return plan you can hold beats a higher-return one you'll abandon at the worst moment.","<b>नींद टेस्ट</b>: कल्पना करो पोर्टफोलियो तेज़ी से गिरे (मान लो एक-तिहाई) — किस बिंदु पर नींद उड़े या बेचने का मन हो? वो बिंदु आपकी असली टॉलरेंस। थोड़ा कम-रिटर्न प्लान जो झेल सको, उस ज़्यादा-रिटर्न से बेहतर जिसे बुरे वक्त छोड़ दो।","<b>Neend test</b>: kalpana karo portfolio tezi se gire (maan lo ek-tihaai) — kis bindu pe neend ude ya bechne ka mann ho? Woh bindu aapki asli tolerance. Thoda kam-return plan jo jhel sako, us zyada-return se behtar jise bure waqt chhod do."),
   call:L("Pick the risk level you can sleep with and stick to — consistency beats theoretical optimality.","वो रिस्क लेवल चुनो जिसके साथ सो सको और टिको — निरंतरता सैद्धांतिक ऑप्टिमल से बेहतर।","Woh risk level chuno jiske saath so sako aur tiko — nirantarta saiddhaantik optimal se behtar.")
  },
  dd:{ex:[
   L("The sleep test is the simplest honest gauge of your true risk tolerance: picture your invested money falling hard — a fifth, a third — and ask at what point you'd start losing sleep or itching to sell everything. That flinch point is your real limit, and it's usually lower than the brave number you'd claim in a calm moment.","नींद टेस्ट आपकी असली रिस्क टॉलरेंस का सबसे सरल ईमानदार पैमाना: कल्पना करो पैसा तेज़ी से गिरे — पाँचवाँ, तिहाई — और पूछो किस बिंदु पर नींद उड़ने या सब बेचने का मन हो। वो झिझक बिंदु आपकी असली सीमा, अक्सर उस बहादुर नंबर से कम जो शांति में बोलते।","Neend test aapki asli risk tolerance ka sabse saral imaandaar paimaana: kalpana karo paisa tezi se gire — paanchvaan, tihaai — aur poocho kis bindu pe neend udne ya sab bechne ka mann ho. Woh jhijhak bindu aapki asli seema, aksar us bahaadur number se kam jo shaanti mein bolte."),
   L("Why does this beat pure optimization? Because the best plan on a spreadsheet is worthless if you abandon it in a crash — and panic-selling is what actually destroys returns (the 'behaviour gap'). A calmer plan you can hold through every storm will, in real life, usually beat a theoretically superior one you bail on at the bottom. This closes the risk module: know yourself, then size your risk so you never have to sell in fear.","यह शुद्ध ऑप्टिमाइज़ेशन से बेहतर क्यों? क्योंकि स्प्रेडशीट का सबसे अच्छा प्लान बेकार अगर क्रैश में छोड़ दो — और घबराकर बेचना ही रिटर्न तबाह करता है ('बिहेवियर गैप')। शांत प्लान जो हर तूफ़ान झेलो, असल ज़िंदगी में बेहतर।","Yeh shuddh optimization se behtar kyun? Kyunki spreadsheet ka sabse achha plan bekaar agar crash mein chhod do — aur ghabraakar bechna hi return tabaah karta hai ('behaviour gap'). Shaant plan jo har toofaan jhelo, asal zindagi mein behtar.")],
   faq:[
    {q:L("Doesn't this mean playing it too safe?","क्या इसका मतलब बहुत सेफ खेलना?","Kya iska matlab bahut safe khelna?"),a:L("No — it means matching risk to what you can hold. Too safe has its own cost (inflation, Module 1); the aim is a level you keep, not the lowest.","नहीं — रिस्क को झेलने लायक रखना। बहुत सेफ की अपनी कीमत (इन्फ्लेशन); लक्ष्य वो लेवल जो टिके।","Nahi — risk ko jhelne layak rakhna. Bahut safe ki apni keemat (inflation); lakshya woh level jo tike.")},
    {q:L("How do I build tolerance over time?","समय के साथ टॉलरेंस कैसे बढ़ाऊँ?","Samay ke saath tolerance kaise badhaun?"),a:L("Experience helps — living through a dip without selling, plus a solid emergency fund, gradually raises what you can calmly hold.","अनुभव मदद करता है — बिना बेचे डिप झेलना और ठोस इमरजेंसी फंड धीरे-धीरे बढ़ाते हैं।","Anubhav madad karta hai — bina beche dip jhelna aur thos emergency fund dheere-dheere badhate hain.")}
   ]},
  terms:[{k:L("Risk tolerance","रिस्क टॉलरेंस","Risk tolerance"),d:L("The level of swings you can hold without panic-selling.","बिना घबराए बेचे जितने झूले झेल सको।","Bina ghabraaye beche jitne jhoole jhel sako.")},{k:L("Behaviour gap","बिहेवियर गैप","Behaviour gap"),d:L("The return you lose by panic-selling instead of holding your plan.","प्लान छोड़ घबराकर बेचने से खोया रिटर्न।","Plan chhod ghabraakar bechne se khoya return.")}],
  action:{h:L("Run a crash on your buckets","अपने बकेट पर क्रैश चलाओ","Apne bucket pe crash chalao"),p:L("Simulate a sharp fall on your virtual portfolio and note the drop that would make you flinch.","अपने वर्चुअल पोर्टफोलियो पर तेज़ गिरावट सिम्युलेट करो और वो गिरावट नोट करो जहाँ आप झिझको।","Apne virtual portfolio pe tez giraavat simulate karo aur woh giraavat note karo jahan aap jhijhko."),data:L("Your virtual portfolio value (in-app).","आपके वर्चुअल पोर्टफोलियो की वैल्यू (ऐप में)।","Aapke virtual portfolio ki value (app mein).")},
  quiz:[
   {q:L("The 'sleep test' measures your…","'नींद टेस्ट' किसे मापता है…","'Neend test' kise maapta hai…"),o:[L("Maximum possible return","अधिकतम संभव रिटर्न","Adhiktam sambhav return"),L("True risk tolerance","असली रिस्क टॉलरेंस","Asli risk tolerance"),L("Tax bracket","टैक्स ब्रैकेट","Tax bracket"),L("Lucky number","लकी नंबर","Lucky number")],a:1,why:L("The point you'd lose sleep or want to sell reveals your real tolerance.","जहाँ नींद उड़े या बेचने का मन हो, वो असली टॉलरेंस।","Jahan neend ude ya bechne ka mann ho, woh asli tolerance.")},
   {q:L("A calmer plan you can hold usually beats…","शांत प्लान जो झेल सको आमतौर पर किससे बेहतर…","Shaant plan jo jhel sako aam taur pe kisse behtar…"),o:[L("A higher-return plan you'll abandon in a crash","ज़्यादा-रिटर्न प्लान जो क्रैश में छोड़ दो","Zyada-return plan jo crash mein chhod do"),L("Keeping only cash","सिर्फ कैश रखना","Sirf cash rakhna"),L("Never investing","कभी इन्वेस्ट न करना","Kabhi invest na karna"),L("Copying a friend","दोस्त की नकल","Dost ki nakal")],a:0,why:L("Panic-selling destroys returns; a plan you keep wins in real life.","घबराकर बेचना रिटर्न तबाह करता है; जो टिके वो जीते।","Ghabraakar bechna return tabaah karta hai; jo tike woh jeete.")}
  ],
  reflect:L("At what drop would you have reached for 'sell'?","किस गिरावट पर आप 'बेचो' की ओर बढ़ते?","Kis giraavat pe aap 'becho' ki or badhte?")}
]};

const MODULE6={ id:"m6", n:6, title:L("Make a plan","प्लान बनाओ","Plan banao"), theme:L("Turn vague goals into a structure you can actually follow.","धुंधले गोल को एक चलने लायक ढाँचे में बदलो।","Dhundhle goals ko ek chalne layak dhaanche mein badlo."),
 lessons:[
 {id:"m6l1",title:L("Give a dream a number and a date","सपने को नंबर और डेट दो","Sapne ko number aur date do"),sub:L("Goal-based investing","गोल-बेस्ड इन्वेस्टिंग","Goal-based investing"),mins:4,
  beats:{
   sit:L("'I want to save for the future' — but it stays vague, and vague goals never get funded.","'मुझे भविष्य के लिए बचाना है' — पर यह धुंधला रहता है, और धुंधले गोल कभी फंड नहीं होते।","'Mujhe bhavishya ke liye bachana hai' — par yeh dhundhla rehta hai, aur dhundhle goal kabhi fund nahi hote."),
   myth:{lie:L("Wanting to save is enough to make it happen.","बचाना चाहना ही काफी है इसे होने के लिए।","Bachana chaahna hi kaafi hai ise hone ke liye."),truth:L("A goal without a number and a date is just a wish; attaching both turns it into a plan.","नंबर और डेट बिना गोल सिर्फ एक ख्वाहिश है; दोनों जोड़ना उसे प्लान बनाता है।","Number aur date bina goal sirf ek khwaahish hai; dono jodna use plan banata hai.")},
   reflex:L("Investing randomly with no target.","बिना टारगेट के बेतरतीब इन्वेस्ट करना।","Bina target ke betarteeb invest karna."),
   q:L("How do I turn a dream into a plan?","सपने को प्लान कैसे बनाऊँ?","Sapne ko plan kaise banaun?"),
   fw:L("<b>Goal-based investing</b> — give each goal a <b>number</b> (how much) and a <b>date</b> (by when). Number + date → a monthly amount you can track, and the goal's horizon picks the right type and risk (Modules 4-5).","<b>गोल-बेस्ड इन्वेस्टिंग</b> — हर गोल को एक <b>नंबर</b> (कितना) और एक <b>डेट</b> (कब तक) दो। नंबर + डेट → ट्रैक करने लायक मंथली रकम, और होराइज़न सही टाइप और रिस्क चुनता है।","<b>Goal-based investing</b> — har goal ko ek <b>number</b> (kitna) aur ek <b>date</b> (kab tak) do. Number + date → track karne layak monthly raqam, aur horizon sahi type aur risk chunta hai."),
   call:L("The amount and timeline are yours; the discipline is simple: no goal without a number and a date.","रकम और टाइमलाइन आपकी; अनुशासन सरल: बिना नंबर और डेट के कोई गोल नहीं।","Raqam aur timeline aapki; anushaasan saral: bina number aur date ke koi goal nahi.")
  },
  dd:{ex:[
   L("A vague goal like 'save for the future' can never be funded because you can't measure it or size it. Goal-based investing fixes this by forcing two things onto every goal: a number (how much it will cost) and a date (when you'll need it). Suddenly it's concrete — you can work out a monthly amount and actually track whether you're on course.","'भविष्य के लिए बचाओ' जैसा धुंधला गोल कभी फंड नहीं हो सकता क्योंकि न नापा जा सकता, न आँका। गोल-बेस्ड इन्वेस्टिंग हर गोल पर दो चीज़ें थोपती है: नंबर (कितना) और डेट (कब)। अब ठोस — मंथली रकम निकलती है और ट्रैक होती है।","'Bhavishya ke liye bachao' jaisa dhundhla goal kabhi fund nahi ho sakta kyunki na naapa ja sakta, na aanka. Goal-based investing har goal pe do cheezein thopti hai: number (kitna) aur date (kab). Ab thos — monthly raqam nikalti hai aur track hoti hai."),
