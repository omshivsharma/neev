<title>Neev — Investing App</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Figtree:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap">

<!-- PWA (installable + offline; active when served over https, e.g. GitHub Pages) -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0E8C6B">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Neev">

<style>
:root{
  --ground:#EEF1EC;--surface:#FFFFFF;--surface-2:#F6F8F4;--surface-3:#EDF1EA;
  --ink:#15211D;--ink-soft:#47544C;--ink-faint:#7B867E;
  --line:#E3E8DF;--line-strong:#D2D9CE;
  --accent:#0E8C6B;--accent-deep:#0A6E54;--accent-wash:#E4F2EC;
  --gold:#C77E1A;--gold-2:#E0A43A;--gold-wash:#FAEDD4;
  --warn:#C0492F;--warn-wash:#FBE7E2;
  --violet:#5B54B8;--violet-wash:#EAE8FA;
  --shadow-s:0 1px 2px rgba(20,34,30,.05),0 6px 16px -12px rgba(20,34,30,.3);
  --shadow-m:0 1px 2px rgba(20,34,30,.06),0 16px 38px -20px rgba(20,34,30,.42);
  --shadow-l:0 2px 6px rgba(20,34,30,.08),0 30px 60px -28px rgba(20,34,30,.5);
  --r:18px;
}
:root:not([data-theme="light"]){ @media(prefers-color-scheme:dark){
  --ground:#0B120F;--surface:#141D19;--surface-2:#1A241F;--surface-3:#212C26;
  --ink:#EAF0EC;--ink-soft:#AEB9B2;--ink-faint:#7C877F;
  --line:#26312B;--line-strong:#35413A;
  --accent:#37C098;--accent-deep:#2AA680;--accent-wash:#15302A;
  --gold:#E7B15A;--gold-2:#EDBB68;--gold-wash:#2C2413;
  --warn:#E9806F;--warn-wash:#331D19;
  --violet:#9A93F0;--violet-wash:#1F1D3A;
  --shadow-s:0 1px 2px rgba(0,0,0,.4),0 6px 16px -12px rgba(0,0,0,.6);
  --shadow-m:0 1px 2px rgba(0,0,0,.4),0 18px 40px -22px rgba(0,0,0,.7);
  --shadow-l:0 2px 8px rgba(0,0,0,.5),0 34px 66px -30px rgba(0,0,0,.85);
}}
:root[data-theme="dark"]{
  --ground:#0B120F;--surface:#141D19;--surface-2:#1A241F;--surface-3:#212C26;
  --ink:#EAF0EC;--ink-soft:#AEB9B2;--ink-faint:#7C877F;
  --line:#26312B;--line-strong:#35413A;
  --accent:#37C098;--accent-deep:#2AA680;--accent-wash:#15302A;
  --gold:#E7B15A;--gold-2:#EDBB68;--gold-wash:#2C2413;
  --warn:#E9806F;--warn-wash:#331D19;
  --violet:#9A93F0;--violet-wash:#1F1D3A;
  --shadow-s:0 1px 2px rgba(0,0,0,.4),0 6px 16px -12px rgba(0,0,0,.6);
  --shadow-m:0 1px 2px rgba(0,0,0,.4),0 18px 40px -22px rgba(0,0,0,.7);
  --shadow-l:0 2px 8px rgba(0,0,0,.5),0 34px 66px -30px rgba(0,0,0,.85);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--ink);font-family:"Figtree",system-ui,sans-serif;
  line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.mono{font-family:"Space Mono",monospace}
.serif{font-family:"Fraunces",serif}

/* device frame */
#app{position:fixed;inset:0;display:grid;place-items:center;background:
  radial-gradient(120% 90% at 80% -10%,var(--accent-wash),transparent 55%),var(--ground)}
.device{width:min(430px,100vw);height:min(920px,100vh);background:var(--surface);
  position:relative;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:var(--shadow-l);border:1px solid var(--line)}
@media(min-width:480px){.device{border-radius:40px;height:min(900px,96vh)}}

/* top status */
.sbar{display:flex;justify-content:space-between;align-items:center;padding:14px 22px 6px;
  font-size:.76rem;font-weight:700;color:var(--ink-soft);flex:none}
.sbar .r{display:flex;gap:5px;align-items:center}
.sbar .r i{width:5px;height:5px;border-radius:50%;background:var(--ink-faint);display:block}

/* scroll area */
.view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.view::-webkit-scrollbar{width:0}
.screen{padding:6px 20px 26px;animation:screenIn .42s cubic-bezier(.2,.7,.2,1)}
@keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pad{padding-bottom:96px}

/* headers */
.eyebrow{font-family:"Space Mono",monospace;font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--accent);font-weight:700}
.h-title{font-family:"Fraunces",serif;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.dim{color:var(--ink-soft)}
.faint{color:var(--ink-faint)}

/* generic card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-s)}
.card.pad{padding:16px}

/* ===== HOME ===== */
.greet{display:flex;align-items:center;gap:12px;margin:8px 0 18px}
.avatar{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent-deep));
  display:grid;place-items:center;color:#fff;font-family:"Fraunces",serif;font-weight:700;font-size:1.2rem;box-shadow:var(--shadow-s)}
.greet .g1{font-size:.8rem;color:var(--ink-faint)}
.greet .g2{font-family:"Fraunces",serif;font-weight:600;font-size:1.15rem;line-height:1.1}
.streakpill{margin-left:auto;display:flex;align-items:center;gap:6px;background:var(--gold-wash);color:var(--gold);
  border-radius:999px;padding:7px 12px;font-weight:800;font-family:"Space Mono",monospace}
.streakpill svg{width:15px;height:15px}
.flame-anim{animation:flick 1.6s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.12) rotate(2deg)}}

.hero{position:relative;overflow:hidden;border-radius:24px;padding:20px;color:#fff;margin-bottom:16px;
  background:linear-gradient(140deg,#0A6E54,#0E8C6B 60%,#16A883);box-shadow:var(--shadow-m)}
.hero .blob{position:absolute;inset:0;opacity:.9;
  background:radial-gradient(90% 70% at 88% 10%,rgba(255,255,255,.18),transparent 55%)}
.hero .tag{position:relative;font-family:"Space Mono",monospace;font-size:.62rem;letter-spacing:.12em;
  text-transform:uppercase;opacity:.85}
.hero h2{position:relative;font-family:"Fraunces",serif;font-weight:600;font-size:1.35rem;margin:6px 0 3px;letter-spacing:-.01em}
.hero p{position:relative;margin:0 0 15px;font-size:.85rem;opacity:.9}
.hero .go{position:relative;display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--accent-deep);
  font-weight:800;font-size:.9rem;border-radius:12px;padding:11px 16px}
.hero .go svg{width:15px;height:15px}
.hero .miniprog{position:relative;margin-top:14px;height:6px;border-radius:99px;background:rgba(255,255,255,.28)}
.hero .miniprog i{display:block;height:100%;border-radius:99px;background:#fff;transition:width .8s cubic-bezier(.2,.7,.2,1)}

.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:13px;text-align:center;box-shadow:var(--shadow-s)}
.stat .n{font-family:"Space Mono",monospace;font-weight:700;font-size:1.35rem;color:var(--accent-deep);font-variant-numeric:tabular-nums}
.stat .l{font-size:.66rem;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-top:2px}

.sect-h{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 12px}
.sect-h .t{font-family:"Fraunces",serif;font-weight:600;font-size:1.1rem}
.sect-h .a{font-size:.8rem;color:var(--accent);font-weight:600}

.dailycard{display:flex;gap:13px;align-items:center;padding:15px;border-radius:16px;background:var(--surface);
  border:1px solid var(--line);box-shadow:var(--shadow-s);width:100%;text-align:left;transition:transform .15s}
.dailycard:active{transform:scale(.98)}
.dailycard .ic{width:46px;height:46px;flex:none;border-radius:13px;background:var(--violet-wash);color:var(--violet);
  display:grid;place-items:center}
.dailycard .ic svg{width:22px;height:22px}
.dailycard .t{font-weight:700;font-size:.95rem}
.dailycard .s{font-size:.77rem;color:var(--ink-faint);margin-top:1px}

/* ===== LEARN / COURSE ===== */
.modblock{margin-bottom:18px}
.modhd{display:flex;gap:12px;align-items:center;margin-bottom:11px}
.modhd .mn{width:38px;height:38px;flex:none;border-radius:11px;background:var(--accent-wash);color:var(--accent-deep);
  display:grid;place-items:center;font-family:"Space Mono",monospace;font-weight:700}
.modhd.locked .mn{background:var(--surface-3);color:var(--ink-faint)}
.modhd .mt{font-family:"Fraunces",serif;font-weight:600;font-size:1.05rem;line-height:1.1}
.modhd .ms{font-size:.75rem;color:var(--ink-faint)}
.modhd .mp{margin-left:auto;font-family:"Space Mono",monospace;font-size:.72rem;color:var(--accent);font-weight:700}
.lesscard{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;border-radius:14px;
  background:var(--surface);border:1px solid var(--line);margin-bottom:8px;transition:transform .15s,border-color .2s}
.lesscard:active{transform:scale(.985)}
.lesscard.done{border-color:var(--accent-wash)}
.lesscard.locked{opacity:.55}
.lesscard .ln{width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;
  font-family:"Space Mono",monospace;font-weight:700;font-size:.82rem;background:var(--surface-3);color:var(--ink-faint)}
.lesscard.done .ln,.lesscard.next .ln{background:var(--accent);color:#fff}
.lesscard.next{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
.lesscard .lt{flex:1;min-width:0}
.lesscard .lt .a{font-weight:700;font-size:.9rem;line-height:1.2}
.lesscard .lt .b{font-size:.73rem;color:var(--ink-faint);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lesscard .chev{color:var(--ink-faint)}
.badge-mini{font-family:"Space Mono",monospace;font-size:.58rem;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 7px;border-radius:6px;background:var(--accent);color:#fff;font-weight:700}

/* ===== LESSON PLAYER (overlay) ===== */
#lesson{position:absolute;inset:0;background:var(--surface);z-index:40;display:none;flex-direction:column}
#lesson.open{display:flex;animation:sheetUp .4s cubic-bezier(.2,.7,.2,1)}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.lhead{flex:none;padding:16px 18px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.lhead .x{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-soft)}
.lhead .prog{flex:1;height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.lhead .prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s ease}
.lbody{flex:1;overflow-y:auto;padding:20px}
.lbody::-webkit-scrollbar{width:0}
.beat{opacity:0;transform:translateY(14px);animation:beatIn .5s forwards}
.beat+.beat{margin-top:14px}
@keyframes beatIn{to{opacity:1;transform:none}}
.beat .bl{font-family:"Space Mono",monospace;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;
  font-weight:700;display:flex;align-items:center;gap:7px;margin-bottom:6px}
.beat .bl .dot{width:7px;height:7px;border-radius:50%}
.beat .bd{font-size:.95rem;color:var(--ink-soft);line-height:1.55}
.beat .bd b{color:var(--ink);font-weight:700}
.c-sit{color:var(--gold)}.c-myth{color:var(--violet)}.c-reflex{color:var(--warn)}
.c-q{color:var(--accent)}.c-fw{color:var(--ink)}.c-call{color:var(--accent-deep)}
.mythbox{background:var(--violet-wash);border-radius:14px;padding:13px 14px}
.mythbox .lie{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--warn);
  text-decoration-thickness:2px;font-size:.9rem}
.mythbox .truth{margin-top:8px;font-size:.92rem;font-weight:600;display:flex;gap:8px;align-items:flex-start}
.mythbox .truth svg{width:16px;height:16px;color:var(--accent);flex:none;margin-top:3px}
.q-scene{background:var(--surface-2);border-left:3px solid var(--gold);border-radius:0 12px 12px 0;padding:13px 15px;font-size:.96rem}
.fw-box{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:14px}
.termrow{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.trm{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.83rem}
.trm b{color:var(--accent-deep)}
details.deepdive{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:2px}
details.deepdive summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:13px 14px;
  font-weight:700;font-size:.85rem;color:var(--accent-deep)}
details.deepdive summary::-webkit-details-marker{display:none}
details.deepdive .ddi{font-size:1rem}
details.deepdive .ddc{margin-left:auto;transition:transform .2s;color:var(--ink-faint)}
details.deepdive[open] .ddc{transform:rotate(90deg)}
.ddbody{padding:0 15px 14px}
.ddbody p{font-size:.9rem;color:var(--ink-soft);margin:0 0 11px;line-height:1.6}
.ddfaqh{font-family:"Space Mono",monospace;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);font-weight:700;margin:6px 0 8px}
.ddfaq{border-top:1px dashed var(--line);padding:9px 0}
.ddfaq .fq{font-weight:700;font-size:.85rem;display:flex;gap:7px}.ddfaq .fq::before{content:"Q";color:var(--accent);font-family:"Space Mono",monospace}
.ddfaq .fa{font-size:.83rem;color:var(--ink-soft);margin-top:3px;padding-left:16px}

.lfoot{flex:none;padding:14px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface)}
.btn{width:100%;border-radius:14px;padding:15px;font-weight:800;font-size:.95rem;background:var(--accent);color:#fff;
  box-shadow:var(--shadow-s);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line-strong);box-shadow:none}
.btn:disabled{opacity:.4}

/* quiz */
.quizwrap .q{margin-bottom:20px}
.quizwrap .qq{font-weight:700;font-size:.98rem;margin-bottom:12px;line-height:1.4}
.quizwrap .qn{color:var(--accent);font-family:"Space Mono",monospace;margin-right:6px}
.opt{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:13px 14px;border-radius:13px;
  border:1.5px solid var(--line-strong);background:var(--surface);font-size:.9rem;margin-bottom:9px;transition:.15s}
.opt .k{width:24px;height:24px;flex:none;border-radius:8px;display:grid;place-items:center;background:var(--surface-3);
  color:var(--ink-faint);font-family:"Space Mono",monospace;font-weight:700;font-size:.76rem}
.opt.right{border-color:var(--accent);background:var(--accent-wash)}.opt.right .k{background:var(--accent);color:#fff}
.opt.wrong{border-color:var(--warn);background:var(--warn-wash)}.opt.wrong .k{background:var(--warn);color:#fff}
.why{font-size:.84rem;color:var(--ink-soft);background:var(--accent-wash);border-radius:11px;padding:11px 13px;
  margin-top:2px;display:none}.why.show{display:block;animation:beatIn .4s forwards}
.why b{color:var(--accent-deep)}

/* action + reflection */
.actcard{background:var(--accent-wash);border:1px solid var(--accent);border-radius:16px;padding:16px}
.actcard .tg{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;border-radius:99px;
  padding:4px 10px;font-family:"Space Mono",monospace;font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.actcard h3{font-family:"Fraunces",serif;font-weight:600;font-size:1.05rem;margin:11px 0 6px}
.actcard p{font-size:.87rem;color:var(--ink-soft);margin:0 0 10px}
.datachip{display:flex;gap:8px;align-items:center;font-size:.76rem;color:var(--ink-soft);background:var(--surface);
  border:1px dashed var(--line-strong);border-radius:10px;padding:9px 11px}
.datachip .live{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--accent-wash)}50%{box-shadow:0 0 0 5px transparent}}
.reflect textarea{width:100%;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface-2);
  padding:11px;font-family:inherit;font-size:.88rem;color:var(--ink);resize:none;min-height:70px}
.reflect textarea:focus{outline:2px solid var(--accent);outline-offset:1px}

/* lesson complete */
.done-hero{text-align:center;padding:24px 10px}
.done-ring{width:120px;height:120px;margin:0 auto 16px;position:relative}
.done-check{position:absolute;inset:0;display:grid;place-items:center;font-size:2.6rem}
.xppop{display:inline-flex;align-items:center;gap:8px;background:var(--gold-wash);color:var(--gold);font-weight:800;
  font-family:"Space Mono",monospace;border-radius:99px;padding:9px 16px;margin-top:8px;animation:beatIn .5s .2s both}

/* ===== SIMULATOR ===== */
.simctrl{margin-bottom:14px}
.modes{display:flex;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px}
.modes button{flex:1;font-weight:700;font-size:.85rem;color:var(--ink-soft);padding:9px;border-radius:9px}
.modes button.on{background:var(--surface);color:var(--accent-deep);box-shadow:var(--shadow-s)}
.field{margin-bottom:15px}
.flab{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
.flab .l{font-weight:700;font-size:.83rem}.flab .v{font-family:"Space Mono",monospace;font-weight:700;color:var(--accent-deep)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.chip{border:1px solid var(--line-strong);border-radius:99px;padding:6px 12px;font-size:.78rem;font-weight:700;color:var(--ink-soft)}
.chip.on{background:var(--accent);color:#fff;border-color:transparent}
input[type=range]{-webkit-appearance:none;width:100%;height:6px;border-radius:99px;background:var(--line-strong);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);border:3px solid var(--surface);box-shadow:var(--shadow-s)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--accent);border:3px solid var(--surface)}
.simres{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
.simres .r{background:var(--surface);padding:12px 10px}
.simres .k{font-size:.62rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);font-weight:700}
.simres .n{font-family:"Space Mono",monospace;font-weight:700;font-size:1.02rem;margin-top:3px;font-variant-numeric:tabular-nums}
.simres .total .n{color:var(--accent-deep)}.simres .gain .n{color:var(--gold)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.74rem;color:var(--ink-soft);margin-top:10px}
.legend span{display:flex;align-items:center;gap:5px}.sw{width:10px;height:10px;border-radius:3px}
.bendnote{margin-top:12px;background:var(--gold-wash);border-radius:11px;padding:10px 12px;font-size:.8rem;color:var(--ink-soft)}
.bendnote b{color:var(--gold)}

/* ===== PORTFOLIO ===== */
.pf-top{background:linear-gradient(140deg,#0A6E54,#12946F);border-radius:22px;padding:20px;color:#fff;margin-bottom:16px;position:relative;overflow:hidden;box-shadow:var(--shadow-m)}
.pf-top .blob{position:absolute;inset:0;background:radial-gradient(80% 60% at 85% 15%,rgba(255,255,255,.16),transparent)}
.pf-top .lb{position:relative;font-size:.72rem;opacity:.85;text-transform:uppercase;letter-spacing:.08em}
.pf-top .val{position:relative;font-family:"Space Mono",monospace;font-weight:700;font-size:2rem;margin:4px 0}
.pf-top .chg{position:relative;font-size:.82rem;font-weight:700;display:inline-flex;gap:5px;align-items:center;background:rgba(255,255,255,.16);border-radius:99px;padding:4px 10px}
.donut-wrap{display:flex;gap:16px;align-items:center;margin-bottom:8px}
.bucket{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}

const MODULE1={ id:"m1", n:1, title:L("You've got money — now what?","पैसा आया — अब क्या?","Paisa aaya — ab kya?"), theme:L("You suddenly have money. Should it even be invested?","अचानक पैसा हाथ में। क्या इसे इन्वेस्ट करना भी चाहिए?","Achanak paisa — kya isse invest karna bhi chahiye?"),
 lessons:[
 {id:"m1l1",title:L("₹10,000 landed — spend, save, or grow?","₹10,000 आए — खर्च, बचाओ, या बढ़ाओ?","₹10,000 aaye — kharch, bachao, ya badhao?"),sub:L("The spend / save / invest fork","खर्च/बचत/निवेश का चौराहा","The spend / save / invest fork"),mins:3,
  beats:{
   sit:L("<b>₹10,000</b> suddenly land in your account — a bonus, or a freelance payment. You're happy, and a sale notification is already staring at you.","आपके खाते में अचानक <b>₹10,000</b> आ गए — बोनस या फ्रीलांस पेमेंट। मन खुश, और सामने एक सेल का नोटिफिकेशन।","Account mein achanak <b>₹10,000</b> aaye — bonus ya freelance ka payment. Dil khush, aur saamne ek sale ka notification."),
   myth:{lie:L("Investing money the moment it arrives is always the smart move.","पैसा आते ही तुरंत 'इन्वेस्ट' कर देना ही समझदारी है।","Paisa aate hi turant 'invest' kar dena hi samajhdari hai."),truth:L("The first question isn't 'where' — it's 'when do I need it'. Cushion first, growth later.","पहला सवाल 'कहाँ' नहीं — 'कब चाहिए' है। कुशन पहले, ग्रोथ बाद में।","Pehla sawaal 'kahan' nahi — 'kab chahiye' hai. Cushion pehle, growth baad mein.")},
   reflex:L("Either spend it right away, or dump it somewhere on a friend's word without thinking.","या तो तुरंत खर्च कर दो, या किसी दोस्त के कहने पर बिना सोचे कहीं डाल दो।","Ya toh turant kharch kar do, ya kisi dost ke kehne pe bina soche kahin daal do."),
   q:L("<b>When</b> do I need this money?","मुझे यह पैसा <b>कब</b> चाहिए?","Is paise ko mujhe <b>kab</b> chahiye?"),
   fw:L("Sort every rupee into three boxes — <b>(a) soon / emergency</b> → safe & reachable, <b>(b) 1–3 year goal</b> → different treatment, <b>(c) 5+ years away</b> → here 'should I grow it?' applies. Order matters: cushion first.","हर रुपये को तीन डिब्बों में सोचो — <b>(a) जल्द/इमरजेंसी</b> → सेफ और रीचेबल, <b>(b) 1–3 साल का गोल</b> → अलग ट्रीटमेंट, <b>(c) 5+ साल</b> → यहाँ 'बढ़ाऊँ?' बनता है। क्रम मायने रखता है: कुशन पहले।","Har rupee ko teen dabbon mein socho — <b>(a) jald/emergency</b> → safe & reachable, <b>(b) 1–3 saal goal</b> → alag treatment, <b>(c) 5+ saal</b> → yahan 'grow karun?' banta hai. Order matters: cushion pehle."),
   call:L("Where the ₹10k goes = your cushion + upcoming needs + horizon. 'What's doing well' is the wrong compass. We won't name a place — only how to choose.","₹10k कहाँ जाए = आपका कुशन + आने वाली ज़रूरतें + होराइज़न। 'क्या अच्छा चल रहा है' गलत कम्पास है। हम जगह नहीं बताते — सिर्फ कैसे चुनें।","₹10k kahan jaaye = aapka cushion + upcoming needs + horizon. 'Kya achha chal raha hai' galat compass hai. Hum jagah name nahi karte — sirf kaise choose karein.")
  },
  dd:{ex:[
   L("Money has no meaning until it has a job. The single question that gives it one is 'when will I need this?' — because that decides how reachable and how growth-focused it should be. A windfall feels like 'extra', which is exactly why it slips away or gets parked carelessly.","पैसे का कोई मतलब नहीं जब तक उसे कोई काम न मिले। वो काम एक सवाल से मिलता है — 'यह कब चाहिए?' — क्योंकि यही तय करता है कि पैसा कितना रीचेबल और कितना ग्रोथ-फोकस्ड हो। अचानक आया पैसा 'एक्स्ट्रा' लगता है, इसीलिए फिसल जाता है।","Paise ka koi matlab nahi jab tak use koi kaam na mile. Woh kaam ek sawaal se milta hai — 'yeh kab chahiye?' — kyunki yahi decide karta hai ki paisa kitna reachable aur kitna growth-focused ho. Achanak aaya paisa 'extra' lagta hai, isiliye fisal jaata hai."),
   L("The three-box order is not random. First a small emergency reachable box, then near-term goals, and only what's left over for 5+ years can chase growth. Growing money you'll need in 6 months just forces you to sell at the wrong time. Fix the order and the 'where' becomes far easier.","तीन डिब्बों का क्रम बेतरतीब नहीं है। पहले छोटा इमरजेंसी रीचेबल डिब्बा, फिर नज़दीकी गोल, और जो बचे वही 5+ साल के लिए ग्रोथ का पीछा करे। 6 महीने में चाहिए पैसे को बढ़ाना आपको गलत समय पर बेचने को मजबूर करता है।","Teen dabbon ka order random nahi hai. Pehle chhota emergency reachable dabba, phir near-term goals, aur jo bache wahi 5+ saal ke liye growth chase kare. 6 mahine mein chahiye paisa badhaana aapko galat waqt pe bechne pe majboor karta hai. Order theek, toh 'kahan' aasaan.")],
   faq:[
    {q:L("Should I not enjoy any of it?","क्या इसमें से कुछ भी एन्जॉय न करूँ?","Kya isme se kuch enjoy na karun?"),a:L("Of course you can. Decide a small 'enjoy' slice consciously — the point is a choice, not an autopilot swipe that eats the whole amount.","बिल्कुल कर सकते हो। एक छोटा 'एन्जॉय' हिस्सा सोच-समझकर तय करो — बात choice की है, ऑटोपायलट की नहीं।","Bilkul kar sakte ho. Ek chhota 'enjoy' hissa soch ke tay karo — baat choice ki hai, autopilot ki nahi.")},
    {q:L("What if I already have an emergency fund?","अगर मेरे पास पहले से इमरजेंसी फंड है?","Agar emergency fund pehle se hai?"),a:L("Then more of this can lean toward mid/long boxes — the framework simply shifts, it doesn't break.","तो ज़्यादा हिस्सा मिड/लॉन्ग डिब्बों की तरफ जा सकता है — फ्रेमवर्क बस शिफ्ट होता है।","Toh zyada hissa mid/long dabbon ki taraf ja sakta hai — framework bas shift hota hai.")}
   ]},
  terms:[{k:L("Emergency cushion","इमरजेंसी कुशन","Emergency cushion"),d:L("Safe, reachable money kept only for the unexpected.","सिर्फ अनचाही ज़रूरत के लिए रखा सेफ, रीचेबल पैसा।","Safe, reachable money kept only for the unexpected.")},{k:L("Time horizon","टाइम होराइज़न","Time horizon"),d:L("How long until you actually need a given rupee.","किसी रुपये की असल में ज़रूरत पड़ने तक का समय।","How long until you actually need a given rupee.")}],
  action:{h:L("Split ₹10,000 into three boxes","₹10,000 को तीन डिब्बों में बाँटो","₹10,000 ko teen dabbon mein baanto"),p:L("Put virtual ₹10,000 into Reach / Mid / Long buckets — whatever ratio feels right today.","वर्चुअल ₹10,000 को रीच / मिड / लॉन्ग बकेट में डालो — जो रेशियो आज सही लगे।","Virtual ₹10,000 ko Jald / Mid / Long buckets mein daalo — jo ratio aaj sahi lage."),data:L("A real savings-account rate for the 'Reach' bucket.","'रीच' बकेट के लिए असली सेविंग्स रेट।","Real savings rate for the 'Jald' bucket.")},

   {q:L("What should come before investing?","इन्वेस्टिंग से पहले क्या होना चाहिए?","Investing shuru karne se pehle kya hona chahiye?"),o:[L("An emergency cushion","एक इमरजेंसी कुशन","Ek emergency cushion"),L("The highest-return fund","सबसे ज़्यादा रिटर्न वाला फंड","Sabse zyada return wala fund"),L("A stock tip","एक स्टॉक टिप","Ek stock tip"),L("Just a demat account","सिर्फ डीमैट अकाउंट","Demat account sirf")],a:0,why:L("Without a cushion, the first shock forces you to sell at the wrong time.","कुशन बिना, पहला झटका आपको गलत समय पर बेचने को मजबूर करेगा।","Cushion bina, pehla jhatka aapko galat waqt pe bechne pe majboor karega.")}

 {id:"m1l2",title:L("When life throws a curveball","जब ज़िंदगी करवाबॉल फेंके","Jab zindagi curveball fenke"),sub:L("Why an emergency fund comes first","इमरजेंसी फंड पहले क्यों","Why an emergency fund comes first"),mins:3,
  beats:{
   sit:L("Saturday night. Your phone slips and the screen shatters — or a sudden medical bill at home. <b>You need ₹15,000, now.</b>","शनिवार रात। फोन गिरा, स्क्रीन चकनाचूर — या घर में अचानक मेडिकल बिल। <b>₹15,000 चाहिए, अभी।</b>","Saturday raat. Phone haath se gira, screen chaknachoor — ya ghar mein achanak medical bill. <b>₹15,000 chahiye, abhi.</b>"),
   myth:{lie:L("If all my money is invested, I'm 'ahead'.","सारा पैसा इन्वेस्टेड हो तो मैं 'आगे' हूँ।","Saara paisa invested ho toh main 'aage' hoon."),truth:L("Without an emergency fund, the first shock forces you to sell at the wrong time.","इमरजेंसी फंड बिना, पहला झटका ही आपको गलत समय पर बेचने को मजबूर करेगा।","Bina emergency fund, pehla jhatka hi aapko galat waqt pe bechne pe majboor karega.")},
   reflex:L("Pull out invested money (down that day), or lean on a credit card / borrowing.","इन्वेस्टेड पैसा निकालो (जो उस दिन नीचे हो), या क्रेडिट कार्ड/उधार पर चले जाओ।","Invested paisa nikaalo (jo us din neeche ho), ya credit card / udhaar pe chale jao."),
   q:L("Is there money you can reach today — <b>no loss, no wait</b>?","क्या ऐसा पैसा है जो <b>बिना नुकसान, बिना इंतज़ार</b> — आज मिल जाए?","Kya aisa paisa hai jo <b>bina loss, bina wait</b> — aaj mil jaaye?"),
   fw:L("Emergency fund = a few months of essential expenses, set aside, safe & liquid, untouched. Not for growth — for <b>peace</b>. Investing starts after this.","इमरजेंसी फंड = कुछ महीनों के ज़रूरी खर्चे, अलग, सेफ और लिक्विड, अनछुए। ग्रोथ के लिए नहीं — <b>शांति</b> के लिए। इन्वेस्टिंग इसके बाद।","Emergency fund = kuch mahine ke essential kharche, alag, safe & liquid, untouched. Yeh growth ke liye nahi — <b>peace</b> ke liye. Investing iske baad shuru hoti hai."),
   call:L("3, 6, or more months — depends on income stability, dependents, and health. Your call.","3, 6 या ज़्यादा महीने — इनकम स्थिरता, आश्रितों और सेहत पर निर्भर। आपका फैसला।","3, 6, ya zyada mahine — income stability, dependents, aur health pe depend karta hai. Aapki call.")
  },
  dd:{ex:[
   L("An emergency fund is boring on purpose. It isn't there to grow — it's there so that a bad week doesn't blow up your long-term plan. Without it, the first unexpected bill forces you to sell investments, often when they're down, turning a temporary dip into a permanent loss.","इमरजेंसी फंड जान-बूझकर बोरिंग है। यह बढ़ने के लिए नहीं — यह इसलिए है कि एक बुरा हफ्ता आपके लॉन्ग-टर्म प्लान को उड़ा न दे। इसके बिना, पहला अनचाहा बिल आपको इन्वेस्टमेंट बेचने को मजबूर करता है, अक्सर जब वो नीचे हों।","Emergency fund jaan-boojh ke boring hai. Yeh badhne ke liye nahi — yeh isliye hai ki ek bura hafta aapke long-term plan ko uda na de. Iske bina, pehla anchaha bill aapko investments bechne pe majboor karta hai, aksar jab woh neeche hon."),
   L("Size it in months of essential spend, not a random number. Keep it somewhere safe and instantly reachable — the whole point is speed. It sits before investing in the order for a simple reason: peace of mind is the foundation everything else is built on.","इसे ज़रूरी खर्चे के महीनों में नापो, किसी random नंबर में नहीं। इसे सेफ और तुरंत मिलने वाली जगह रखो — पूरा मकसद स्पीड है। यह इन्वेस्टिंग से पहले आता है क्योंकि मन की शांति ही नींव है।","Ise essential kharche ke mahino mein naapo, kisi random number mein nahi. Ise safe aur turant milne wali jagah rakho — poora maqsad speed hai. Yeh investing se pehle aata hai kyunki mann ki shaanti hi neev hai.")],
   faq:[
    {q:L("Isn't idle emergency money 'wasted'?","क्या बेकार पड़ा इमरजेंसी पैसा 'बर्बाद' नहीं?","Idle emergency paisa 'waste' nahi?"),a:L("No — its job is availability, not return. Think of it as insurance you can spend, not a missed investment.","नहीं — इसका काम उपलब्धता है, रिटर्न नहीं। इसे खर्च करने लायक बीमा समझो।","Nahi — iska kaam availability hai, return nahi. Ise kharch karne layak insurance samjho.")},
    {q:L("3 months or 6 months?","3 महीने या 6 महीने?","3 mahine ya 6 mahine?"),a:L("More months if your income is irregular or people depend on you; fewer if it's very stable. Your situation, your call.","ज़्यादा महीने अगर इनकम अनियमित है या लोग आप पर निर्भर हैं; कम अगर बहुत स्थिर। आपकी situation।","Zyada mahine agar income irregular hai ya log aap pe depend hain; kam agar bahut stable. Aapki call.")}
   ]},
  terms:[{k:L("Emergency fund","इमरजेंसी फंड","Emergency fund"),d:L("A safe, liquid pot sized in months of essential spending.","ज़रूरी खर्चे के महीनों में नापा सेफ, लिक्विड फंड।","A safe, liquid pot sized in months of essential spending.")},{k:L("Liquidity","लिक्विडिटी","Liquidity"),d:L("How fast you can reach cash without a loss.","बिना नुकसान कितनी जल्दी कैश मिल जाए।","How fast you can reach cash without a loss.")}],

 {id:"m1l3",title:L("Idle money is quietly shrinking","रखा हुआ पैसा चुपचाप छोटा हो रहा है","Drawer mein pada paisa chhota ho raha hai"),sub:L("Inflation, the silent shrink","इन्फ्लेशन, खामोश कटौती","Inflation, the silent shrink"),mins:3,
  beats:{
   sit:L("Grandma kept <b>₹50,000</b> at home for 5 years, thinking it 'safe'. The notes are the same, the count is the same.","दादी ने <b>₹50,000</b> घर पे 'सेफ' समझकर 5 साल से रखे। नोट वही, गिनती वही।","Dadi ne <b>₹50,000</b> ghar pe 'safe' samajh ke 5 saal se rakhe. Note wahi, ginti wahi."),
   myth:{lie:L("Cash kept idle at home is fully safe.","घर/idle में रखा कैश = पूरी तरह सेफ।","Cash ghar/idle mein rakhna = fully safe."),truth:L("Safety from volatility and safety from inflation are two completely different things.","वोलैटिलिटी से सेफ्टी और इन्फ्लेशन से सेफ्टी — दो बिल्कुल अलग बातें।","Volatility se safety aur inflation se safety — do bilkul alag baatein hain.")},
   reflex:L("Assuming idle cash stays permanently safe.","idle कैश को हमेशा सेफ मान लेना।","Idle cash ko permanently safe maan lena."),
   q:L("In 5 years, will that ₹50,000 buy <b>just as much</b>?","5 साल बाद उन ₹50,000 से आप <b>उतना ही</b> खरीद पाओगे?","5 saal baad us ₹50,000 se aap <b>utna hi</b> khareed paoge?"),
   fw:L("Inflation raises prices slowly, so the same rupees buy less. Idle 'safe' money quietly loses its <b>buying power</b>.","इन्फ्लेशन दाम धीरे-धीरे बढ़ाता है; तो same रुपयों से कम मिलता है। idle 'सेफ' पैसा चुपचाप अपनी <b>बाइंग पावर</b> खोता है।","Inflation daam dheere-dheere badhata hai; toh same rupees se kam milta hai. Idle 'safe' paisa chup-chaap apni <b>buying power</b> khota hai."),
   call:L("Idle cash is fine for emergencies; but long-term money left idle for years carries a quiet cost. How much to keep idle — decide by need, not fear.","इमरजेंसी के लिए idle कैश सही; पर सालों idle पड़ा लॉन्ग-टर्म पैसा एक खामोश कीमत रखता है। कितना idle — ज़रूरत से तय करो, डर से नहीं।","Emergency ke liye idle cash sahi; par barso idle pada long-term paisa ek quiet cost carry karta hai. Kitna idle — zaroorat se decide karo, dar se nahi.")
  },
  dd:{ex:[
   L("Inflation is the reason 'doing nothing' with money is not actually neutral. Prices for the things you buy — food, rent, travel — tend to drift upward, so a fixed pile of cash slowly buys less each year even though the number never changes. It's a loss you don't see on any statement.","इन्फ्लेशन ही वजह है कि पैसे के साथ 'कुछ न करना' असल में neutral नहीं है। खाना, किराया, सफर — इनके दाम ऊपर की ओर बढ़ते हैं, तो जमा कैश हर साल थोड़ा कम खरीदता है, चाहे नंबर वही रहे।","Inflation hi wajah hai ki paise ke saath 'kuch na karna' asal mein neutral nahi hai. Khaana, kiraya, safar — inke daam upar ki or badhte hain, toh jama cash har saal thoda kam khareedta hai, chahe number wahi rahe."),
   L("This isn't an argument to never hold cash — your emergency fund must stay in cash. It's an argument against letting long-term money sit idle out of fear. Money you won't need for years has time to grow past inflation; leaving it idle is a silent, optional cost.","यह दलील नहीं कि कभी कैश न रखो — इमरजेंसी फंड कैश में ही रहे। यह दलील है कि लॉन्ग-टर्म पैसा डर से idle न पड़ा रहे। जो पैसा सालों नहीं चाहिए उसके पास इन्फ्लेशन से आगे बढ़ने का समय है।","Yeh daleel nahi ki kabhi cash na rakho — emergency fund cash mein hi rahe. Yeh daleel hai ki long-term paisa dar se idle na pada rahe. Jo paisa saalon nahi chahiye uske paas inflation se aage badhne ka time hai.")],
   faq:[
    {q:L("So cash is bad?","तो कैश बुरा है?","Toh cash bura hai?"),a:L("No — cash is perfect for money you need soon. It's only a quiet cost for money you won't touch for years.","नहीं — जल्द चाहिए पैसे के लिए कैश बढ़िया है। यह सिर्फ सालों न छुए जाने वाले पैसे के लिए खामोश कीमत है।","Nahi — jald chahiye paise ke liye cash badhiya hai. Yeh sirf saalon na chhue jaane wale paise ke liye khamosh cost hai.")},
    {q:L("How do I even know the inflation rate?","इन्फ्लेशन रेट पता कैसे करूँ?","Inflation rate pata kaise karun?"),a:L("The app shows the latest official India figure. Don't memorise a number — just grasp the direction: idle money loses ground.","ऐप नवीनतम आधिकारिक भारत आँकड़ा दिखाता है। नंबर रटो मत — दिशा समझो: idle पैसा पिछड़ता है।","App latest official India figure dikhata hai. Number ratto mat — direction samjho: idle paisa pichhadta hai.")}
   ]},
  terms:[{k:L("Inflation","इन्फ्लेशन","Inflation"),d:L("The general rise in prices, so the same rupees buy a little less each year.","दामों का आम बढ़ना, जिससे same रुपये हर साल थोड़ा कम खरीदते हैं।","The general rise in prices, so the same rupees buy a little less each year.")},{k:L("Purchasing power","बाइंग पावर","Purchasing power"),d:L("What your money can actually buy, not the rupee count.","आपका पैसा असल में क्या खरीद सकता है, रुपयों की गिनती नहीं।","What your money can actually buy, not the rupee count.")}],
  action:{h:L("Watch buying power fall","बाइंग पावर गिरती देखो","Buying power girti hui dekho"),p:L("Apply the latest real inflation to virtual ₹50,000 and see its buying power 5 years out.","वर्चुअल ₹50,000 पे नवीनतम असली इन्फ्लेशन लगाकर 5 साल आगे की बाइंग पावर देखो।","Virtual ₹50,000 pe latest real inflation apply karke 5 saal aage ki buying power dekho."),data:L("Latest official India CPI print.","नवीनतम आधिकारिक भारत CPI आँकड़ा।","Latest official India CPI print.")},
  quiz:[
   {q:L("What quietly happens to idle 'safe' cash?","idle 'सेफ' कैश के साथ चुपचाप क्या होता है?","Idle 'safe' cash ke saath quietly kya hota hai?"),o:[L("The rupee count falls","रुपये की गिनती गिरती है","Rupee ginti girti hai"),L("Its buying power falls","बाइंग पावर गिरती है","Buying power girti hai"),L("The bank uses it","बैंक इस्तेमाल कर लेता है","Bank use le leta hai"),L("Nothing","कुछ नहीं","Kuch nahi")],a:1,why:L("The number stays, but rising prices mean it buys less.","नंबर वही, पर दाम बढ़ने से वो कम खरीद पाता है।","Number wahi, par prices badhne se woh kam khareed paata hai.")},
   {q:L("Safety from volatility is NOT the same as safety from…","वोलैटिलिटी से सेफ होना किससे सेफ होने जैसा नहीं?","Volatility se safe hona kis se safe hone jaisa NAHI hai?"),o:[L("Theft","चोरी","Chori"),L("Inflation","इन्फ्लेशन","Inflation"),L("Fees","फीस","Fees"),L("Tax","टैक्स","Tax")],a:1,why:L("Avoiding bumpiness is one thing; protecting buying power from inflation is another.","बंपीनेस से बचना अलग; इन्फ्लेशन से बाइंग पावर बचाना अलग।","Bumpiness se bachna alag; inflation se buying power ka bachaav alag cheez hai.")}
  ],
  reflect:L("How much of your cash is 'needed reachable' vs 'just sitting'?","आपका कितना कैश 'ज़रूरी रीचेबल' है बनाम 'बस पड़ा हुआ'?","Kitna cash aapka 'zaroori reachable' hai vs 'bas pada hua'?")},

 {id:"m1l4",title:L("Who turns ₹200 into ₹400 — time","₹200 को ₹400 कौन बनाता है — टाइम","₹200 ko ₹400 kaun banata hai — time"),sub:L("Compounding is back-loaded","कंपाउंडिंग बैक-लोडेड है","Compounding is back-loaded"),mins:3,
  beats:{
   sit:L("Two friends. One started putting in small amounts at 22 and forgot about it. The other started at 32 with <b>double</b> the amount.","दो दोस्त। एक ने 22 की उम्र से थोड़ा-थोड़ा डाला और भूल गया। दूसरे ने 32 से <b>दोगुनी</b> रकम डाली।","Do dost. Ek ne 22 ki umar se chhota-chhota daala aur bhool gaya. Doosre ne 32 se <b>double</b> amount daala."),
   myth:{lie:L("Investing only matters once you have a big amount.","इन्वेस्टिंग तभी मायने रखती है जब बड़ी रकम हो।","Investing tabhi matlab rakhta hai jab bada amount ho."),truth:L("Time is a bigger lever than amount — starting early beats investing more later.","टाइम रकम से बड़ा लीवर है — जल्दी शुरू करना > बाद में ज़्यादा डालना।","Time amount se bada lever hai — jaldi shuru karna > baad mein zyada daalna.")},
   reflex:L("'It's small now — later I'll earn more and invest a big lump at once.'","'अभी कम है — बाद में ज़्यादा कमाकर एक साथ बड़ा इन्वेस्ट करूँगा।'","'Abhi kam hai — baad mein zyada kama ke ek saath bada invest karunga.'"),
   q:L("Who ended up ahead — who put in <b>more</b>, or who started <b>early</b>?","आगे कौन निकला — जिसने <b>ज़्यादा</b> डाला, या जिसने <b>जल्दी</b> शुरू किया?","Aage kaun nikla — jisne <b>zyada</b> daala, ya jisne <b>jaldi</b> shuru kiya?"),
   fw:L("Compounding = return on return. Flat early, the real magic in later years (back-loaded). The heavy lifting is done by <b>time</b>, not the amount.","कंपाउंडिंग = रिटर्न पर रिटर्न। शुरू में फ्लैट, असली कमाल बाद के सालों में (बैक-लोडेड)। भारी काम <b>टाइम</b> करता है, रकम नहीं।","Compounding = return on return. Shuru mein flat lagta hai, asli kamaal baad ke saalon mein (back-loaded). Heavy lifting <b>time</b> karta hai, amount nahi."),
   call:L("Start today with whatever you can — small is fine. Where to point it is a separate, later decision.","जो अभी दे सको उससे आज शुरू करो — छोटा भी चलेगा। कहाँ लगाना है वो अलग, बाद का फैसला।","Jo abhi de sako, usse aaj shuru karo — chhota bhi chalega. Kahan point karna hai woh alag, baad ka decision.")
  },
  dd:{ex:[
   L("Compounding means your returns start earning their own returns. In year one you earn on your money; in year two you earn on your money AND on last year's gains. This snowball is tiny at first, which is why early years look flat and boring — and why most people quit before it gets interesting.","कंपाउंडिंग यानी आपके रिटर्न खुद रिटर्न कमाने लगते हैं। पहले साल आप अपने पैसे पर कमाते हो; दूसरे साल अपने पैसे पर और पिछले साल के मुनाफे पर भी। यह स्नोबॉल शुरू में छोटा है, इसीलिए शुरुआती साल फ्लैट लगते हैं।","Compounding yaani aapke return khud return kamaane lagte hain. Pehle saal aap apne paise pe kamate ho; doosre saal apne paise pe AUR pichhle saal ke munaafe pe bhi. Yeh snowball shuru mein chhota hai, isiliye shuruaati saal flat lagte hain."),
   L("Because it's back-loaded, time is the strongest lever — more than the amount. Someone who starts at 22 gives the snowball a decade more of cycles than someone at 32, and often ends ahead even with smaller contributions. The one thing fully in your control is starting, and not withdrawing.","चूँकि यह बैक-लोडेड है, टाइम सबसे बड़ा लीवर है — रकम से भी ज़्यादा। 22 से शुरू करने वाला स्नोबॉल को 32 वाले से एक दशक ज़्यादा साइकिल देता है, और अक्सर कम डालकर भी आगे रहता है। आपके हाथ में बस शुरू करना और न निकालना है।","Kyunki yeh back-loaded hai, time sabse bada lever hai — amount se bhi zyada. 22 se shuru karne wala snowball ko 32 wale se ek dashak zyada cycles deta hai, aur aksar kam daal ke bhi aage rehta hai. Aapke haath mein bas shuru karna aur na nikaalna hai.")],
   faq:[
    {q:L("I can only invest a tiny bit — worth it?","मैं बहुत थोड़ा ही कर सकता हूँ — फायदा है?","Main bahut thoda hi kar sakta hoon — fayda hai?"),a:L("Yes — starting early with a little usually beats starting late with a lot, because time does the work. Open the simulator and see.","हाँ — जल्दी थोड़े से शुरू करना अक्सर देर से बहुत डालने से बेहतर, क्योंकि काम टाइम करता है। सिम्युलेटर में देखो।","Haan — jaldi thode se shuru karna aksar der se bahut daalne se behtar, kyunki kaam time karta hai. Simulator mein dekho.")},
    {q:L("What return should I assume?","कितना रिटर्न मानूँ?","Kitna return maanun?"),a:L("Don't fixate on it — you can't control it. Focus on the two things you can: time in, and not pulling out early.","इस पर मत अटको — यह आपके बस में नहीं। दो चीज़ों पर ध्यान दो जो आपके बस में हैं: समय और जल्दी न निकालना।","Ispe mat atko — yeh aapke bas mein nahi. Do cheezon pe dhyan do jo bas mein hain: time, aur jaldi na nikaalna.")}
   ]},
  terms:[{k:L("Compounding","कंपाउंडिंग","Compounding"),d:L("Earning returns on both your money and the returns it already earned.","अपने पैसे और पहले कमाए रिटर्न — दोनों पर रिटर्न कमाना।","Earning returns on both your money and the returns it already earned.")},{k:L("Time horizon","टाइम होराइज़न","Time horizon"),d:L("How long the money stays invested before you need it.","पैसा ज़रूरत से पहले कितने समय निवेशित रहता है।","How long the money stays invested before you need it.")}],
  action:{h:L("Find the bend","बेंड ढूंढो","Bend dhoondo"),p:L("In the simulator, run ₹500 forward 5, 15 and 25 years and find the year the curve turns from flat to steep.","सिम्युलेटर में ₹500 को 5, 15 और 25 साल आगे चलाकर वो साल ढूंढो जहाँ कर्व फ्लैट से तेज़ होता है।","Simulator mein ₹500 ko 5, 15 aur 25 saal aage chala ke woh saal dhoondo jahan curve flat se steep hota hai."),data:L("A real historical index return series drives the curve.","असली ऐतिहासिक इंडेक्स रिटर्न सीरीज़ कर्व चलाती है।","A real historical index return series drives the curve."),sim:true},
  quiz:[
   {q:L("Why do compounding's early years look flat?","कंपाउंडिंग के शुरुआती साल फ्लैट क्यों लगते हैं?","Compounding ke early saal flat kyun lagte hain?"),o:[L("Returns are highest at the start","रिटर्न शुरू में सबसे ज़्यादा","Return shuru mein sabse zyada"),L("The snowball is still small","स्नोबॉल अभी छोटा है","Snowball abhi chhota hai"),L("Inflation eats it all","इन्फ्लेशन सब खा जाता है","Inflation sab kha jaata hai"),L("No tax paid yet","टैक्स नहीं दिया","Tax nahi diya")],a:1,why:L("Back-loaded — the returns-on-returns snowball grows big only later.","बैक-लोडेड — रिटर्न-पर-रिटर्न स्नोबॉल बाद में बड़ा होता है।","Back-loaded — returns-on-returns ka snowball baad mein bada hota hai.")},
   {q:L("Same monthly amount — who's ahead, starting at 25 or 35?","same मंथली रकम — कौन आगे, 25 से या 35 से?","Same monthly amount — kaun aage, 25 se shuru ya 35 se?"),o:[L("From 35","35 से","35 se"),L("From 25","25 से","25 se"),L("Both equal","दोनों बराबर","Dono barabar"),L("Can't say","कह नहीं सकते","Keh nahi sakte")],a:1,why:L("More time = more cycles — time is compounding's biggest lever.","ज़्यादा टाइम = ज़्यादा साइकिल — टाइम सबसे बड़ा लीवर।","Zyada time = zyada cycles — time compounding ka sabse bada lever.")}
  ],
  reflect:L("Which year did the bend appear — did it surprise you?","बेंड किस साल आया — हैरानी हुई?","Bend kis saal aaya — surprise hua?"),
  tax:L("Frequent selling triggers tax/charges that break compounding. In India, equity held over 1 year (long-term) is taxed differently. (verify current rate before relying on this)","बार-बार बेचने से टैक्स/चार्ज कंपाउंडिंग तोड़ते हैं। भारत में 1 साल से ज़्यादा रखी इक्विटी (लॉन्ग-टर्म) अलग taxed होती है। (verify current rate before relying on this)","Baar-baar bechne se tax/charges compounding todte hain. India mein equity 1 saal se zyada rakha (long-term) alag taxed hota hai. (verify current rate before relying on this)")},

 {id:"m1l5",title:L("Wedding in 8 months, retirement 25 years away","शादी 8 महीने में, रिटायरमेंट 25 साल दूर","Shaadi 8 mahine mein, retirement 25 saal door"),sub:L("Time horizon decides treatment","होराइज़न ट्रीटमेंट तय करता है","Time horizon decides treatment"),mins:3,
  beats:{
   sit:L("You have two goals, <b>₹1 lakh</b> each: your sister's wedding in 8 months, your own retirement 25 years away.","आपके पास दो गोल, दोनों के लिए <b>₹1 लाख</b>: बहन की शादी 8 महीने में, अपनी रिटायरमेंट 25 साल दूर।","Aapke paas do goals, dono ke liye <b>₹1 lakh</b>: behen ki shaadi 8 mahine mein, apni retirement 25 saal door."),
   myth:{lie:L("Same amount, so it should get the same treatment.","रकम same है तो ट्रीटमेंट भी same होना चाहिए।","Amount same hai toh treatment bhi same hona chahiye."),truth:L("Horizon decides the treatment — not the amount.","होराइज़न ट्रीटमेंट तय करता है — रकम नहीं।","Horizon treatment decide karta hai — amount nahi.")},
   reflex:L("Keeping both ₹1 lakh in one place, with one mindset.","दोनों ₹1 लाख को एक जगह, एक सोच से रखना।","Dono ₹1 lakh ko ek jagah, ek soch se rakhna."),
   q:L("Should near and far money be the same just because the number is?","नज़दीकी और दूर का पैसा same हो सिर्फ इसलिए कि नंबर same है?","Near aur far paisa same hona chahiye sirf isliye ki number same hai?"),
   fw:L("<b>Short horizon</b> → safe & reachable (bumpiness will hurt at the wrong time). <b>Long horizon</b> → can ride bumps, with time to recover and compound. This is goal bucketing.","<b>छोटा होराइज़न</b> → सेफ और रीचेबल (बंपीनेस गलत समय चोट देगी)। <b>लंबा होराइज़न</b> → बंप झेल सकता है, recover और compound का समय। इसे गोल बकेटिंग कहते हैं।","<b>Short horizon</b> → safe & reachable (bumpiness galat waqt pe chot degi). <b>Long horizon</b> → bumps ride kar sakta hai, recover aur compound hone ka time hai. Isko goal bucketing kehte hain."),
   call:L("Bucket each goal by its date; where each sits = horizon + liquidity + risk. In your hands.","हर गोल को उसकी डेट से बकेट करो; कहाँ बैठे = होराइज़न + लिक्विडिटी + रिस्क। आपके हाथ में।","Har goal ko date ke hisaab se bucket karo; kahan baithe = horizon + liquidity + risk. Aapke haath mein.")
  },
  dd:{ex:[
   L("The same rupee behaves differently depending on when you need it. Money for a goal months away can't afford a bad dip — if the market drops right when the wedding bill is due, you're forced to sell low. So near-term money stays safe and reachable, accepting low growth as the price of certainty.","एक ही रुपया इस पर निर्भर करता है कि आपको कब चाहिए। कुछ महीनों दूर के गोल का पैसा एक बुरे डिप को नहीं झेल सकता — अगर बिल के वक्त मार्केट गिरा, तो नीचे बेचना पड़ेगा। इसलिए नज़दीकी पैसा सेफ और रीचेबल रहे।","Ek hi rupaya is pe depend karta hai ki aapko kab chahiye. Kuch mahine door ke goal ka paisa ek bure dip ko nahi jhel sakta — agar bill ke waqt market gira, toh neeche bechna padega. Isliye near-term paisa safe aur reachable rahe."),
   L("Long-term money is the opposite — it has years to recover from any dip and let compounding work, so it can afford bumps for higher growth. Bucketing by goal-date, not by amount, is how you avoid the two classic mistakes: risking money you'll need soon, and playing too safe with money you won't touch for decades.","लॉन्ग-टर्म पैसा उलटा है — उसके पास किसी डिप से उबरने और compound होने के साल हैं, तो वो ग्रोथ के लिए बंप झेल सकता है। गोल-डेट से बकेटिंग दो क्लासिक गलतियों से बचाती है।","Long-term paisa ulta hai — uske paas kisi dip se ubarne aur compound hone ke saal hain, toh woh growth ke liye bumps jhel sakta hai. Goal-date se bucketing do classic galtiyon se bachaati hai: jald chahiye paisa risk karna, aur decades door paisa over-safe rakhna.")],
   faq:[
    {q:L("What if a goal has no fixed date?","अगर गोल की कोई तय डेट नहीं?","Agar goal ki fixed date nahi?"),a:L("Estimate a rough window (e.g. 'about 3 years'). Even an approximate horizon changes the treatment correctly.","एक मोटा दायरा अंदाज़ो (जैसे 'लगभग 3 साल')। अनुमानित होराइज़न भी ट्रीटमेंट सही बदल देता है।","Ek mota daayra andaazo (jaise 'lagbhag 3 saal'). Anumaanit horizon bhi treatment sahi badal deta hai.")},
    {q:L("How many buckets should I have?","कितने बकेट होने चाहिए?","Kitne buckets hone chahiye?"),a:L("As many as you have distinct goal-timeframes — often just near, medium and long is enough to start.","जितने अलग गोल-समय हैं — अक्सर बस नज़दीकी, मध्यम और लंबा शुरू के लिए काफी।","Jitne alag goal-timeframes hain — aksar bas near, medium aur long shuru ke liye kaafi.")}
   ]},
  terms:[{k:L("Time horizon","टाइम होराइज़न","Time horizon"),d:L("Years until you actually need a specific pot.","किसी खास पॉट की ज़रूरत पड़ने तक के साल।","Years until you actually need a specific pot.")},{k:L("Goal bucketing","गोल बकेटिंग","Goal bucketing"),d:L("Separating money by goal, each with its own horizon.","पैसे को गोल के हिसाब से बाँटना, हर एक का अपना होराइज़न।","Separating money by goal, each with its own horizon.")}],
  action:{h:L("Bucket your goals","अपने गोल बकेट करो","Apne goals bucket karo"),p:L("Write your real goals with dates; the app computes each horizon; put virtual money into 'under 3 yrs' / 'over 7 yrs'.","अपने असली गोल डेट के साथ लिखो; ऐप होराइज़न निकालेगा; वर्चुअल पैसा 'under 3 yrs' / 'over 7 yrs' में डालो।","Apne asli goals dates ke saath likho; app horizon nikaalega; virtual paise ko 'under 3 yrs' / 'over 7 yrs' mein daalo."),data:L("Today's date + your goal dates.","आज की डेट + आपकी गोल डेट्स।","Today's date + your goal dates.")},
  quiz:[
   {q:L("Why is bumpiness a bigger problem for short-horizon money?","शॉर्ट-होराइज़न पैसे के लिए बंपीनेस बड़ी दिक्कत क्यों?","Short-horizon paise ke liye bumpiness bada problem kyun?"),o:[L("It grows faster","वो तेज़ बढ़ता है","Woh tez badhta hai"),L("If it's down you may be forced to sell","नीचे हो तो बेचना पड़ सकता है","Neeche ho toh bechna pad sakta hai"),L("More tax","टैक्स ज़्यादा","Tax zyada"),L("More bank charges","बैंक चार्ज ज़्यादा","Bank charge zyada")],a:1,why:L("With little time, a dip leaves no room to recover — you sell low.","कम समय में डिप से उबरने का मौका नहीं — नीचे बेचना पड़ता है।","Kam time mein dip aaya toh recover ka mauka nahi — low pe bechna padta hai.")},
   {q:L("Which is an example of the wrong horizon?","गलत होराइज़न का उदाहरण कौन सा है?","Wrong-horizon ka example kaunsa hai?"),o:[L("Emergency cash reachable","इमरजेंसी कैश रीचेबल","Emergency cash reachable"),L("Locking next month's money","अगले महीने का पैसा लॉक करना","Agle mahine ka paisa lock karna"),L("25-year money riding bumps","25-साल का पैसा बंप झेलना","25-saal paisa bumps ride"),L("Bucketing goals by date","गोल डेट से बकेट करना","Goals date se bucket")],a:1,why:L("Locking money you need very soon is a horizon mismatch.","जल्द चाहिए पैसा लॉक करना होराइज़न मिसमैच है।","Jald chahiye paisa lock karna horizon mismatch hai.")}
  ],
  reflect:L("Which goal are you treating with the wrong horizon?","आप कौन सा गोल गलत होराइज़न पर ट्रीट कर रहे हो?","Kaun sa goal aap galat horizon pe treat kar rahe ho?")},

 {id:"m1l6",title:L("“This'll double your money” — now what?","“यह डबल कर देगा” — अब क्या?","“Yeh double kar dega” — ab kya?"),sub:L("The risk-return smell test","रिस्क-रिटर्न स्मेल टेस्ट","The risk-return smell test"),mins:3,
  beats:{
   sit:L("A WhatsApp forward — or a friend, confidently: <b>'Doubles in 6 months, zero risk, guaranteed. Hurry, the offer's closing.'</b>","WhatsApp फॉरवर्ड — या दोस्त confidently: <b>'6 महीने में डबल, रिस्क ज़ीरो, गारंटीड। जल्दी करो, ऑफर बंद हो रहा है।'</b>","WhatsApp forward — ya dost confidently: <b>'6 mahine mein double, risk zero, guaranteed. Jaldi karo, offer close ho raha hai.'</b>"),
   myth:{lie:L("High return and zero risk can come together.","हाई रिटर्न और ज़ीरो रिस्क एक साथ मिल सकते हैं।","High return aur zero risk ek saath mil sakte hain."),truth:L("More potential return = more ups-and-downs. Guaranteed-high + no-risk = classic red flag.","ज़्यादा रिटर्न का मौका = ज़्यादा उतार-चढ़ाव। गारंटीड-हाई + नो-रिस्क = क्लासिक रेड फ्लैग।","Zyada return ka mauka = zyada ups-and-downs. Guaranteed-high + no-risk = classic red flag.")},
   reflex:L("FOMO — 'everyone must be making money' — and jumping in without thinking.","FOMO — 'सब कमा रहे होंगे' — और बिना सोचे कूद जाना।","FOMO — 'sab kama rahe honge' — aur bina soche kood jaana."),
   q:L("High return + zero risk + urgency — can this combination be real?","हाई रिटर्न + ज़ीरो रिस्क + अर्जेंसी — क्या यह combination real हो सकता है?","High return + zero risk + urgency — kya yeh combination real ho sakta hai?"),
   fw:L("Risk–return trade-off: where there's more return potential, there's more bumpiness. Urgency is added to <b>stop you thinking</b>. This lesson is the doorway to the risk module.","रिस्क–रिटर्न ट्रेड-ऑफ: जहाँ ज़्यादा रिटर्न का मौका, वहाँ ज़्यादा बंपीनेस। अर्जेंसी आपको <b>सोचने से रोकने</b> के लिए है। यह रिस्क मॉड्यूल का दरवाज़ा है।","Risk–return trade-off: jahan zyada return ka mauka, wahan zyada bumpiness. Urgency aapko <b>sochne se rokne</b> ke liye lagayi jaati hai. Yeh sabak risk module ka darwaza hai."),
   call:L("Slow down. Judge anything by horizon, risk capacity and diversification — not by a tip, and never by urgency.","रुको। किसी भी चीज़ को होराइज़न, रिस्क कैपेसिटी और डाइवर्सिफिकेशन से जज करो — टिप से नहीं, अर्जेंसी से कभी नहीं।","Ruko. Kisi bhi cheez ko horizon, risk capacity aur diversification ke lens se judge karo — tip pe nahi, urgency pe kabhi nahi.")
  },
  dd:{ex:[
   L("There's an iron rule in markets: return and risk travel together. Anything offering unusually high returns is, by definition, taking on more risk — even if the seller hides it. So a pitch of 'high return AND zero risk' isn't a rare opportunity; it's a warning sign that something is being concealed or is outright fake.","मार्केट में एक पक्का नियम है: रिटर्न और रिस्क साथ चलते हैं। असामान्य रूप से ऊँचा रिटर्न देने वाली कोई भी चीज़ ज़्यादा रिस्क ले रही है — चाहे बेचने वाला छुपाए। तो 'हाई रिटर्न और ज़ीरो रिस्क' दुर्लभ मौका नहीं, चेतावनी है।","Market mein ek pakka niyam hai: return aur risk saath chalte hain. Asaamaanya roop se ooncha return dene wali koi bhi cheez zyada risk le rahi hai — chahe bechne wala chhupaye. Toh 'high return AND zero risk' durlabh mauka nahi, chetaawni hai."),
   L("Urgency is the other tell. 'Hurry, offer closing' exists to stop you from pausing and checking — because a pause would expose the flaw. The defence is simple: never decide on urgency. Run any opportunity through your own lens — horizon, how much risk you can bear, whether it's spread out — and if it can't survive a slow look, walk away.","अर्जेंसी दूसरा संकेत है। 'जल्दी करो' इसलिए है कि आप रुककर जाँच न करें — क्योंकि रुकना खामी दिखा देगा। बचाव सरल: अर्जेंसी पर फैसला कभी नहीं। हर मौके को अपने lens से देखो, और धीमी नज़र न झेले तो छोड़ दो।","Urgency doosra sanket hai. 'Jaldi karo' isliye hai ki aap ruk ke jaanch na karein — kyunki rukna khaami dikha dega. Bachaav saral: urgency pe faisla kabhi nahi. Har mauke ko apne lens se dekho, aur dheemi nazar na jhele toh chhod do.")],
   faq:[
    {q:L("But what if it's genuinely a good opportunity?","पर अगर सच में अच्छा मौका हो?","Par agar sach mein achha mauka ho?"),a:L("A genuine opportunity survives a slow, calm look and disclosure of its risks. If it collapses the moment you pause to check, it wasn't one.","सच्चा मौका धीमी, शांत नज़र और अपने रिस्क बताने में टिकता है। रुकते ही ढह जाए तो मौका था ही नहीं।","Sachcha mauka dheemi, shaant nazar aur apne risk bataane mein tikta hai. Rukte hi dheh jaaye toh mauka tha hi nahi.")},
    {q:L("How do I say no to a pushy friend?","पुशी दोस्त को ना कैसे कहूँ?","Pushy dost ko na kaise kahun?"),a:L("You don't owe an instant yes. 'Let me look into it' is a complete answer — and the pressure to skip that step is itself the red flag.","आपको तुरंत हाँ नहीं कहनी। 'देख के बताता हूँ' पूरा जवाब है — और इसे छोड़ने का दबाव ही रेड फ्लैग है।","Aapko turant haan nahi kehni. 'Dekh ke bataata hoon' poora jawaab hai — aur ise chhodne ka dabaav hi red flag hai.")}
   ]},
  terms:[{k:L("Risk-return trade-off","रिस्क-रिटर्न ट्रेड-ऑफ","Risk-return trade-off"),d:L("Higher potential return almost always comes with more ups and downs.","ज़्यादा संभावित रिटर्न लगभग हमेशा ज़्यादा उतार-चढ़ाव के साथ आता है।","Higher potential return almost always comes with more ups and downs.")},{k:L("Red flag","रेड फ्लैग","Red flag"),d:L("A promise of high return, no risk, and urgency — treat with suspicion.","हाई रिटर्न, नो रिस्क और अर्जेंसी का वादा — शक से देखो।","A promise of high return, no risk, and urgency — treat with suspicion.")}],
  action:{h:L("See the trade-off with your eyes","ट्रेड-ऑफ आँखों से देखो","Trade-off ko aankhon se dekho"),p:L("In the app, place a broad index's bumpy 1-year path next to a fixed rate (real data).","ऐप में एक broad index की 1-साल की बंपी चाल को एक fixed rate के साथ रखो (असली डेटा)।","App mein ek broad index ki 1-saal bumpy chaal ko ek fixed rate ke saath rakh ke dekho (real data)."),data:L("1-yr index series + current fixed rate.","1-साल इंडेक्स सीरीज़ + मौजूदा fixed rate।","1-yr index series + current fixed rate.")},
  quiz:[
   {q:L("'Guaranteed high return, zero risk, hurry' — the right reaction?","'गारंटीड हाई रिटर्न, ज़ीरो रिस्क, जल्दी करो' — सही रिएक्शन?","'Guaranteed high return, zero risk, jaldi karo' — sahi reaction?"),o:[L("Put everything in","सब कुछ डाल दो","Sab kuch daal do"),L("Be suspicious","शक करो","Shak karo"),L("Borrow to invest more","उधार लेकर और डालो","Udhaar le ke aur daalo"),L("Assume it's legal","मान लो legal है","Maan lo legal hai")],a:1,why:L("High return + zero risk is a red flag; urgency exists to stop you thinking.","हाई रिटर्न + ज़ीरो रिस्क रेड फ्लैग है; अर्जेंसी सोचने से रोकती है।","High return + zero risk ek red flag hai; urgency aapko sochne se rokti hai.")},
   {q:L("How should you judge any option?","किसी भी option को कैसे जज करें?","Kisi option ko judge kaise karein?"),o:[L("By a friend's confidence","दोस्त के confidence से","Dost ke confidence se"),L("By urgency","अर्जेंसी से","Urgency se"),L("By your horizon/risk/diversification","अपने होराइज़न/रिस्क/डाइवर्सिफिकेशन से","Apne horizon/risk/diversification se"),L("By last year's return","पिछले साल के रिटर्न से","Pichhle saal ke return se")],a:2,why:L("Decisions come from your situation — not a tip or urgency.","फैसले आपकी situation से — टिप या अर्जेंसी से नहीं।","Decision aapki situation se — tip ya urgency se nahi.")}
  ],
  reflect:L("Ever made a financial decision in FOMO? What happened?","कभी FOMO में कोई फाइनेंशियल फैसला लिया? क्या हुआ?","Kabhi FOMO mein koi financial decision liya? kya hua?")}
]};

const MODULE2={ id:"m2", n:2, title:L("Budgeting: where does it all go?","बजटिंग: पैसा कहाँ जाता है?","Budgeting: paisa kahan jaata hai?"), theme:L("Handle your monthly cash flow before you invest.","इन्वेस्ट से पहले अपना मासिक कैश फ्लो संभालो।","Invest se pehle apna monthly cash flow sambhaalo."),
 lessons:[
 {id:"m2l1",title:L("Salary in, half gone in 10 days — where?","सैलरी आई, 10 दिन में आधी गायब — कहाँ?","Salary aayi, 10 din mein aadhi gayab — kahan?"),sub:L("Tracking · needs vs wants","ट्रैकिंग · नीड्स बनाम वॉन्ट्स","Tracking · needs vs wants"),mins:4,
  beats:{
   sit:L("Salary lands on the 1st, you're happy. Ten days later the balance is half gone and you can't say where.","1 तारीख को सैलरी आई, मन खुश। 10 दिन बाद बैलेंस आधा गायब, और याद ही नहीं कहाँ गया।","1 tareekh ko salary aayi, mann khush. 10 din baad balance aadha gayab, aur yaad hi nahi kahan gaya."),
   myth:{lie:L("Budgeting means being stingy about everything.","बजट बनाना मतलब हर चीज़ पर कंजूसी।","Budget banana matlab har cheez pe kanjoosi."),truth:L("A budget isn't stinginess — it's awareness. It shows whether your money works for you or just leaks away.","बजट कंजूसी नहीं — अवेयरनेस है। यह दिखाता है कि पैसा आपके लिए काम कर रहा है या बस बह रहा है।","Budget kanjoosi nahi — awareness hai. Yeh dikhata hai ki paisa aapke liye kaam kar raha hai ya bas beh raha hai.")},
   reflex:L("Not tracking, and guessing where it all went.","ट्रैक न करना, और अंदाज़ा लगाना कि पैसा कहाँ गया।","Track na karna, aur andaaza lagana ki paisa kahan gaya."),
   q:L("Where does my money actually go?","मेरा पैसा असल में जाता कहाँ है?","Mera paisa asal mein jaata kahan hai?"),
   fw:L("Sort every spend into three — <b>Needs</b> (rent, food, bills, transport), <b>Wants</b> (eating out, OTT, shopping), <b>Savings &amp; debt</b>. Visibility comes before control.","हर खर्च को तीन में बाँटो — <b>नीड्स</b> (किराया, खाना, बिल, सफर), <b>वॉन्ट्स</b> (बाहर खाना, OTT, शॉपिंग), <b>सेविंग्स और डेट</b>। कंट्रोल से पहले विज़िबिलिटी।","Har kharch ko teen mein baanto — <b>Needs</b> (rent, khaana, bill, safar), <b>Wants</b> (bahar khaana, OTT, shopping), <b>Savings &amp; debt</b>. Control se pehle visibility."),
   call:L("Don't hunt for the 'right' ratio yet — first just learn your real pattern.","अभी 'सही' रेशियो मत ढूंढो — पहले बस अपना असली पैटर्न जानो।","Abhi 'sahi' ratio mat dhoondo — pehle bas apna asli pattern jaano.")
  },
  dd:{ex:[
   L("Money rarely vanishes in one big splurge — it leaks through dozens of small, unnoticed spends: ₹40 chai twice a day, a ₹500 weekend meal, forgotten subscriptions. By month-end these add up to thousands. The first step isn't control, it's visibility: knowing where it goes.","पैसा एक बड़े खर्च में गायब नहीं होता — यह दर्जनों छोटे, अनदेखे खर्चों से रिसता है: दिन में दो बार ₹40 की चाय, ₹500 का वीकेंड खाना, भूली हुई सब्सक्रिप्शन। महीने के अंत तक ये हज़ारों बन जाते हैं। पहला कदम कंट्रोल नहीं, विज़िबिलिटी है।","Paisa ek bade kharch mein gayab nahi hota — yeh darjanon chhote, andekhe kharchon se risata hai: din mein do baar ₹40 ki chai, ₹500 ka weekend khaana, bhooli hui subscriptions. Mahine ke ant tak ye hazaaron ban jaate hain. Pehla kadam control nahi, visibility hai."),
   L("Worked example — on a ₹40,000 take-home: say Needs come to ₹24,000 (60%), Wants ₹12,000 (30%), and Savings only ₹4,000 (10%). The scan itself reveals the gap — needs eating 60%, savings just 10% — before you change a thing. And the line blurs: a basic phone plan is a need, its premium tier a want; the goal is honesty, not a perfect label.","उदाहरण — ₹40,000 टेक-होम पर: मान लो नीड्स ₹24,000 (60%), वॉन्ट्स ₹12,000 (30%), और सेविंग्स सिर्फ ₹4,000 (10%)। स्कैन ही गैप दिखा देता है — नीड्स 60%, सेविंग्स 10% — कुछ बदलने से पहले।","Udaharan — ₹40,000 take-home pe: maan lo Needs ₹24,000 (60%), Wants ₹12,000 (30%), aur Savings sirf ₹4,000 (10%). Scan hi gap dikha deta hai — needs 60%, savings 10% — kuch badalne se pehle. Aur line dhundhli hoti hai: basic phone plan need hai, premium want; maqsad honesty hai, perfect label nahi.")],
   faq:[
    {q:L("Do I have to track every rupee?","क्या हर रुपया ट्रैक करना ज़रूरी है?","Kya har rupaya track karna zaroori hai?"),a:L("No — catch the big and recurring spends; that's where 80% of the leak is. After 30 days you'll sense it without writing.","नहीं — बड़े और बार-बार वाले खर्च पकड़ो; 80% रिसाव वहीं है। 30 दिन बाद बिना लिखे भी समझ आएगा।","Nahi — bade aur baar-baar wale kharche pakdo; 80% leak wahin hai. 30 din baad bina likhe bhi samajh aayega.")},
    {q:L("How do I track cash spends?","कैश खर्च कैसे ट्रैक करूँ?","Cash kharche kaise track karun?"),a:L("30 seconds at day's end — just note the big cash spends. Direction matters more than perfection.","दिन के अंत में 30 सेकंड — बस बड़े कैश खर्च नोट करो। परफेक्शन से ज़्यादा दिशा मायने रखती है।","Din ke ant mein 30 second — bas bade cash kharche note karo. Perfection se zyada direction maayne rakhti hai.")}
   ]},
  terms:[{k:L("Cash flow","कैश फ्लो","Cash flow"),d:L("The money moving in (income) and out (expenses) each month.","हर महीने अंदर (इनकम) और बाहर (खर्च) जाता पैसा।","Har mahine andar (income) aur bahar (kharch) jaata paisa.")},{k:L("Discretionary spend","डिस्क्रेशनरी खर्च","Discretionary spend"),d:L("Spending fully in your control — the 'wants'.","पूरी तरह आपके कंट्रोल का खर्च — 'वॉन्ट्स'।","Poori tarah aapke control ka kharch — 'wants'.")}],
  action:{h:L("Tag your 5 biggest spends","अपने 5 सबसे बड़े खर्च टैग करो","Apne 5 sabse bade kharche tag karo"),p:L("Enter last month's 5 biggest expenses and tag each Need or Want.","पिछले महीने के 5 सबसे बड़े खर्च डालो और हर एक को Need या Want टैग करो।","Pichhle mahine ke 5 sabse bade kharche daalo aur har ek ko Need ya Want tag karo."),data:L("Your real past expenses (user-entered).","आपके असली पिछले खर्च (यूज़र-डाला)।","Aapke asli pichhle kharche (user-entered).")},
  quiz:[
   {q:L("What is the FIRST step to fixing your spending?","खर्च सुधारने का पहला कदम क्या है?","Kharch sudhaarne ka pehla kadam kya hai?"),o:[L("Cut everything","सब काटो","Sab kaato"),L("See where it actually goes","देखो पैसा असल में कहाँ जाता है","Dekho paisa asal mein kahan jaata hai"),L("Earn more first","पहले ज़्यादा कमाओ","Pehle zyada kamao"),L("Open more accounts","और अकाउंट खोलो","Aur account kholo")],a:1,why:L("Visibility comes before control — you can't fix a leak you can't see.","कंट्रोल से पहले विज़िबिलिटी — जो रिसाव दिखे नहीं उसे ठीक नहीं कर सकते।","Control se pehle visibility — jo leak dikhe nahi use theek nahi kar sakte.")},
   {q:L("Which is a 'need', not a 'want'?","कौन सा 'need' है, 'want' नहीं?","Kaunsa 'need' hai, 'want' nahi?"),o:[L("A premium OTT plan","प्रीमियम OTT प्लान","Premium OTT plan"),L("Rent","किराया","Kiraya"),L("Weekend dining out","वीकेंड बाहर खाना","Weekend bahar khaana"),L("A new gadget","नया गैजेट","Naya gadget")],a:1,why:L("Rent is essential; the others are discretionary wants you control.","किराया ज़रूरी है; बाकी आपके कंट्रोल के वॉन्ट्स हैं।","Kiraya zaroori hai; baaki aapke control ke wants hain.")}
  ],
  reflect:L("How many of your 'needs' turned out to be 'wants'?","आपके कितने 'needs' असल में 'wants' निकले?","Aapke kitne 'needs' asal mein 'wants' nikle?")},

 {id:"m2l2",title:L("50-30-20: a simple frame","50-30-20: एक सरल ढाँचा","50-30-20: ek simple dhaancha"),sub:L("The classic budgeting rule, in depth","क्लासिक बजट रूल, गहराई से","The classic budgeting rule, in depth"),mins:4,
  beats:{
   sit:L("You now know where money goes. Next question: how much <i>should</i> go where? Calculating each thing feels tiring.","अब आप जानते हो पैसा कहाँ जाता है। अगला सवाल: कितना कहाँ जाना <i>चाहिए</i>? हर चीज़ calculate करना थकाऊ लगता है।","Ab aap jaante ho paisa kahan jaata hai. Agla sawaal: kitna kahan jaana <i>chahiye</i>? Har cheez calculate karna thakaane wala lagta hai."),
   myth:{lie:L("Budgeting needs Excel and hours of planning.","बजटिंग के लिए Excel और घंटों की प्लानिंग चाहिए।","Budgeting ke liye Excel aur ghanton ki planning chahiye."),truth:L("A simple 3-part frame does 90% of the job. 50-30-20 is exactly that.","एक सरल 3-हिस्से का ढाँचा 90% काम कर देता है। 50-30-20 वही है।","Ek saral 3-hisse ka dhaancha 90% kaam kar deta hai. 50-30-20 wahi hai.")},
   reflex:L("Over-complicating it, or giving up on budgeting entirely.","इसे ज़्यादा उलझाना, या बजटिंग छोड़ देना।","Ise zyada uljhaana, ya budgeting chhod dena."),
   q:L("How much of my pay should go where?","मेरी सैलरी का कितना हिस्सा कहाँ जाए?","Meri salary ka kitna hissa kahan jaaye?"),
   fw:L("<b>50%</b> Needs, <b>30%</b> Wants, <b>20%</b> Savings &amp; debt — of your <b>take-home</b> pay (not gross). Extra loan repayment counts in the 20%.","<b>50%</b> नीड्स, <b>30%</b> वॉन्ट्स, <b>20%</b> सेविंग्स और डेट — आपकी <b>टेक-होम</b> सैलरी का (ग्रॉस का नहीं)। एक्स्ट्रा लोन चुकाना 20% में गिना जाता है।","<b>50%</b> Needs, <b>30%</b> Wants, <b>20%</b> Savings &amp; debt — aapki <b>take-home</b> salary ka (gross ka nahi). Extra loan chukana 20% mein ginta hai."),
   call:L("Adjust to your life — just make sure the 20% exists. We won't say where savings go, only that they must.","अपनी लाइफ से एडजस्ट करो — बस 20% मौजूद हो। हम नहीं कहते सेविंग्स कहाँ जाए, सिर्फ कि जाए।","Apni life se adjust karo — bas 20% maujood ho. Hum nahi kehte savings kahan jaaye, sirf ki jaaye.")
  },
  dd:{ex:[
   L("50-30-20 splits your take-home into three simple buckets and gives instant clarity. Two things people get wrong: the split is on take-home (after tax/PF), not gross; and any loan repayment ABOVE the minimum counts in the 20% savings bucket, because clearing debt is also building your future.","50-30-20 आपकी टेक-होम को तीन सरल बकेट में बाँटता है और तुरंत क्लैरिटी देता है। दो चीज़ें लोग गलत समझते हैं: हिस्सा टेक-होम पर है, ग्रॉस पर नहीं; और मिनिमम से ऊपर की लोन रीपेमेंट 20% में गिनती है।","50-30-20 aapki take-home ko teen saral bucket mein baant-ta hai aur turant clarity deta hai. Do cheezein log galat samajhte hain: hissa take-home pe hai, gross pe nahi; aur minimum se upar ki loan repayment 20% mein ginti hai."),
   L("Worked example — ₹50,000 take-home: Needs ₹25,000, Wants ₹15,000, Save &amp; debt ₹10,000. That ₹10,000/month is exactly the fuel compounding needs. India reality: on lower incomes needs often exceed 50% (rent + food dominate) — so 50-30-20 is a direction, not a law. If needs are 65%, don't panic; aim to trim wants and nudge savings from 10% toward 15%.","उदाहरण — ₹50,000 टेक-होम: नीड्स ₹25,000, वॉन्ट्स ₹15,000, सेव और डेट ₹10,000। वो ₹10,000/महीना ही कंपाउंडिंग का ईंधन है। भारत में कम इनकम पर नीड्स अक्सर 50% से ऊपर — तो यह दिशा है, कानून नहीं।","Udaharan — ₹50,000 take-home: Needs ₹25,000, Wants ₹15,000, Save & debt ₹10,000. Woh ₹10,000/mahina hi compounding ka eendhan hai. India mein kam income pe needs aksar 50% se upar — toh yeh direction hai, kanoon nahi.")],
   faq:[
    {q:L("My needs are over 50% — does the rule fail?","मेरी नीड्स 50% से ज़्यादा हैं — रूल फेल?","Meri needs 50% se zyada hain — rule fail?"),a:L("No — it's useful precisely because it shows your real situation. Higher needs just means focus on trimming wants so savings isn't zero.","नहीं — यह इसलिए काम का है कि आपकी असली situation दिखाता है। ज़्यादा नीड्स मतलब वॉन्ट्स घटाओ ताकि सेविंग्स शून्य न रहे।","Nahi — yeh isliye kaam ka hai ki aapki asli situation dikhaata hai. Zyada needs matlab wants ghatao taaki savings shoonya na rahe.")},
    {q:L("Is EMI a need or a saving?","EMI need है या saving?","EMI need hai ya saving?"),a:L("The minimum EMI is a need (must-pay). Extra prepayment above it is the savings/debt bucket — your choice to build the future faster.","मिनिमम EMI need है (चुकाना ज़रूरी)। उसके ऊपर एक्स्ट्रा प्रीपेमेंट सेविंग्स/डेट बकेट है।","Minimum EMI need hai (chukana zaroori). Uske upar extra prepayment savings/debt bucket hai — aapki choice.")}
   ]},
  terms:[{k:L("Take-home pay","टेक-होम पे","Take-home pay"),d:L("Salary in hand after tax and deductions.","टैक्स और कटौती के बाद हाथ में आने वाली सैलरी।","Tax aur deductions ke baad haath mein aane wali salary.")},{k:L("Budget","बजट","Budget"),d:L("A plan for how much money goes into each bucket.","पैसा किस बकेट में कितना जाएगा उसका प्लान।","Paisa kis bucket mein kitna jaayega uska plan.")}],
  action:{h:L("See your 50-30-20 targets","अपने 50-30-20 टारगेट देखो","Apne 50-30-20 targets dekho"),p:L("Enter your take-home; the app shows the rupee targets and compares them with your real spend.","अपनी टेक-होम डालो; ऐप रुपये के टारगेट दिखाएगा और आपके असली खर्च से तुलना करेगा।","Apni take-home daalo; app rupee targets dikhayega aur aapke asli kharch se compare karega."),data:L("Your take-home salary (user-entered).","आपकी टेक-होम सैलरी (यूज़र-डाला)।","Aapki take-home salary (user-entered).")},
  quiz:[
   {q:L("50-30-20 is applied to which figure?","50-30-20 किस राशि पर लगता है?","50-30-20 kis raashi pe lagta hai?"),o:[L("Gross salary","ग्रॉस सैलरी","Gross salary"),L("Take-home pay","टेक-होम पे","Take-home pay"),L("Annual bonus","सालाना बोनस","Saalaana bonus"),L("Total savings","कुल बचत","Kul bachat")],a:1,why:L("It splits your take-home (in-hand) pay, not gross.","यह टेक-होम (हाथ में) सैलरी बाँटता है, ग्रॉस नहीं।","Yeh take-home (haath mein) salary baant-ta hai, gross nahi.")},
   {q:L("In 50-30-20, what does the 20% cover?","50-30-20 में 20% किसके लिए है?","50-30-20 mein 20% kiske liye hai?"),o:[L("More wants","और वॉन्ट्स","Aur wants"),L("Savings and extra debt payoff","सेविंग्स और एक्स्ट्रा लोन चुकाना","Savings aur extra loan chukana"),L("Rent only","सिर्फ किराया","Sirf kiraya"),L("Taxes","टैक्स","Tax")],a:1,why:L("The 20% is future-building: savings, investing, and paying debt above the minimum.","20% भविष्य बनाना है: सेविंग्स, इन्वेस्टिंग और मिनिमम से ऊपर लोन।","20% future banana hai: savings, investing aur minimum se upar loan.")}
  ],
  reflect:L("Which bucket is furthest from its 50-30-20 target for you?","आपके लिए कौन सा बकेट 50-30-20 टारगेट से सबसे दूर है?","Aapke liye kaunsa bucket 50-30-20 target se sabse door hai?")},

 {id:"m2l3",title:L("40-30-30 and other variants","40-30-30 और बाकी वैरिएंट","40-30-30 aur baaki variants"),sub:L("Which split fits you?","कौन सी स्प्लिट आपके लिए?","Kaunsi split aapke liye?"),mins:4,
  beats:{
   sit:L("You tried 50-30-20 and feel you could save more — or someone said '40-30-30 is better'. Which is right?","आपने 50-30-20 आज़माया और लगता है ज़्यादा बचा सकते हो — या किसी ने कहा '40-30-30 बेहतर है'। कौन सा सही?","Aapne 50-30-20 aazmaya aur lagta hai zyada bacha sakte ho — ya kisi ne kaha '40-30-30 better hai'. Kaunsa sahi?"),
   myth:{lie:L("There's one 'best' budgeting rule everyone should follow.","एक 'बेस्ट' बजट रूल है जो सबको फॉलो करना चाहिए।","Ek 'best' budgeting rule hai jo sabko follow karna chahiye."),truth:L("Rules are templates for different life stages. The best one is the one you can actually sustain.","रूल अलग लाइफ स्टेज के लिए टेम्पलेट हैं। बेस्ट वो जो आप सच में निभा सको।","Rules alag life stages ke liye templates hain. Best woh jo aap sach mein nibha sako.")},
   reflex:L("Chasing the 'optimal' rule instead of a sustainable one.","निभने वाले के बजाय 'ऑप्टिमल' रूल का पीछा करना।","Nibhne wale ke bajaye 'optimal' rule ka peechha karna."),
   q:L("Which split fits my situation?","कौन सी स्प्लिट मेरी situation में फिट है?","Kaunsi split meri situation mein fit hai?"),
   fw:L("<b>40-30-30</b> = aggressive saver (low needs, big 30% to savings). Also <b>70-20-10</b> for beginners, <b>60-20-20</b> as a middle path. The pattern is constant: shrink living, grow the future.","<b>40-30-30</b> = आक्रामक सेवर (कम नीड्स, बड़ा 30% सेविंग्स)। शुरुआती के लिए <b>70-20-10</b>, बीच का रास्ता <b>60-20-20</b>। पैटर्न एक: लिविंग घटाओ, भविष्य बढ़ाओ।","<b>40-30-30</b> = aggressive saver (kam needs, bada 30% savings). Beginners ke liye <b>70-20-10</b>, beech ka rasta <b>60-20-20</b>. Pattern ek: living ghatao, future badhao."),
   call:L("Whichever split you can keep up consistently is the best one for you.","जो भी स्प्लिट आप लगातार निभा सको, वही आपके लिए बेस्ट है।","Jo bhi split aap lagataar nibha sako, wahi aapke liye best hai.")
  },
  dd:{ex:[
   L("40-30-30 puts a full 30% into savings and investing — great for those with low needs (living with family, no rent) who want to build wealth faster. More saved today means more compounding tomorrow. Other frames help you find your stage: 70-20-10 is realistic on a small salary; 60-20-20 is a middle ground.","40-30-30 पूरे 30% सेविंग्स और इन्वेस्टिंग को देता है — उनके लिए बढ़िया जिनकी नीड्स कम हैं (परिवार के साथ, बिना किराया) और तेज़ी से वेल्थ बनाना चाहते हैं। आज ज़्यादा बचत = कल ज़्यादा कंपाउंडिंग।","40-30-30 poore 30% savings aur investing ko deta hai — unke liye badhiya jinki needs kam hain (family ke saath, bina kiraya) aur tezi se wealth banana chahte hain. Aaj zyada bachat = kal zyada compounding."),
   L("Worked example — ₹50,000: 50-30-20 saves ₹10,000/month; 40-30-30 saves ₹15,000. That extra ₹5,000/month, compounded over years, can become lakhs on its own — BUT only if 40% needs is genuinely liveable for you. An aggressive plan you break in 2 months is worse than a gentle one you keep for years.","उदाहरण — ₹50,000: 50-30-20 में ₹10,000/महीना बचत; 40-30-30 में ₹15,000। वो एक्स्ट्रा ₹5,000/महीना सालों में कंपाउंड होकर खुद लाखों बन सकता है — पर तभी जब 40% नीड्स सच में जीने लायक हो।","Udaharan — ₹50,000: 50-30-20 mein ₹10,000/mahina bachat; 40-30-30 mein ₹15,000. Woh extra ₹5,000/mahina saalon mein compound ho ke khud laakhon ban sakta hai — par tabhi jab 40% needs sach mein jeene layak ho.")],
   faq:[
    {q:L("I can't live on 40% needs — then?","मैं 40% नीड्स में जी नहीं सकता — तो?","Main 40% needs mein jee nahi sakta — toh?"),a:L("Then 40-30-30 isn't for you right now. Start at 50-30-20 or 70-20-10 — your stage will change over time.","तो 40-30-30 अभी आपके लिए नहीं। 50-30-20 या 70-20-10 से शुरू करो — स्टेज बदलेगी।","Toh 40-30-30 abhi aapke liye nahi. 50-30-20 ya 70-20-10 se shuru karo — stage badlegi.")},
    {q:L("Do I re-check percentages daily?","क्या रोज़ percentages चेक करूँ?","Kya roz percentages check karun?"),a:L("No — set once, review once a month. Automation (next lesson) runs it for you.","नहीं — एक बार सेट, महीने में एक बार रिव्यू। ऑटोमेशन (अगला पाठ) इसे चला देता है।","Nahi — ek baar set, mahine mein ek baar review. Automation (agla lesson) ise chala deta hai.")}
   ]},
  terms:[{k:L("Savings rate","सेविंग्स रेट","Savings rate"),d:L("The share of income you save/invest — the biggest driver of wealth.","इनकम का वो हिस्सा जो आप बचाते/इन्वेस्ट करते हैं — वेल्थ का सबसे बड़ा ड्राइवर।","Income ka woh hissa jo aap bachate/invest karte ho — wealth ka sabse bada driver.")},{k:L("Lifestyle creep","लाइफस्टाइल क्रीप","Lifestyle creep"),d:L("Spending rising with income, so your savings rate never improves.","इनकम बढ़ते ही खर्च बढ़ना, जिससे सेविंग्स रेट नहीं सुधरता।","Income badhte hi kharch badhna, jisse savings rate nahi sudharta.")}],
